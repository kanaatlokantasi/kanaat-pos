<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanaat POS">
<meta name="theme-color" content="#1d4fa3">
<title>Kanaat POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app — top bar, scrolling work area, bottom tab bar; order screen swaps the tab bar for a cart bar. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d7dde5;
  --ink:#142033; --muted:#5b6677; --accent:#1d4fa3; --accent-ink:#ffffff; --accent-soft:#dfe8f7;
  --ok:#1f7a4d; --ok-soft:#dcf0e5; --warn:#a15c00; --danger:#b42318; --danger-soft:#fbe3e0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d121a; --surface:#18202c; --surface-2:#1f2937; --line:#2d3848;
  --ink:#e8edf4; --muted:#97a2b3; --accent:#6f9ef0; --accent-ink:#0b1424; --accent-soft:#1e2e4a;
  --ok:#5cc28e; --ok-soft:#173527; --warn:#e3a24a; --danger:#f0786b; --danger-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121a; --surface:#18202c; --surface-2:#1f2937; --line:#2d3848;
  --ink:#e8edf4; --muted:#97a2b3; --accent:#6f9ef0; --accent-ink:#0b1424; --accent-soft:#1e2e4a;
  --ok:#5cc28e; --ok-soft:#173527; --warn:#e3a24a; --danger:#f0786b; --danger-soft:#3a1d1b; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand{flex:1}
.top .chip{padding:6px 9px;max-width:120px;gap:5px}
.top .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand b{font:700 20px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{white-space:nowrap}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on i{background:var(--ok)}
.chip.on{border-color:var(--ok);color:var(--ok)}

main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:none;padding:10px 4px 9px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.act{color:var(--accent)}

h2{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
h3{font:600 18px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.note.warn{background:var(--danger-soft)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);min-height:92px;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.tile .n{font:700 26px/1 var(--display)}
.tile .m{font-size:12px;color:var(--muted)}
.tile.open{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.open .m{color:inherit;opacity:.85}
.tile .t{font:600 18px/1 var(--display)}

/* order */
.ohead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -16px 6px;padding-inline:16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:600;white-space:nowrap}
.cats button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.igrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;min-height:82px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative}
.item .nm{font-weight:600;line-height:1.2}
.item .pr{font:600 19px/1 var(--display);color:var(--muted)}
.item .q{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 6px}
.item:active{background:var(--accent-soft)}
.itemw{position:relative;display:flex}
.item.hasq .nm{padding-right:68px}
.itemw .item{flex:1;padding-right:12px}
.itemw.hashalf .item{padding-bottom:12px}
.halfb{position:absolute;right:8px;bottom:8px;min-width:44px;padding:0 8px;height:36px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font:700 19px/1 var(--display);letter-spacing:.04em}
.halfb:active{background:var(--accent-soft)}
.tipbox{background:linear-gradient(160deg,#1f8a55,#156b41);color:#fff;border-radius:14px;padding:14px 12px 12px;text-align:center;animation:tipglow 1.6s ease-in-out 6}
.tiptitle{font:700 30px/1 var(--display);letter-spacing:.06em}
.tipsub{font-size:14px;margin:6px 0 12px;opacity:.95}
.tipbox .tipseg{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.5)}
.tipbox .tipseg button{background:#fff;color:#156b41;border-left-color:rgba(21,107,65,.25);position:relative;font-size:16px;padding-top:16px}
.tipbox .tipseg button.act{background:#0d3f27;color:#fff}
.tipfav{position:absolute;top:3px;left:0;right:0;font:700 9px/1 var(--body);letter-spacing:.02em;text-transform:uppercase;color:#b45309}
.tipbox .tipseg button.act .tipfav{color:#fde68a}
@keyframes tipglow{0%,100%{box-shadow:0 0 0 0 rgba(31,138,85,0)}50%{box-shadow:0 0 0 8px rgba(31,138,85,.35),0 0 26px rgba(31,138,85,.55)}}
@media (prefers-reduced-motion:reduce){.tipbox{animation:none}}
.tipseg{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tipseg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:12px 4px;font-weight:700;min-height:48px}
.tipseg button:first-child{border-left:0}
.tipseg button.act{background:var(--accent);color:var(--accent-ink)}
.paysum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.paysum>span:nth-child(even){text-align:right}
.paysum .grand{font:700 30px/1.1 var(--display)}
#tipInput{font:700 32px/1.2 var(--display);text-align:center;padding:12px}
.billv{background:#fff;color:#111;border-radius:6px;padding:14px 14px 12px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.06);border:1px solid var(--line)}
.billv .muted{color:#666}
.billv .bhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1.5px dashed #bbb;margin-bottom:4px}
.billv .bl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.billv .bn{min-width:0;font-size:16px;line-height:1.3}
.billv .bn small{display:block;color:#777;font-size:12px}
.billv .ba{font-size:16px;font-weight:600}
.billv .qty button{background:#fff;color:#111;border-color:#ccc}
.billv .btot{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px dashed #bbb;margin-top:6px;padding-top:10px;font-weight:700}
.billv .btot b{font:700 32px/1 var(--display)}
.billv .linkbtn{color:#1d4fa3}
.btn.pkgon{background:var(--warn);border-color:var(--warn);color:#fff}
.pkgbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warn);color:#fff;border-radius:10px;padding:10px 12px;margin:-2px 0 10px}
.pkgbar span{flex:1;font-size:13px;opacity:.95;min-width:0}
.pkgbar .linkbtn{color:#fff;text-decoration:underline}
.billv .bsec{margin-top:10px;padding:4px 8px;background:#111;color:#fff;font-weight:700;letter-spacing:.08em;font-size:13px;border-radius:4px;display:inline-block}
#updBar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:45;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.halfchk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}

.cartbar{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px}
.cartbar .sum{flex:1;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 16px;min-height:52px;font-weight:600}
.cartbar .sum b{font:700 24px/1 var(--display)}

/* sheets & modals */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .sb{overflow:auto;padding:12px 16px;flex:1}
.sheet .sf{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.sf .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{border:0;background:var(--surface-2);border-radius:50%;width:36px;height:36px;font-size:18px}

.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:600;min-width:0}
.line .lp{font:600 18px/1 var(--display);text-align:right}
.line .sub{font-size:12px;color:var(--muted);grid-column:1}
.line .sub.sent{color:var(--ok)}
.qty{display:flex;align-items:center;gap:6px;grid-column:2;justify-self:end}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.qty span{min-width:22px;text-align:center;font-weight:700}
.lnote{grid-column:1/-1}
.lnote input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 2px}
.total b{font:700 30px/1 var(--display)}

.modal{background:var(--bg);margin:auto 16px;width:100%;max-width:440px;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto;align-self:center}
.preview{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;justify-content:center}
.preview img{width:100%;max-width:320px;image-rendering:pixelated}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink);width:100%}
.f textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px;font-weight:600}
.seg button.act{background:var(--accent);color:var(--accent-ink)}

/* menu editor */
.mlist .mi{display:grid;grid-template-columns:1fr 88px 44px 36px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mi input{border:1px solid transparent;background:transparent;border-radius:8px;padding:8px;width:100%;font-size:15px}
.mi input:focus{border-color:var(--line);background:var(--surface)}
.mi input.p{text-align:right;font-variant-numeric:tabular-nums}
.mi .del{border:0;background:none;color:var(--danger);font-size:20px}
.cathead{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cathead input{font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent;background:transparent;padding:6px 4px;border-radius:8px;width:100%}

/* report */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi b{display:block;font:700 26px/1.1 var(--display);margin-top:4px}
.kpi.big{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.big span{color:inherit;opacity:.7}
.kpi.big b{font-size:38px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t td,.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.void td{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill.nakit{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.kart{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (min-width:600px){.tgrid{grid-template-columns:repeat(4,1fr)}.igrid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>Kanaat Lokantası</b><small><span id="wtag"></span>POS · Sürüm 36</small></div>
    <button class="chip on" id="admChip" data-act="lock" hidden aria-label="Yönetici açık, kilitle" title="Kilitle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></button>
    <button class="chip" id="prChip" data-act="printerChip"><i></i><span>Yazıcı</span></button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-v="tables" class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Masalar</button>
    <button data-act="tab" data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rapor</button>
    <button data-act="tab" data-v="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>Menü</button>
    <button data-act="tab" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V3h12v6M6 17H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M7 14h10v7H7z"/></svg>Yazıcı</button>
  </nav>
  <div class="cartbar" id="cartbar" hidden></div>
</div>
<div id="layer"></div>
<div id="toast"></div>
<button id="updBar" hidden data-act="doUpdate">Yeni sürüm hazır · <b>Yenile</b></button>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>

<script>
/* ============ veri ============ */
const LS='kanaat-pos-v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round(n*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>money(n)+' ₺';
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const dmy=t=>new Date(t).toLocaleDateString('tr-TR');

const HALF_CATS=['Çorbalar','Sıcak Sebze Yemekleri','Zeytinyağlılar','Izgaralar','Salatalar','Pilav ve Makarnalar','Köfteler','Et Yemekleri','Tatlılar'];
const NO_HALF=['Kuzu Etli Özbek Pilavı','Çiftlik Kebabı','Kuzu Kapama','Talaş Kebabı','Kuzu Etli Talaş Böreği','İmam Bayıldı','Zeytinyağlı Enginar Dolma','Zeytinyağlı Enginar','Karnıyarık','Güveçte Parmak Kebabı','Tavuk Kızartma','Şehriyeli Tavuk','Dalyan Köfte','Dana Rosto',
  'Kuzu Ayak Paça','Güveç Türlü','Kereviz Dolma','Tavuk Bonfile','Bonfile','Karışık Izgara','Kase Yoğurdu','Cacık','Fırın Makarna',
  'Kuzu Ciğer Sarma','Kağıt Kebap','Kuzu Keşkek','Kuzu Haşlama','Kuzu Kaburga Dolma','Fırın Bonfile veya Pirzola','Palamut Pilaki',
  'Sütlaç','Aşure','Tavuk Göğsü','Kazandibi','Zerde','Yassı Kadayıf','Şekerpare','Tel Kadayıf','Keşkül','Krem Şokola'];
const HALF_PRICE={'Kaymaklı İncir Tatlısı':210,'Kaymaklı Kayısı Tatlısı':210,'Sade İncir Tatlısı':160,
  'Izgara Köfte (150 gram)':360,'Ankara Köfte':345,'İzmir Köfte':345,'Fırın Köfte':345,'Kayseri Köfte':345,'Mızrak Köfte':345,'Sebzeli Köfte':345,'Ekişili Köfte':345};
const UNIT_ITEMS={'Yaprak Sarma':110,'Lahana Sarma':110};

async function pinHash(pin){const t='kanaat-pos:'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of t)h=((h*33)^ch.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
function unlockAdmin(){ADM.until=Date.now()+ADMIN_MIN*60000;renderAdmChip()}

function requireAdmin(fn,forceNew){
  if(isAdmin()&&!forceNew){touchAdmin();fn();return}
  const hasPin=!!S.settings.adminPin&&!forceNew;
  modal(`<div class="row" style="justify-content:space-between"><h2>${hasPin?'Yönetici şifresi':'Yönetici şifresi belirleyin'}</h2><button class="x" data-act="close" aria-label="Kapat">✕</button></div>
    <p class="muted" style="margin:0">${hasPin?'Bu bölüm sadece yönetici içindir.':'Rapor, Menü ve ayarları korumak için 4–8 haneli bir şifre belirleyin. Garsonlara söylemeyin.'}</p>
    <label class="f">Şifre<input id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>
    ${hasPin?'':'<label class="f">Şifre (tekrar)<input id="pin2" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>'}
    <p id="pinErr" class="muted" style="margin:0;color:var(--danger);min-height:1.2em"></p>
    <button class="btn pri block" id="pinOk">${hasPin?'Aç':'Şifreyi kaydet'}</button>`);
  const p1=document.getElementById('pin1'),err=document.getElementById('pinErr');setTimeout(()=>p1.focus(),50);
  const go=async()=>{const v=p1.value.trim();
    if(!/^\d{4,8}$/.test(v)){err.textContent='Şifre 4–8 rakamdan oluşmalı.';return}
    if(!hasPin){if(v!==document.getElementById('pin2').value.trim()){err.textContent='İki şifre aynı değil.';return}
      S.settings.adminPin=await pinHash(v);save();closeLayer();unlockAdmin();toast('Yönetici şifresi kaydedildi');fn();return}
    if(await pinHash(v)!==S.settings.adminPin){err.textContent='Şifre yanlış.';p1.value='';p1.focus();return}
    closeLayer();unlockAdmin();fn()};
  document.getElementById('pinOk').onclick=go;
  $layer.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
}

function salesOf(day){return S.sales.filter(s=>dayKey(s.at)===day)}
function summary(day){
  const list=salesOf(day),valid=list.filter(s=>!s.void);
  const sum=(f)=>valid.filter(f).reduce((a,s)=>a+s.total,0);
  const items={},pitems={};let pkgTotal=0,pkgSales=0;
  valid.forEach(s=>{let hasP=false;s.lines.forEach(l=>{const m=l.pkg?pitems:items,k=l.name;m[k]=m[k]||{q:0,t:0};m[k].q+=l.qty;m[k].t+=l.qty*l.price;if(l.pkg){pkgTotal+=l.qty*l.price;hasP=true}});if(hasP)pkgSales++});
  const tsum=f=>valid.filter(f).reduce((a,s)=>a+(s.tip||0),0);
  return{list,valid,total:sum(()=>1),cash:sum(s=>s.pay==='Nakit'),card:sum(s=>s.pay==='Kart'),tip:tsum(()=>1),tipCash:tsum(s=>s.pay==='Nakit'),tipCard:tsum(s=>s.pay==='Kart'),
    items:Object.entries(items).sort((a,b)=>b[1].t-a[1].t),pitems:Object.entries(pitems).sort((a,b)=>b[1].t-a[1].t),pkgTotal,pkgSales,voids:list.length-valid.length,
    waiters:Object.entries(valid.reduce((m,s)=>{const w=s.waiter||'(adsız)';m[w]=m[w]||{n:0,t:0,tip:0,tc:0,tk:0};m[w].n++;m[w].t+=s.total;m[w].tip+=s.tip||0;if(s.pay==='Nakit')m[w].tc+=s.tip||0;else m[w].tk+=s.tip||0;return m},{})).sort((a,b)=>b[1].tip-a[1].tip)}
}

const $layer=document.getElementById('layer');
function sheet(html){$layer.innerHTML=`<div class="scrim" data-scrim><div class="sheet">${html}</div></div>`}
function modal(html){$layer.innerHTML=`<div class="scrim" data-scrim style="align-items:center"><div class="modal">${html}</div></div>`}
function closeLayer(){$layer.innerHTML=''}
function ask(msg,okLabel,fn,danger=true){
  modal(`<h2>${esc(msg)}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" data-act="close">Vazgeç</button><button class="btn ${danger?'danger':'pri'}" id="askOk">${esc(okLabel)}</button></div>`);
  document.getElementById('askOk').onclick=()=>{closeLayer();fn()};
}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800)}

const logoOn=()=>S.settings.logo&&LOGO_IMG.complete&&LOGO_IMG.naturalWidth>0&&!(S.settings.printer!=='niimbot'&&S.settings.mode==='text');
function headerRows(){const h=S.settings.header.split('\n').filter(x=>x.trim());
  if(logoOn())return [{k:'logo'},...h.slice(1).map((x,i)=>({k:'c',text:x,b:i===0}))];
  return h.map((x,i)=>i===0?{k:'title',text:x}:{k:'c',text:x})}
function footerRows(){return S.settings.footer.split('\n').filter(x=>x.trim()).map(x=>({k:'c',text:x}))}
function billDoc(tableName,lines,total,opts={}){
  const at=opts.at||Date.now();
  return [...headerRows(),{k:'gap'},
    {k:'lr',l:dmy(at),r:hm(at)},{k:'lr',l:tableName,r:opts.no?('No: '+opts.no):'',b:true},...((opts.waiter??S.settings.waiter)?[{k:'l',text:'Garson: '+(opts.waiter??S.settings.waiter),small:true}]:[]),{k:'hr'},
    ...[...lines.filter(l=>!l.pkg),...(lines.some(l=>l.pkg)?[{sec:1}]:[]),...lines.filter(l=>l.pkg)].flatMap(l=>l.sec?[{k:'gap'},{k:'l',text:'— PAKET —',b:true}]:[{k:'lr',l:`${l.qty} x ${l.name}`,r:money(l.qty*l.price)},...(l.qty>1?[{k:'l',text:`   ${l.qty} x ${money(l.price)}`,small:true}]:[])]),
    {k:'hr'},...(opts.tip>0?[{k:'lr',l:'Ara toplam',r:fmt(total)},{k:'lr',l:'Gönüllü bahşiş',r:fmt(opts.tip)},{k:'big',l:'TOPLAM',r:fmt(total+opts.tip)}]:[{k:'big',l:'TOPLAM',r:fmt(total)}]),
    ...(opts.pay?[{k:'lr',l:'Ödeme',r:opts.pay}]:[{k:'c',text:'— Ödenmedi —'}]),
    {k:'l',text:'Fiyatlarımıza KDV dahildir.',small:true},
    {k:'gap'},...footerRows()];
}
function kitchenDoc(tableName,items){
  return [{k:'title',text:'MUTFAK'},{k:'title',text:tableName},{k:'c',text:dmy(Date.now())+' '+hm(Date.now())},{k:'hr'},
    ...items.flatMap(x=>[{k:'kl',text:(x.l.pkg?'PAKET · ':'')+(x.l.unit?(x.d<0?`İPTAL ${-x.d} TEK `:`${x.d} TEK `)+x.l.name.replace(/ \(tek\)$/,''):(x.d<0?`İPTAL ${-x.d} x `:`${x.d} x `)+(x.l.half?x.l.name.replace(/ \((yarım|az)\)$/,'')+' — AZ':x.l.name))},...(x.l.note?[{k:'l',text:'  » '+x.l.note,b:true}]:[])]),{k:'hr'}];
}
function zDoc(day){
  const r=summary(day);
  return [...headerRows(),{k:'gap'},{k:'title',text:'GÜN SONU'},{k:'c',text:day.split('-').reverse().join('.')+'  ·  yazdırma '+hm(Date.now())},{k:'hr'},
    {k:'lr',l:'Adisyon',r:String(r.valid.length)},{k:'lr',l:'Nakit',r:fmt(r.cash)},{k:'lr',l:'Kart',r:fmt(r.card)},
    ...(r.voids?[{k:'lr',l:'İptal edilen',r:String(r.voids)}]:[]),{k:'hr'},{k:'lr',l:'Masada',r:fmt(r.total-r.pkgTotal)},{k:'lr',l:'Paket',r:fmt(r.pkgTotal)},{k:'big',l:'CİRO',r:fmt(r.total)},
    ...(r.tip?[{k:'hr'},{k:'lr',l:'Bahşiş (nakit)',r:fmt(r.tipCash)},{k:'lr',l:'Bahşiş (kart)',r:fmt(r.tipCard)},{k:'lr',l:'Toplam bahşiş',r:fmt(r.tip),b:true}]:[]),{k:'hr'},
    ...(r.waiters.length?[{k:'c',text:'Garsonlara göre bahşiş',b:true},...r.waiters.map(([w,v])=>({k:'lr',l:`${w} (${v.n} adisyon)`,r:fmt(v.tip)})),{k:'hr'}]:[]),
    {k:'c',text:'Satılan ürünler · masada',b:true},...r.items.map(([n,v])=>({k:'lr',l:`${v.q} x ${n}`,r:money(v.t)})),
    ...(r.pitems.length?[{k:'gap'},{k:'c',text:'Satılan ürünler · paket',b:true},...r.pitems.map(([n,v])=>({k:'lr',l:`${v.q} x ${n}`,r:money(v.t)}))]:[]),{k:'hr'},
    {k:'c',text:'BİLGİ AMAÇLIDIR'}];
}

function renderCanvas(doc){
  const W=S.settings.printer==='niimbot'?Math.min(384,Math.floor(S.settings.labelW*8/8)*8):(S.settings.paper==80?576:384);
  const fs=W===576?28:Math.max(15,Math.round(W*0.06)), pad=6;
  const F=(sz,b)=>`${b?700:500} ${sz}px Figtree, "Helvetica Neue", Arial, sans-serif`;
  const m=document.createElement('canvas').getContext('2d');
  const wrap=(text,font,maxW)=>{m.font=font;const words=String(text).split(' ');const out=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;if(m.measureText(t).width<=maxW||!cur)cur=t;else{out.push(cur);cur=w}}out.push(cur);return out};
  const ops=[];let y=10;
  for(const r of doc){
    if(r.k==='gap'){y+=fs*0.5;continue}
    if(r.k==='logo'){const lw=Math.round(W*0.82),lh=Math.round(LOGO_IMG.naturalHeight*lw/LOGO_IMG.naturalWidth);ops.push({img:true,x:Math.round((W-lw)/2),y:y+4,w:lw,h:lh});y+=lh+10;continue}
    if(r.k==='hr'){ops.push({hr:true,y:y+fs*0.4});y+=fs*0.9;continue}
    if(r.k==='title'||r.k==='c'){const sz=r.k==='title'?Math.round(fs*1.45):fs;const font=F(sz,r.k==='title'||r.b);
      for(const ln of wrap(r.text,font,W-pad*2)){ops.push({t:ln,font,x:W/2,y:y+sz,align:'center'});y+=sz*1.25}continue}
    if(r.k==='l'||r.k==='kl'){const sz=r.k==='kl'?Math.round(fs*1.25):(r.small?Math.round(fs*.85):fs);const font=F(sz,r.k==='kl'||r.b);
      for(const ln of wrap(r.text,font,W-pad*2)){ops.push({t:ln,font,x:pad,y:y+sz,align:'left'});y+=sz*1.25}continue}
    if(r.k==='lr'||r.k==='big'){const sz=r.k==='big'?Math.round(fs*1.4):fs;const font=F(sz,r.k==='big'||r.b);
      m.font=font;const rw=r.r?m.measureText(r.r).width+12:0;const lines=wrap(r.l,font,W-pad*2-rw);
      lines.forEach((ln,i)=>{ops.push({t:ln,font,x:pad,y:y+sz,align:'left'});if(i===0&&r.r)ops.push({t:r.r,font,x:W-pad,y:y+sz,align:'right'});y+=sz*1.25});continue}
  }
  const c=document.createElement('canvas');c.width=W;c.height=Math.ceil(y+24);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';g.strokeStyle='#000';
  for(const o of ops){if(o.img){g.drawImage(LOGO_IMG,o.x,o.y,o.w,o.h);continue}
    if(o.hr){g.setLineDash([6,5]);g.lineWidth=2;g.beginPath();g.moveTo(pad,o.y);g.lineTo(W-pad,o.y);g.stroke();continue}
    g.font=o.font;g.textAlign=o.align;g.textBaseline='alphabetic';g.fillText(o.t,o.x,o.y)}
  return c;
}

/* ============ ESC/POS ============ */
const ESC=0x1b,GS=0x1d;
function concat(arrs){const n=arrs.reduce((a,b)=>a+b.length,0);const o=new Uint8Array(n);let p=0;for(const a of arrs){o.set(a,p);p+=a.length}return o}
function tail(){const t=[new Uint8Array([ESC,0x64,4])];if(S.settings.cutter)t.push(new Uint8Array([GS,0x56,66,0]));return t}
function rasterJob(canvas){
  const W=canvas.width,H=canvas.height,bpr=W/8;const d=canvas.getContext('2d').getImageData(0,0,W,H).data;const parts=[new Uint8Array([ESC,0x40])];
  for(let y0=0;y0<H;y0+=96){const h=Math.min(96,H-y0);const b=new Uint8Array(8+bpr*h);b.set([GS,0x76,0x30,0,bpr&255,bpr>>8,h&255,h>>8]);
    for(let y=0;y<h;y++)for(let x=0;x<W;x++){const i=((y0+y)*W+x)*4;if(d[i]*.299+d[i+1]*.587+d[i+2]*.114<150)b[8+y*bpr+(x>>3)]|=0x80>>(x&7)}
    parts.push(b)}
  return concat([...parts,...tail()]);
}
const TR={'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U','â':'a','Â':'A','î':'i','û':'u','₺':'TL','»':'>>','—':'-','–':'-','·':'-'};
const ascii=s=>String(s).replace(/[^\x20-\x7e]/g,c=>TR[c]??'?');
function textJob(doc){
  const cols=S.settings.paper==80?48:32;const enc=s=>new TextEncoder().encode(ascii(s));const out=[new Uint8Array([ESC,0x40])];
  const nl=()=>out.push(new Uint8Array([0x0a]));
  const wrapC=(t,w)=>{const words=ascii(t).split(' ');const o=[];let c='';for(const x of words){const n=c?c+' '+x:x;if(n.length<=w||!c)c=n;else{o.push(c);c=x}}o.push(c);return o.flatMap(l=>l.match(new RegExp('.{1,'+w+'}','g'))||[''])};
  for(const r of doc){
    if(r.k==='gap'){nl();continue}
    if(r.k==='hr'){out.push(enc('-'.repeat(cols)));nl();continue}
    if(r.k==='title'){out.push(new Uint8Array([ESC,0x61,1,GS,0x21,0x11,ESC,0x45,1]),enc(r.text));nl();out.push(new Uint8Array([GS,0x21,0,ESC,0x45,0,ESC,0x61,0]));continue}
    if(r.k==='c'){out.push(new Uint8Array([ESC,0x61,1,ESC,0x45,r.b?1:0]),enc(r.text));nl();out.push(new Uint8Array([ESC,0x45,0,ESC,0x61,0]));continue}
    if(r.k==='kl'){out.push(new Uint8Array([GS,0x21,0x01,ESC,0x45,1]),enc(r.text));nl();out.push(new Uint8Array([GS,0x21,0,ESC,0x45,0]));continue}
    if(r.k==='l'){out.push(new Uint8Array([ESC,0x45,r.b?1:0]),enc(r.text));nl();out.push(new Uint8Array([ESC,0x45,0]));continue}
    if(r.k==='lr'||r.k==='big'){const R=ascii(r.r||'');const L=wrapC(r.l,cols-R.length-1);
      if(r.k==='big'||r.b)out.push(new Uint8Array([ESC,0x45,1]));
      L.forEach((ln,i)=>{out.push(enc(i===0?ln+' '.repeat(Math.max(1,cols-ln.length-R.length))+R:ln));nl()});
      out.push(new Uint8Array([ESC,0x45,0]));continue}
  }
  return concat([...out,...tail()]);
}

const BLOG=[];

const errText=e=>((e&&e.name&&e.name!=='Error')?e.name+': ':'')+((e&&e.message)||String(e));

const props=c=>Object.entries({read:c.properties.read,write:c.properties.write,wwr:c.properties.writeWithoutResponse,notify:c.properties.notify,indicate:c.properties.indicate}).filter(x=>x[1]).map(x=>x[0]).join(',');
async function listServices(server){

  catch(e){blog('Servis listesi alınamadı ('+errText(e)+'), tek tek deneniyor')}

async function findChar(server){
  if(isNiim()){
    let svc=null;
    try{svc=await server.getPrimaryService(NIIM_SVC);blog('Niimbot servisi bulundu')}catch(e){blog('Niimbot servisi doğrudan bulunamadı: '+errText(e))}
    const svcs=svc?[svc]:await listServices(server);
    let fallback=null;
    for(const sv of svcs){if(sv.uuid.length<5)continue;let chars=[];try{chars=await sv.getCharacteristics()}catch(e){blog('Kanal listesi hatası: '+errText(e));continue}
      for(const c of chars){blog('Kanal '+c.uuid.slice(0,8)+' ['+props(c)+']');
        if(c.properties.notify&&c.properties.writeWithoutResponse)return c;
        if(c.properties.notify&&c.properties.write&&!fallback)fallback=c}}
    if(fallback)return fallback;
    throw new Error('Niimbot kanalı bulunamadı. Listeden B1 ile başlayan yazıcıyı seçin.');
  }
  const svcs=await listServices(server);
  for(const sv of svcs){let chars=[];try{chars=await sv.getCharacteristics()}catch(e){continue}
    for(const c of chars){if(c.properties.writeWithoutResponse||c.properties.write){blog('Kanal '+c.uuid.slice(0,8)+' ['+props(c)+']');return c}}}
  throw new Error('Yazılabilir kanal bulunamadı');
}

async function attach(server){

async function connectBT(){
  if(!navigator.bluetooth)throw new Error('Bu tarayıcı Bluetooth desteklemiyor (Bluefy ile açın)');
  blog('Cihaz seçimi açılıyor ('+(isNiim()?'Niimbot':'fiş yazıcısı')+')');
  const waitT=setTimeout(()=>blog('Cihaz seçimi 20 sn içinde sayfaya ulaşmadı. Sayfa başka bir sayfanın içinde açılmış olabilir.'),20000);
  let dev;try{dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SERVICES})}finally{clearTimeout(waitT)}
  blog('Seçilen cihaz: '+(dev.name||'(adsız)'));
  if(BT.device&&BT.device!==dev){try{BT.device.gatt.disconnect()}catch(e){}}
  BT.device=dev;
  if(!dev._kanaat){dev.addEventListener('gattserverdisconnected',()=>{blog('Bağlantı koptu');BT.char=null;renderChip()});dev._kanaat=true}

  try{server=await dev.gatt.connect()}catch(e){blog('Bağlanamadı: '+errText(e));throw new Error('Yazıcıya bağlanılamadı. Yazıcı açık mı, Niimbot uygulaması kapalı mı? ('+errText(e)+')')}

async function ensureBT(){
  if(BT.char&&BT.device?.gatt?.connected&&BT.niim===isNiim())return true;
  if(BT.device){blog('Yeniden bağlanılıyor: '+(BT.device.name||''));
    try{await attach(await BT.device.gatt.connect());return true}catch(e){blog('Yeniden bağlanamadı: '+errText(e))}}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sendBytes(bytes){
  const CH=100;
  for(let i=0;i<bytes.length;i+=CH){const part=bytes.slice(i,i+CH);
    if(BT.noResp&&BT.char.writeValueWithoutResponse){await BT.char.writeValueWithoutResponse(part);await sleep(18)}
    else if(BT.char.writeValueWithResponse)await BT.char.writeValueWithResponse(part);
    else await BT.char.writeValue(part);}
}
function jobFor(doc){return S.settings.mode==='text'?textJob(doc):rasterJob(renderCanvas(doc))}

/* ---- Niimbot B1 protokolü (açık kaynak niimbluelib'e göre) ---- */
const u16=n=>[(n>>8)&255,n&255];
function nPkt(cmd,data){let x=cmd^data.length;for(const b of data)x^=b;
  const a=[0x55,0x55,cmd,data.length,...data,x&255,0xaa,0xaa];return new Uint8Array(cmd===0xC1?[3,...a]:a)}
const NERR={1:'Yazıcının kapağı açık',2:'Etiket bitti',3:'Pil zayıf, şarja takın',6:'Veri hatası',7:'Yazıcı ısındı, biraz bekleyin',8:'Etiket çıkmadı, ruloyu kontrol edin',9:'Yazıcı meşgul',0x10:'Takılı etiket uygun değil',0x11:'Etiket tipi ayarlanamadı',0x13:'Koyuluk ayarlanamadı',0x14:'Etiket rulosu tanınmadı: kapağı açıp ruloyu yeniden yerleştirin, orijinal Niimbot rulosu kullanın'};
function nOnData(e){const v=e.target.value;const a=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);
  const b=new Uint8Array(BT.rx.length+a.length);b.set(BT.rx);b.set(a,BT.rx.length);BT.rx=b;
  for(;;){let i=0;while(i<BT.rx.length-1&&!(BT.rx[i]===0x55&&BT.rx[i+1]===0x55))i++;
    if(i>0)BT.rx=BT.rx.slice(i);
    if(BT.rx.length<4)break;const tot=BT.rx[3]+7;if(BT.rx.length<tot)break;
    const cmd=BT.rx[2],data=BT.rx.slice(4,4+BT.rx[3]);BT.rx=BT.rx.slice(tot);
    const w=BT.waiter;if(!w)continue;
    if(cmd===0xDB||cmd===0x00){BT.waiter=null;clearTimeout(w.t);w.rej(new Error(cmd?((NERR[data[0]]||'Yazıcı hata verdi')+' (kod '+data[0]+')'):'Yazıcı bu komutu kabul etmedi'))}
    else if(w.ids.includes(cmd)){BT.waiter=null;clearTimeout(w.t);w.res(data)}}
}
async function nWrite(bytes){const c=BT.char;if(!c)throw new Error('Yazıcı bağlı değil');
  if(c.properties.writeWithoutResponse&&c.writeValueWithoutResponse)await c.writeValueWithoutResponse(bytes);
  else if(c.writeValueWithResponse)await c.writeValueWithResponse(bytes);else await c.writeValue(bytes);
  await sleep(12)}
function nCmd(cmd,data,ids,timeout=1500){return new Promise((res,rej)=>{
  const t=setTimeout(()=>{if(BT.waiter&&BT.waiter.t===t)BT.waiter=null;rej(new Error('Yazıcı yanıt vermedi'))},timeout);
  BT.waiter={ids,res,rej,t};nWrite(nPkt(cmd,data)).catch(e=>{clearTimeout(t);BT.waiter=null;rej(e)})})}
function niimPages(canvas){
  const W=canvas.width,H=canvas.height,bpr=W/8,d=canvas.getContext('2d').getImageData(0,0,W,H).data;
  const rows=[];for(let y=0;y<H;y++){const r=new Uint8Array(bpr);let any=false;
    for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i]*.299+d[i+1]*.587+d[i+2]*.114<150){r[x>>3]|=0x80>>(x&7);any=true}}rows.push(any?r:null)}
  let end=H;while(end>0&&!rows[end-1])end--;
  let start=0;while(start<end&&!rows[start])start++;
  const pageRows=Math.round(S.settings.labelH*8),margin=12,usable=pageRows-margin*2;
  const pages=[];let pos=start;
  while(pos<end){let cut=Math.min(end,pos+usable);
    if(cut<end){let c=cut;while(c>pos+usable*0.5&&rows[c-1])c--;if(c>pos+usable*0.5)cut=c}
    const page=new Array(pageRows).fill(null);for(let y=pos;y<cut;y++)page[margin+(y-pos)]=rows[y];
    pages.push(page);pos=cut;while(pos<end&&!rows[pos])pos++}
  if(!pages.length)pages.push(new Array(pageRows).fill(null));
  return pages.map(pg=>({rows:pageRows,cols:W,packets:niimRowPackets(pg,bpr)}));
}
const same=(a,b)=>{if(a===b)return true;if(!a||!b||a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true};
function niimRowPackets(page,bpr){
  const out=[];const chunk=16;
  for(let y=0;y<page.length;){let rep=1;while(y+rep<page.length&&rep<255&&same(page[y],page[y+rep]))rep++;
    const r=page[y];
    if(!r)out.push(nPkt(0x84,[...u16(y),rep]));
    else{const parts=[0,0,0];let total=0;
      r.forEach((v,i)=>{let n=0;for(let b=0;b<8;b++)if(v&(1<<b))n++;total+=n;if(bpr<=chunk*3)parts[Math.floor(i/chunk)]+=n});
      const counts=bpr<=chunk*3?parts:[0,total&255,(total>>8)&255];
      out.push(nPkt(0x85,[...u16(y),...counts,rep,...r]))}
    y+=rep}
  return out;
}
let niimLabels=1;
async function niimPrint(canvas){
  const pages=niimPages(canvas),total=pages.length;niimLabels=total;blog('Baskı başlıyor: '+total+' etiket, '+S.settings.labelW+'×'+S.settings.labelH+' mm');
  try{
    await nCmd(0x21,[Math.min(5,Math.max(1,S.settings.density|0||3))],[0x31]);
    await nCmd(0x23,[1],[0x33]);
    await nCmd(0x01,[...u16(total),0,0,0,0,0],[0x02]);
    for(const p of pages){
      await nCmd(0x03,[1],[0x04]);
      await nCmd(0x13,[...u16(p.rows),...u16(p.cols),...u16(1)],[0x14]);
      for(const pk of p.packets)await nWrite(pk);
      await nCmd(0xE3,[1],[0xE4],10000);blog('Etiket gönderildi');
    }
    const t0=Date.now();
    while(Date.now()-t0<20000+total*4000){await sleep(400);let d;try{d=await nCmd(0xA3,[1],[0xB3],1500)}catch(e){if(/kod/.test(e.message))throw e;continue}
      if(d.length>=2&&((d[0]<<8)|d[1])>=total)break}
  }finally{try{await nCmd(0xF3,[1],[0xF4],3000)}catch(e){}}
}
let printing=false;
async function printDoc(doc,label){
  if(await ensureBT()){
    if(printing){toast('Yazıcı meşgul, biraz bekleyin');return false}
    printing=true;toast(label+' yazdırılıyor…');
    try{if(BT.niim)await niimPrint(renderCanvas(doc));else await sendBytes(jobFor(doc));toast(label+' yazdırıldı'+(BT.niim&&niimLabels>1?` (${niimLabels} etiket)`:''));return true}
    catch(e){blog('Baskı hatası: '+errText(e));toast('Yazdırılamadı: '+errText(e));showPreview(doc,label);return false}
    finally{printing=false}
  }
  showPreview(doc,label);return false;
}

    const box=document.getElementById('tipCustomBox');box.hidden=v!=='custom';if(v==='custom')setTimeout(()=>document.getElementById('tipInput').focus(),50);
    updatePay()},
  async doPay(d){const t=S.tables[ui.table];if(!t)return;const pr=document.getElementById('payPrint')?.checked;
    const lines=t.lines.filter(l=>l.qty>0).map(l=>({name:l.name,price:l.price,qty:l.qty,...(l.pkg?{pkg:true}:{})}));
    const tip=tipAmount(tTotal(t));
    const sale={id:uid(),no:++S.seq,table:tName(ui.table),lines,total:tTotal(t),tip,pay:d.p,at:Date.now(),waiter:S.settings.waiter||''};
    S.sales.push(sale);delete S.tables[ui.table];save();closeLayer();ui.view='tables';render();
    toast(`${sale.table} kapandı · ${d.p} ${fmt(sale.total+tip)}${tip?' (bahşiş '+fmt(tip)+')':''}`);
    if(pr)await printDoc(billDoc(sale.table,lines,sale.total,{pay:d.p,no:sale.no,at:sale.at,tip,waiter:sale.waiter}),'Fiş')},
  clearTable(){requireAdmin(()=>ask(tName(ui.table)+' boşaltılsın mı?','Boşalt',()=>{delete S.tables[ui.table];save();ui.view='tables';render();toast('Masa boşaltıldı')}))},
  moveTable(){const t=S.tables[ui.table];if(!t||!tCount(t)){toast('Taşınacak ürün yok');return}
    const free=tableList().filter(x=>x.key!==ui.table);
    modal(`<div class="row" style="justify-content:space-between"><h2>Nereye taşınsın?</h2><button class="x" data-act="close" aria-label="Kapat">✕</button></div>
     <p class="muted" style="margin:0">Dolu masaya taşırsanız adisyonlar birleşir.</p>
     <div class="tgrid">${free.map(x=>`<button class="tile ${S.tables[x.key]&&tCount(S.tables[x.key])?'open':''}" style="min-height:64px" data-act="doMove" data-k="${esc(x.key)}"><span class="n">${esc(x.short)}</span></button>`).join('')}</div>`)},
  doMove(d){const from=S.tables[ui.table],to=S.tables[d.k];
    if(to){to.lines.push(...from.lines);to.openedAt=Math.min(to.openedAt,from.openedAt)}else S.tables[d.k]=from;
    delete S.tables[ui.table];ui.table=d.k;save();closeLayer();render();toast('Taşındı: '+tName(d.k))},
  async printZ(){await printDoc(zDoc(ui.reportDay),'Gün sonu')},
  csv(){const r=summary(ui.reportDay);const rows=[['No','Tarih','Saat','Masa','Garson','Ödeme','Tutar','Paket tutarı','Bahşiş','Durum','Ürünler']];
    r.list.forEach(s=>rows.push([s.no,dmy(s.at),hm(s.at),s.table,s.waiter||'',s.pay,money(s.total),money(s.lines.filter(l=>l.pkg).reduce((a,l)=>a+l.qty*l.price,0)),money(s.tip||0),s.void?'İptal':'',s.lines.map(l=>l.qty+'x '+l.name+(l.pkg?' (paket)':'')).join(', ')]));
    const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'kanaat-satis-'+ui.reportDay+'.csv')},
  saleMenu(d){const s=S.sales.find(x=>x.id===d.id);if(!s)return;
    modal(`<div class="row" style="justify-content:space-between"><h2>${esc(s.table)} · ${hm(s.at)}</h2><button class="x" data-act="close" aria-label="Kapat">✕</button></div>
     <div>${s.lines.map(l=>`<div class="row" style="justify-content:space-between"><span>${l.qty} x ${esc(l.name)}</span><span class="num">${fmt(l.qty*l.price)}</span></div>`).join('')}</div>
     ${s.tip?`<div class="row num" style="justify-content:space-between"><span class="muted">Gönüllü bahşiş</span><span>${fmt(s.tip)}</span></div>`:''}
     <div class="total"><span class="muted">${s.pay}${s.void?' · İPTAL':''}</span><b class="num">${fmt(s.total+(s.tip||0))}</b></div>
     <button class="btn" data-act="reprint" data-id="${s.id}">Fişi tekrar yazdır</button>
     <button class="btn danger" data-act="voidSale" data-id="${s.id}">${s.void?'İptali geri al':'Adisyonu iptal et'}</button>`)},
  async reprint(d){const s=S.sales.find(x=>x.id===d.id);closeLayer();await printDoc(billDoc(s.table,s.lines,s.total,{pay:s.pay,no:s.no,at:s.at,tip:s.tip||0,waiter:s.waiter||''}),'Fiş')},
  voidSale(d){const s=S.sales.find(x=>x.id===d.id);s.void=!s.void;save();closeLayer();render();toast(s.void?'Adisyon iptal edildi':'İptal geri alındı')},
  bulk(d){const txt=document.getElementById('bulk').value;const parsed=parseMenu(txt);
    if(!parsed.items.length){toast('Okunabilir satır yok. Biçim: Kategori | Ürün | Fiyat');return}
    const go=()=>{const m=d.mode==='replace'?{cats:[],items:[],sample:false}:{...S.menu,sample:false};
      for(const it of parsed.items){let c=m.cats.find(x=>x.name.toLocaleLowerCase('tr')===it.cat.toLocaleLowerCase('tr'));if(!c){c={id:uid(),name:it.cat};m.cats.push(c)}
        m.items.push({id:uid(),cat:c.id,name:it.name,price:it.price})}
      S.menu=m;ui.cat=null;save();render();toast(parsed.items.length+' ürün yüklendi'+(parsed.bad?` · ${parsed.bad} satır okunamadı`:''))};
    if(d.mode==='replace')ask(`Mevcut menü silinip ${parsed.items.length} ürün yüklensin mi?`,'Değiştir',go,false);else go()},
  resetMenu(){ask('Menü, 09.07.2026 fiyat listesine geri dönsün mü? Yaptığınız menü değişiklikleri silinir.','Geri dön',()=>{S.menu=sampleMenu();ui.cat=null;save();render();toast('Fiyat listesi yüklendi')},false)},
  addCat(){S.menu.cats.push({id:uid(),name:'Yeni kategori'});S.menu.sample=false;save();render()},
  delCat(d){const n=S.menu.items.filter(i=>i.cat===d.id).length;ask(`Kategori ve içindeki ${n} ürün silinsin mi?`,'Sil',()=>{S.menu.cats=S.menu.cats.filter(c=>c.id!==d.id);S.menu.items=S.menu.items.filter(i=>i.cat!==d.id);save();render()})},
  addItem(d){const it={id:uid(),cat:d.cat,name:'Yeni ürün',price:0};S.menu.items.push(it);S.menu.sample=false;save();render();const el=document.getElementById('in-'+it.id);if(el){el.focus();el.select()}},
  delItem(d){S.menu.items=S.menu.items.filter(i=>i.id!==d.id);save();render()},
  set(d){if(d.k==='printer'&&S.settings.printer!==d.val){try{BT.device?.gatt?.disconnect()}catch(e){}BT.char=null;BT.device=null}
    S.settings[d.k]=(d.k==='paper'||d.k==='density')?Number(d.val):d.val;save();render()},
  label(d){S.settings.labelW=Number(d.w);S.settings.labelH=Number(d.h);save();render();toast('Etiket: '+d.w+'×'+d.h+' mm')},
  async connect(){try{await connectBT();toast('Yazıcı bağlandı');render()}catch(e){if(isCancel(e)){blog('Seçim iptal edildi');return}blog('Hata: '+errText(e));toast(errText(e));render()}},
  async copyLog(){const t=BLOG.join('\n')||'(kayıt yok)';try{await navigator.clipboard.writeText(t);toast('Kayıt kopyalandı')}catch(e){const el=document.getElementById('btlog');const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Metin seçildi, Kopyala deyin')}},
  disconnect(){try{BT.device?.gatt?.disconnect()}catch(e){}BT.char=null;BT.device=null;render()},
  async testPrint(){await printDoc([...headerRows(),{k:'gap'},{k:'c',text:'Deneme fişi',b:true},{k:'c',text:'Türkçe: ıİşŞğĞüÜöÖçÇ ₺'},{k:'hr'},{k:'lr',l:'2 x Mercimek Çorbası',r:money(240)},{k:'big',l:'TOPLAM',r:fmt(240)},{k:'gap'},...footerRows()],'Deneme fişi')},
  backup(){download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'kanaat-pos-yedek-'+dayKey(Date.now())+'.json')},
  restore(){document.getElementById('restoreFile').click()},
  pickLogo(){document.getElementById('logoFile').click()},
  resetLogo(){S.settings.logoData='';save();loadLogo();setTimeout(render,50);toast('Kanaat logosu geri geldi')}
};
function parseNum(s){s=String(s).replace(/[₺\s]|TL/gi,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:null}
function parseMenu(txt){let cat='Genel';const items=[];let bad=0;
  for(let raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;
    if(line.startsWith('#')){cat=line.replace(/^#+/,'').trim()||cat;continue}
    const p=line.split(/\s*[|;\t]\s*/).filter(x=>x!=='');
    if(p.length>=3){const pr=parseNum(p[p.length-1]);if(pr!=null){items.push({cat:p[0],name:p.slice(1,-1).join(' '),price:pr});continue}}
    if(p.length===2){const pr=parseNum(p[1]);if(pr!=null){items.push({cat,name:p[0],price:pr});continue}}
    const m=line.match(/^(.*?)[\s.…-]+(\d[\d.,]*)\s*(₺|TL)?$/i);if(m&&parseNum(m[2])!=null){items.push({cat,name:m[1].trim(),price:parseNum(m[2])});continue}
    if(p.length===1&&!/\d/.test(line)){cat=line;continue}
    bad++}
  return{items,bad}}
async function download(blob,name){
  let dl=null;try{dl=window.claude?.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});toast('Kaydedildi')}catch(e){if(e&&e.code!=='declined')toast('Dosya kaydedilemedi')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.itemhalf){const i=S.menu.items.find(x=>x.id===el.dataset.itemhalf);if(i){i.noHalf=!el.checked;save();toast(i.name+': az '+(i.noHalf?'yok':'var'))}}
  if(el.dataset.cathalf){const c=S.menu.cats.find(x=>x.id===el.dataset.cathalf);if(c){c.half=el.checked;save();toast(c.name+': az porsiyon '+(c.half?'açık':'kapalı'))}}
  if(el.id==='halfPct'){const n=Math.max(30,Math.min(100,parseInt(el.value)||50));S.settings.halfPct=n;save();vMenu()}
  if(el.dataset.note){const l=findLine(el.dataset.note);if(l){l.note=el.value.trim();save()}}
  if(el.dataset.catname){const c=S.menu.cats.find(x=>x.id===el.dataset.catname);if(c){c.name=el.value.trim()||c.name;S.menu.sample=false;save()}}
  if(el.dataset.iname){const i=S.menu.items.find(x=>x.id===el.dataset.iname);if(i){i.name=el.value.trim()||i.name;S.menu.sample=false;save()}}
  if(el.dataset.iprice){const i=S.menu.items.find(x=>x.id===el.dataset.iprice);const n=parseNum(el.value);if(i&&n!=null){i.price=n;S.menu.sample=false;save()}el.value=money(i?i.price:0)}
});
document.getElementById('restoreFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.menu||!d.settings)throw 0;ask('Yedek yüklensin mi? Bu telefondaki veriler değişir.','Yükle',()=>{S={...defaults(),...d};save();render();toast('Yedek yüklendi')},false)}catch(x){toast('Bu dosya geçerli bir yedek değil')}};
  r.readAsText(f);e.target.value=''};
document.getElementById('logoFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const img=new Image();img.onload=()=>{const w=600,h=Math.max(1,Math.round(img.height*w/img.width));const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    const d=g.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const v=d.data[i]*.299+d.data[i+1]*.587+d.data[i+2]*.114<150?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
    g.putImageData(d,0,0);S.settings.logoData=c.toDataURL('image/png');save();loadLogo();setTimeout(render,50);toast('Logo değişti');URL.revokeObjectURL(img.src)};
  img.onerror=()=>toast('Bu görsel açılamadı');img.src=URL.createObjectURL(f)};
setInterval(()=>{if(ui.view==='tables')vTables()},60000);
/* güncelleme kontrolü */
const MY_VER=parseInt((document.querySelector('.brand small')?.textContent.match(/Sürüm (\d+)/)||[])[1]||'0');
let NEW_VER=0;
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol))return;
  try{const r=await fetch(location.pathname+'?ver='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/POS · Sürüm (\d+)/);const v=m?parseInt(m[1]):0;
    if(v>MY_VER){NEW_VER=v;document.getElementById('updBar').hidden=false}}catch(e){}
}
A.doUpdate=()=>{location.replace(location.pathname+'?v='+(NEW_VER||Date.now()))};
setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
render();
