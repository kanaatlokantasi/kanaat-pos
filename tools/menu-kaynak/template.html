TE.sheep": ["از شیر گوسفند", "Van schapenmelk"], "NOTE.sep": ["سرشیر جداگانه حساب می‌شود", "Room wordt apart berekend"], "NOTE.breakfast": ["فقط در ساعات صبحانه", "Alleen tijdens het ontbijt"], "MEAT.b": ["گوشت گوساله", "Rund"], "MEAT.l": ["گوشت بره", "Lam"], "MEAT.c": ["مرغ", "Kip"], "MEAT.t": ["بوقلمون", "Kalkoen"], "MEAT.f": ["ماهی", "Vis"], "ALG.G": ["گلوتن", "Gluten"], "ALG.M": ["شیر", "Melk"], "ALG.E": ["تخم‌مرغ", "Ei"], "ALG.N": ["مغزها", "Noten"], "ALG.C": ["کرفس", "Selderij"], "ALG.F": ["ماهی", "Vis"], "DIET.V": ["وگان", "Veganistisch"], "DIET.v": ["گیاهی", "Vegetarisch"], "DIET.GF": ["بدون گلوتن", "Glutenvrij"], "DIET.NF": ["بدون مغزها", "Notenvrij"], "DIET.SF": ["بدون شکر", "Suikervrij"], "DIET.DF": ["بدون لبنیات", "Zuivelvrij"], "CHEF_UI.title": ["پیشنهاد سرآشپز", "Aanbeveling van de chef"], "CHEF_UI.today": ["امروز {d} است", "Vandaag is het {d}"], "CHEF_UI.show": ["نمایش در منو", "Toon in het menu"], "CHEF_UI.close": ["بستن", "Sluiten"], "CART_UI.add": ["افزودن", "Toevoegen"], "CART_UI.my": ["صورت‌حساب من", "Mijn rekening"], "CART_UI.total": ["جمع کل", "Totaal"], "CART_UI.note": ["این فهرست فقط برای راحتی شماست. ممکن است برخی غذاها تمام شده باشند؛ گارسون تأیید می‌کند. صورت‌حساب رسمی را گارسون می‌آورد.", "Deze lijst is alleen een hulpmiddel. Sommige gerechten kunnen op zijn; de ober bevestigt dit. De officiële rekening komt van de ober."], "CART_UI.show": ["نشان دادن به گارسون", "Aan de ober laten zien"], "CART_UI.scan": ["از گارسون بخواهید این کد را با گوشی خود اسکن کند.", "Vraag de ober deze code met zijn telefoon te scannen."], "CART_UI.clear": ["پاک کردن فهرست", "Lijst wissen"], "CART_UI.back": ["بازگشت", "Terug"], "CART_UI.az": ["نیم‌پرس", "Halve portie"], "CART_UI.tek": ["۱ عدد", "1 stuk"], "CART_UI.p3": ["۱ پرس = ۳ عدد", "1 portie = 3 stuks"], "CART_UI.long": ["فهرست برای کد QR خیلی طولانی است. لطفاً این صفحه را به گارسون نشان دهید.", "De lijst is te lang voor een QR-code. Laat dit scherm aan de ober zien."], "OK_UI.title": ["صورت‌حساب تأییدشدهٔ ش ingen hebben voldaan. Uw feedback is rechtstreeks naar de eigenaar gegaan en we gaan ermee aan de slag."], "FB_UI.google": ["بسیار خوشحال می‌شویم اگر تجربهٔ خود را در گوگل هم به اشتراک بگذارید.", "We zouden het fijn vinden als u uw ervaring ook op Google deelt."], "FB_UI.gbtn": ["نوشتن نظر در گوگل", "Schrijf een Google-review"], "FB_UI.err": ["ارسال نشد. لطفاً دوباره تلاش کنید.", "Versturen mislukt. Probeer het opnieuw."], "AVAIL_UI.menu": ["این منوی کامل ماست. ممکن است برخی غذاها امروز موجود نباشند؛ لطفاً از گارسون بپرسید.", "Dit is ons volledige menu. Sommige gerechten zijn vandaag mogelijk niet beschikbaar; vraag het de ober."], "AVAIL_UI.chef": ["ممکن است تمام شده باشد؛ لطفاً از گارسون بپرسید.", "Het kan uitverkocht zijn; vraag het de ober."], "CHAT.title": ["از سرآشپز بپرسید", "Vraag het de chef"], "CHAT.sub": ["یک سؤال انتخاب کنید", "Kies een vraag"], "CHAT.hello": ["خوش آمدید! چطور می‌توانم کمکتان کنم؟", "Welkom! Hoe kan ik u helpen?"], "CHAT.story": ["داستان کامل ما را بخوانید", "Lees ons hele verhaal"], "CHAT.insta": ["اگر از حضورتان لذت می‌برید، ما را در اینستاگرام دنبال کنید. خوشحال می‌شویم آنجا هم شما را ببینیم! 😊", "Bevalt uw bezoek? Volg ons dan op Instagram. We zien u daar graag ook! 😊"], "CHAT.follow": ["دنبال کردن در اینستاگرام", "Volgen op Instagram"], "CHAT.calc": ["محاسبهٔ صورت‌حساب من", "Mijn rekening berekenen"], "CHAT.maps": ["باز کردن در نقشه", "Openen in Kaarten"], "Q.first.q": ["اولین بار است که اینجا می‌آیم. چه چیزی را امتحان کنم؟", "Ik ben hier voor het eerst. Wat moet ik proberen?"], "Q.first.a": ["برای اولین بارتان، پلو ازبکی با گوشت بره را به‌عنوان غذای اصلی، کنگر فرنگی در روغن زیتون را کنارش و در پایان دسر به با سرشیر را پیشنهاد می‌کنم. برای دیدن هر غذا روی آن بزنید:", "Voor uw eerste bezoek raad ik Oezbeekse pilav met lamsvlees aan als hoofdgerecht, artisjok in olijfolie als bijgerecht en als afsluiter het kweepeerdessert met room. Tik op een gerecht om het te zien:"], "Q.story.q": ["داستان اینجا چیست؟", "Wat is het verhaal van deze plek?"], "Q.story.a": ["لوکانتای ما در سال ۱۹۳۳ در اسکودار توسط خانوادهٔ کارگیلی تأسیس شد؛ خانواده‌ای که سنت دسرهای شیری و بستنی‌اش به حدود ۱۵۰ سال پیش برمی‌گردد. ما هنوز یک کسب‌وکار خانوادگی هستیم: در هر مرحله، از تولید و خرید تا آشپزخانه و سرویس، یکی از اعضای خانواده کار می‌کند و برخی از آشپزهای ما بیش از ۴۰ سال سابقه دارند.\n\nهر روز ۱۰۰ تا ۱۲۰ نوع دسر، غذای روغن زیتونی، خوراک گرم، بستنی و ماست را تازه آماده می‌کنیم. قانون ما ساده است: فقط بهترین مواد اولیه. اگر کیفیت مناسب را پیدا نکنیم، آن غذا را نمی‌پزیم. به لطف بسته‌بندی‌ای که از دههٔ ۱۹۷۰ روی آن کار می‌کنیم، غذای ما به خانه‌ها و دفترها هم می‌رسد.\n\nدر سال ۲۰۰۰، نظرسنجی «۱۰۰ بهترین در غذا» مجلهٔ ویزیون ما را بهترین لوکانتای سنتی با بهترین بستنی، ماست، اکمک کادایفی و سوپ پاچه معرفی کرد. در نیویورک تایمز، لوموند و ال از ما نوشته‌اند و راهنماهای لونلی پلنت، راف گاید، لو گید دو روتار و لویی ویتون ما را توصیه می‌کنند. در سال‌های ۲۰۲۵ و ۲۰۲۶ جایزهٔ آشپزی سنتی را از راهنمای گو-میو ترکیه دریافت کردیم.", "Onze lokanta werd in 1933 in Üsküdar opgericht door de familie Kargılı, wier traditie in melkdesserts en ijs zo'n 150 jaar teruggaat. We zijn nog steeds een familiebedrijf: in elke fase, van productie en inkoop tot keuken en bediening, werkt een familielid, en sommige van onze koks hebben meer dan 40 jaar ervaring.\n\nElke dag bereiden we vers 100 tot 120 soorten desserts, gerechten in olijfolie, warme gerechten, ijs en yoghurt. Onze regel is simpel: alleen de beste ingrediënten. Vinden we niet de juiste kwaliteit, dan maken we dat gerecht niet. Dankzij de verpakking die we sinds de jaren zeventig ontwikkelen, bereikt ons eten ook huizen en kantoren.\n\nIn 2000 riep de enquête ‘Beste 100 in eten’ van het tijdschrift Vizyon ons uit tot beste traditionele lokanta, met het beste ijs, de beste yoghurt, ekmek kadayıfı en pootjessoep. We stonden in de New York Times, Le Monde en Elle, en worden aanbevolen door Lonely Planet, Rough Guide, Le Guide du Routard en de Louis Vuitton-gids. In 2025 en 2026 ontvingen we de prijs voor Traditionele Keuken in de Gault&Millau-gids Turkije."], "Q.today.q": ["امروز چه پیشنهادی دارید؟", "Wat raadt u vandaag aan?"], "Q.today.a": ["امروز این را پیشنهاد می‌کنم. مطمئنم خیلی دوستش خواهید داشت:", "Vandaag raad ik dit aan. U gaat het vast heerlijk vinden:"], "Q.veg.q": ["گیاه‌خواران چه می‌توانند بخورند؟", "Wat kunnen vegetariërs eten?"], "Q.veg.a": ["بیشتر غذاهای روغن زیتونی ما وگان هستند، سالادها و کمپوت‌ها هم همین‌طور. با دکمهٔ زیر فقط غذاهای گیاهی را می‌بینید. توجه: بیشتر خوراک‌های گرم سبزیجات ما با گوشت پخته می‌شوند.", "De meeste van onze gerechten in olijfolie zijn veganistisch, net als de salades en compotes. Met de knop hieronder ziet u alleen de vegetarische gerechten. Let op: de meeste warme groentegerechten worden met vlees bereid."], "Q.olive.q": ["«غذاهای روغن زیتونی» چیست؟", "Wat zijn ‘gerechten in olijfolie’?"], "Q.olive.a": ["سبزیجاتی که آرام در روغن زیتون پخته و سرد سرو می‌شوند؛ از غذاهای کلاسیک آشپزی استانبول. بیشترشان وگان هستند. با دلمهٔ برگ مو یا امام بایلدی شروع کنید:", "Groenten die langzaam in olijfolie zijn gegaard en koud worden geserveerd, een klassieker uit de Istanbulse keuken. De meeste zijn veganistisch. Begin met gevulde wijnbladeren of İmambayıldı:"], "Q.dessert.q": ["کدام دسر را پیشنهاد می‌کنید؟", "Welk dessert raadt u aan?"], "Q.dessert.a": ["دسر به با سرشیر از محبوب‌ترین‌هاست. برای چیزی سبک، شیربرنج؛ برای چیزی شربتی، اکمک کادایفی. اگر کنجکاوید، کازان‌دیبی را امتحان کنید: با سینهٔ مرغ درست می‌شود، اما طعمش شیرین است!", "Ons kweepeerdessert met room is een favoriet. Voor iets lichts: rijstpudding; voor iets met siroop: ekmek kadayıfı. Bent u nieuwsgierig? Probeer kazandibi: het wordt gemaakt met kipfilet, en toch smaakt het zoet!"], "Q.allergy.q": ["حساسیت دارم. چه کار کنم؟", "Ik heb een allergie. Wat moet ik doen?"], "Q.allergy.a": ["لطفاً پیش از سفارش به گارسون بگویید؛ او به آشپزخانه اطلاع می‌دهد. برچسب‌های نارنجی زیر هر غذا آلرژن‌ها را نشان می‌دهند: گلوتن، شیر، تخم‌مرغ، مغزها، کرفس، ماهی و کنجد. برچسب‌ها راهنما هستند، پس برای اطمینان با گارسون هماهنگ کنید.", "Meld het aan de ober voordat u bestelt; hij geeft het door aan de keuken. De oranje labels onder elk gerecht tonen de allergenen: gluten, melk, ei, noten, selderij, vis en sesam. De labels zijn een richtlijn, dus controleer het voor de zekerheid bij de ober."], "Q.togo.q": ["می‌توانم غذاهایتان را بیرون ببرم؟", "Kan ik uw gerechten meenemen?"], "Q.togo.a": ["البته! همهٔ غذاها و دسرهای ما بیرون‌بر هم هستند. همچنین می‌توانید دسرها را کیلویی، ماست شیر گوسفند در کوزهٔ سفالی و مرباهای خانگی ما را بخرید. با بسته‌بندی مناسب، بستنی ما ساعت‌ها بدون آب شدن سفر می‌کند. یک سوغاتی شیرین از اسکودار.", "Natuurlijk! Al onze gerechten en desserts zijn ook om mee te nemen. U kunt ook desserts per kilo kopen, schapenmelkyoghurt in een aardewerken pot en onze huisgemaakte jam. Met de juiste verpakking kan ons ijs uren reizen zonder te smelten. Een zoet souvenir uit Üsküdar."], "Q.cater.q": ["آیا برای خانه، دفتر، مراسم، عروسی و مولودی تحویل غذا و کیترینگ دارید؟", "Verzorgen jullie bezorging en catering voor thuis, kantoren, evenementen, bruiloften en mevlids?"], "Q.cater.a": ["بله! به خانه‌ها و دفترها غذا می‌رسانیم و برای مراسم، عروسی و مولودی (مجالس مذهبی) کیترینگ داریم.", "Ja zeker! We bezorgen eten bij huizen en kantoren, en verzorgen catering voor evenementen, bruiloften en mevlids (religieuze bijeenkomsten)."], "Q.calc.q": ["چطور صورت‌حسابم را حساب کنم؟", "Hoe kan ik mijn rekening uitrekenen?"], "Q.calc.a": ["آسان است! «🧾 {calc}» را در بالا باز کنید و غذاهایی را که خورده‌اید با «+» اضافه کنید؛ برای برخی غذاها می‌توانید نیم‌پرس یا یک عدد هم انتخاب کنید. نوار «{my}» در پایین جمع کل را نشان می‌دهد. وقتی تمام شد، «{show}» را بزنید: گارسون کد را اسکن، بررسی و تأیید می‌کند. سپس می‌توانید صورت‌حساب تأییدشده را به زبان خودتان در گوشی ذخیره کنید.", "Heel eenvoudig! Open bovenaan ‘🧾 {calc}’ en voeg met ‘+’ de gerechten toe die u heeft gegeten; bij sommige gerechten kunt u ook een halve portie of één stuk kiezen. De balk ‘{my}’ onderaan toont uw totaal. Klaar? Tik dan op ‘{show}’: de ober scant de code, controleert en bevestigt. Daarna kunt u de bevestigde rekening in uw eigen taal op uw telefoon opslaan."], "Q.fb.q": ["می‌خواهم نظرم را بگویم", "Ik wil graag mijn mening geven"], "Q.fb.a": ["با کمال میل! لطفاً امتیاز بدهید و اگر خواستید چند کلمه بنویسید:", "Graag! Geef ons een beoordeling en schrijf, als u wilt, een paar woorden:"], "Q.hours.q": ["ساعت کاری شما چیست؟", "Wat zijn uw openingstijden?"], "CHEF_REC": ["پیشنهاد سرآشپز برای این {d}", "Deze {d} raadt de chef aan"]};
(()=>{const D={UI,CAT,CNOTE,NOTE,MEAT,ALG,DIET,CHEF_UI,CART_UI,OK_UI,TIP_UI,DRINK_UI,SPLIT_UI,FB_UI,AVAIL_UI};
 for(let i=0;i<2;i++)for(const [path,vals] of Object.entries(EXT6)){const [a,b,c]=path.split(".");
  if(a==="CHEF_REC")CHEF_REC.push(vals[i]);
  else if(a==="CHAT")CHAT[b].push(vals[i]);
  else if(a==="Q"){const q=CHAT.q.find(x=>x.id===b);if(q)q[c].push(vals[i])}

că. O amintire dulce din Üsküdar."], "Q.cater.q": ["Oferiți livrare de mâncare și catering pentru case, birouri, evenimente, nunți și mevlid-uri?"], "Q.cater.a": ["Da! Livrăm mâncare la case și birouri și oferim catering pentru evenimente, nunți și mevlid-uri (întâlniri religioase)."], "Q.calc.q": ["Cum îmi pot calcula nota?"], "Q.calc.a": ["Este simplu! Deschideți „🧾 {calc}” sus și adăugați cu „+” preparatele pe care le-ați mâncat; la unele preparate puteți alege și jumătate de porție sau o singură bucată. Bara „{my}” de jos arată totalul. Când ați terminat, atingeți „{show}”: ospătarul scanează codul, îl verifică și îl confirmă. Apoi puteți salva nota confirmată pe telefon, în limba dumneavoastră."], "Q.fb.q": ["Aș dori să-mi spun părerea"], "Q.fb.a": ["Cu plăcere! Vă rugăm să ne dați o notă și, dacă doriți, să scrieți câteva cuvinte:"], "Q.hours.q": ["Care este programul dumneavoastră?"], "CHEF_REC": ["Recomandarea bucătarului-șef pentru {d}"]};

"Q.first.a":["Na pierwszą wizytę polecam pilaw w stylu uzbeckim z jagnięciną jako danie główne, do tego karczochy na oliwie, a na deser tartę z pigwy z kaymakiem. Dotknij potrawę, by ją zobaczyć:","לביקור הראשון אני ממליץ על פילאף בסגנון אוזבקי עם כבש כמנה עיקרית, ארטישוק בשמן זית בצד, וקינוח חבוש עם קאימק לסיום. הקישו על מנה כדי לראות אותה:","За първото ви посещение препоръчвам узбекски пилаф с агнешко като основно ястие, артишок в зехтин отстрани и дюлев десерт с каймак за финал. Докоснете ястие, за да го видите:","Për vizitën e parë, rekomandoj pilaf uzbek me qengj si pjatë kryesore, angjinare në vaj ulliri në anë dhe ëmbëlsirë ftoi me kaymak për fund. Prekni një pjatë për ta parë:","पहली बार आने पर मैं मेमने वाला उज़्बेक शैली का पिलाफ़ मुख्य व्यंजन के रूप में, साथ में जैतून तेल वाले आर्टिचोक और अंत में कैमक के साथ क्विंस मिठाई की सलाह दूँगा। किसी व्यंजन को छूकर देखें:"],
"Q.story.q":["Jaka jest historia tego miejsca?","מה הסיפור של המקום הזה?","Каква е историята на това място?","Cila është historia e këtij vendi?","इस जगह की कहानी क्या है?"],
"Q.story.a":["Nasza lokanta powstała w 1933 roku w Üsküdar. Założyła ją rodzina Kargılı, której tradycja deserów mlecznych i lodów sięga około 150 lat wstecz. Do dziś jesteśmy rodzinnym biznesem: na każdym etapie, od produkcji i zakupów po kuchnię i obsługę, pracuje ktoś z rodziny, a niektórzy nasi kucharze mają ponad 40 lat doświadczenia.\n\nKażdego dnia świeżo przygotowujemy 100–120 rodzajów deserów, dań na oliwie, dań gorących, lodów i jogurtów. Nasza zasada jest prosta: najlepsze składniki. Jeśli nie znajdziemy odpowiedniej jakości, danie nie powstaje. Dzięki opakowaniom, które rozwijamy od lat 70., nasze jedzenie trafia też do domów i biur.\n\nW 2000 roku w ankiecie „100 najlepszych w jedzeniu” magazynu Vizyon uznano nas za najlepszą tradycyjną lokantę, z najlepszymi lodami, jogurtem, ekmek kadayıfı i zupą z flaków. Pisały o nas New York Times, Le Monde i Elle, a polecają nas Lonely Planet, Rough Guide, Le Guide du Routard i przewodnik Louis Vuitton. W 2025 i 2026 roku otrzymaliśmy nagrodę Traditional Cuisine w przewodniku Gault&Millau Turcja.", "הלוקנטה שלנו נוסדה ב-1933 באוסקודר על ידי משפחת קרגילי, שמסורתה של קינוחי חלב וגלידה נמשכת כ-150 שנה. אנחנו עדיין עסק משפחתי: בכל שלב, מהייצור והרכש ועד המטבח והשירות, עובד מבני המשפחה, וחלק מהטבחים שלנו בעלי ניסיון של יותר מ-40 שנה.\n\nבכל יום אנחנו מכינים טרי 100–120 סוגי קינוחים, מנות בשמן זית, מנות חמות, גלידה ויוגורט. הכלל שלנו פשוט: רק החומרים הטובים ביותר. אם לא נמצא חומר גלם באיכות הראויה, לא נכין את המנה. בזכות אריזות שפיתחנו מאז שנות ה-70, האוכל שלנו מגיע גם לבתים ולמשרדים.\n\nבשנת 2000 זכינו בסקר „100 הטובים באוכל” של מגזין Vizyon כלוקנטה המסורתית הטובה ביותר, עם הגלידה, היוגורט, ekmek kadayıfı ומרק הקרביים הטובים ביותר. הופענו ב-New York Times, Le Monde ו-Elle, ואנחנו מומלצים על ידי Lonely Planet, Rough Guide, Le Guide du Routard ומדריך Louis Vuitton. בשנים 2025 ו-2026 זכינו בפרס המטבח המסורתי במדריך Gault&Millau טורקיה.", "Нашата lokanta е основана през 1933 г. в Ускюдар от семейство Каргъли, чиято традиция с млечни десерти и сладолед е около 150 години. Все още сме семеен бизнес: във всеки етап, от производството и покупките до кухнята и обслужването, работи някой от семейството, а някои от готвачите ни имат над 40 години опит.\n\nВсеки ден приготвяме пресни 100–120 вида десерти, ястия със зехтин, топли ястия, сладолед и кисело мляко. Нашето правило е просто: най-добрите продукти. Ако не намерим подходящото качество, не приготвяме ястието. Благодарение на опаковките, които развиваме от 70-те години, храната ни стига и до домовете и офисите.\n\nПрез 2000 г. в анкетата „100 най-добри в храната“ на списание Vizyon бяхме избрани за най-добра традиционна lokanta, с най-добрия сладолед, кисело мляко, ekmek kadayıfı и супа от шкембе. Публикувани сме в New York Times, Le Monde и Elle, а ни препоръчват Lonely Planet, Rough Guide, Le Guide du Routard и справочникът на Louis Vuitton. През 2025 и 2026 г. получихме наградата за традиционна кухня в Gault&Millau Турция.", "Lokanta jonë u themelua në 1933 në Üsküdar nga familja Kargılı, tradita e të cilës me ëmbëlsira me qumësht dhe akullore shkon rreth 150 vjet. Ende jemi biznes familjar: në çdo fazë, nga prodhimi dhe blerjet deri te kuzhina dhe shërbimi, punon dikush nga familja, dhe disa nga kuzhinierët tanë kanë mbi 40 vjet përvojë.\n\nÇdo ditë përgatisim të freskëta 100–120 lloje ëmbëlsirash, pjata me vaj ulliri, pjata të nxehta, akullore dhe kos. Rregulli ynë është i thjeshtë: vetëm lëndët e para më të mira. Nëse nuk gjejmë cilësinë e duhur, nuk e përgatisim pjatën. Falë paketimeve që zhvillojmë që nga vitet 70, ushqimi ynë arrin edhe në shtëpi dhe zyra.\n\nNë vitin 2000, në sondazhin „100 më të mirët në ushqim” të revistës Vizyon, u zgjodhëm lokanta tradicionale më e mirë, me akulloren, kosin, ekmek kadayıfı dhe supën e shkembit më të mirë. Kemi qenë në New York Times, Le Monde dhe Elle, dhe na rekomandojnë Lonely Planet, Rough Guide, Le Guide du Routard dhe udhëzuesi Louis Vuitton. Në 2025 dhe 2026 morëm çmimin e kuzhinës tradicionale në udhëzuesin Gault&Millau Turqi.", "हमारी लोकांता की स्थापना 1933 में उस्कुदार में कारगिली परिवार ने की थी, जिनकी दूध की मिठाइयों और आइसक्रीम की परंपरा लगभग 150 साल पुरानी है। हम आज भी एक पारिवारिक व्यवसाय हैं: उत्पादन और खरीद से लेकर रसोई और सेवा तक हर चरण में परिवार का कोई न कोई सदस्य काम करता है, और हमारे कुछ रसोइयों का अनुभव 40 वर्षों से अधिक है।\n\nहर दिन हम ताज़ा 100–120 प्रकार की मिठाइयाँ, जैतून तेल के व्यंजन, गरम व्यंजन, आइसक्रीम और दही तैयार करते हैं। हमारा नियम सीधा है: केवल सबसे अच्छी सामग्री। अगर सही गुणवत्ता की सामग्री न मिले, तो हम वह व्यंजन नहीं बनाते। 1970 के दशक से विकसित हमारी पैकिंग के कारण हमारा खाना घरों और दफ़्तरों तक भी पहुँचता है।\n\n2000 में Vizyon पत्रिका के „खाने में सर्वश्रेष्ठ 100” सर्वेक्षण में हमें सर्वश्रेष्ठ पारंपरिक लोकांता चुना गया, साथ ही सर्वश्रेष्ठ आइसक्रीम, दही, एकमेक कादायिफ़ और पाचा सूप के लिए भी। हम New York Times, Le Monde और Elle में छपे हैं, और Lonely Planet, Rough Guide, Le Guide du Routard तथा Louis Vuitton गाइड हमारी सिफ़ारिश करते हैं। 2025 और 2026 में हमें Gault&Millau तुर्की गाइड में पारंपरिक व्यंजन पुरस्कार मिला।"],
"Q.today.q":["Co dzisiaj polecacie?","מה אתם ממליצים היום?","Какво препоръчвате днес?","Çfarë rekomandoni sot?","आज आप क्या सुझाते हैं?"],
"Q.today.a":["Dzisiaj polecam to danie, jestem pewien, że Państwu zasmakuje:","היום אני ממליץ על זה, בטוח שתאהבו:","Днес препоръчвам това, сигурен съм, че ще ви хареса:","Sot rekomandoj këtë, jam i sigurt që do t'ju pëlqejë:","आज मैं यह सुझाता हूँ, मुझे यकीन है आपको पसंद आएगा:"],
"Q.veg.q":["Co mogą jeść wegetarianie?","מה צמחונים יכולים לאכול?","Какво могат да ядат вегетарианците?","Çfarë mund të hanë vegjetarianët?","शाकाहारी लोग क्या खा सकते हैं?"],
"Q.veg.a":["Większość naszych dań na oliwie jest wegańska, podobnie sałatki i kompoty. Przyciskiem poniżej zobaczą Państwo w menu tylko dania wegetariańskie. Uwaga: większość gorących dań warzywnych gotujemy z mięsem.","רוב מנות השמן הזית שלנו טבעוניות, וכך גם הסלטים והקומפוטים. בלחצן שלמטה תוכלו לראות בתפריט רק מנות צמחוניות. לתשומת לבכם: רוב מנות הירקות החמות שלנו מבושלות עם בשר.","Повечето ни ястия със зехтин са веган, както и салатите и компотите. С бутона по-долу виждате само вегетарианските ястия. Забележка: повечето ни топли зеленчукови ястия се готвят с месо.","Shumica e pjatave tona në vaj ulliri janë vegane, po ashtu sallatat dhe kompot. Me butonin më poshtë shihni vetëm pjatat vegjetariane. Shënim: shumica e pjatave tona të nxehta me perime gatuhen me mish.","हमारे जैतून तेल वाले अधिकतर व्यंजन वीगन हैं, सलाद और कॉम्पोट भी। नीचे के बटन से आप केवल शाकाहारी व्यंजन देख सकते हैं। ध्यान दें: हमारे गर्म सब्ज़ी व्यंजनों में से अधिकतर मांस के साथ पकाए जाते हैं।"],
"Q.olive.q":["Czym są „dania na oliwie”?","מה זה „מנות בשמן זית”?","Какво са „ястията със зехтин”?","Çfarë janë „pjatat me vaj ulliri”?","„जैतून तेल के व्यंजन” क्या होते हैं?"],
"Q.olive.a":["Warzywa powoli duszone w oliwie z oliwek i podawane na zimno, klasyka kuchni stambulskiej. Większość to dania wegańskie. Zacznij od sarmy z liści winogron lub imambayıldı:","ירקות שמבושלים לאט בשמן זית ומוגשים קרים, מאפייה קלאסית של המטבח האיסטנבולי. רובם טבעוניים. אפשר להתחיל מעלי גפן ממולאים או מאימאמבאיילדי:","Зеленчуци, бавно сготвени в зехтин и сервирани студени, класика на истанбулската кухня. Повечето са веган. Започнете със сармички от лозови листа или имам баялды:","Perime të gatuara ngadalë në vaj ulliri dhe të shërbyera të ftohta, klasik i kuzhinës stambollite. Shumica janë vegane. Filloni me gjethe hardhie të mbushura ose imambajaldi:","सब्ज़ियाँ जैतून तेल में धीरे-धीरे पकाकर ठंडी परोसी जाती हैं, इस्तांबुल की पाक-कला की एक क्लासिक। इनमें से अधिकतर वीगन हैं। अंगूर की पत्तियों में भरे चावल या इमामबायल्दी से शुरू करें:"],
"Q.dessert.q":["Który deser Państwu polecacie?","איזה קינוח אתם ממליצים?","Кой десерт препоръчвате?","Cilën ëmbëlsirë rekomandoni?","कौन सी मिठाई सुझाते हैं?"],
"Q.dessert.a":["Nasz deser z pigwy z kaymakiem jest bardzo lubiany. Na coś lekkiego polecam sütlaç, a na coś słodkiego i syropowego ekmek kadayıfı. Jeśli jest Pan/Pani ciekawy, proszę spróbować kazandibi: zawiera pierś z kurczaka, a smakuje słodko!","קינוח החבוש שלנו עם קאימק הוא מהאהובים. למשהו קל, אני ממליץ על סוטלאץ', ולמשהו מתוק וספוג סירופ, על ekmek kadayıfı. אם אתם סקרנים, נסו קזאנדיבי: יש בו חזה עוף, אבל הטעם מתוק!","Нашият дюлев десерт с каймак е много обичан. За нещо леко препоръчвам сютлач, а за нещо сладко и сироповано – ekmek kadayıfı. Ако сте любопитни, опитайте казандиби: има пилешко филе, но вкусът е сладък!","Ëmbëlsira jonë me ftoi dhe kaymak është shumë e dashur. Për diçka të lehtë rekomandoj sütlaç, për diçka të ëmbël me shurup ekmek kadayıfı. Nëse jeni kurioz, provoni kazandibi: ka gjoks pule, por ka shije të ëmbël!","हमारी कैमक के साथ क्विंस मिठाई बहुत पसंद की जाती है। हल्की चीज़ के लिए सुतलाच, और शरबती मीठे के लिए एकमेक कादायिफ़। अगर आप उत्सुक हैं, तो कज़ानदिबी आज़माएँ: इसमें चिकन ब्रेस्ट होता है, पर स्वाद मीठा होता है!"],
"Q.allergy.q":["Mam alergię, co mam zrobić?","יש לי אלרגיה, מה לעשות?","Имам алергия, какво да правя?","Kam një alergji, çfarë duhet të bëj?","मुझे एलर्जी है, मुझे क्या करना चाहिए?"],
"Q.allergy.a":["Proszę powiedzieć kelnerowi przed zamówieniem, przekaże to kuchni. Pomarańczowe etykiety pod każdym daniem pokazują alergeny: gluten, mleko, jajka, orzechy, seler, ryby i sezam. Etykiety są tylko wskazówką; dla pewności proszę zapytać kelnera.","נא לספר למלצר לפני ההזמנה, והוא יעביר זאת למטבח. התוויות הכתומות מתחת לכל מנה מציינות אלרגנים: גלוטן, חלב, ביצים, אגוזים, סלרי, דגים ושומשום. התוויות הן הנחיה בלבד, אנא בדקו עם המלצר לוודאות.","Моля, кажете на сервитьора преди поръчка; той ще уведоми кухнята. Оранжевите етикети под всяко ястие показват алергените: глутен, мляко, яйца, ядки, целина, риба и сусам. Етикетите са ориентир, за сигурност попитайте сервитьора.","Ju lutemi tregojeni kamarierit para porosisë; ai do ta njoftojë kuzhinën. Etiketat portokalli nën çdo pjatë tregojnë alergenët: gluten, qumësht, vezë, arra, selino, peshk dhe sezam. Etiketat janë udhëzues; për siguri pyesni kamarierin.","कृपया ऑर्डर देने से पहले वेटर को बताएं, वह रसोई को सूचित करेगा। हर व्यंजन के नीचे नारंगी लेबल एलर्जेन बताते हैं: ग्लूटेन, दूध, अंडा, मेवे, सेलेरी, मछली और तिल। लेबल केवल मार्गदर्शन हैं, पक्का करने के लिए वेटर से पूछें।"],
"Q.togo.q":["Czy mogę zabrać dania na wynos?","אפשר לקחת את המנות הביתה?","Мога ли да взема ястията за вкъщи?","Mund t'i marr pjatat për me çuar?","क्या मैं आपके व्यंजन पैक करवा सकता हूँ?"],
"Q.togo.a":["Oczywiście! Wszystkie nasze dania i desery są dostępne na wynos. Desery sprzedajemy też na kilogramy, jogurt z mleka owczego w glinianym garnku, a domowe dżemy w słoikach. Lody też można zabrać, w odpowiednim opakowaniu nie topnieją przez wiele godzin. Słodka pamiątka z Üsküdar.","בטח! כל המנות והקינוחים שלנו זמינים גם לקחת. אפשר לקנות את הקינוחים לפי ק״ג, יוגורט מחלב כבשים בסיר חרס וריבות ביתיות בצנצנת. גם הגלידה נשמרת שעות בלי להימס באריזה מתאימה. מזכרת מתוקה מאוסקודר.","Разбира се! Всички наши ястия и десерти са налични и за вкъщи. Десертите можете да купите и на килограм, овчето кисело мляко в глинен съд и домашните сладка в буркан. Сладоледът също издържа часове без да се топи в подходяща опаковка. Сладък спомен от Ускюдар.","Sigurisht! Të gjitha pjatat dhe ëmbëlsirat tona janë të disponueshme edhe për me marrë. Ëmbëlsirat i shisni edhe me kile, kosin e delës në tenxhere balte dhe reçelet e bëra në shtëpi në kavanoz. Akullorja gjithashtu qëndron orë të tëra pa u shkrirë në paketim të duhur. Një kujtim i ëmbël nga Üsküdar.","बेशक! हमारे सभी व्यंजन और मिठाइयाँ पैक करवाए जा सकते हैं। मिठाइयाँ किलो के हिसाब से, मिट्टी के बर्तन में भेड़ के दूध का दही और घर के बने जैम जार में मिलते हैं। सही पैकिंग में आइसक्रीम भी घंटों पिघलती नहीं। उस्कुदार की एक मीठी सौगात।"],
"Q.cater.q":["Czy oferują Państwo dostawę jedzenia i catering do domów, biur, na wydarzenia, wesela i mevlidy?","האם אתם מספקים משלוחי אוכל וקייטרינג לבתים, למשרדים, לאירועים, לחתונות ולמבלידים?","Предлагате ли доставка на храна и кетъринг за домове, офиси, събития, сватби и мевлиди?","A ofroni dërgim ushqimi dhe catering për shtëpi, zyra, evente, dasma dhe mevlide?","क्या आप घरों, दफ़्तरों, आयोजनों, शादियों और मेवलिद के लिए खाना डिलीवरी और कैटरिंग करते हैं?"],
"Q.cater.a":["Tak! Dostarczamy jedzenie do domów i biur oraz zapewniamy catering na wydarzenia, wesela i mevlidy (spotkania religijne).","כן! אנחנו מספקים משלוחי אוכל לבתים ולמשרדים, ומציעים קייטרינג לאירועים, לחתונות ולמבלידים (מפגשים דתיים).","Да! Доставяме храна до домове и офиси и предлагаме кетъринг за събития, сватби и мевлиди (религиозни събирания).","Po! Dërgojmë ushqim në shtëpi dhe zyra dhe ofrojmë catering për evente, dasma dhe mevlide (mbledhje fetare).","हाँ! हम घरों और दफ़्तरों तक खाना पहुँचाते हैं, और आयोजनों, शादियों और मेवलिद (धार्मिक सभाओं) के लिए कैटरिंग करते हैं।"],
"Q.calc.q":["Jak mogę obliczyć mój rachunek?","איך אפשר לחשב את החשבון?","Как мога да изчисля сметката си?","Si mund ta llogaris llogarinë time?","अपना बिल कैसे जोड़ूँ?"],
"Q.calc.a":["Bardzo łatwo! Otwórz u góry „🧾 {calc}”, dodaj zjedzone dania przyciskiem „+”; przy niektórych daniach można też wybrać małą porcję lub 1 sztukę. Pasek „{my}” na dole pokazuje sumę. Gdy skończysz, naciśnij „{show}”: kelner zeskanuje kod, sprawdzi i potwierdzi. Potwierdzony rachunek możesz zapisać w telefonie w swoim języku.","קל מאוד! פתחו את „🧾 {calc}” למעלה והוסיפו את המנות שאכלתם עם „+”; בחלק מהמנות אפשר לבחור גם מנה קטנה או יחידה אחת. הפס „{my}” שלמטה מציג את הסכום. בסיום לחצו על „{show}”: המלצר יסרוק את הקוד, יבדוק ויאשר. את החשבון המאושר אפשר לשמור בטלפון בשפה שלכם.","Много лесно! Отворете „🧾 {calc}” най-горе и добавете ястията с „+”; при някои ястия можете да изберете и половин порция или 1 брой. Лентата „{my}” долу показва общата сума. Когато приключите, натиснете „{show}”: сервитьорът сканира кода, проверява и потвърждава. Потвърдената сметка можете да запазите в телефона си на вашия език.","Shumë e thjeshtë! Hapni „🧾 {calc}” lart dhe shtoni pjatat me „+”; te disa pjata mund të zgjidhni edhe porcion gjysmë ose 1 copë. Shiriti „{my}” poshtë tregon totalin. Kur të mbaroni, shtypni „{show}”: kamarieri skanon kodin, kontrollon dhe konfirmon. Llogarinë e konfirmuar mund ta ruani në telefon në gjuhën tuaj.","बहुत आसान! ऊपर „🧾 {calc}” खोलें और खाए गए व्यंजन „+” से जोड़ें; कुछ व्यंजनों में आधी प्लेट या 1 नग भी चुन सकते हैं। नीचे की पट्टी „{my}” कुल राशि दिखाती है। पूरा होने पर „{show}” दबाएँ: वेटर कोड स्कैन करके जाँच कर पुष्टि करेगा। पुष्टि की गई बिल को आप अपनी भाषा में फ़ोन में सहेज सकते हैं।"],
"Q.fb.q":["Chcę podzielić się opinią","אשמח לשתף את דעתי","Искам да споделя мнението си","Do të doja të ndaj mendimin tim","मैं अपनी राय साझा करना चाहता/चाहती हूँ"],
"Q.fb.a":["Bardzo się cieszymy! Proszę nas ocenić i, jeśli chcą Państwo, napisać kilka słów:","נשמח מאוד! אנא דרגו אותנו, ואם תרצו כתבו כמה מילים:","Ще се радваме! Моля, оценете ни и, ако желаете, напишете няколко думи:","Do të gëzoheshim! Ju lutemi na vlerësoni dhe, nëse dëshironi, shkruani disa fjalë:","हमें बहुत खुशी होगी! कृपया हमें रेट करें और चाहें तो कुछ शब्द भी लिखें:"],
"Q.hours.q":["Jakie są Państwa godziny otwarcia?","מה שעות הפעילות שלכם?","Какво е работното ви време?","Cili është orari juaj i punës?","आपका खुलने का समय क्या है?"]
};

o": ["بر اساس ۱۴ ماده حساسیت‌زای اصلی تعریف‌شده توسط وزارت کشاورزی و جنگلداری ترکیه.", "依據土耳其農林部定義的 14 種主要過敏原。", "อ้างอิงจากสารก่อภูมิแพ้หลัก 14 ชนิดที่กระทรวงเกษตรและป่าไม้ตุรกีกำหนด", "Dựa trên 14 chất gây dị ứng chính do Bộ Nông nghiệp và Lâm nghiệp Thổ Nhĩ Kỳ quy định.", "Berdasarkan 14 alergen utama yang ditetapkan oleh Kementerian Pertanian dan Kehutanan Turki.", "Batay sa 14 na pangunahing allergens na itinakda ng Turkish Ministry of Agriculture and Forestry."], "ALGI.inm": ["مواد حساسیت‌زا در غذاهای ما", "我們餐點中的過敏原", "สารก่อภูมิแพ้ในอาหารของเรา", "Chất gây dị ứng trong món ăn của chúng tôi", "Alergen dalam hidangan kami", "Allergens sa aming mga pagkain"], "ALGI.out": ["در آشپزخانه ما استفاده نمی‌شود", "本廚房未使用", "ไม่ได้ใช้ในครัวของเรา", "Không được dùng trong bếp của chúng tôi", "Tidak digunakan di dapur kami", "Hindi ginagamit sa aming kusina"], "ALGI.show": ["نمایش غذاهای بدون آن", "顯示不含此成分的餐點", "แสดงเมนูที่ไม่มีสารนี้", "Xem các món không có chất này", "Tampilkan hidangan tanpa ini", "Ipakita ang mga pagkaing walang ito"], "ALGI.cnt": ["غذاها: {n}", "餐點：{n}", "เมนู: {n}", "Món: {n}", "Hidangan: {n}", "Mga pagkain: {n}"], "PORT_UI.full": ["پرس کامل", "整份", "จานเต็ม", "Phần đầy đủ", "Porsi penuh", "Buong serving"], "PORT_UI.half": ["شما یک پرس نصفه ({h}) افزوده‌اید. پرس کامل {f} است.", "您加入了半份（{h}）。整份為 {f}。", "คุณเพิ่มครึ่งจาน ({h}) จานเต็มคือ {f}", "Bạn đã thêm nửa phần ({h}). Phần đầy đủ là {f}.", "Anda menambahkan setengah porsi ({h}). Porsi penuh adalah {f}.", "Nagdagdag ka ng kalahating serving ({h}). Ang buong serving ay {f}."], "CHAT.title": ["از سرآشپز بپرسید", "問問主廚", "ถามเชฟ", "Hỏi đầu bếp", "Tanya Koki", "Magtanong sa Chef"], "CHAT.sub": ["یک سؤال انتخاب کنید", "選擇一個問題", "เลือกคำถาม", "Chọn một câu hỏi", "Pilih pertanyaan", "Pumili ng tanong"], "CHAT.hello": ["خوش آمدید! چطور می‌توانم کمک کنم؟", "歡迎！有什麼可以為您效勞？", "ยินดีต้อนรับ! มีอะไรให้ช่วยไหม", "Chào mừng! Tôi có thể giúp gì cho bạn?", "Selamat datang! Ada yang bisa saya bantu?", "Maligayang pagdating! Paano kita matutulungan?"], "CHAT.story": ["داستان کامل ما را بخوانید", "閱讀我們的完整故事", "อ่านเรื่องราวทั้งหมดของเรา", "Đọc câu chuyện đầy đủ của chúng tôi", "Baca kisah lengkap kami", "Basahin ang aming buong kuwento"], "CHAT.insta": ["اگر از بازدیدتان لذت می‌برید، ما را در اینستاگرام دنبال کنید. خوشحال می‌شویم آنجا هم ببینیمتان! 😊", "如果您喜歡這次的體驗，歡迎在 Instagram 追蹤我們。也很期待在那裡見到您！😊", "หากคุณชอบการมาเยือนของคุณ ติดตามเราบน Instagram ด้วยนะ เรายินดีที่จะได้เห็นคุณที่นั่นเช่นกัน! 😊", "Nếu bạn thích chuyến ghé thăm này, hãy theo dõi chúng tôi trên Instagram. Chúng tôi rất mong được gặp bạn ở đó! 😊", "Jika Anda menikmati kunjungan ini, ikuti kami di Instagram. Kami senang bertemu Anda di sana juga! 😊", "Kung nagustuhan mo ang iyong pagbisita, sundan kami sa Instagram. Gusto ka rin naming makita doon! 😊"], "CHAT.follow": ["دنبال کردن در اینستاگرام", "在 Instagram 追蹤", "ติดตามบน Instagram", "Theo dõi trên Instagram", "Ikuti di Instagram", "I-follow sa Instagram"], "CHAT.calc": ["محاسبه صورت‌حساب من", "計算我的帳單", "คำนวณบิลของฉัน", "Tính hóa đơn của tôi", "Hitung tagihan saya", "Kalkulahin ang aking bill"], "CHAT.maps": ["باز کردن در نقشه", "在地圖中開啟", "เปิดในแผนที่", "Mở trên bản đồ", "Buka di Peta", "Buksan sa Maps"], "Q.first.q": ["اولین بار است که اینجا هستم. چه چیزی را باید امتحان کنم؟", "這是我第一次來。應該嘗試什麼？", "นี่เป็นครั้งแรกที่มา ควรลองอะไรดี", "Đây là lần đầu tôi đến. Nên thử món gì?", "Ini pertama kali saya ke sini. Apa yang sebaiknya saya coba?", "Ngayon ang unang beses ko rito. Ano ang dapat kong subukan?"], "Q.first.a": ["برای اولین بار، پلوی ازبکی با گوشت بره را به‌عنوان غذای اصلی، آرتیشو در روغن زیتون را به‌عنوان مکمل و دسر به پخته با خامه را برای پایان پیشنهاد می‌کنم. برای دیدن غذا روی آن ضربه بزنید:", "首次光臨，我推薦烏茲別克抓飯羊肉作為主餐，搭配橄欖油朝鮮薊，最後以榲桲甜點配凝脂奶油收尾。點按餐點即可查看：", "สำหรับการมาครั้งแรก ผมแนะนำข้าวพิลาฟอุซเบกกับเนื้อแกะเป็นเมนูหลัก ทานคู่กับอาร์ติโชคผัดน้ำมันมะกอก และปิดท้ายด้วยขนมควินซ์กับครีมข้น แตะเมนูเพื่อดูภาพ:", "Lần đầu ghé thăm, tôi gợi ý cơm pilaf kiểu Uzbek với thịt cừu làm món chính, atiso nấu dầu ô liu ăn kèm, và tráng miệng mộc qua với kem đặc để kết thúc. Chạm vào món để xem:", "Untuk kunjungan pertama, saya merekomendasikan pilaf gaya Uzbek dengan domba sebagai hidangan utama, artisoke dalam minyak zaitun sebagai pendamping, dan pencuci mulut kuwini dengan krim kental untuk penutup. Ketuk hidangan untuk melihatnya:", "Para sa unang pagbisita, inirerekomenda ko ang Uzbek pilaf na may tupa bilang pangunahing ulam, artichoke sa olive oil bilang side, at quince dessert na may clotted cream pampatapos. I-tap ang isang pagkain para makita ito:"], "Q.story.q": ["داستان این مکان چیست؟", "這家店的故事是什麼？", "เรื่องราวของที่นี่เป็นอย่างไร", "Câu chuyện của quán này là gì?", "Apa kisah tempat ini?", "Ano ang kuwento ng lugar na ito?"], "Q.story.a": ["رستوران ما در سال ۱۹۳۳ در اوسکودار توسط خانواده کارگیلی تأسیس شد؛ سنت آن‌ها در دسرهای شیری و بستنی حدود ۱۵۰ سال قدمت دارد. ما هنوز یک کسب‌وکار خانوادگی هستیم: در هر مرحله، از تولید و خرید تا آشپزخانه و خدمات، یکی از اعضای خانواده کار می‌کند و برخی از آشپزهای ما بیش از ۴۰ سال تجربه دارند.\n\nما هر روز ۱۰۰ تا ۱۲۰ نوع دسر، غذای روغن زیتون، غذای گرم، بستنی و ماست تازه تهیه می‌کنیم. قاعده ما ساده است: فقط بهترین مواد اولیه. اگر کیفیت مناسب را پیدا نکنیم، آن غذا را تهیه نمی‌کنیم. به لطف بسته‌بندی‌هایی که از دهه ۱۹۷۰ توسعه داده‌ایم، غذای ما به خانه‌ها و دفاتر هم می‌رسد.\n\nدر سال ۲۰۰۰، نظرسنجی «۱۰۰ بهترین در غذا» مجله Vizyon ما را بهترین لوکانتای سنتی انتخاب کرد، با بهترین بستنی، ماست، ekmek kadayıfı و سوپ پاچه. ما در New York Times، Le Monde و Elle معرفی شده‌ایم و Lonely Planet، Rough Guide، Le Guide du Routard و راهنمای Louis Vuitton ما را توصیه می‌کنند. در سال‌های ۲۰۲۵ و ۲۰۲۶ جایزه آشپزی سنتی راهنمای Gault&Millau ترکیه را دریافت کردیم.", "本店於 1933 年由 Kargılı 家族在烏斯屈達爾創立，其牛奶甜點與冰淇淋的傳統已有約 150 年歷史。我們仍是家族經營：從生產、採購到廚房與服務，每個環節都有家族成員參與，部分廚師擁有逾 40 年經驗。\n\n我們每天新鮮製作 100 至 120 種甜點、橄欖油料理、熱食、冰淇淋與優格。我們的原則很簡單：只用最好的食材。若找不到合適的品質，我們就不做那道菜。得益於我們自 1970 年代起持續改良的包裝，我們的食物也能送到家中與辦公室。\n\n2000 年，《Vizyon》雜誌的「食物百大」調查將我們評為最佳傳統 lokanta，並肯定我們的冰淇淋、優格、ekmek kadayıfı 與羊蹄湯。我們曾登上《紐約時報》、《世界報》與《ELLE》，並獲得 Lonely Planet、Rough Guide、Le Guide du Routard 與路易威登指南推薦。2025 與 2026 年，我們獲得 Gault&Millau 土耳其指南的傳統料理獎。", "ร้านของเราก่อตั้งขึ้นในปี 1933 ที่อุสกูดาร์โดยตระกูลคาร์กึลึ ซึ่งมีประเพณีขนมจากนมและไอศกรีมมาราว 150 ปี เรายังเป็นธุรกิจครอบครัว: สมาชิกครอบครัวทำงานในทุกขั้นตอน ตั้งแต่การผลิต การจัดซื้อ ไปจนถึงครัวและการบริการ และพ่อครัวบางคนมีประสบการณ์กว่า 40 ปี\n\nทุกวันเราทำขนมหวาน 100–120 ชนิด อาหารผัดน้ำมันมะกอก อาหารร้อน ไอศกรีม และโยเกิร์ตสดใหม่ กฎของเราเรียบง่าย: ใช้เฉพาะวัตถุดิบที่ดีที่สุด หากหาคุณภาพที่เหมาะสมไม่ได้ เราจะไม่ทำเมนูนั้น ด้วยบรรจุภัณฑ์ที่เราพัฒนามาตั้งแต่ทศวรรษ 1970 อาหารของเรายังไปถึงบ้านและสำนักงานได้ด้วย\n\nในปี 2000 การสำรวจ \"100 อันดับอาหารที่ดีที่สุด\" ของนิตยสาร Vizyon ยกให้เราเป็นลาคันตาแบบดั้งเดิมที่ดีที่สุด พร้อมไอศกรีม โยเกิร์ต ekmek kadayıfı และซุปขาแกะที่ดีที่สุด เราเคยปรากฏใน New York Times, Le Monde และ Elle และได้รับการแนะนำโดย Lonely Planet, Rough Guide, Le Guide du Routard และคู่มือ Louis Vuitton ในปี 2025 และ 2026 เราได้รับรางวัลอาหารดั้งเดิมจาก Gault&Millau Turkey Guide", "Quán của chúng tôi được gia đình Kargılı thành lập năm 1933 tại Üsküdar, với truyền thống các món tráng miệng từ sữa và kem kéo dài khoảng 150 năm. Chúng tôi vẫn là doanh nghiệp gia đình: mỗi khâu, từ sản xuất, thu mua đến bếp và phục vụ, đều có thành viên trong gia đình tham gia, và một số đầu bếp của chúng tôi có hơn 40 năm kinh nghiệm.\n\nMỗi ngày chúng tôi chế biến tươi 100–120 loại tráng miệng, món nấu dầu ô liu, món nóng, kem và sữa chua. Nguyên tắc của chúng tôi rất đơn giản: chỉ dùng nguyên liệu tốt nhất. Nếu không tìm được chất lượng phù hợp, chúng tôi sẽ không làm món đó. Nhờ bao bì mà chúng tôi đã cải tiến từ những năm 1970, món ăn của chúng tôi cũng đến được nhà và văn phòng.\n\nNăm 2000, khảo sát “100 món ăn hay nhất” của tạp chí Vizyon đã bình chọn chúng tôi là lokanta truyền thống tốt nhất, với kem, sữa chua, ekmek kadayıfı và súp chân cừu tốt nhất. Chúng tôi từng được New York Times, Le Monde và Elle giới thiệu, và được Lonely Planet, Rough Guide, Le Guide du Routard và cẩm nang Louis Vuitton gợi ý. Năm 2025 và 2026, chúng tôi nhận giải Ẩm thực truyền thống trong Cẩm nang Gault&Millau Thổ Nhĩ Kỳ.", "Lokanta kami didirikan pada 1933 di Üsküdar oleh keluarga Kargılı, yang tradisi kue susu dan es krimnya telah berlangsung sekitar 150 tahun. Kami masih merupakan bisnis keluarga: setiap tahap, dari produksi dan pembelian hingga dapur dan layanan, dikerjakan oleh anggota keluarga, dan beberapa juru masak kami memiliki pengalaman lebih dari 40 tahun.\n\nSetiap hari kami membuat segar 100–120 jenis kue, hidangan minyak zaitun, hidangan panas, es krim, dan yogurt. Aturan kami sederhana: hanya bahan terbaik. Jika kami tidak menemukan kualitas yang tepat, kami tidak membuat hidangan itu. Berkat kemasan yang kami kembangkan sejak 1970-an, makanan kami juga sampai ke rumah dan kantor.\n\nPada 2000, survei “100 Terbaik dalam Makanan” dari majalah Vizyon menobatkan kami sebagai lokanta tradisional terbaik, dengan es krim, yogurt, ekmek kadayıfı, dan sup kaki terbaik. Kami pernah dimuat di New York Times, Le Monde dan Elle, dan direkomendasikan oleh Lonely Planet, Rough Guide, Le Guide du Routard, dan panduan Louis Vuitton. Pada 2025 dan 2026 kami menerima penghargaan Masakan Tradisional dari Panduan Gault&Millau Turki.", "Itinatag ang aming lokanta noong 1933 sa Üsküdar ng pamilyang Kargılı, na ang tradisyon ng mga dessert na gawa sa gatas at ice cream ay umabot nang halos 150 taon. Isa pa rin kaming negosyong pampamilya: may miyembro ng pamilya sa bawat yugto, mula sa produksyon at pagbili hanggang sa kusina at serbisyo, at may ilan sa aming mga cook na may mahigit 40 taong karanasan.\n\nArawaraw kaming naghahanda nang sariwa ng 100–120 uri ng dessert, pagkaing olive oil, maiinit na pagkain, ice cream at yogurt. Simple ang aming panuntunan: pinakamahusay na sangkap lamang. Kung hindi namin makita ang tamang kalidad, hindi namin ginagawa ang ulam na iyon. Dahil sa packaging na pinaunlad namin mula dekada 1970, nakakarating din ang aming pagkain sa mga bahay at opisina.\n\nNoong 2000, pinangalanan kami ng survey na “Best 100 in Food” ng Vizyon magazine na pinakamahusay na tradisyonal na lokanta, na may pinakamahusay na ice cream, yogurt, ekmek kadayıfı at sopas ng paa ng tupa. Itinampok kami ng New York Times, Le Monde at Elle, at inirerekomenda kami ng Lonely Planet, Rough Guide, Le Guide du Routard at ng Louis Vuitton guide. Noong 2025 at 2026, nakatanggap kami ng Traditional Cuisine award sa Gault&Millau Turkey Guide."], "Q.today.q": ["امروز چه چیزی پیشنهاد می‌کنید؟", "今天推薦什麼？", "วันนี้แนะนำอะไร", "Hôm nay bạn gợi ý món gì?", "Apa yang Anda rekomendasikan hari ini?", "Ano ang inirerekomenda mo ngayon?"], "Q.today.a": ["امروز این را پیشنهاد می‌کنم. مطمئنم که دوستش خواهید داشت:", "今天我推薦這一道，相信您一定會喜歡：", "วันนี้ผมแนะนำเมนูนี้ มั่นใจว่าคุณจะชอบ:", "Hôm nay tôi gợi ý món này. Tôi chắc bạn sẽ thích:", "Hari ini saya merekomendasikan ini. Saya yakin Anda akan menyukainya:", "Ngayon, inirerekomenda ko ito. Sigurado akong magugustuhan mo:"], "Q.veg.q": ["گیاه‌خواران چه چیزی می‌توانند بخورند؟", "素食者可以吃什麼？", "มังสวิรัติกินอะไรได้บ้าง", "Người ăn chay có thể dùng món gì?", "Apa yang bisa dimakan vegetarian?", "Ano ang puwedeng kainin ng vegetarian?"], "Q.veg.a": ["بیشتر غذاهای روغن زیتون ما وگان هستند، و همین‌طور سالادها و کمپوت‌ها. با دکمه پایین می‌توانید فقط غذاهای گیاهی را ببینید. توجه: بیشتر غذاهای گرم سبزیجات ما با گوشت پخته می‌شوند.", "我們大部分橄欖油料理為全素，沙拉與蜜餞也是。使用下方按鈕可只查看素食餐點。注意：大部分熱食蔬菜料理是與肉一起烹調的。", "อาหารผัดน้ำมันมะกอกส่วนใหญ่ของเราเป็นวีแกน เช่นเดียวกับสลัดและคอมโพท ใช้ปุ่มด้านล่างเพื่อดูเฉพาะเมนูมังสวิรัติ หมายเหตุ: อาหารผักร้อนส่วนใหญ่ของเราปรุงกับเนื้อ", "Hầu hết món nấu dầu ô liu của chúng tôi là thuần chay, cũng như các món salad và compote. Dùng nút bên dưới để chỉ xem món chay. Lưu ý: hầu hết món rau nóng được nấu với thịt.", "Sebagian besar hidangan minyak zaitun kami vegan, begitu pula salad dan kompot. Gunakan tombol di bawah untuk melihat hidangan vegetarian saja. Catatan: sebagian besar hidangan sayuran panas kami dimasak dengan daging.", "Karamihan sa mga pagkaing olive oil namin ay vegan, gayundin ang mga salad at compote. Gamitin ang button sa ibaba para makita lamang ang mga vegetarian na pagkain. Tandaan: karamihan sa aming maiinit na pagkaing gulay ay niluluto kasama ng karne."], "Q.olive.q": ["«غذاهای روغن زیتون» چیست؟", "什麼是「橄欖油料理」？", "\"อาหารน้ำมันมะกอก\" คืออะไร", "“Món nấu dầu ô liu” là gì?", "Apa itu “hidangan minyak zaitun”?", "Ano ang “olive oil dishes”?"], "Q.olive.a": ["سبزیجاتی که آهسته در روغن زیتون پخته و سرد سرو می‌شوند، از کلاسیک‌های آشپزی استانبول. بیشترشان وگان‌اند. با برگ مو دلمه‌ای یا ایمام‌بایلدی شروع کنید:", "以橄欖油慢燉並冷食的蔬菜，是伊斯坦堡料理的經典。大多為全素。可從釀葡萄葉或伊曼拜勒迪開始：", "ผักที่ปรุงช้าๆ ในน้ำมันมะกอกและเสิร์ฟเย็น เป็นอาหารคลาสสิกของอิสตันบูล ส่วนใหญ่เป็นวีแกน เริ่มด้วยใบองุ่นยัดไส้หรืออิหม่ามบายัลดี:", "Rau yang được hầm chậm trong dầu ô liu và ăn nguội, một món kinh điển của ẩm thực Istanbul. Hầu hết là thuần chay. Bắt đầu với lá nho nhồi hoặc İmambayıldı:", "Sayuran yang dimasak perlahan dalam minyak zaitun dan disajikan dingin, hidangan klasik masakan Istanbul. Sebagian besar vegan. Mulailah dengan daun anggur isi atau İmambayıldı:", "Mga gulay na dahan-dahang niluto sa olive oil at inihahain nang malamig, isang klasiko ng lutuing Istanbul. Karamihan ay vegan. Magsimula sa stuffed na dahon ng ubas o İmambayıldı:"], "Q.dessert.q": ["کدام دسر را پیشنهاد می‌کنید؟", "您推薦哪種甜點？", "คุณแนะนำของหวานอะไร", "Bạn gợi ý món tráng miệng nào?", "Pencuci mulut apa yang Anda rekomendasikan?", "Anong dessert ang inirerekomenda mo?"], "Q.dessert.a": ["دسر به پخته با خامه ما محبوب است. برای چیزی سبک، شیربرنج؛ برای چیزی شربتی، اکمک کادایفی. اگر کنجکاو هستید، کازاندیبی را امتحان کنید: با سینه مرغ درست می‌شود، اما شیرین است!", "我們的烤榲桲配凝脂奶油很受歡迎。想清淡一點可選米布丁，想要糖漿類可選 ekmek kadayıfı。若好奇，可試試 kazandibi：它用雞胸肉製作，卻是甜的！", "ขนมควินซ์อบกับครีมข้นของเราเป็นที่นิยม อยากได้อะไรเบาๆ ลองข้าวพุดดิ้ง อยากได้แบบน้ำเชื่อมลอง ekmek kadayıfı หากอยากลอง kazandibi: ทำจากอกไก่ แต่รสหวาน!", "Tráng miệng mộc qua với kem đặc là món được yêu thích. Muốn nhẹ hơn thì chọn cơm sữa; muốn dạng siro thì chọn ekmek kadayıfı. Nếu tò mò, hãy thử kazandibi: làm từ ức gà nhưng vị ngọt!", "Pencuci mulut kuwini dengan krim kental adalah favorit. Untuk yang ringan, puding nasi; untuk yang berair gula, ekmek kadayıfı. Jika penasaran, coba kazandibi: dibuat dari dada ayam, namun rasanya manis!", "Paborito ang aming quince dessert na may clotted cream. Para sa magaan, rice pudding; para sa may syrup, ekmek kadayıfı. Kung curious ka, subukan ang kazandibi: gawa ito sa dibdib ng manok, pero matamis ang lasa!"], "Q.allergy.q": ["من حساسیت دارم. چه باید بکنم؟", "我有過敏。我該怎麼做？", "ฉันแพ้อาหาร ควรทำอย่างไร", "Tôi bị dị ứng. Tôi nên làm gì?", "Saya punya alergi. Apa yang harus saya lakukan?", "May allergy ako. Ano ang dapat kong gawin?"], "Q.allergy.a": ["لطفاً پیش از سفارش به گارسون بگویید؛ او به آشپزخانه اطلاع می‌دهد. برچسب‌های نارنجی زیر هر غذا مواد حساسیت‌زا را نشان می‌دهند: گلوتن، شیر، تخم‌مرغ، آجیل، کرفس، ماهی و کنجد. برچسب‌ها راهنما هستند، پس برای اطمینان از گارسون بپرسید.", "請在點餐前告知服務生，他會通知廚房。每道餐點下方的橘色標籤顯示過敏原：麩質、牛奶、雞蛋、堅果、芹菜、魚與芝麻。標籤僅供參考，請向服務生確認。", "โปรดแจ้งพนักงานเสิร์ฟก่อนสั่งอาหาร เขาจะแจ้งครัว ป้ายสีส้มใต้เมนูแต่ละจานบอกสารก่อภูมิแพ้: กลูเตน นม ไข่ ถั่วเปลือกแข็ง เซเลอรี ปลา และงา ป้ายเป็นเพียงแนวทาง โปรดตรวจสอบกับพนักงานเสิร์ฟ", "Vui lòng báo cho nhân viên phục vụ trước khi gọi món; họ sẽ thông báo cho bếp. Nhãn màu cam dưới mỗi món cho biết chất gây dị ứng: gluten, sữa, trứng, hạt, cần tây, cá và vừng. Nhãn chỉ mang tính hướng dẫn, vui lòng xác nhận với nhân viên phục vụ.", "Silakan beri tahu pelayan sebelum memesan; mereka akan memberi tahu dapur. Label oranye di bawah setiap hidangan menunjukkan alergen: gluten, susu, telur, kacang, seledri, ikan dan wijen. Label hanya panduan, jadi mohon konfirmasi dengan pelayan.", "Pakisabihan ang waiter bago umorder; ipaaalam niya ito sa kusina. Ipinapakita ng orange na label sa ilalim ng bawat pagkain ang allergens: gluten, gatas, itlog, nuts, celery, isda at linga. Gabay lamang ang mga label, kaya pakitiyak sa waiter."], "Q.togo.q": ["آیا می‌توانم غذاهایتان را برای بردن بگیرم؟", "可以外帶您的餐點嗎？", "ซื้อกลับบ้านได้ไหม", "Tôi có thể mang đồ ăn về không?", "Bisakah saya membawa pulang makanan?", "Puwede bang i-take out ang inyong mga pagkain?"], "Q.togo.a": ["البته! همه غذاها و دسرهای ما را می‌توانید برای بردن هم بگیرید. همچنین می‌توانید دسرها را به کیلو، ماست میش در ظرف سفالی و مربای خانگی ما را بخرید. با بسته‌بندی مناسب، بستنی ما ساعت‌ها بدون آب شدن حمل می‌شود. یادگاری شیرین از اوسکودار.", "當然！我們所有餐點與甜點都能外帶。您也可以按公斤購買甜點、陶罐羊奶優格與自製果醬。以適當包裝，我們的冰淇淋可以運送數小時而不融化。來自 Üsküdar 的甜蜜紀念品。", "แน่นอน! เมนูและของหวานทั้งหมดของเรากลับบ้านได้ คุณยังซื้อของหวานตามกิโลกรัม โยเกิร์ตนมแกะในหม้อดิน และแยมโฮมเมดของเราได้ด้วย ด้วยบรรจุภัณฑ์ที่เหมาะสม ไอศกรีมของเราเดินทางได้เป็นชั่วโมงโดยไม่ละลาย ของฝากหวานจากอุสกูดาร์", "Tất nhiên! Mọi món ăn và tráng miệng của chúng tôi đều có thể mang về. Bạn cũng có thể mua tráng miệng theo kg, sữa chua sữa cừu trong hũ đất và mứt tự làm của chúng tôi. Với bao bì phù hợp, kem của chúng tôi có thể đi xa hàng giờ mà không chảy. Một món quà ngọt ngào từ Üsküdar.", "Tentu! Semua hidangan dan pencuci mulut kami juga bisa dibawa pulang. Anda juga bisa membeli pencuci mulut per kilo, yogurt susu domba dalam pot tanah liat, dan selai buatan rumah kami. Dengan kemasan yang tepat, es krim kami bisa bertahan berjam-jam tanpa meleleh. Oleh-oleh manis dari Üsküdar.", "Siyempre! Maaari ring i-take out ang lahat ng aming pagkain at dessert. Maaari ka ring bumili ng dessert kada kilo, sheep's milk yogurt sa palayok na luwad, at aming homemade jam. Sa tamang packaging, nakakatagal ng ilang oras ang aming ice cream nang hindi natutunaw. Matamis na pasalubong mula sa Üsküdar."], "Q.cater.q": ["آیا برای خانه‌ها، دفاتر، مراسم، عروسی‌ها و مولودی‌ها تحویل غذا و کترینگ دارید؟", "是否提供住家、辦公室、活動、婚禮與 mevlit 的外送與外燴服務？", "มีบริการจัดส่งอาหารและเคเทอริงสำหรับบ้าน สำนักงาน งานอีเวนต์ งานแต่งงาน และพิธี mevlit ไหม", "Quán có giao đồ ăn và phục vụ tiệc cho nhà riêng, văn phòng, sự kiện, đám cưới và mevlit không?", "Apakah tersedia layanan antar makanan dan katering untuk rumah, kantor, acara, pernikahan dan mevlit?", "May food delivery at catering ba para sa bahay, opisina, event, kasal at mevlit?"], "Q.cater.a": ["بله! غذا را به خانه‌ها و دفاتر تحویل می‌دهیم و برای مراسم، عروسی‌ها و مولودی‌ها (گردهمایی‌های مذهبی) کترینگ انجام می‌دهیم.", "有的！我們提供住家與辦公室外送，並為活動、婚禮與 mevlit（宗教聚會）提供外燴服務。", "มีครับ/ค่ะ! เราจัดส่งอาหารถึงบ้านและสำนักงาน และรับจัดเลี้ยงงานอีเวนต์ งานแต่งงาน และ mevlit (การรวมตัวทางศาสนา)", "Có! Chúng tôi giao đồ ăn đến nhà và văn phòng, và phục vụ tiệc cho sự kiện, đám cưới và mevlit (các buổi tụ họp tôn giáo).", "Ya! Kami mengantar makanan ke rumah dan kantor, serta menyediakan katering untuk acara, pernikahan dan mevlit (pertemuan keagamaan).", "Oo! Naghahatid kami ng pagkain sa mga bahay at opisina, at nagbibigay ng catering para sa mga event, kasal at mevlit (mga pagtitipong panrelihiyon)."], "Q.calc.q": ["چطور صورت‌حسابم را حساب کنم؟", "我要怎麼計算帳單？", "คำนวณบิลของฉันอย่างไร", "Tôi tính hóa đơn bằng cách nào?", "Bagaimana cara menghitung tagihan saya?", "Paano ko kakalkulahin ang aking bill?"], "Q.calc.a": ["آسان است! «🧾 {calc}» را در بالا باز کنید و غذاهایی را که خورده‌اید با «+» اضافه کنید؛ برای برخی غذاها می‌توانید نیم پرس یا یک عدد را هم انتخاب کنید. نوار «{my}» در پایین جمع کل را نشان می‌دهد. وقتی تمام شد، روی «{show}» بزنید: گارسون کد را اسکن، بررسی و تأیید می‌کند. سپس می‌توانید صورت‌حساب تأییدشده را به زبان خودتان در تلفنتان ذخیره کنید.", "很簡單！點擊上方的「🧾 {calc}」，用「+」加入您吃過的餐點；部分餐點也可選擇半份或單個。底部的「{my}」列會顯示總計。完成後點擊「{show}」：服務生會掃描代碼、核對並確認。之後您可以用自己的語言將已確認的帳單儲存到手機。", "ง่ายมาก! เปิด \"🧾 {calc}\" ด้านบนแล้วเพิ่มเมนูที่คุณทานด้วยปุ่ม \"+\" บางเมนูยังเลือกครึ่งจานหรือ 1 ชิ้นได้ แถบ \"{my}\" ด้านล่างแสดงยอดรวม เมื่อเสร็จแล้วแตะ \"{show}\" พนักงานเสิร์ฟจะสแกนรหัส ตรวจสอบ และยืนยัน จากนั้นคุณบันทึกบิลที่ยืนยันแล้วในโทรศัพท์ด้วยภาษาของคุณได้", "Rất dễ! Mở “🧾 {calc}” ở trên cùng và thêm các món đã ăn bằng “+”; với một số món bạn cũng có thể chọn nửa phần hoặc một cái. Thanh “{my}” ở dưới hiển thị tổng. Khi xong, chạm “{show}”: nhân viên phục vụ quét mã, kiểm tra và xác nhận. Sau đó bạn có thể lưu hóa đơn đã xác nhận vào điện thoại bằng ngôn ngữ của mình.", "Mudah! Buka “🧾 {calc}” di bagian atas dan tambahkan hidangan yang Anda makan dengan “+”; untuk beberapa hidangan Anda juga bisa memilih setengah porsi atau satu potong. Bilah “{my}” di bawah menampilkan total. Setelah selesai, ketuk “{show}”: pelayan memindai kode, memeriksa, dan mengonfirmasi. Setelah itu Anda dapat menyimpan tagihan yang sudah dikonfirmasi di ponsel dalam bahasa Anda.", "Madali lang! Buksan ang “🧾 {calc}” sa itaas at idagdag ang mga kinain mo gamit ang “+”; sa ilang pagkain, puwede ka ring pumili ng kalahating serving o isang piraso. Ipinapakita ng “{my}” bar sa ibaba ang kabuuan. Kapag tapos ka na, i-tap ang “{show}”: i-scan ng waiter ang code, titingnan at kukumpirmahin. Pagkatapos, puwede mong i-save ang kinumpirmang bill sa telepono mo sa sarili mong wika."], "Q.fb.q": ["می‌خواهم بازخوردم را به اشتراک بگذارم", "我想分享我的回饋", "ฉันอยากแชร์ความคิดเห็นของฉัน", "Tôi muốn chia sẻ nhận xét của mình", "Saya ingin berbagi masukan", "Gusto kong magbigay ng feedback"], "Q.fb.a": ["خوشحال می‌شوم بشنوم! لطفاً به ما امتیاز دهید و در صورت تمایل چند کلمه هم بنویسید:", "很樂意聽取！請為我們評分，也可以留下幾句話：", "ยินดีมากที่ได้ฟัง! โปรดให้คะแนนเรา และเขียนความเห็นสั้นๆ ได้ถ้าต้องการ:", "Chúng tôi rất vui được nghe! Vui lòng đánh giá và thêm vài lời nếu bạn muốn:", "Kami senang mendengarnya! Silakan beri penilaian, dan tambahkan beberapa kata jika Anda mau:", "Ikagagalak naming marinig iyan! Pakibigyan kami ng rating, at magdagdag ng ilang salita kung gusto mo:"], "Q.hours.q": ["ساعات کاری شما چیست؟", "你們的營業時間是？", "เวลาเปิดทำการคือเมื่อไร", "Giờ mở cửa của quán là khi nào?", "Jam buka Anda kapan?", "Ano ang inyong oras ng pagbubukas?"]};

недоступні; запитайте офіціанта.", "Ez a teljes menünk. Egyes ételek ma nem elérhetők; kérdezd meg a pincért.", "Toto je celé naše menu. Některá jídla dnes nemusí být k dispozici; zeptejte se číšníka.", "Toto je naše celé menu. Niektoré jedlá dnes nemusia byť k dispozícii; opýtajte sa čašníka.", "Ovo je naš puni jelovnik. Neka jela danas možda nisu dostupna; pitajte konobara.", "Tai visas mūsų meniu. Kai kurių patiekalų šiandien gali nebūti; paklauskite padavėjo.", "Detta är vår fullständiga meny. Vissa rätter kanske inte finns tillgängliga idag; fråga servitören.", "Dette er vores fulde menu. Nogle retter er muligvis ikke tilgængelige i dag; spørg tjeneren.", "Bu bizning to'liq menyu. Ba'zi taomlar bugun mavjud bo'lmasligi mumkin; ofitsiantdan so'rang.", "Bu biziň doly menýumyz. Käbir iýmitler şu gün elýeterli bolmasa biler; welýantşydan soraň.", "Энэ бол бидний бүтэн цэс. Зарим хоол өнөөдөр боломжгүй байж магадгүй; зөөгчөөсөө асууна уу.", "Бұл біздің толық мәзіріміз. Кейбір тағамдар бүгін болмауы мүмкін; даяшыдан сұраңыз."], "AVAIL_UI.chef": ["Можливо, страва закінчилась; запитайте офіціанта.", "Lehet, hogy elfogyott; kérdezd meg a pincért.", "Možná je vyprodáno; zeptejte se číšníka.", "Možno je vypredané; opýtajte sa čašníka.", "Možda je rasprodano; pitajte konobara.", "Galimai išparduota; paklauskite padavėjo.", "Den kan vara slut; fråga servitören.", "Den kan være udsolgt; spørg tjeneren.", "Balki tugagan bo'lishi mumkin; ofitsiantdan so'rang.", "Belki gutaran bolup biler; welýantşydan soraň.", "Магадгүй дууссан байж магадгүй; зөөгчөөсөө асууна уу.", "Мүмкін таусылған; даяшыдан сұраңыз."], "ALGI.title": ["Інформація про алергени", "Allergénekre vonatkozó információ", "Informace o alergenech", "Informácie o alergénoch", "Informacije o alergenima", "Informacija apie alergenus", "Information om allergener", "Oplysninger om allergener", "Allergenlar haqida ma'lumot", "Allergenler barada maglumat", "Харшил үүсгэгчийн мэдээлэл", "Аллергендер туралы ақпарат"], "ALGI.intro": ["На основі 14 основних алергенів, визначених Міністерством сільського господарства та лісового господарства Туреччини.", "A török Földművelésügyi és Erdészeti Minisztérium által meghatározott 14 fő allergén alapján.", "Podle 14 hlavních alergenů stanovených tureckým ministerstvem zemědělství a lesnictví.", "Podľa 14 hlavných alergénov stanovených tureckým ministerstvom poľnohospodárstva a lesníctva.", "Na temelju 14 glavnih alergena koje je definiralo turskoe ministarstvo poljoprivrede i šumarstva.", "Pagal 14 pagrindinių alergenų, nustatytų Turkijos žemės ūkio ir miškininkystės ministerijos.", "Baserat på de 14 huvudsakliga allergenerna som definieras av det turkiska jordbruks- och skogsbruksministeriet.", "Baseret på de 14 vigtigste allergener, som defineres af det tyrkiske landbrugs- og skovbrugsministerium.", "Turkiya Qishloq xo'jaligi va o'rmon xo'jaligi vazirligi belgilagan 14 ta asosiy allergen asosida.", "Türkiýäniň Oba hojalygy we tokaýçylyk ministrliginiň kesgitleýän 14 esasy allergeni esasynda.", "Туркийн Хөдөө аж ахуй, ойн аж ахуйн яамны тодорхойлсон 14 гол харшил үүсгэгчид суурилсан.", "Түркия Ауыл шаруашылығы және орман шаруашылығы министрлігі анықтаған 14 негізгі аллергенге негізделген."], "ALGI.inm": ["Наші страви містять алергени", "Ételeinkben allergének vannak", "Naše jídla obsahují alergeny", "Naše jedlá obsahujú alergény", "Naša jela sadrže alergene", "Mūsų patiekaluose yra alergenų", "Våra rätter innehåller allergener", "Vores retter indeholder allergener", "Bizning taomlarimizda allergenlar bor", "Biziň iýmitlerimizde allergenler bar", "Манай хоолонд харшил үүсгэгч байна", "Біздің тағамдарда аллергендер бар"], "ALGI.out": ["Наша кухня їх не використовує", "Konyhánkban nem használjuk", "V naší kuchyni se nepoužívají", "V našej kuchyni sa nepoužívajú", "Ne koristimo u našoj kuhinji", "Mūsų virtuvėje nenaudojama", "Används inte i vårt kök", "Bruges ikke i vores køkken", "Bizning oshxonamizda ishlatilmaydi", "Biziň aşhanamyzda ulanylmaýar", "Манай гал тогоонд хэрэглэдэггүй", "Біздің асханамызда пайдаланылмайды"], "ALGI.show": ["Показати страви без цього", "Mutasd azokat az ételeket, amelyekben nincs", "Zobrazit jídla bez toho", "Zobraziť jedlá bez toho", "Prikaži jela bez toga", "Rodyti patiekalus be to", "Visa rätter utan detta", "Vis retter uden dette", "Buning tarkibisiz taomlarni ko'rsatish", "Munuňsyz iýmitleri görkez", "Үүнгүй хоолыг харуулах", "Мұнысыз тағамдарды көрсету"], "ALGI.cnt": ["Страв: {n}", "Ételek: {n}", "Jídel: {n}", "Jedál: {n}", "Jela: {n}", "Patiekalai: {n}", "Rätter: {n}", "Retter: {n}", "Taomlar: {n}", "Iýmitler: {n}", "Хоол: {n}", "Тағамдар: {n}"], "PORT_UI.full": ["Повна порція", "Teljes adag", "Celá porce", "Celá porcia", "Cijela porcija", "Pilna porcija", "Hel portion", "Hel portion", "To'liq porsiya", "Doly porsiýa", "Бүтэн порц", "Толық порция"], "PORT_UI.half": ["Ви додали ПІВПОРЦІЮ ({h}). Повна порція — {f}.", "Fél adagot adtál hozzá ({h}). A teljes adag {f}.", "Přidali jste POLOVIČNÍ porci ({h}). Celá porce je {f}.", "Pridali ste POLOVICU porcie ({h}). Celá porcia je {f}.", "Dodali ste POLOVINU porcije ({h}). Cijela porcija je {f}.", "Įtraukėte PUSĘ porcijos ({h}). Pilna porcija – {f}.", "Du har lagt till en HALV portion ({h}). En hel portion är {f}.", "Du har tilføjet en HALV portion ({h}). En hel portion er {f}.", "Siz YARIM porsiya qo'shdingiz ({h}). To'liq porsiya – {f}.", "Siz ÝARYM porsiýa goşdyňyz ({h}). Doly porsiýa – {f}.", "Та ХАГАС порц нэмсэн ({h}). Бүтэн порц нь {f}.", "Сіз ЖАРТЫ порция қостыңыз ({h}). Толық порция – {f}."], "CHAT.title": ["Запитайте шефа", "Kérdezze a szakácsot", "Zeptejte se kuchaře", "Opýtajte sa kuchára", "Pitajte kuharicu", "Klauskite virėjo", "Fråga kocken", "Spørg kokken", "Oshpazdan so'rang", "Aşpezden soraň", "Шефээс асуух", "Аспазшыдан сұраңыз"], "CHAT.sub": ["Оберіть питання", "Válasszon kérdést", "Vyberte otázku", "Vyberte otázku", "Odaberite pitanje", "Pasirinkite klausimą", "Välj en fråga", "Vælg et spørgsmål", "Savolni tanl
