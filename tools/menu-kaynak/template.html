н уақыт өткізгеніңіз ұнаса, Instagram-да бізді бақылаңыз. Сонда да сізді көргеніміз қуаныш болады! 😊"], "CHAT.follow": ["Підписатися в Instagram", "Követés az Instagramon", "Sledovat na Instagramu", "Sledovať na Instagrame", "Prati na Instagramu", "Sekti Instagram", "Följ på Instagram", "Følg på Instagram", "Instagram'da kuzatish", "Instagram-da yzarlamak", "Instagram дээр дагах", "Instagram-да жазылу"], "CHAT.calc": ["Порахувати мій рахунок", "Számítsa ki a számlámat", "Spočítat můj účet", "Vypočítať môj účet", "Izračunaj moj račun", "Apskaičiuoti mano sąskaitą", "Räkna ut min nota", "Beregn min regning", "Mening hisobimni hisoblash", "Hasabymy hasaplamak", "Миний төлбөрийг тооцоолох", "Менің шотымды есептеу"], "CHAT.maps": ["Відкрити в картах", "Megnyitás a térképen", "Otevřít v mapách", "Otvoriť v mapách", "Otvori u kartama", "Atidaryti žemėlapyje", "Öppna i kartor", "Åbn i kort", "Xaritada ochish", "Kartada açmak", "Газрын зурагт нээх", "Картада ашу"], "Q.first.q": ["Я тут вперше. Що варто спробувати?", "Először vagyok itt. Mit érdemes kipróbálni?", "Jsem tu poprvé. Co bych měl ochutnat?", "Som tu prvýkrát. Čo by som mal ochutnať?", "Ovdje sam prvi put. Što da probam?", "Čia esu pirmą kartą. Ką man verta paragauti?", "Det är min första gång här. Vad bör jag prova?", "Det er første gang, jeg er her. Hvad skal jeg prøve?", "Bu yerga birinchi marta kelganman. Nimani sinab ko'rishim kerak?", "Bu ýere ilkinji gezek geldim. Näme synap görmeli?", "Би энд анх удаа ирж байна. Юу амтлах вэ?", "Мұнда бірінші рет келдім. Нені татып көру керек?"], "Q.first.a": ["Для першого відвідування рекомендую узбецький плов з бараниною як основну страву, артишок у оливковій олії як гарнір, а на завершення десерт з айви зі сметаною. Натисніть на страву, щоб її переглянути:", "Első látogatásához az özbég stílusú bárányos pilafot ajánlom főételnek, mellé zeytinyağlı articsókát, a végén pedig tejszínes birsalmadesszertet. Nyomjon egy ételre, hogy megnézze:", "Pro první návštěvu doporučuji uzbecký pilaf s jehněčím jako hlavní chod, artyčoky v olivovém oleji jako přílohu a na závěr kdoulový dezert se smetanou. Klepněte na jídlo a zobrazte si ho:", "Na prvú návštevu odporúčam uzbecký pilaf s jahňacinou ako hlavné jedlo, artičoky v olivovom oleji ako prílohu a na záver kdoňový dezert so smotanou. Ťuknite na jedlo, aby ste ho zobrazili:", "Za prvi posjet preporučujem uzbekistanski pilav s janjetinom kao glavno jelo, artičoke u maslinovom ulju uz strane i desert od dunje s kajmakom za kraj. Dodirnite jelo da ga vidite:", "Pirmam apsilankymui rekomenduoju uzbekišką ėriuko plovą kaip pagrindinį patiekalą, artišokus alyvuogių aliejuje šalia ir kvitėnų desertą su grietine baigiant. Palieskite patiekalą, kad jį pamatytumėte:", "Till ert första besök rekommenderar jag uzbekisk pilaf med lamm som huvudrätt, kronärtskocka i olivolja vid sidan och kvittendessert med grädde till sist. Tryck på en rätt för att se den:", "Til dit første besøg anbefaler jeg usbekisk pilaf med lam som hovedret, artiskok i olivenolie som tilbehør og kvæbledessert med fløde til sidst. Tryk på en ret for at se den:", "Birinchi tashrifingiz uchun asosiy taom sifatida qo'y go'shti bilan o'zbek palovini, garnir sifatida zaytun moyidagi artishokni va yakun uchun qaymoqli behi desertini tavsiya qilaman. Taomni ko'rish uchun bosing:", "Ilkinji gezek üçin esasy iýmit hökmünde guzaly özbek pilawyny, gapdal tarapdan zeýtin ýagynda artişoky we soňunda gaýmakly behi desertini maslahat berýärin. Görmek üçin iýmite basyň:", "Анх ирсэн танд үндсэн хоолоор хонины махтай узбек пилав, хажуугийн хоолоор зэйтүн тосон дахь артишок, эцэст нь тостой бүлдирээний амтат санал болгож байна. Хоолыг харахын тулд дарна уу:", "Алғашқы келуіңізге өзбек стиліндегі қой еті плавын басты тағам ретінде, зәйтүн майындағы артишокты қосымша ретінде, ал соңында кремі бар айва десертін ұсынамын. Көру үшін тағамды басыңыз:"], "Q.story.q": ["Яка історія цього закладу?", "Mi a történetük ennek a helynek?", "Jaký je příběh tohoto místa?", "Aký je príbeh tohto miesta?", "Kakva je priča ovog mjesta?", "Kokia šios vietos istorija?", "Vad är platsens historia?", "Hvad er stedets historie?", "Bu joyning tarixi qanday?", "Bu ýeriň taryhy nähili?", "Энэ газрын түүх ямар вэ?", "Бұл орынның тарихы қандай?"], "Q.story.a": ["Наш ресторан (локанта) заснувала родина Каргилі в 1933 році в Ускюдарі; їхня традиція молочних десертів і морозива налічує близько 150 років. Ми досі сімейний бізнес: на кожному етапі, від виробництва та закупівель до кухні й обслуговування, працює хтось із родини, а деякі з наших кухарів мають понад 40 років досвіду.\n\nЩодня ми свіжо готуємо 100–120 видів десертів, страв у оливковій олії, гарячих страв, морозива та йогурту. Наше правило просте: лише найкращі інгредієнти. Якщо не можемо знайти потрібну якість, ми не готуємо цю страву. Завдяки упаковці, яку ми вдосконалюємо з 1970-х, наша їжа також потрапляє до домівок і офісів.\n\nУ 2000 році опитування журналу Vizyon «100 найкращих у харчуванні» визнало нас найкращою традиційною локантою з найкращим морозивом, йогуртом, ekmek kadayıfı та супом із ніжок. Про нас писали New York Times, Le Monde та Elle, нас рекомендують Lonely Planet, Rough Guide, Le Guide du Routard та путівник Louis Vuitton. У 2025 і 2026 роках ми отримали нагороду в категорії традиційної кухні в путівнику Gault&Millau Туреччина.", "Lokantánkat 1933-ban alapította Üsküdarban a Kargılı család, akiknek tejes desszert- és fagylalthagyománya nagyjából 150 évre nyúlik vissza. Ma is családi vállalkozás vagyunk: a termeléstől és a beszerzéstől a konyháig és a kiszolgálásig minden szakaszban dolgozik családtag, és néhány szakácsunknak több mint 40 éves tapasztalata van.\n\nNaponta frissen készítünk 100–120 féle desszertet, olívaolajos ételt, meleg ételt, fagylaltot és joghurtot. Szabályunk egyszerű: csak a legjobb alapanyagok. Ha nem találunk megfelelő minőséget, nem készítjük el az adott ételt. Az 1970-es évek óta fejlesztett csomagolásunknak köszönhetően ételeink otthonokba és irodákba is eljutnak.\n\n2000-ben a Vizyon magazin „Az étel 100 legjobbja” felmérése a legjobb hagyományos lokantának választott minket, a legjobb fagylalttal, joghurttal, ekmek kadayıfıval és sertéslábleveslevessel. Szerepeltünk a New York Timesban, a Le Mondeban és az Elle-ben, ajánlja a Lonely Planet, a Rough Guide, a Le Guide du Routard és a Louis Vuitton útikönyv. 2025-ben és 2026-ban a Gault&Millau Törökország útikönyv hagyományos konyha díjával tüntettek ki minket.", "Naše lokanta byla založena v roce 1933 v Üsküdaru rodinou Kargılı, jejíž tradice mléčných dezertů a zmrzliny sahá zhruba 150 let zpět. Jsme stále rodinný podnik: v každé fázi, od výroby a nákupu přes kuchyni až po obsluhu, pracuje některý člen rodiny a někteří naši kuchaři mají více než 40 let zkušeností.\n\nKaždý den čerstvě připravujeme 100–120 druhů dezertů, jídel v olivovém oleji, teplých jídel, zmrzliny a jogurtu. Naše pravidlo je jednoduché: jen ty nejlepší suroviny. Pokud nenajdeme správnou kvalitu, dané jídlo nepřipravujeme. Díky obalům, které vyvíjíme od 70. let, se naše jídlo dostává i do domácností a kanceláří.\n\nV roce 2000 nás anketa časopisu Vizyon „100 nejlepších v jídle“ vyhlásila nejlepší tradiční lokantou s nejlepší zmrzlinou, jogurtem, ekmek kadayıfı a polévkou z kuřecích nožiček. Psaly o nás New York Times, Le Monde a Elle a doporučují nás Lonely Planet, Rough Guide, Le Guide du Routard a průvodce Louis Vuitton. V letech 2025 a 2026 jsme získali ocenění za tradiční kuchyni v průvodci Gault&Millau Turecko.", "Naša lokanta bola založená v roku 1933 v Üsküdare rodinou Kargılı, ktorej tradícia mliečnych dezertov a zmrzliny siaha asi 150 rokov dozadu. Sme stále rodinný podnik: v každej fáze, od výroby a nákupu po kuchyňu a obsluhu, pracuje niekto z rodiny a niektorí naši kuchári majú viac ako 40 rokov skúseností.\n\nKaždý deň čerstvo pripravujeme 100–120 druhov dezertov, jedál v olivovom oleji, teplých jedál, zmrzliny a jogurtu. Naše pravidlo je jednoduché: len tie najlepšie suroviny. Ak nenájdeme správnu kvalitu, dané jedlo nepripravujeme. Vďaka obalom, ktoré vyvíjame od 70. rokov, sa naše jedlo dostáva aj do domácností a kancelárií.\n\nV roku 2000 nás prieskum časopisu Vizyon „100 najlepších v jedle“ vyhlásil za najlepšiu tradičnú lokantu s najlepšou zmrzlinou, jogurtom, ekmek kadayıfı a polievkou z hovädzích nožičiek. Písali o nás New York Times, Le Monde a Elle a odporúčajú nás Lonely Planet, Rough Guide, Le Guide du Routard a sprievodca Louis Vuitton. V rokoch 2025 a 2026 sme získali ocenenie za tradičnú kuchyňu v sprievodcovi Gault&Millau Turecko.", "Naša lokanta je osnovana 1933. u Üsküdaru u obitelji Kargılı, čija tradicija mliječnih deserta i sladoleda seže otprilike 150 godina unatrag. Još uvijek smo obiteljska tvrtka: u svakoj fazi, od proizvodnje i nabave do kuhinje i usluge, radi netko iz obitelji, a neki naši kuhari imaju više od 40 godina iskustva.\n\nSvaki dan svježe pripremamo 100–120 vrsta deserta, jela u maslinovom ulju, toplih jela, sladoleda i jogurta. Naše je pravilo jednostavno: samo najbolji sastojci. Ako ne nađemo odgovarajuću kvalitetu, to jelo ne pripremamo. Zahvaljujući ambalaži koju razvijamo od 1970-ih, naša hrana stiže i do domova i ureda.\n\nGodine 2000. anketa časopisa Vizyon „100 najboljih u hrani“ proglasila nas je najboljom tradicionalnom lokantom, s najboljim sladoledom, jogurtom, ekmek kadayıfı i juhom od teletine nožica. Pisali su o nama New York Times, Le Monde i Elle, a preporučuju nas Lonely Planet, Rough Guide, Le Guide du Routard i vodič Louis Vuitton. Godine 2025. i 2026. dobili smo nagradu za tradicionalnu kuhinju u vodiču Gault&Millau Turska.", "Mūsų lokanta įkurta 1933 m. Üsküdare Kargılı šeimos, kurių pieno desertų ir ledų tradicija siekia apie 150 metų. Vis dar esame šeimos verslas: kiekviename etape – nuo gamybos ir pirkimų iki virtuvės bei aptarnavimo – dirba kuris nors šeimos narys, o kai kurie mūsų virėjai turi daugiau nei 40 metų patirtį.\n\nKasdien šviežiai ruošiame 100–120 rūšių desertų, patiekalų alyvuogių aliejuje, karštų patiekalų, ledų ir jogurto. Mūsų taisyklė paprasta: tik geriausi ingredientai. Jei neradome tinkamos kokybės, to patiekalo negaminame. Dėka pakuočių, kurias tobulinome nuo 1970-ųjų, mūsų maistas pasiekia ir namus, ir biurus.\n\n2000 m. žurnalo Vizyon apklausa „100 geriausių maisto srityje“ mus paskelbė geriausia tradicine lokanta su geriausiais ledais, jogurtu, ekmek kadayıfı ir kojelių sriuba. Apie mus rašė New York Times, Le Monde ir Elle, mus rekomenduoja Lonely Planet, Rough Guide, Le Guide du Routard ir Louis Vuitton gidas. 2025 ir 2026 m. gavome Gault&Millau Turkijos gido tradicinės virtuvės apdovanojimą.", "Vår lokanta grundades 1933 i Üsküdar av familjen Kargılı, vars tradition av mjölkdesserter och glass går tillbaka omkring 150 år. Vi är fortfarande ett familjeföretag: i varje led, från produktion och inköp till kök och service, arbetar någon i familjen, och några av våra kockar har över 40 års erfarenhet.\n\nVarje dag tillagar vi färska 100–120 sorters desserter, rätter i olivolja, varma rätter, glass och yoghurt. Vår regel är enkel: endast de bästa råvarorna. Om vi inte hittar rätt kvalitet tillagar vi inte rätten. Tack vare förpackningar som vi har utvecklat sedan 1970-talet når vår mat även hem och kontor.\n\nÅr 2000 utsåg tidningen Vizyons enkät ”De 100 bästa på mat” oss till den bästa traditionella lokantan, med bäst glass, yoghurt, ekmek kadayıfı och kalvfotssoppa. Vi har omnämnts i New York Times, Le Monde och Elle, och rekommenderas av Lonely Planet, Rough Guide, Le Guide du Routard och Louis Vuitton-guiden. Under 2025 och 2026 fick vi priset för traditionell matlagning i Gault&Millau Turkiet-guiden.", "Vores lokanta blev grundlagt i 1933 i Üsküdar af familien Kargılı, hvis tradition med mælkedesserter og is går cirka 150 år tilbage. Vi er stadig en familievirksomhed: på hvert led, fra produktion og indkøb til køkken og service, arbejder et familiemedlem, og nogle af vores kokke har over 40 års erfaring.\n\nHver dag tilbereder vi friskt 100–120 slags desserter, retter i olivenolie, varme retter, is og yoghurt. Vores regel er enkel: kun de bedste råvarer. Hvis vi ikke kan finde den rigtige kvalitet, laver vi ikke retten. Takket være den emballage, vi har udviklet siden 1970'erne, kommer vores mad også ud til hjem og kontorer.\n\nI 2000 kåret Vizyon-magasinets undersøgelse »De 100 bedste inden for mad« os til den bedste traditionelle lokanta, med den bedste is, yoghurt, ekmek kadayıfı og kalvefodssuppe. Vi har været omtalt i New York Times, Le Monde og Elle, og anbefales af Lonely Planet, Rough Guide, Le Guide du Routard og Louis Vuitton-guiden. I 2025 og 2026 modtog vi prisen for traditionel madlavning i Gault&Millau Tyrkiet-guiden.", "Bizning lokantamiz 1933-yilda Üsküdarda Kargılı oilasi tomonidan asos solingan; ularning sutli desert va muzqaymoq an'anasi qariyb 150 yil oldin boshlangan. Biz hali ham oilaviy biznesmiz: ishlab chiqarish va xaridan tortib oshxona va xizmatgacha har bosqichda oila a'zosi ishlaydi, ba'zi oshpazlarimizning tajribasi 40 yildan oshadi.\n\nHar kuni 100–120 xil desert, zaytun moyidagi taomlar, issiq taomlar, muzqaymoq va qatiqni yangi tayyorlaymiz. Qoidamiz oddiy: faqat eng yaxshi xom ashyo. Kerakli sifatni topa olmasak, o'sha taomni tayyorlamaymiz. 1970-yillardan beri ishlab chiqilgan qadoqlash tufayli taomlarimiz uylar va ofislarga ham yetib boradi.\n\n2000-yilda Vizyon jurnalining «Oziq-ovqatdagi eng yaxshi 100» so'rovnomasi bizni eng yaxshi an'anaviy lokanta deb topdi: eng yaxshi muzqaymoq, qatiq, ekmek kadayıfı va oyoq sho'rvasi bilan. Bizni New York Times, Le Monde va Elle yozgan, Lonely Planet, Rough Guide, Le Guide du Routard va Louis Vuitton qo'llanmasi tavsiya qiladi. 2025 va 2026 yillarda Gault&Millau Turkiya qo'llanmasining an'anaviy oshxona mukofotini oldik.", "Biziň lokantamyz 1933-nji ýylda Üsküdarda Kargılı maşgalasy tarapyndan esaslandyryldy; olaryň süýtli desert we dondurma däpleri takmynan 150 ýyl öňe gidýär. Biz entek maşgala telekeçiligi: önümçilikden we satyn almakdan tä aşhana we hyzmata çenli her basgançakda maşgala agzasy işleýär, käbir aşpezlerimiziň 40 ýyldan gowrak tejribesi bar.\n\nHer gün 100–120 görnüşli desert, zeýtin ýagyndaky iýmitler, yssy iýmitler, dondurma we gatyk täze taýýarlaýarys. Düzgünimiz ýönekeý: diňe iň oňat iýmit serişdeleri. Dogry hilini tapmasak, şol iýmiti taýýarlamaýarys. 1970-nji ýyllardan bäri ösdürýän gaplamamyzyň kömegi bilen iýmitlerimiz öýlere we ofislere-de ýetýär.\n\n2000-nji ýylda Vizyon žurnalynyň «Iýmitde iň oňat 100» barlagy bizi iň oňat dessur lokanta diýip yglan etdi: iň oňat dondurma, gatyk, ekmek kadayıfı we aýak şorpasy bilen. Biz barada New York Times, Le Monde we Elle ýazdy; Lonely Planet, Rough Guide, Le Guide du Routard we Louis Vuitton gollanmasy maslahat berýär. 2025 we 2026-njy ýyllarda Gault&Millau Türkiýe gollanmasynda dessur aşpezçilik baýragyny aldyk.", "Манай локант 1933 онд Üsküdar хотод Kargılı гэр бүлээр үүсгэн байгуулагдсан бөгөөд тэдний сүүн амтат болон зайрмагны уламжлал ойролцоогоор 150 жилийн түүхтэй. Бид одоо ч гэр бүлийн бизнес: үйлдвэрлэл, худалдан авалтаас эхлээд гал тогоо, үйлчилгээ хүртэл үе шат бүрт гэр бүлийн гишүүн ажиллаж, зарим тогоочдын туршлага 40 жилээс давдаг.\n\nӨдөр бүр 100–120 төрлийн амтат, зэйтүн тосон дахь хоол, халуун хоол, зайрмаг, тараг шинээр бэлтгэдэг. Бидний дүрэм энгийн: зөвхөн хамгийн сайн түүхий эд. Зөв чанарыг олж чадахгүй бол тэр хоолыг хийхгүй. 1970-аад оноос хөгжүүлсэн савлагааны ачаар бидний хоол гэр, оффист хүрдэг.\n\n2000 онд Vizyon сэтгүүлийн «Хоолны шилдэг 100» санамжилгаар бид хамгийн сайн уламжлалт локант хэмээн тодорч, хамгийн сайн зайрмаг, тараг, ekmek kadayıfı, хөлний шөлтэй байсан. Бидний тухай New York Times, Le Monde, Elle сонинд бичсэн; Lonely Planet, Rough Guide, Le Guide du Routard болон Louis Vuitton гарын авлага зөвлөдөг. 2025 болон 2026 онд Gault&Millau Turkey гарын авлагын уламжлалт хоолны шагнал хүртсэн.", "Біздің локантамыз 1933 жылы Üsküdar-да Kargılı отбасы негіздеген; олардың сүтті десерт пен балмұздақ дәстүрі шамамен 150 жылға созылады. Біз әлі де отбасылық бизнеспіз: өндіріс пен сатып алудан бастап ас үй мен қызметке дейінгі әр кезеңде отбасы мүшесі жұмыс істейді, кейбір аспазшыларымыздың тәжірибесі 40 жылдан асады.\n\nКүн сайын 100–120 түрлі десертті, зәйтүн майындағы тағамдарды, ыстық тағамдарды, балмұздақ пен қатықты жаңадан дайындаймыз. Біздің ереже қарапайым: тек ең жақсы шикізат. Дұрыс сапаны таба алмасақ, сол тағамды жасамаймыз. 1970 жылдардан бері дамытып келе жатқан орауымыздың арқасында тағамдарымыз үйлерге және кеңселерге де жетеді.\n\n2000 жылы Vizyon журналының «Тағамдағы үздік 100» сауалнамасы бізді ең үздік дәстүрлі локант деп таныды: ең үздік балмұздақ, қатық, ekmek kadayıfı және ашақ сорпасымен. Бізге туралы New York Times, Le Monde және Elle жазды, Lonely Planet, Rough Guide, Le Guide du Routard және Louis Vuitton нұсқаулығы ұсынады. 2025 және 2026 жылдары Gault&Millau Түркия нұсқаулығының дәстүрлі асхана номинациясында сыйлық алдық."], "Q.today.q": ["Що ви рекомендуєте сьогодні?", "Mit ajánl ma?", "Co doporučujete dnes?", "Čo odporúčate dnes?", "Što preporučujete danas?", "Ką rekomenduojate šiandien?", "Vad rekommenderar ni idag?", "Hvad anbefaler I i dag?", "Bugun nimani tavsiya qilasiz?", "Şu gün näme maslahat berýärsiňiz?", "Өнөөдөр юу санал болгох вэ?", "Бүгін не ұсынасыз?"], "Q.today.a": ["Сьогодні рекомендую ось це. Я впевнений, що вам сподобається:", "Ma ezt ajánlom. Biztos vagyok benne, hogy szeretni fogja:", "Dnes doporučuji tohle. Jsem si jistý, že si to zamilujete:", "Dnes odporúčam toto. Som si istý, že si to zamilujete:", "Danas preporučujem ovo. Siguran sam da ćete voljeti:", "Šiandien rekomenduoju štai šį. Esu tikras, kad jums patiks:", "Idag rekommenderar jag den här. Jag är säker på att du kommer att älska den:", "I dag anbefaler jeg denne. Jeg er sikker på, at du vil elske den:", "Bugun men shuni tavsiya qilaman. Ishonchim komilki, yoqadi:", "Şu gün muny maslahat berýärin. Ynanýaryn, halarsyňyz:", "Өнөөдөр би үүнийг санал болгож байна. Таньд таалагдана гэдэгт итгэлтэй байна:", "Бүгін мен мынаны ұсынамын. Ұнайтынына сенімдімін:"], "Q.veg.q": ["Вегетаріанці можуть їсти що?", "Mit ehetnek a vegetáriánusok?", "Co mohou jíst vegetariáni?", "Čo môžu jesť vegetariáni?", "Što mogu jesti vegetarijanci?", "Ką gali valgyti vegetarai?", "Vad kan vegetarianer äta?", "Hvad kan vegetarer spise?", "Vegetarianlar nima yeyishi mumkin?", "Wegetarianlar näme iýip bilýärler?", "Цагаан хоолтнууд юу идэж болох вэ?", "Вегетариандықтар не жей алады?"], "Q.veg.a": ["Більшість наших страв в оливковій олії, як і салати та компоти, веганські. Кнопкою нижче можна побачити лише вегетаріанські страви. Зауважте: більшість наших гарячих овочевих страв готуються з м'ясом.", "Olajos ételeink többsége vegán, akárcsak a saláták és a kompótok. Az alábbi gombbal csak a vegetáriánus ételeket láthatja. Megjegyzés: a meleg zöldséges ételeink többségét hússal főzzük.", "Většina našich jídel v olivovém oleji je veganská, stejně jako saláty a kompoty. Tlačítkem níže zobrazíte jen vegetariánská jídla. Pozor: většina našich teplých zeleninových jídel se vaří s masem.", "Väčšina našich jedál v olivovom oleji je vegánska, rovnako ako šaláty a kompóty. Tlačidlom nižšie zobrazíte iba vegetariánske jedlá. Upozornenie: väčšina našich teplých zeleninových jedál sa varí s mäsom.", "Većina naših jela u maslinovom ulju vegansko je, kao i salate i kompoti. Gumbom ispod prikažite samo vegetarijanska jela. Napomena: većina naših toplih jela od povrća kuha se s mesom.", "Dauguma mūsų patiekalų alyvuogių aliejuje yra veganiški, kaip ir salotos bei kompotai. Žemiau esančiu mygtuku pamatysite tik vegetariškus patiekalus. Atkreipkite dėmesį: dauguma mūsų karštų daržovių patiekalų gaminami su mėsa.", "De flesta av våra rätter i olivolja är veganska, liksom salladerna och kompotterna. Använd knappen nedan för att bara se vegetariska rätter. Observera: de flesta av våra varma grönsaksrätter tillagas med kött.", "De fleste af vores retter i olivenolie er veganske, ligesom salater og kompoter. Brug knappen nedenfor for kun at se vegetariske retter. Bemærk: de fleste af vores varme grøntsagsretter tilberedes med kød.", "Zeytin moyidagi taomlarimizning ko'pchiligi vegan, salatlar va kompotlar ham shunday. Pastdagi tugma bilan faqat vegetarian taomlarni ko'rishingiz mumkin. Diqqat: issiq sabzavot taomlarimizning ko'pchiligi go'sht bilan pishiriladi.", "Zeýtin ýagyndaky iýmitlerimiziň köpüsi wegandyr, salatlar we kompotlar hem şeýle. Aşakdaky düwme bilen diňe wegetarian iýmitleri görüp bilersiňiz. Üns beriň: gyzgyn gök önüm iýmitlerimiziň köpüsi et bilen bişirilýär.", "Манай зэйтүн тосон дахь хоолны ихэнх нь веган, салат, компот ч мөн адил. Доорх товчоор зөвхөн цагаан хоолтон хоолыг харж болно. Анхаарна уу: манай халуун ногоон хоолны ихэнхийг махтай хийдэг.", "Зәйтүн майындағы тағамдарымыздың көпшілігі веган, салаттар мен компоттар да солай. Төмендегі түймені басып, тек вегетариандық тағамдарды көруге болады. Ескерту: ыстық көкөніс тағамдарымыздың көбі етпен пісіріледі."], "Q.olive.q": ["Що таке «страви в оливковій олії»?", "Mik azok az „olívaolajos ételek”?", "Co jsou „jídla v olivovém oleji”?", "Čo sú „jedlá v olivovom oleji”?", "Što su „jela u maslinovom ulju”?", "Kas yra „patiekalai alyvuogių aliejuje”?", "Vad är ”rätter i olivolja”?", "Hvad er ”retter i olivenolie”?", "«Zaytun moyidagi taomlar» nima?", "«Zeýtin ýagyndaky iýmitler» näme?", "«Зэйтүн тосон дахь хоол» гэж юу вэ?", "«Зәйтүн майындағы тағамдар» дегеніміз не?"], "Q.olive.a": ["Овочі, повільно тушковані в оливковій олії й подавані холодними, класика стамбульської кухні. Більшість з них веганські. Почніть з фаршированих виноградних листків або İmambayıldı:", "Olívaolajban lassan párolt zöldségek, hidegen tálalva, az isztambuli konyha klasszikusa. A legtöbb vegán. Kezdje töltött szőlőlevéllel vagy İmambayıldıval:", "Zelenina pomalu dušená v olivovém oleji a podávaná studená, klasika istanbulské kuchyně. Většina je veganská. Začněte plněnými vinnými listy nebo İmambayıldı:", "Zelenina pomaly dusená v olivovom oleji a podávaná studená, klasika istanbulskej kuchyne. Väčšina je vegánska. Začnite plnenými vinnými listami alebo İmambayıldı:", "Povrće polako kuhano u maslinovom ulju i poslužano hladno, klasik istanbulske kuhinje. Većina je veganska. Počnite s punjenim vinovim listovima ili İmambayıldıom:", "Daržovės, lėtai troškintos alyvuogių aliejuje ir patiekiamos šaltos, – klasika Stambulo virtuvėje. Dauguma yra veganiški. Pradėkite nuo įdarytų vynuogių lapų arba İmambayıldı:", "Grönsaker långsamt tillagade i olivolja och serverade kalla, en klassiker i Istanbuls kök. De flesta är veganska. Börja med fyllda vinblad eller İmambayıldı:", "Grøntsager langsomt tilberedt i olivenolie og serveret kolde, en klassiker i Istanbuls køkken. De fleste er veganske. Start med fyldte vinblade eller İmambayıldı:", "Zeytin moyida sekin pishirilgan va sovuq holda tortiladigan sabzavotlar, Istanbul oshxonasining klassikasi. Ko'pchiligi vegan. Tolma uzum barglari yoki İmambayıldı bilan boshlang:", "Zeýtin ýagynda haýal bişirilen we sowuk berilýän gök önümler, Stambul aşhanasynyň klassigi. Köpüsi wegandyr. Dolduryşly üzüm ýaprakdan ýa-da İmambayıldydan başlaň:", "Зэйтүн тосонд удаан шарсан, хүйтнээр үйлчилдэг ногоон хоолнууд, Истанбулын хоолны сонгодог жишээ. Ихэнх нь веган. Дүүргэсэн усан үзмийн навч эсвэл İmambayıldı-ээр эхлээрэй:", "Зәйтүн майында баяу пісірілген және суық беріletін көкөністер, Стамбұл асханасының классикасы. Көбі веган. Толтырылған жүзім жапырағы немесе İmambayıldı-дан бастаңыз:"], "Q.dessert.q": ["Який десерт ви рекомендуєте?", "Melyik desszertet ajánlja?", "Který dezert doporučujete?", "Ktorý dezert odporúčate?", "Koji desert preporučujete?", "Kurį desertą rekomenduojate?", "Vilken efterrätt rekommenderar ni?", "Hvilken dessert anbefaler I?", "Qaysi desertni tavsiya qilasiz?", "Haýsy desserti maslahat berýärsiňiz?", "Ямар амтатыг санал болгох вэ?", "Қай десертті ұсынасыз?"], "Q.dessert.a": ["Наш айвовий десерт з кремом — улюблений. Якщо хочете щось легке, — рисовий пудинг; якщо солодке з сиропом — ekmek kadayıfı. Якщо цікаво, спробуйте kazandibi: його готують із курячої грудки, але смак солодкий!", "Birsalmadesszertünk tejszínnel népszerű. Ha valami könnyűre vágyik, a rizspuding; ha szirupos ízre, az ekmek kadayıfı. Ha kíváncsi, kóstolja meg a kazandibit: csirkemellből készül, mégis édes az íze!", "Náš kdoulový dezert se smetanou je oblíbený. Pro něco lehkého rýžový nákyp, pro něco sirupového ekmek kadayıfı. Jste-li zvědaví, zkuste kazandibi: dělá se z kuřecích prsou, a přesto chutná sladce!", "Náš kdoňový dezert so smotanou je obľúbený. Pre niečo ľahké ryžový nákyp, pre niečo sirupové ekmek kadayıfı. Ak ste zvedaví, skúste kazandibi: pripravuje sa z kuracích pŕs, a predsa chutí sladko!", "Naš desert od dunje s kajmakom je omiljen. Za nešto lagano rižin puding, za nešto u sirupu ekmek kadayıfı. Ako ste znatiželjni, probajte kazandibi: pravi se od pilećih prsa, a slatkog je okusa!", "Mūsų kvitėnų desertas su grietine – mėgstamiausias. Jei norite ko nors lengvo – ryžių pudingas, o jei su sirupu – ekmek kadayıfı. Jei smalsu, paragaukite kazandibi: jis gaminamas iš vištienos krūtinėlės, bet skonis saldus!", "Vår kvittendessert med grädde är en favorit. För något lätt, risgrynspudding; för något sirapsdoppat, ekmek kadayıfı. Om du är nyfiken, prova kazandibi: den görs på kycklingbröst men smakar sött!", "Vores kvæbledessert med fløde er en favorit. Til noget let, risengrød; til noget sirupsagtigt, ekmek kadayıfı. Hvis du er nysgerrig, så prøv kazandibi: den laves af kyllingebryst, men smager sødt!", "Qaymoqli behi desertimiz sevimli. Yengil narsa uchun sutli guruch; sharbatli narsa uchun ekmek kadayıfı. Qiziqsangiz, kazandibini sinab ko'ring: u tovuq ko'kragidan tayyorlanadi, lekin shirin ta'mli!", "Gaýmakly behi desertimiz halanýan. Ýeňil zat üçin süýtli tüwi; siropdan ýasalan zat üçin ekmek kadayıfı. Gyzyklanýan bolsaňyz, kazandibi synap görüň: towuk döşünden taýýarlanýar, emma şirin tagamly!", "Тостой бүлдирээний амтат бидэнд дуртай. Хөнгөн зүйл хүсвэл — будаатай пудинг; шараппатай зүйл хүсвэл — ekmek kadayıfı. Сонирхож байвал kazandibi-г амтлаарай: тахианы цээжээр хийдэг ч чихэрлэг амттай!", "Қаймақты айва десертіміз ұнайды. Жеңіл нәрсе үшін — күріш пудингі; шербеті бар нәрсе үшін — ekmek kadayıfı. Қызықсаңыз, kazandibi-ді көріңіз: тауық көкірегінен жасалады, бірақ тәтті дәмі бар!"], "Q.allergy.q": ["У мене алергія. Що мені робити?", "Allergiás vagyok. Mit tegyek?", "Mám alergii. Co mám dělat?", "Mám alergiu. Čo mám robiť?", "Imam alergiju. Što da radim?", "Turiu alergiją. Ką man daryti?", "Jag har en allergi. Vad ska jag göra?", "Jeg har en allergi. Hvad skal jeg gøre?", "Menda allergiya bor. Nima qilishim kerak?", "Allergiýam bar. Näme etmeli?", "Надад харшил байдаг. Яах вэ?", "Менің аллергиям бар. Не істеуім керек?"], "Q.allergy.a": ["Будь ласка, перед замовленням повідомте офіціанта; він передасть це на кухню. Помаранчеві позначки під кожною стравою показують алергени: глютен, молоко, яйця, горіхи, селера, рибу та кунжут. Позначки є орієнтиром, тому, будь ласка, уточніть у офіціанта.", "Kérjük, a rendelés előtt szóljon a pincérnek; ő tájékoztatja a konyhát. Minden étel alatti narancssárga címke jelzi az allergéneket: glutén, tej, tojás, diófélék, zeller, hal és szezám. A címkék tájékoztató jellegűek, ezért kérjük, bizonyosodjon meg róluk a pincérnél.", "Před objednáním prosím řekněte číšníkovi; ten to předá kuchyni. Oranžové štítky pod každým jídlem ukazují alergeny: lepek, mléko, vejce, ořechy, celer, ryby a sezam. Štítky jsou pouze orientační, proto si je prosím ověřte u číšníka.", "Pred objednaním prosím povedzte čašníkovi; ten to oznámi kuchyni. Oranžové štítky pod každým jedlom ukazujú alergény: lepok, mlieko, vajcia, orechy, zeler, ryby a sezam. Štítky sú len orientačné, preto si ich prosím overte u čašníka.", "Molimo prije narudžbe recite konobaru; on će obavijestiti kuhinju. Narančaste oznake ispod svakog jela pokazuju alergene: gluten, mlijeko, jaja, orašaste plodove, celer, ribu i sezam. Oznake su samo informativne, pa ih molimo provjerite s konobarom.", "Prašome prieš užsakant pasakyti padavėjui; jis perduos virtuvei. Oranžinės etiketės po kiekvienu patiekalu nurodo alergenus: glitimą, pieną, kiaušinius, riešutus, saldierius, žuvį ir sezamą. Etiketės yra tik orientacinės, todėl prašome patikslinti su padavėju.", "Informera gärna servitören innan du beställer; han meddelar köket. De orangefärgade etiketterna under varje rätt visar allergener: gluten, mjölk, ägg, nötter, selleri, fisk och sesam. Etiketterna är en vägledning, så kontrollera gärna med servitören.", "Sig venligst til tjeneren, før du bestiller; hun/han giver besked til køkkenet. De orange mærkater under hver ret viser allergener: gluten, mælk, æg, nødder, selleri, fisk og sesam. Mærkaterne er en vejledning, så tjek venligst med tjeneren.", "Buyurtma berishdan oldin ofitsiantga ayting; u oshxonaga xabar beradi. Har bir taom ostidagi to'q sariq belgilar allergenlarni ko'rsatadi: glyuten, sut, tuxum, yong'oq, selderey, baliq va kunjut. Belgilar taxminiy, shuning uchun ofitsiant bilan tekshiring.", "Sargyt bermezden ozal welýantşa habar beriň; ol aşhana habar berer. Her iýmitiň aşagyndaky narynç belgiler allergenleri görkezýär: glýuten, süýt, ýumurtga, ýaňgak, seldereý, balyk we küňjüt. Belgiler maslahat üçindir, şonuň üçin welýantşydan barlaň.", "Захиалахаасаа өмнө зөөгчдөө мэдэгдээрэй; тэр гал тогоонд мэдэгдэнэ. Хоол бүрийн доорх улбар шар тэмдэг харшил үүсгэгчдийг заана: глютен, сүү, өндөг, самар, сельдерей, загас, кунжут. Тэмдэг бол зөвлөмж тул зөөгчтэйгээ шалгана уу.", "Тапсырыс бермес бұрын даяшыға айтыңыз; ол асханаға хабарлайды. Әр тағамның астындағы қызғылт сары белгілер аллергендерді көрсетеді: глютен, сүт, жұмыртқа, жаңғақ, сельдерей, балық және күнжіт. Белгілер жол көрсету үшін, сондықтан даяшыдан тексеріңіз."], "Q.togo.q": ["Ваші страви можна забрати з собою?", "Elvihetők-e az ételek?", "Mohu si vaše jídla odnést?", "Môžem si vaše jedlá odniesť?", "Mogu li ponijeti vaša jela?", "Ar galiu pasiimti jūsų patiekalus?", "Kan jag ta med mig era rätter?", "Kan jeg få jeres retter med hjem?", "Taomlaringizni olib ketsam bo'ladimi?", "Siziň iýmitleriňizi alyp gidip bilerinmi?", "Таны хоолыг авч явж болох уу?", "Тағамдарыңызды алып кетуге бола ма?"], "Q.togo.a": ["Звичайно! Усі наші страви й десерти можна взяти з собою. Також можна купити наші десерти на кілограми, йогурт з овечого молока в глиняному горщику та наші домашні варення. За правильного пакування наше морозиво може перевозитися годинами, не тануючи. Солодкий сувенір з Ускюдара.", "Persze! Minden ételünk és desszertünk elvihető. Kaphatók desszertjeink kilóra, juhtejes joghurt cserépedényben és házi lekvárjaink is. Megfelelő csomagolásban fagylaltunk órákig utazhat anélkül, hogy elolvadna. Édes emlék Üsküdarból.", "Samozřejmě! Všechna naše jídla a dezerty si můžete odnést. Také lze koupit naše dezerty na kilo, ovčí jogurt v hliněném hrnci a naše domácí džemy. S vhodným obalem vydrží naše zmrzlina cestovat hodiny, aniž by roztála. Sladká vzpomínka z Üsküdaru.", "Samozrejme! Všetky naše jedlá a dezerty si môžete odniesť. Dajú sa kúpiť aj naše dezerty na kilá, ovčí jogurt v hlinenom hrnci a naše domáce džemy. S vhodným obalom vydrží naša zmrzlina cestovať hodiny bez roztopenia. Sladký suvenír z Üsküdaru.", "Naravno! Sva naša jela i deserti mogu se ponijeti. Možete kupiti i naše deserte na kilogram, ovčji jogurt u glinenoj posudi i naše domaće džemove. Uz odgovarajuću ambalažu naš sladoled može putovati satima bez topljenja. Slatka uspomena iz Üsküdara.", "Žinoma! Visus mūsų patiekalus ir desertus galite pasiimti. Taip pat galima įsigyti desertų pagal kilogramą, avių pieno jogurto molio puode ir mūsų namų uogienių. Su tinkamomis pakuotėmis mūsų ledai gali keliauti valandas neištirpdami. Saldus suvenyras iš Ūsiudaro.", "Självklart! Alla våra rätter och desserter kan tas med. Du kan också köpa våra desserter per kilo, fårmjölksyoghurt i lergryta och våra hemgjorda sylter. Med rätt förpackning kan vår glass resa i timmar utan att smälta. En söt souvenir från Üsküdar.", "Selvfølgelig! Alle vores retter og desserter kan også tages med. Du kan også købe vores desserter pr. kilo, fåremælksyoghurt i lergryde og vores hjemmelavede syltetøj. Med den rette emballage kan vores is rejse i timevis uden at smelte. Et sødt souvenir fra Üsküdar.", "Albatta! Barcha taomlarimiz va shirinliklarimizni olib ketish mumkin. Shuningdek, shirinliklarimizni kilogramm hisobida, ko'zachada qo'y sutidan qatiq va uy murabbolarimizni sotib olishingiz mumkin. To'g'ri qadoqlash bilan muzqaymoqlarimiz erimasdan soatlab yo'l bosadi. Üsküdardan shirin esdalik.", "Hökman! Ähli iýmitlerimiz we desertlerimiz alyp gidilip bilner. Desertlerimizi kilogram boýunça, şuwüýli gatygy küýzede we öý murap-larymyzy hem satyn alyp bilersiňiz. Dogry gaplamada dondurmamyz eremän sagatlap ýol gidip biler. Üsküdardan şirin ýadygärlik.", "Мэдээж! Бүх хоол, амтатаа авч явж болно. Мөн амтатаа кг-аар, шавар саванд хонины сүүн тарааг, гэрийн мурабба худалдаж авч болно. Зөв савлагаатай бол манай зайрмаг хэдэн цагийн турш хайлахгүй явна. Üsküdar-аас сайхан дурсгал.", "Әрине! Барлық тағамдарымыз бен десерттерімізді алып кетуге болады. Десерттерімізді килограммен, балшық ыдыстағы қой қатығын және үйде жасалған мураббаларымызды да сатып алуға болады. Дұрыс орауда балмұздағымыз ерімей сағаттап жол жүреді. Üsküdar-дан тәтті естелік."], "Q.cater.q": ["Ви доставляєте їжу додому чи в офіси та організовуєте кейтеринг для подій, весіль і мевлітів?", "Házhoz szállítanak ételt otthonokba és irodákba, és vállalnak catering-t rendezvényekre, esküvőkre és mevlidekre?", "Nabízíte rozvoz jídla do domů a do kanceláří a catering na akce, svatby a mevlidy?", "Ponúkate donášku jedál domov a do kancelárií a cateringu na akcie, svadby a mevlidy?", "Nudite li dostavu hrane u domove i urede te catering za događaje, vjenčanja i mevlide?", "Ar teikiate maisto pristatymą į namus ir biurus bei aptarnavimą renginiams, vestuvėms ir mevlidams?", "Erbjuder ni matleverans till hem och kontor samt catering för evenemang, bröllop och mevlid?", "Tilbyder I madlevering til hjem og kontorer samt catering til begivenheder, bryllupper og mevlid?", "Uylarga va ofislarga ovqat yetkazib berasizmi hamda tadbirlar, to'ylar va mevlidlar uchun katering xizmati ko'rsatasizmi?", "Öýlere we ofislere iýmit eltip berýärsiňizmi we çäreler, toýlar we mewlitler üçin kateringmi?", "Танд болон оффистоо хоол хүргэлт, арга хэмжээ, хурим, мевлид-ын кейтеринг үйлчилгээ байдаг уу?", "Үйлерге және кеңселерге тамақ жеткізесіз бе, сондай-ақ іс-шаралар, некелер және мевлидтерге катеринг жасайсыз ба?"], "Q.cater.a": ["Так! Ми доставляємо їжу додому та в офіси, а також організовуємо кейтеринг для заходів, весіль і мевлідів (релігійних зібрань).", "Igen! Házhoz szállítunk ételt otthonokba és irodákba, valamint cateringet biztosítunk rendezvényekre, esküvőkre és mevlidekre (vallási összejövetelekre).", "Ano! Dovážíme jídlo do domů a do kanceláří a zajišťujeme catering na akce, svatby a mevlidy (náboženská shromáždění).", "Áno! Donášame jedlo domov a do kancelárií a zabezpečujeme catering na akcie, svadby a mevlidy (náboženské zhromaždenia).", "Da! Dostavljamo hranu u domove i urede te pružamo catering za događaje, vjenčanja i mevlide (vjerska okupljanja).", "Taip! Pristatome maistą į namus ir biurus, o renginiams, vestuvėms ir mevlidams (religiniams susibūrimams) teikiame aptarnavimą.", "Ja! Vi levererar mat till hem och kontor och erbjuder catering för evenemang, bröllop och mevlid (religiösa sammankomster).", "Ja! Vi leverer mad til hjem og kontorer og tilbyder catering til begivenheder, bryllupper og mevlid (religiøse sammenkomster).", "Ha! Uylarga va ofislarga ovqat yetkazamiz, tadbirlar, to'ylar va mevlidlar (diniy yig'ilishlar) uchun katering xizmatini ko'rsatamiz.", "Hawa! Öýlere we ofislere iýmit eltip berýäris we çäreler, toýlar we mewlitler (dini ýygnanyşyklar) üçin kateringi hödürleýäris.", "Тийм! Бид гэр болон оффист хоол хүргэж, арга хэмжээ, хурим, мевлид (шашны цуглаан)-д кейтеринг үйлчилгээ үзүүлдэг.", "Иә! Үйлерге және кеңселерге тамақ жеткіземіз, іс-шаралар, некелер және мевлидтер (діни жиындар) үшін катеринг көрсетеміз."], "Q.calc.q": ["Як мені порахувати мій рахунок?", "Hogyan számolhatom ki a számlámat?", "Jak si mohu spočítat účet?", "Ako si môžem vypočítať účet?", "Kako mogu izračunati račun?", "Kaip apskaičiuoti mano sąskaitą?", "Hur räknar jag ut min nota?", "Hvordan kan jeg regne min regning ud?", "Hisobimni qanday hisoblayman?", "Hasabymy nädip hasaplaýaryn?", "Миний төлбөрийг яаж тооцоолох вэ?", "Шотымды қалай есептеймін?"], "Q.calc.a": ["Це просто! Відкрийте «🧾 {calc}» угорі й додайте з’їдені страви кнопкою «+»; для деяких страв можна обрати також половину порції або один шматок. Смуга «{my}» внизу показує вашу суму. Коли закінчите, натисніть «{show}»: офіціант відскануює код, перевіряє й підтверджує. Потім підтверджений рахунок можна зберегти на телефоні вашою мовою.", "Egyszerű! Nyissa meg fent a „🧾 {calc}” részt, és a „+” gombbal adja hozzá az elfogyasztott ételeket; bizonyos ételeknél féladagot vagy egy darabot is választhat. Az alján lévő „{my}” sáv mutatja a végösszeget. Ha végzett, koppintson a „{show}” gombra: a pincér beolvassa a kódot, ellenőrzi és megerősíti. Ezután a megerősített számlát a telefonján, saját nyelvén mentheti el.", "Je to snadné! Nahoře otevřete „🧾 {calc}” a přidejte snězená jídla tlačítkem „+“; u některých jídel můžete vybrat také půlku porce nebo jeden kus. Lišta „{my}“ dole ukazuje celkovou částku. Až budete hotovi, klepněte na „{show}“: číšník kód naskenuje, zkontroluje a potvrdí. Potvrzený účet si pak můžete uložit do telefonu ve svém jazyce.", "Je to jednoduché! Hore otvorte „🧾 {calc}“ a pridajte zjedené jedlá tlačidlom „+“; pri niektorých jedlách môžete zvoliť aj polovičnú porciu alebo jeden kus. Lišta „{my}“ dole zobrazuje celkovú sumu. Keď skončíte, ťuknite na „{show}“: čašník kód naskenuje, skontroluje a potvrdí. Potvrdený účet potom môžete uložiť do telefónu vo svojom jazyku.", "Lako je! Otvorite „🧾 {calc}“ na vrhu i dodajte pojedena jela pomoću „+“; za neka jela možete odabrati i pola porcije ili jedan komad. Traka „{my}“ pri dnu pokazuje ukupni iznos. Kad završite, dodirnite „{show}“: konobar skenira kôd, provjeri ga i potvrdi. Potvrđeni račun zatim možete spremiti na telefon na vlastitom jeziku.", "Lengva! Viršuje atidarykite „🧾 {calc}“ ir pridėkite suvalgytus patiekalus mygtuku „+“; kai kuriems patiekalams galite pasirinkti ir pusę porcijos arba vieną gabalą. Apačioje esanti juosta „{my}“ rodo jūsų sumą. Baigę paspauskite „{show}“: padavėjas nuskaitys kodą, patikrins ir patvirtins. Tada patvirtintą sąskaitą galite išsaugoti telefone savo kalba.", "Det är enkelt! Öppna ”🧾 {calc}” överst och lägg till de rätter du ätit med ”+”; för vissa rätter kan du också välja halv portion eller en bit. Raden ”{my}” längst ned visar totalsumman. När du är klar, tryck på ”{show}”: servitören skannar koden, kontrollerar och bekräftar. Sedan kan du spara den bekräftade notan på din telefon på ditt eget språk.", "Det er let! Åbn ”🧾 {calc}” øverst, og tilføj de retter, du har spist, med ”+”; for nogle retter kan du også vælge en halv portion eller ét stykke. Linjen ”{my}” nederst viser din samlede sum. Når du er færdig, tryk på ”{show}”: tjeneren scanner koden, tjekker og bekræfter. Derefter kan du gemme den bekræftede regning på din telefon på dit eget sprog.", "Juda oson! Yuqorida «🧾 {calc}» ni oching va yegan taomlaringizni «+» bilan qo'shing; ba'zi taomlar uchun yarim porsiya yoki bitta bo'lak tanlash ham mumkin. Pastdagi «{my}» paneli umumiy summani ko'rsatadi. Tugagach, «{show}» ni bosing: ofitsiant kodni skanerlab, tekshirib tasdiqlaydi. Keyin tasdiqlangan hisobni telefoningizga o'z tilingizda saqlashingiz mumkin.", "Aňsat! Ýokarda «🧾 {calc}» açyň we iýen iýmitleriňizi «+» bilen goşuň; käbir iýmitler üçin ýarym porsiýa ýa-da bir bölek saýlap bolar. Aşakdaky «{my}» setir jemi görkezýär. Gutaransoňyňyz «{show}» basyň: welýantşy kody skanirläp, barlap tassyklar. Soňra tassyklanan hasaby telefonyňyzda öz diliňizde saklap bilersiňiz.", "Энгийн! Дээд хэсгийн «🧾 {calc}»-ийг нээгээд, идсэн хоолоо «+» товчоор нэмнэ үү; зарим хоолонд хагас порц эсвэл нэг ширхэг сонгож болно. Доод талын «{my}» мөр нийт дүнг харуулна. Дууссаны дараа «{show}» дарна уу: зөөгч кодыг уншуулж, шалгаж баталгаажуулна. Дараа нь баталгаажсан төлбөрөө утаснаасаа өөрийн хэлээр хадгалж болно.", "Оңай! Жоғарыдағы «🧾 {calc}»-ті ашып, жеген тағамдарыңызды «+» арқылы қосыңыз; кейбір тағамдарға жарты порция немесе бір дана таңдауға болады. Төменгі «{my}» жолағы жалпы сомасын көрсетеді. Аяқтағанда «{show}» түймесін басыңыз: даяшы кодты сканерлеп, тексеріп растайды. Содан кейін расталған шотты телефонында өз тілінде сақтауға болады."], "Q.fb.q": ["Я хотів би поділитися відгуком", "Szeretnék visszajelzést adni", "Rád bych sdílel(a) zpětnou vazbu", "Rád by som sa podelil(a) o spätnú väzbu", "Želio/la bih podijeliti povratnu informaciju", "Norėčiau pateikti atsiliepimą", "Jag vill dela med mig av min feedback", "Jeg vil gerne dele min feedback", "Fikr-mulohazamni bildirmoqchiman", "Teswirimi paýlaşmak isleýärin", "Санал хүсэлтээ хуваалцмаар байна", "Пікірімді бөліскім келеді"], "Q.fb.a": ["Бу, будемо раді почути! Будь ласка, оцініть нас і за бажання додайте кілька слів:", "Örömmel halljuk! Kérjük, értékeljen minket, és ha szeretné, írjon pár szót is:", "To rádi uslyšíme! Ohodnoťte nás prosím a případně přidejte pár slov:", "To radi počujeme! Ohodnoťte nás prosím a v prípade záujmu pridajte pár slov:", "Rado ćemo čuti! Molimo ocijenite nas, a ako želite, dodajte nekoliko riječi:", "Būsime labai dėkingi! Įvertinkite mus ir, jei norite, parašykite kelis žodžius:", "Vi vill gärna höra det! Betygsätt oss gärna, och skriv gärna några ord:", "Det vil vi gerne høre! Giv os en bedømmelse, og skriv gerne et par ord:", "Eshiti
