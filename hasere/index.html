<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haşere Kontrol Dosyası · Kanaat Lokantası</title>
<meta name="theme-color" content="#1D5A46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haşere">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: a dossier — summary strip, sticky section index, then visits / plan / products / documents / emergency, each as a plain section. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --ink:#17201B; --muted:#58645D; --line:#D6DDD7;
  --accent:#1D5A46; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --ok:#23704A; --ok-soft:#DDF0E4; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#A82A20; --bad-soft:#F8DEDA;
  --t-ilt:#D99A00; --t-canli:#2D69A0; --t-yem:#B8372D; --t-glue:#14857A; --t-feromon:#7A4BB0; --t-guve:#8A5A2B; --t-monitor:#5F6B66;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1A; --sunk:#1E2722; --ink:#E4EAE6; --muted:#9AA7A0; --line:#2B3530;
  --accent:#6CC1A0; --accent-ink:#0B1A14; --accent-soft:#1F3A30;
  --ok:#6BCB95; --ok-soft:#183324; --warn:#F0B355; --warn-soft:#3A2A10; --bad:#F08A80; --bad-soft:#3D1C19;
  --t-ilt:#F2C230; --t-canli:#6BA6DE; --t-yem:#EE7A6E; --t-glue:#4CC4B6; --t-feromon:#B592E6; --t-guve:#C99A68; --t-monitor:#9AA7A0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1A; --sunk:#1E2722; --ink:#E4EAE6; --muted:#9AA7A0; --line:#2B3530;
  --accent:#6CC1A0; --accent-ink:#0B1A14; --accent-soft:#1F3A30;
  --ok:#6BCB95; --ok-soft:#183324; --warn:#F0B355; --warn-soft:#3A2A10; --bad:#F08A80; --bad-soft:#3D1C19;
  --t-ilt:#F2C230; --t-canli:#6BA6DE; --t-yem:#EE7A6E; --t-glue:#4CC4B6; --t-feromon:#B592E6; --t-guve:#C99A68; --t-monitor:#9AA7A0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-stretch:72%;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,46px);font-weight:750;letter-spacing:-.01em}
h2{font-size:26px;font-weight:720}
h3{font-size:17px;font-weight:650;font-stretch:85%}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
.head{background:var(--surface);border-bottom:1px solid var(--line)}
.head .wrap{padding-block:28px 22px;display:grid;gap:14px}
.head-meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:14px}
.head-meta b{color:var(--ink);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.summary>div{background:var(--surface);padding:12px 14px;display:grid;gap:2px;min-width:0}
.summary .v{font-size:21px;font-weight:700;font-stretch:80%;font-variant-numeric:tabular-nums}
.summary .s{font-size:13px;color:var(--muted)}
@media (max-width:720px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* index */
.index{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.index .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.index a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
.index a.on{background:var(--ink);color:var(--bg)}

section{padding-block:34px 8px;scroll-margin-top:60px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-neutral{background:var(--sunk);color:var(--muted)}
.chip{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.acil{background:var(--bad-soft);color:var(--bad);font-weight:600}

/* visits */
.visits{display:grid;gap:10px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:16px;padding:14px 16px;align-items:start}
.visit .date{display:grid;line-height:1.05}
.visit .date .d{font-size:28px;font-weight:750;font-stretch:70%;font-variant-numeric:tabular-nums}
.visit .date .m{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.visit .body{display:grid;gap:7px;min-width:0}
.visit .row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.visit dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;margin:0;font-size:14px}
.visit dt{color:var(--muted)}
.visit dd{margin:0;min-width:0}
.visit .side{display:grid;gap:8px;justify-items:end}
.thumb{width:96px;height:72px;border-radius:6px;border:1px solid var(--line);background:var(--sunk) center/cover no-repeat;padding:0;position:relative}
.thumb span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
@media (max-width:640px){
  .visit{grid-template-columns:minmax(0,1fr) auto;gap:10px 14px}
  .visit .date{grid-column:1;display:flex;gap:8px;align-items:baseline}
  .visit .body{grid-column:1/-1;grid-row:2}
  .visit .side{grid-column:2;grid-row:1}
  .thumb{width:76px;height:56px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.edit-only{display:none!important}
body.limited .owner-only{display:none!important}
body.editing .edit-only{display:revert!important}
body.editing .btn.edit-only,body.editing .edit-row.edit-only{display:inline-flex!important}

/* plan */
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.legend button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;font-weight:600}
.legend button[aria-pressed="false"]{opacity:.45}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.plan-scroll{overflow-x:auto;border-radius:6px}
.plan{position:relative;min-width:640px;background:#fff;border-radius:6px;user-select:none}
.plan img{display:block;width:100%;height:auto;max-width:none}
:root[data-theme="dark"] .plan img{filter:brightness(.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .plan img{filter:brightness(.92)}}
body.placing .plan{cursor:crosshair}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);background:transparent;padding:0;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.mk.solid{background:var(--c);color:#fff;font:700 12px/1 var(--f-ui);display:grid;place-items:center;width:24px;height:24px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mk[aria-pressed="true"]{outline:3px solid var(--c);outline-offset:3px}
.mk:hover{transform:translate(-50%,-50%) scale(1.12)}
.pop{position:absolute;z-index:5;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;min-width:200px;max-width:260px;font-size:13.5px;display:grid;gap:4px}
.pop b{font-size:15px}
.st-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.st-table th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.st-table td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.st-table tr{cursor:pointer}
.st-table tr.sel td{background:var(--accent-soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.plan-note{font-size:13px;color:var(--muted);margin:10px 2px 0}
.tablewrap{overflow-x:auto}

/* products */
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:720px){.products{grid-template-columns:minmax(0,1fr)}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start}
.prod-top{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.prod dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;margin:0;font-size:14px}
.prod dt{color:var(--muted)}
.prod dd{margin:0}
.prod .use{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}

/* docs */
.docgroup{margin-bottom:18px}
.docgroup h3{margin-bottom:8px}
.docs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.doc:first-child{border-top:0}
.doc .t{font-weight:600}
.doc .m{font-size:13.5px;color:var(--muted)}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:end;align-items:center}
@media (max-width:560px){.doc{grid-template-columns:minmax(0,1fr)}.doc .acts{justify-content:start}}

/* emergency */
.emerg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:720px){.emerg{grid-template-columns:minmax(0,1fr)}}
.emerg>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.emerg .num{font-size:26px;font-weight:750;font-stretch:75%;font-variant-numeric:tabular-nums;user-select:all}
.emerg .first{border-color:var(--bad);background:var(--bad-soft)}
.contract{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px;font-size:14px}
.contract ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}

footer{padding-block:30px 90px;color:var(--muted);font-size:13px}

/* overlay & forms */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.62);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px 18px 16px;display:grid;gap:14px}
.sheet h2{font-size:22px}
.field{display:grid;gap:5px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13.5px;cursor:pointer}
.checks input{accent-color:var(--accent)}
.rowsx{display:grid;gap:6px}
.rowx{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px}
.rowx input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos .ph{position:relative}
.photos .ph img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.photos .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;line-height:1}
.sheet-acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.lb{position:fixed;inset:0;z-index:60;background:#0b0e0d;display:grid;grid-template-rows:auto minmax(0,1fr);color:#fff}
.lb-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.lb-bar .btn{background:#222a26;border-color:#3a443f;color:#fff}
.lb-view{overflow:auto;display:grid;place-items:center;padding:8px}
.lb-view img{max-width:100%;max-height:100%;object-fit:contain}
.lb-view.zoom{place-items:start}
.lb-view.zoom img{max-width:none;max-height:none;width:180%}

.dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:end}
.dock .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.savebar{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600}
.edit-banner{background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
.edit-banner .wrap{padding-block:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* firebase version additions */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.who b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.boot{padding-block:80px;text-align:center;color:var(--muted)}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;max-width:520px;margin:30px auto}
.err{color:var(--bad);font-size:13.5px;min-height:1em;margin:0}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.inv{width:100%;border-collapse:collapse;font-size:14px}
.inv th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
.inv td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.inv td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.inv tfoot td{font-weight:700;border-bottom:0}
.inv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.private{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 10px}
.ver{font-family:var(--f-mono);font-size:12px}
.updbar{position:fixed;left:0;right:0;top:0;z-index:80;background:var(--accent);color:var(--accent-ink);display:flex;gap:10px;justify-content:center;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;font-weight:600}
.updbar button{background:var(--accent-ink);color:var(--accent);border:0;border-radius:6px;padding:4px 10px;font-weight:700}
.thumb.loading{opacity:.6}

.lb-bar{gap:10px}
.lb-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-bar [data-lb="back"]{font-size:15px;padding:7px 12px}
.lb-view.pdf{display:block;place-items:initial;text-align:center;padding:8px 8px 40px;-webkit-overflow-scrolling:touch}
.lb-view.pdf .pdfpage{display:block;margin:0 auto;width:100%;max-width:1100px;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.lb-view.pdf.zoom .pdfpage{width:200%;max-width:none}

/* ---------- files: stored in Firestore in parts (free plan has no file storage) ---------- */
const fileCache=new Map();
const fcol=priv=>priv?"hk_pfiles":"hk_files";
async function getFile(id,priv){
  const k=(priv?"p:":"")+id; if(fileCache.has(k)) return fileCache.get(k);
  const p=(async()=>{
    const head=await db.collection(fcol(priv)).doc(id).get();
    if(!head.exists) throw new Error("missing");
    const h=head.data(); const parts=[];
    for(let i=0;i<h.n;i++){const s=await db.collection(fcol(priv)).doc(id).collection("parts").doc(String(i)).get(); parts.push(s.data().d);}
    const bin=atob(parts.join("")); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const blob=new Blob([u8],{type:h.mime}); return {blob,url:URL.createObjectURL(blob),mime:h.mime,name:h.name||""};
  })();
  fileCache.set(k,p); p.catch(()=>fileCache.delete(k)); return p;
}
function b64OfBlob(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function putFileB64(b64,mime,name,priv,onProg){
  const id=uid(); const n=Math.max(1,Math.ceil(b64.length/CHUNK)); const col=db.collection(fcol(priv)).doc(id);
  for(let i=0;i<n;i++){ await col.collection("parts").doc(String(i)).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)}); onProg&&onProg((i+1)/n); }
  await col.set({mime,name:name||"",n,size:Math.round(b64.length*3/4),by:me?me.name:"",byUid:me?me.uid:"",at:firebase.firestore.FieldValue.serverTimestamp()});
  return id;
}
async function putFile(blob,mime,name,priv,onProg){return putFileB64(await b64OfBlob(blob),mime,name,priv,onProg)}
async function delFile(id,priv){ if(!id) return; try{const h=await db.collection(fcol(priv)).doc(id).get(); const n=h.exists?h.data().n:0; for(let i=0;i<n;i++) await db.collection(fcol(priv)).doc(id).collection("parts").doc(String(i)).delete(); await db.collection(fcol(priv)).doc(id).delete();}catch(e){} }

const isPdf=f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name||"");
const isHeic=f=>/hei[cf]/i.test(f.type||"")||/\.hei[cf]$/i.test(f.name||"");
function imgErr(f){return isHeic(f)?"Bu HEIC fotoğraf bu cihazda açılamadı. iPhone'da Ayarlar › Kamera › Biçimler › “En Uyumlu” seçin ya da fotoğrafı kamerayla yeniden çekin.":"Dosya okunamadı: "+(f.name||"fotoğraf")}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("img"));im.src=src})}
async function scaleTo(file,max){const url=URL.createObjectURL(file);try{const im=await loadImg(url);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return c}finally{URL.revokeObjectURL(url)}}
async function photoParts(file){const big=await scaleTo(file,1600);const thumb=await scaleTo(file,260);
  return{b64:big.toDataURL("image/jpeg",0.62).split(",")[1],thumb:thumb.toDataURL("image/jpeg",0.6)}}

/* ---------- section spy ---------- */
let spyObs=null;
function spy(){if(spyObs)spyObs.disconnect();if(!("IntersectionObserver" in window))return;
  spyObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll(".index a").forEach(a=>a.classList.toggle("on",a.dataset.sec===e.target.id))})},{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("main section").forEach(s=>spyObs.observe(s))}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const nav=e.target.closest(".index a");
  if(nav){e.preventDefault();const t=document.getElementById(nav.dataset.sec);if(t)t.scrollIntoView({behavior:"smooth"});return}
  const planbox=e.target.closest("#planbox"),el=e.target.closest("[data-act]");
  if(placing&&planbox&&(!el||el.dataset.act!=="sel-st")){
    const r=planbox.querySelector("img").getBoundingClientRect();
    const x=+((e.clientX-r.left)/r.width*100).toFixed(2),y=+((e.clientY-r.top)/r.height*100).toFixed(2);
    if(placing.mode==="move"){const st=(META.stations||[]).map(s=>s.id===placing.id?{...s,x,y,onScan:false}:s);placing=null;saveMeta({stations:st},"Yeni konum kaydedildi")}
    else{placing=null;render();stationForm({id:uid(),type:"glue",no:"",area:"",x,y,onScan:false,note:""},true)}
    return}
  if(!el){if(selSt&&!e.target.closest(".pop")){selSt=null;render()}return}
  const a=el.dataset.act;
  if(a==="login")loginForm();
  else if(a==="logout"){await auth.signOut();toast("Çıkış yapıldı")}
  else if(a==="sel-st"){selSt=selSt===el.dataset.id?null:el.dataset.id;render();if(el.tagName==="TR")$("#planbox").scrollIntoView({behavior:"smooth",block:"center"})}
  else if(a==="toggle-type"){const t=el.dataset.type;hiddenTypes.has(t)?hiddenTypes.delete(t):hiddenTypes.add(t);render()}
  else if(a==="open-photo")openLightbox(el.dataset.vid,0);
  else if(a==="open-file")openFile(el.dataset.f,false);
  else if(a==="open-pfile")openFile(el.dataset.f,true);
  else if(a==="new-visit"&&isUser())visitForm(null);
  else if(a==="edit-visit")visitForm(VISITS.find(v=>v.id===el.dataset.id));
  else if(a==="new-doc"&&isUser())docForm(null);
  else if(a==="edit-doc"&&isAdm())docForm(DOCS.find(d=>d.id===el.dataset.id));
  else if(a==="new-inv"&&isUser())invForm(null);
  else if(a==="edit-inv")invForm(INVOICES.find(x=>x.id===el.dataset.id));
  else if(!isAdm())return;
  else if(a==="add-station"){placing={mode:"new"};selSt=null;render();toast("Plan üzerinde istasyonun yerine dokunun")}
  else if(a==="move-st"){placing={mode:"move",id:el.dataset.id};render();toast("Yeni konuma dokunun")}
  else if(a==="edit-st"){e.stopPropagation();stationForm((META.stations||[]).find(s=>s.id===el.dataset.id),false)}
  else if(a==="new-prod")prodForm(null);
  else if(a==="edit-prod")prodForm((META.products||[]).find(p=>p.id===el.dataset.id));
});

/* ---------- viewers: full screen inside the app, with "← Geri" and the phone's back gesture ---------- */
const viewers=[];
function closeTopViewer(){const v=viewers.pop();if(v){v.el.remove();v.onClose&&v.onClose()}}
window.addEventListener("popstate",()=>{if(viewers.length)closeTopViewer()});
function viewer(title,extra){
  const lb=document.createElement("div");lb.className="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-label",title);
  lb.innerHTML=`<div class="lb-bar"><button class="btn sm" data-lb="back">← Geri</button><div class="lb-title"></div><div style="display:flex;gap:6px">${extra||""}</div></div><div class="lb-view"></div>`;
  lb.querySelector(".lb-title").textContent=title;
  document.body.appendChild(lb);const v={el:lb};viewers.push(v);
  try{history.pushState({hkViewer:viewers.length},"")}catch(e){}
  lb.addEventListener("click",ev=>{const b=ev.target.closest("[data-lb]");if(!b)return;
    if(b.dataset.lb==="back"){if(history.state&&history.state.hkViewer)history.back();else closeTopViewer()}
    else if(b.dataset.lb==="zoom"){const z=lb.querySelector(".lb-view").classList.toggle("zoom");b.textContent=z?"Küçült":"Yakınlaştır"}});
  return v}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&viewers.length){if(history.state&&history.state.hkViewer)history.back();else closeTopViewer()}});
const setTitle=(v,t)=>{v.el.querySelector(".lb-title").textContent=t};
const viewBody=v=>v.el.querySelector(".lb-view");
function showImage(url,title,extra){const v=viewer(title,(extra||"")+`<button class="btn sm" data-lb="zoom">Yakınlaştır</button>`);
  viewBody(v).innerHTML=`<img alt="">`;const img=viewBody(v).querySelector("img");img.src=url;img.alt=title;return v}
let pdfjsP=null;
function loadPdfJs(){if(!pdfjsP)pdfjsP=loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";return window.pdfjsLib});pdfjsP.catch(()=>{pdfjsP=null});return pdfjsP}
async function showPdf(f,title){
  const v=viewer(title,`<button class="btn sm" data-lb="zoom">Yakınlaştır</button>`);const body=viewBody(v);body.classList.add("pdf");
  body.innerHTML=`<p class="lb-msg">Belge hazırlanıyor…</p>`;
  try{const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await f.blob.arrayBuffer())}).promise;
    body.innerHTML="";const W=Math.min(body.clientWidth||window.innerWidth,1100);
    for(let i=1;i<=doc.numPages;i++){if(!v.el.isConnected)return;
      const page=await doc.getPage(i);const vp0=page.getViewport({scale:1});const scale=(W-16)/vp0.width*Math.min(window.devicePixelRatio||1,2);const vp=page.getViewport({scale});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.className="pdfpage";c.setAttribute("aria-label",`Sayfa ${i}`);
      const lab=document.createElement("div");lab.className="pgno";lab.textContent=`Sayfa ${i} / ${doc.numPages}`;
      body.appendChild(c);body.appendChild(lab);await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}
  }catch(e){body.innerHTML=`<div class="lb-msg"><p>Belge burada gösterilemedi.</p><a class="btn primary" href="${f.url}" target="_blank" rel="noopener">Belgeyi ayrı açın</a></div>`}
}
async function openFile(id,priv){
  const v=viewer("Belge");viewBody(v).innerHTML=`<p class="lb-msg">Yükleniyor…</p>`;
  try{const f=await getFile(id,priv);if(!v.el.isConnected)return;
    viewers.splice(viewers.indexOf(v),1);v.el.remove();
    try{history.replaceState(null,"")}catch(e){}
    if(f.mime.startsWith("image/")){replaceViewer(()=>showImage(f.url,f.name||"Belge"))}
    else replaceViewer(()=>showPdf(f,f.name||"Belge"));
  }catch(err){viewBody(v).innerHTML=`<p class="lb-msg">Belge açılamadı. İnternet bağlantınızı kontrol edin.</p>`}
}
/* reuse the history entry the loading screen already pushed */
function replaceViewer(fn){const push=history.pushState;history.pushState=function(st){try{history.replaceState(st,"")}catch(e){}};try{fn()}finally{history.pushState=push}}
async function openLightbox(vid,i){
  const v=VISITS.find(x=>x.id===vid);if(!v)return;const ph=v.photos||[];
  const title=()=>`${fmt(v.date)} · Sıra no ${v.sira||"—"}${ph.length>1?` · ${i+1}/${ph.length}`:""}`;
  const vw=showImage(ph[i].t,title(),ph.length>1?`<button class="btn sm" data-lb="prev">‹</button><button class="btn sm" data-lb="next">›</button>`:"");
  const img=viewBody(vw).querySelector("img");
  const load=async()=>{setTitle(vw,title());img.src=ph[i].t;try{const f=await getFile(ph[i].f,false);img.src=f.url}catch(e){toast("Fotoğrafın büyük hali yüklenemedi")}};
  vw.el.addEventListener("click",ev=>{const b=ev.target.closest("[data-lb]");if(!b)return;if(b.dataset.lb==="prev"){i=(i-1+ph.length)%ph.length;load()}else if(b.dataset.lb==="next"){i=(i+1)%ph.length;load()}});

/* pending uploads: picked files become {kind:'img',b64,thumb} or {kind:'pdf',blob,name} until "Kaydet" */
async function pickFiles(fileList,list,statusEl,allowPdf){
  const files=[...fileList];let i=0;
  for(const file of files){i++;statusEl.textContent=`Hazırlanıyor… ${i}/${files.length}`;
    if(isPdf(file)){if(!allowPdf){toast("Burada yalnızca fotoğraf eklenebilir");continue}
      if(file.size>15*1024*1024){toast("PDF 15 MB'tan büyük; fotoğrafını çekip ekleyin");continue}
      list.push({kind:"pdf",blob:file,name:(file.name||"Belge").replace(/\.pdf$/i,"")})}
    else{try{const p=await photoParts(file);list.push({kind:"img",b64:p.b64,thumb:p.thumb,name:file.name||"Fotoğraf"})}catch(err){toast(imgErr(file))}}}
  statusEl.textContent=""}
async function uploadPending(list,priv,prog){
  const out=[];let k=0;
  for(const p of list){k++;
    const id=p.kind==="img"?await putFileB64(p.b64,"image/jpeg",p.name,priv,r=>prog((k-1+r)/list.length)):await putFile(p.blob,"application/pdf",p.name,priv,r=>prog((k-1+r)/list.length));
    out.push({...p,f:id})}
  return out}
const pendHtml=list=>list.map((p,i)=>p.kind==="img"?`<div class="ph"><img src="${p.thumb}" alt="Yeni fotoğraf ${i+1}"><button type="button" data-rmpend="${i}" aria-label="Kaldır">×</button></div>`:`<span class="chip">${esc(p.name)}.pdf <button type="button" class="linkbtn" data-rmpend="${i}">kaldır</button></span>`).join("");

    ${isAdm()?`<div class="grid2"><div class="field"><label for="df-status">Durum</label><select id="df-status" name="status">${Object.keys(STATUS).map(k=>`<option value="${k}" ${d.status===k?"selected":""}>${STATUS[k][0]}</option>`).join("")}</select></div>
      <div class="field"><label for="df-req">Talep tarihi</label><input id="df-req" type="date" name="requested" value="${d.requested||""}"></div></div>
    <div class="checks"><label><input type="checkbox" name="hidden" ${d.hidden?"checked":""}>Denetçi sayfasında gösterme</label></div>`:""}
    <div class="field"><label for="df-note">Not</label><input id="df-note" type="text" name="note" value="${esc(d.note)}"></div>
    <div class="bar" id="df-bar" hidden><i></i></div><p class="err" id="df-err"></p><div id="df-confirm"></div>
    <div class="sheet-acts"><div>${!isNew&&isAdm()?`<button type="button" class="btn danger" data-del>Belgeyi sil</button>`:""}</div><div style="display:flex;gap:8px"><button type="button" class="btn" data-cancel>Vazgeç</button><button type="submit" class="btn primary" id="df-save">Kaydet</button></div></div>`);
  const draw=()=>{$("#df-files").innerHTML=(d.file&&!pend.length?`<span class="chip">Mevcut dosya: ${esc(d.file.name||"belge")}</span>`:"")+pendHtml(pend)};draw();
  f.addEventListener("click",e=>{const t=e.target;
    if(t.closest("[data-rmpend]")){pend.splice(+t.closest("[data-rmpend]").dataset.rmpend,1);draw()}
    else if(t.closest("[data-cancel]")){if(!f.dataset.busy)ov.remove()}
    else if(t.closest("[data-del]"))delConfirm(f,"#df-confirm","Belge listeden silinsin mi?");
    else if(t.closest("[data-nodel]"))$("#df-confirm").innerHTML="";
    else if(t.closest("[data-yesdel]")){db.collection("hk_docs").doc(d.id).delete().then(()=>{ov.remove();toast("Belge silindi")},x=>toast(errMsg(x)))}});
  $("#df-up").addEventListener("change",async e=>{await pickFiles(e.target.files,pend,$("#df-status"),true);e.target.value="";draw()});
  f.addEventListener("submit",async()=>{const fd=new FormData(f);const title=fd.get("title").trim();if(!title){$("#df-err").textContent="Belge adı girin.";return}
    if(isNew&&!pend.length){$("#df-err").textContent="Belgenin fotoğrafını ya da PDF'ini ekleyin.";return}
    const btn=$("#df-save");btn.disabled=true;f.dataset.busy="1";$("#df-err").textContent="";
    try{
      const base={title,group:fd.get("group"),ref:fd.get("ref").trim(),date:fd.get("date")||"",valid:fd.get("valid")||"",note:fd.get("note").trim()};
      if(isAdm())Object.assign(base,{status:fd.get("status"),requested:fd.get("requested")||"",hidden:!!fd.get("hidden")});else if(isNew)Object.assign(base,{status:"dosyada",requested:"",hidden:false});
      let up=[];if(pend.length){const bar=$("#df-bar");bar.hidden=false;btn.textContent="Yükleniyor…";up=await uploadPending(pend,false,r=>bar.firstChild.style.width=Math.round(r*100)+"%")}
      const fileOf=p=>({f:p.f,name:p.name,mime:p.kind==="pdf"?"application/pdf":"image/jpeg"});
      if(isNew){for(let i=0;i<up.length;i++){const id=i?uid():d.id;await db.collection("hk_docs").doc(id).set({...base,title:up.length>1?`${title} (${i+1}/${up.length})`:title,file:fileOf(up[i]),order:Date.now(),...stamp()})}}
      else await db.collection("hk_docs").doc(d.id).update({...base,...(up.length?{file:fileOf(up[0])}:{}),...editStamp()});
      ov.remove();toast(isNew?"Belge eklendi":"Belge güncellendi")
    }catch(x){delete f.dataset.busy;btn.disabled=false;btn.textContent="Kaydet";$("#df-err").textContent=errMsg(x)}});
}
function invForm(x){
  const isNew=!x;
  x=x?JSON.parse(JSON.stringify(x)):{id:uid(),date:iso(today),no:"",period:iso(today).slice(0,7),amount:null,note:"",files:[]};
  const pend=[];
  const {f,ov}=sheet(`<h2>${isNew?"Yeni fatura":"Faturayı düzenle"}</h2>
    <div class="field"><span class="lab">Fatura</span><div class="photos" id="if-files"></div>
      <label class="btn primary" style="justify-self:start">Belge yükle<input type="file" accept="${ACC}" multiple id="if-up" hidden></label>

    <div class="grid2"><div class="field"><label for="if-date">Fatura tarihi</label><input id="if-date" type="date" name="date" value="${x.date||""}" required></div>
      <div class="field"><label for="if-no">Fatura no</label><input id="if-no" type="text" name="no" value="${esc(x.no)}" autocapitalize="characters"></div></div>
    <div class="grid2"><div class="field"><label for="if-per">Hizmet dönemi</label><input id="if-per" type="month" name="period" value="${x.period||""}"></div>
      <div class="field"><label for="if-amt">Tutar, KDV dahil (₺)</label><input id="if-amt" type="text" name="amount" inputmode="decimal" value="${x.amount!=null?String(x.amount).replace(".",","):""}" placeholder="ör. 2.400,00"></div></div>
    <div class="field"><label for="if-note">Not</label><input id="if-note" type="text" name="note" value="${esc(x.note)}"></div>
    <div class="bar" id="if-bar" hidden><i></i></div><p class="err" id="if-err"></p><div id="if-confirm"></div>
    <div class="sheet-acts"><div>${!isNew&&isAdm()?`<button type="button" class="btn danger" data-del>Faturayı sil</button>`:""}</div><div style="display:flex;gap:8px"><button type="button" class="btn" data-cancel>Vazgeç</button><button type="submit" class="btn primary" id="if-save">Kaydet</button></div></div>`);
  const draw=()=>{$("#if-files").innerHTML=x.files.map((p,i)=>`<span class="chip">${p.mime==="application/pdf"?"PDF":"Fotoğraf"} ${i+1} <button type="button" class="linkbtn" data-rmf="${i}">kaldır</button></span>`).join("")+pendHtml(pend)||`<span class="muted" style="font-size:13.5px">Henüz dosya yok</span>`};draw();
  f.addEventListener("click",e=>{const t=e.target;
    if(t.closest("[data-rmpend]")){pend.splice(+t.closest("[data-rmpend]").dataset.rmpend,1);draw()}
    else if(t.closest("[data-rmf]")){x.files.splice(+t.closest("[data-rmf]").dataset.rmf,1);draw()}
    else if(t.closest("[data-cancel]")){if(!f.dataset.busy)ov.remove()}
    else if(t.closest("[data-del]"))delConfirm(f,"#if-confirm","Fatura silinsin mi?");
    else if(t.closest("[data-nodel]"))$("#if-confirm").innerHTML="";
    else if(t.closest("[data-yesdel]")){db.collection("hk_invoices").doc(x.id).delete().then(()=>{ov.remove();toast("Fatura silindi")},er=>toast(errMsg(er)))}});
  $("#if-up").addEventListener("change",async e=>{await pickFiles(e.target.files,pend,$("#if-status"),true);e.target.value="";draw()});
  f.addEventListener("submit",async()=>{const fd=new FormData(f);
    if(!fd.get("date")){$("#if-err").textContent="Fatura tarihini girin.";return}
    const raw=String(fd.get("amount")||"").trim();let amount=null;
    if(raw){amount=parseFloat(raw.replace(/\s|₺/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));if(!isFinite(amount)){$("#if-err").textContent="Tutar anlaşılamadı. Örnek: 2.400,00";return}}
    if(isNew&&!pend.length){$("#if-err").textContent="Faturanın fotoğrafını ya da PDF'ini ekleyin.";return}
    const btn=$("#if-save");btn.disabled=true;f.dataset.busy="1";$("#if-err").textContent="";
    try{
      if(pend.length){const bar=$("#if-bar");bar.hidden=false;btn.textContent="Yükleniyor…";const up=await uploadPending(pend,true,r=>bar.firstChild.style.width=Math.round(r*100)+"%");up.forEach(p=>x.files.push({f:p.f,mime:p.kind==="pdf"?"application/pdf":"image/jpeg"}));pend.length=0}
      const data={date:fd.get("date"),no:fd.get("no").trim(),period:fd.get("period")||"",amount,note:fd.get("note").trim(),files:x.files};
      if(isNew)await db.collection("hk_invoices").doc(x.id).set({...data,...stamp()});else await db.collection("hk_invoices").doc(x.id).update({...data,...editStamp()});
      ov.remove();toast(isNew?"Fatura kaydedildi":"Fatura güncellendi")
    }catch(er){delete f.dataset.busy;btn.disabled=false;btn.textContent="Kaydet";$("#if-err").textContent=errMsg(er)}});
}
function saveMeta(patch,msg){return db.collection("hk_meta").doc("main").update({...patch,...editStamp()}).then(()=>{if(msg)toast(msg)},x=>toast(errMsg(x)))}

    <div class="field"><label for="sf-type">Tür</label><select id="sf-type" name="type">${Object.keys(TYPES).map(t=>`<option value="${t}" ${s.type===t?"selected":""}>${TYPES[t].ad}</option>`).join("")}</select></div>

    <div class="field"><label for="sf-area">Bölüm</label><input id="sf-area" type="text" name="area" value="${esc(s.area)}" list="dl-area" placeholder="ör. Mutfak"></div></div>

    const list=(META.stations||[]).slice();const i=list.findIndex(x=>x.id===s.id);if(i>=0)list[i]=s;else list.push(s);selSt=s.id;ov.remove();saveMeta({stations:list},"İstasyon kaydedildi")});

/* ---------- login (same names and passwords as Kanaat Ödemeler) ---------- */
function loginForm(){
  const {f,ov}=sheet(`<h2>Personel girişi</h2><p class="muted" style="margin:0">Kanaat Ödemeler'de kullandığınız ad soyad ve şifreyle girin.</p>
    <div class="field"><label for="ln">Ad soyad</label><input id="ln" type="text" autocomplete="username" required></div>
    <div class="field"><label for="lp">Şifre</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <p class="err" id="le"></p>
    <div class="sheet-acts"><span></span><div style="display:flex;gap:8px"><button type="button" class="btn" data-cancel>Vazgeç</button><button type="submit" class="btn primary" id="lb">Giriş yap</button></div></div>`);
  f.querySelector("#ln").focus();
  f.addEventListener("click",e=>{if(e.target.closest("[data-cancel]"))ov.remove()});
  f.addEventListener("submit",async()=>{const b=$("#lb");b.disabled=true;b.textContent="Giriş yapılıyor…";$("#le").textContent="";
    try{await auth.signInWithEmailAndPassword(emailOf($("#ln").value),$("#lp").value.trim());ov.remove()}
    catch(x){b.disabled=false;b.textContent="Giriş yap";const c=x&&x.code||"";$("#le").textContent=/invalid|wrong-password|user-not-found/.test(c)?"Ad soyad veya şifre hatalı.":/too-many/.test(c)?"Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar deneyin.":/network/.test(c)?"İnternet bağlantısı yok.":"Giriş yapılamadı ("+c+")."}});
}
async function onAuth(u){
  if(!u){me=null;subInv();render();return}
  try{const s=await db.collection("users").doc(u.uid).get();
    if(!s.exists){await auth.signOut();toast("Bu hesabın erişimi yok. Yöneticiyle görüşün.");return}
    const d=s.data();me={uid:u.uid,name:d.name,role:d.role};
  }catch(e){me=null;toast("Giriş doğrulanamadı ("+(e.code||e)+")");render();return}
  subInv();
  render();
}

/* ---------- first-time setup (admin, once) ---------- */
/* invoices are public; re-subscribe on sign-in/out so a rule that only lets signed-in people read still works for them */
function subInv(){if(unsubInv){try{unsubInv()}catch(e){}}
  unsubInv=db.collection("hk_invoices").onSnapshot(s=>{INVOICES=s.docs.map(x=>({id:x.id,...x.data()}));invOk=true;if(!setupOpen)render()},e=>{invOk=false;INVOICES=[];if(!setupOpen)render()})}
function setupHtml(){return`<p style="margin:0">İlk kurulum: Claude'un hazırladığı mevcut kayıtlar (8 ziyaret, yerleşim planı, ürünler, 14 belge) bu sisteme aktarılacak.</p>
  <div class="field"><label for="sc">Kurulum kodu</label><input id="sc" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX"></div>
  <div class="bar" id="sbar" hidden><i></i></div><p class="err" id="se"></p><button class="btn primary" id="sb" style="justify-self:start">Kurulumu başlat</button>`}
function bindSetup(){const b=$("#sb");if(!b)return;b.onclick=runSetup}
async function runSetup(){
  const code=String($("#sc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");const er=$("#se"),b=$("#sb"),bar=$("#sbar");er.textContent="";
  if(!code){er.textContent="Kurulum kodunu girin.";return}
  b.disabled=true;b.textContent="Paket indiriliyor…";setupOpen=true;
  try{
    const r=await fetch("kurulum.bin?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Paket indirilemedi");
    const ct=new Uint8Array(await r.arrayBuffer());const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(SEED_SALT),iterations:SEED_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    let seed;try{seed=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(SEED_IV)},key,ct)))}catch(x){throw new Error("Kurulum kodu hatalı")}
    bar.hidden=false;const keys=Object.keys(seed.files);const ids={};let k=0;
    for(const key2 of keys){k++;b.textContent=`Dosyalar yükleniyor… ${k}/${keys.length}`;const fl=seed.files[key2];
      ids[key2]=await putFileB64(fl.b64,fl.mime,fl.name,false,p=>bar.firstChild.style.width=Math.round((k-1+p)/keys.length*100)+"%")}
    b.textContent="Kayıtlar yazılıyor…";
    const ts=firebase.firestore.FieldValue.serverTimestamp();const by={addedBy:me.name,addedByUid:me.uid,addedAt:ts};
    for(const v of seed.visits){const{id,photoKeys,thumbs,...rest}=v;await db.collection("hk_visits").doc(id).set({...rest,photos:photoKeys.map((pk,i)=>({f:ids[pk],t:thumbs[i]})),pdfs:[],...by})}
    for(const d of seed.docs){const{id,fileKey,...rest}=d;await db.collection("hk_docs").doc(id).set({...rest,file:fileKey?{f:ids[fileKey],name:seed.files[fileKey].name,mime:seed.files[fileKey].mime}:null,...by})}
    const{krokiKey,...m}=seed.meta;await db.collection("hk_meta").doc("main").set({...m,kroki:ids[krokiKey],...by});
    setupOpen=false;render();toast("Kurulum tamamlandı");
  }catch(x){setupOpen=false;const msg=x&&x.code?errMsg(x):(x.message||String(x));render();const e2=$("#se");if(e2)e2.textContent=msg;else toast(msg)}
}

/* ---------- toast & update ---------- */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const MY_VER=5;
async function checkUpdate(){if(!/^https?:/.test(location.protocol))return;
  try{const r=await fetch(location.pathname+"?ver="+Date.now(),{cache:"no-store"});if(!r.ok)return;const m=(await r.text()).match(/const MY_VER=(\d+);/);const v=m?parseInt(m[1]):0;
    if(v>MY_VER&&!$(".updbar")){const d=document.createElement("div");d.className="updbar";d.innerHTML=`<span>Yeni sürüm hazır.</span><button type="button">Yenile</button>`;d.querySelector("button").onclick=()=>location.replace(location.pathname+"?v="+v);document.body.appendChild(d)}}catch(e){}}
setInterval(checkUpdate,180000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});setTimeout(checkUpdate,4000);

/* ---------- boot ---------- */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.appendChild(s)})}
async function boot(){
  render();
  try{for(const m of["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`)}
  catch(e){$("#app").innerHTML=`<div class="wrap"><div class="notice"><h2>Haşere Kontrol Dosyası</h2><p class="err">Bağlantı kurulamadı. İnternetinizi kontrol edip sayfayı yenileyin.</p></div></div>`;return}
  firebase.initializeApp(FB_CFG);auth=firebase.auth();db=firebase.firestore();
  try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  const fail=e=>{$("#app").innerHTML=`<div class="wrap"><div class="notice"><h2>Haşere Kontrol Dosyası</h2><p class="err">${e&&e.code==="permission-denied"?"Kayıtlar okunamadı: Firebase kuralları henüz eklenmemiş.":"Kayıtlar okunamadı. Sayfayı yenileyin."}</p></div></div>`};
  db.collection("hk_meta").doc("main").onSnapshot(s=>{META=s.exists?s.data():null;metaLoaded=true;
    if(META&&META.kroki&&!krokiUrl)getFile(META.kroki,false).then(f=>{krokiUrl=f.url;render()},()=>{});
    if(!setupOpen)render()},fail);
  db.collection("hk_visits").onSnapshot(s=>{VISITS=s.docs.map(x=>({id:x.id,...x.data()}));if(!setupOpen)render()},()=>{});
  db.collection("hk_docs").onSnapshot(s=>{DOCS=s.docs.map(x=>({id:x.id,...x.data()}));if(!setupOpen)render()},()=>{});
  subInv();
  auth.onAuthStateChanged(u=>{if(!setupOpen)onAuth(u)});
  if(location.hash){setTimeout(()=>{const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()},800)}
}
boot();
})();
