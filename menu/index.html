TE.sheep": ["از شیر گوسفند", "Van schapenmelk"], "NOTE.sep": ["سرشیر جداگانه حساب می‌شود", "Room wordt apart berekend"], "NOTE.breakfast": ["فقط در ساعات صبحانه", "Alleen tijdens het ontbijt"], "MEAT.b": ["گوشت گوساله", "Rund"], "MEAT.l": ["گوشت بره", "Lam"], "MEAT.c": ["مرغ", "Kip"], "MEAT.t": ["بوقلمون", "Kalkoen"], "MEAT.f": ["ماهی", "Vis"], "ALG.G": ["گلوتن", "Gluten"], "ALG.M": ["شیر", "Melk"], "ALG.E": ["تخم‌مرغ", "Ei"], "ALG.N": ["مغزها", "Noten"], "ALG.C": ["کرفس", "Selderij"], "ALG.F": ["ماهی", "Vis"], "DIET.V": ["وگان", "Veganistisch"], "DIET.v": ["گیاهی", "Vegetarisch"], "DIET.GF": ["بدون گلوتن", "Glutenvrij"], "DIET.NF": ["بدون مغزها", "Notenvrij"], "DIET.SF": ["بدون شکر", "Suikervrij"], "DIET.DF": ["بدون لبنیات", "Zuivelvrij"], "CHEF_UI.title": ["پیشنهاد سرآشپز", "Aanbeveling van de chef"], "CHEF_UI.today": ["امروز {d} است", "Vandaag is het {d}"], "CHEF_UI.show": ["نمایش در منو", "Toon in het menu"], "CHEF_UI.close": ["بستن", "Sluiten"], "CART_UI.add": ["افزودن", "Toevoegen"], "CART_UI.my": ["صورت‌حساب من", "Mijn rekening"], "CART_UI.total": ["جمع کل", "Totaal"], "CART_UI.note": ["این فهرست فقط برای راحتی شماست. ممکن است برخی غذاها تمام شده باشند؛ گارسون تأیید می‌کند. صورت‌حساب رسمی را گارسون می‌آورد.", "Deze lijst is alleen een hulpmiddel. Sommige gerechten kunnen op zijn; de ober bevestigt dit. De officiële rekening komt van de ober."], "CART_UI.show": ["نشان دادن به گارسون", "Aan de ober laten zien"], "CART_UI.scan": ["از گارسون بخواهید این کد را با گوشی خود اسکن کند.", "Vraag de ober deze code met zijn telefoon te scannen."], "CART_UI.clear": ["پاک کردن فهرست", "Lijst wissen"], "CART_UI.back": ["بازگشت", "Terug"], "CART_UI.az": ["نیم‌پرس", "Halve portie"], "CART_UI.tek": ["۱ عدد", "1 stuk"], "CART_UI.p3": ["۱ پرس = ۳ عدد", "1 portie = 3 stuks"], "CART_UI.long": ["فهرست برای کد QR خیلی طولانی است. لطفاً این صفحه را به گارسون نشان دهید.", "De lijst is te lang voor een QR-code. Laat dit scherm aan de ober zien."], "OK_UI.title": ["صورت‌حساب تأییدشدهٔ ش ingen hebben voldaan. Uw feedback is rechtstreeks naar de eigenaar gegaan en we gaan ermee aan de slag."], "FB_UI.google": ["بسیار خوشحال می‌شویم اگر تجربهٔ خود را در گوگل هم به اشتراک بگذارید.", "We zouden het fijn vinden als u uw ervaring ook op Google deelt."], "FB_UI.gbtn": ["نوشتن نظر در گوگل", "Schrijf een Google-review"], "FB_UI.err": ["ارسال نشد. لطفاً دوباره تلاش کنید.", "Versturen mislukt. Probeer het opnieuw."], "AVAIL_UI.menu": ["این منوی کامل ماست. ممکن است برخی غذاها امروز موجود نباشند؛ لطفاً از گارسون بپرسید.", "Dit is ons volledige menu. Sommige gerechten zijn vandaag mogelijk niet beschikbaar; vraag het de ober."], "AVAIL_UI.chef": ["ممکن است تمام شده باشد؛ لطفاً از گارسون بپرسید.", "Het kan uitverkocht zijn; vraag het de ober."], "CHAT.title": ["از سرآشپز بپرسید", "Vraag het de chef"], "CHAT.sub": ["یک سؤال انتخاب کنید", "Kies een vraag"], "CHAT.hello": ["خوش آمدید! چطور می‌توانم کمکتان کنم؟", "Welkom! Hoe kan ik u helpen?"], "CHAT.story": ["داستان کامل ما را بخوانید", "Lees ons hele verhaal"], "CHAT.insta": ["اگر از حضورتان لذت می‌برید، ما را در اینستاگرام دنبال کنید. خوشحال می‌شویم آنجا هم شما را ببینیم! 😊", "Bevalt uw bezoek? Volg ons dan op Instagram. We zien u daar graag ook! 😊"], "CHAT.follow": ["دنبال کردن در اینستاگرام", "Volgen op Instagram"], "CHAT.calc": ["محاسبهٔ صورت‌حساب من", "Mijn rekening berekenen"], "CHAT.maps": ["باز کردن در نقشه", "Openen in Kaarten"], "Q.first.q": ["اولین بار است که اینجا می‌آیم. چه چیزی را امتحان کنم؟", "Ik ben hier voor het eerst. Wat moet ik proberen?"], "Q.first.a": ["برای اولین بارتان، پلو ازبکی با گوشت بره را به‌عنوان غذای اصلی، کنگر فرنگی در روغن زیتون را کنارش و در پایان دسر به با سرشیر را پیشنهاد می‌کنم. برای دیدن هر غذا روی آن بزنید:", "Voor uw eerste bezoek raad ik Oezbeekse pilav met lamsvlees aan als hoofdgerecht, artisjok in olijfolie als bijgerecht en als afsluiter het kweepeerdessert met room. Tik op een gerecht om het te zien:"], "Q.story.q": ["داستان اینجا چیست؟", "Wat is het verhaal van deze plek?"], "Q.story.a": ["لوکانتای ما در سال ۱۹۳۳ در اسکودار توسط خانوادهٔ کارگیلی تأسیس شد؛ خانواده‌ای که سنت دسرهای شیری و بستنی‌اش به حدود ۱۵۰ سال پیش برمی‌گردد. ما هنوز یک کسب‌وکار خانوادگی هستیم: در هر مرحله، از تولید و خرید تا آشپزخانه و سرویس، یکی از اعضای خانواده کار می‌کند و برخی از آشپزهای ما بیش از ۴۰ سال سابقه دارند.\n\nهر روز ۱۰۰ تا ۱۲۰ نوع دسر، غذای روغن زیتونی، خوراک گرم، بستنی و ماست را تازه آماده می‌کنیم. قانون ما ساده است: فقط بهترین مواد اولیه. اگر کیفیت مناسب را پیدا نکنیم، آن غذا را نمی‌پزیم. به لطف بسته‌بندی‌ای که از دههٔ ۱۹۷۰ روی آن کار می‌کنیم، غذای ما به خانه‌ها و دفترها هم می‌رسد.\n\nدر سال ۲۰۰۰، نظرسنجی «۱۰۰ بهترین در غذا» مجلهٔ ویزیون ما را بهترین لوکانتای سنتی با بهترین بستنی، ماست، اکمک کادایفی و سوپ پاچه معرفی کرد. در نیویورک تایمز، لوموند و ال از ما نوشته‌اند و راهنماهای لونلی پلنت، راف گاید، لو گید دو روتار و لویی ویتون ما را توصیه می‌کنند. در سال‌های ۲۰۲۵ و ۲۰۲۶ جایزهٔ آشپزی سنتی را از راهنمای گو-میو ترکیه دریافت کردیم.", "Onze lokanta werd in 1933 in Üsküdar opgericht door de familie Kargılı, wier traditie in melkdesserts en ijs zo'n 150 jaar teruggaat. We zijn nog steeds een familiebedrijf: in elke fase, van productie en inkoop tot keuken en bediening, werkt een familielid, en sommige van onze koks hebben meer dan 40 jaar ervaring.\n\nElke dag bereiden we vers 100 tot 120 soorten desserts, gerechten in olijfolie, warme gerechten, ijs en yoghurt. Onze regel is simpel: alleen de beste ingrediënten. Vinden we niet de juiste kwaliteit, dan maken we dat gerecht niet. Dankzij de verpakking die we sinds de jaren zeventig ontwikkelen, bereikt ons eten ook huizen en kantoren.\n\nIn 2000 riep de enquête ‘Beste 100 in eten’ van het tijdschrift Vizyon ons uit tot beste traditionele lokanta, met het beste ijs, de beste yoghurt, ekmek kadayıfı en pootjessoep. We stonden in de New York Times, Le Monde en Elle, en worden aanbevolen door Lonely Planet, Rough Guide, Le Guide du Routard en de Louis Vuitton-gids. In 2025 en 2026 ontvingen we de prijs voor Traditionele Keuken in de Gault&Millau-gids Turkije."], "Q.today.q": ["امروز چه پیشنهادی دارید؟", "Wat raadt u vandaag aan?"], "Q.today.a": ["امروز این را پیشنهاد می‌کنم. مطمئنم خیلی دوستش خواهید داشت:", "Vandaag raad ik dit aan. U gaat het vast heerlijk vinden:"], "Q.veg.q": ["گیاه‌خواران چه می‌توانند بخورند؟", "Wat kunnen vegetariërs eten?"], "Q.veg.a": ["بیشتر غذاهای روغن زیتونی ما وگان هستند، سالادها و کمپوت‌ها هم همین‌طور. با دکمهٔ زیر فقط غذاهای گیاهی را می‌بینید. توجه: بیشتر خوراک‌های گرم سبزیجات ما با گوشت پخته می‌شوند.", "De meeste van onze gerechten in olijfolie zijn veganistisch, net als de salades en compotes. Met de knop hieronder ziet u alleen de vegetarische gerechten. Let op: de meeste warme groentegerechten worden met vlees bereid."], "Q.olive.q": ["«غذاهای روغن زیتونی» چیست؟", "Wat zijn ‘gerechten in olijfolie’?"], "Q.olive.a": ["سبزیجاتی که آرام در روغن زیتون پخته و سرد سرو می‌شوند؛ از غذاهای کلاسیک آشپزی استانبول. بیشترشان وگان هستند. با دلمهٔ برگ مو یا امام بایلدی شروع کنید:", "Groenten die langzaam in olijfolie zijn gegaard en koud worden geserveerd, een klassieker uit de Istanbulse keuken. De meeste zijn veganistisch. Begin met gevulde wijnbladeren of İmambayıldı:"], "Q.dessert.q": ["کدام دسر را پیشنهاد می‌کنید؟", "Welk dessert raadt u aan?"], "Q.dessert.a": ["دسر به با سرشیر از محبوب‌ترین‌هاست. برای چیزی سبک، شیربرنج؛ برای چیزی شربتی، اکمک کادایفی. اگر کنجکاوید، کازان‌دیبی را امتحان کنید: با سینهٔ مرغ درست می‌شود، اما طعمش شیرین است!", "Ons kweepeerdessert met room is een favoriet. Voor iets lichts: rijstpudding; voor iets met siroop: ekmek kadayıfı. Bent u nieuwsgierig? Probeer kazandibi: het wordt gemaakt met kipfilet, en toch smaakt het zoet!"], "Q.allergy.q": ["حساسیت دارم. چه کار کنم؟", "Ik heb een allergie. Wat moet ik doen?"], "Q.allergy.a": ["لطفاً پیش از سفارش به گارسون بگویید؛ او به آشپزخانه اطلاع می‌دهد. برچسب‌های نارنجی زیر هر غذا آلرژن‌ها را نشان می‌دهند: گلوتن، شیر، تخم‌مرغ، مغزها، کرفس و ماهی. برچسب‌ها راهنما هستند، پس برای اطمینان با گارسون هماهنگ کنید.", "Meld het aan de ober voordat u bestelt; hij geeft het door aan de keuken. De oranje labels onder elk gerecht tonen de allergenen: gluten, melk, ei, noten, selderij en vis. De labels zijn een richtlijn, dus controleer het voor de zekerheid bij de ober."], "Q.togo.q": ["می‌توانم غذاهایتان را بیرون ببرم؟", "Kan ik uw gerechten meenemen?"], "Q.togo.a": ["البته! همهٔ غذاها و دسرهای ما بیرون‌بر هم هستند. همچنین می‌توانید دسرها را کیلویی، ماست شیر گوسفند در کوزهٔ سفالی و مرباهای خانگی ما را بخرید. با بسته‌بندی مناسب، بستنی ما ساعت‌ها بدون آب شدن سفر می‌کند. یک سوغاتی شیرین از اسکودار.", "Natuurlijk! Al onze gerechten en desserts zijn ook om mee te nemen. U kunt ook desserts per kilo kopen, schapenmelkyoghurt in een aardewerken pot en onze huisgemaakte jam. Met de juiste verpakking kan ons ijs uren reizen zonder te smelten. Een zoet souvenir uit Üsküdar."], "Q.cater.q": ["آیا برای خانه، دفتر، مراسم، عروسی و مولودی تحویل غذا و کیترینگ دارید؟", "Verzorgen jullie bezorging en catering voor thuis, kantoren, evenementen, bruiloften en mevlids?"], "Q.cater.a": ["بله! به خانه‌ها و دفترها غذا می‌رسانیم و برای مراسم، عروسی و مولودی (مجالس مذهبی) کیترینگ داریم.", "Ja zeker! We bezorgen eten bij huizen en kantoren, en verzorgen catering voor evenementen, bruiloften en mevlids (religieuze bijeenkomsten)."], "Q.calc.q": ["چطور صورت‌حسابم را حساب کنم؟", "Hoe kan ik mijn rekening uitrekenen?"], "Q.calc.a": ["آسان است! «🧾 {calc}» را در بالا باز کنید و غذاهایی را که خورده‌اید با «+» اضافه کنید؛ برای برخی غذاها می‌توانید نیم‌پرس یا یک عدد هم انتخاب کنید. نوار «{my}» در پایین جمع کل را نشان می‌دهد. وقتی تمام شد، «{show}» را بزنید: گارسون کد را اسکن، بررسی و تأیید می‌کند. سپس می‌توانید صورت‌حساب تأییدشده را به زبان خودتان در گوشی ذخیره کنید.", "Heel eenvoudig! Open bovenaan ‘🧾 {calc}’ en voeg met ‘+’ de gerechten toe die u heeft gegeten; bij sommige gerechten kunt u ook een halve portie of één stuk kiezen. De balk ‘{my}’ onderaan toont uw totaal. Klaar? Tik dan op ‘{show}’: de ober scant de code, controleert en bevestigt. Daarna kunt u de bevestigde rekening in uw eigen taal op uw telefoon opslaan."], "Q.fb.q": ["می‌خواهم نظرم را بگویم", "Ik wil graag mijn mening geven"], "Q.fb.a": ["با کمال میل! لطفاً امتیاز بدهید و اگر خواستید چند کلمه بنویسید:", "Graag! Geef ons een beoordeling en schrijf, als u wilt, een paar woorden:"], "Q.hours.q": ["ساعت کاری شما چیست؟", "Wat zijn uw openingstijden?"], "CHEF_REC": ["پیشنهاد سرآشپز برای این {d}", "Deze {d} raadt de chef aan"]};
(()=>{const D={UI,CAT,CNOTE,NOTE,MEAT,ALG,DIET,CHEF_UI,CART_UI,OK_UI,TIP_UI,DRINK_UI,SPLIT_UI,FB_UI,AVAIL_UI};
 for(let i=0;i<2;i++)for(const [path,vals] of Object.entries(EXT6)){const [a,b,c]=path.split(".");
  if(a==="CHEF_REC")CHEF_REC.push(vals[i]);

  else if(a==="Q"){const q=CHAT.q.find(x=>x.id===b);if(q)q[c].push(vals[i])}
  else D[a][b].push(vals[i])}})();
