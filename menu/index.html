<style>
:root{
  --bg:#F7F2E8; --card:#FFFDF8; --ink:#2A2620; --muted:#6F675B; --line:#E6DDCC;
  --green:#1D5A46; --green-soft:#E3EEE8; --amber:#8A4B0F; --amber-soft:#FBEBD6;
  --chip:#EFE7D8; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171512;--card:#211E1A;--ink:#F1EBDF;--muted:#ADA493;--line:#36312A;
  --green:#7FC2A4;--green-soft:#1F3229;--amber:#F2B66E;--amber-soft:#3A2A17;--chip:#2C2823;--shadow:none}
}
*{box-sizing:border-box}
html{scroll-padding-top:175px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans",system-ui,sans-serif}
html[lang=zh] body,html[lang=zh] .name,html[lang=zh] section.cat h2{font-family:"Noto Sans SC","Noto Sans",system-ui,sans-serif}
html[lang=ja] body,html[lang=ja] .name,html[lang=ja] section.cat h2{font-family:"Noto Sans JP","Noto Sans",system-ui,sans-serif}
html[lang=ko] body,html[lang=ko] .name,html[lang=ko] section.cat h2{font-family:"Noto Sans KR","Noto Sans",system-ui,sans-serif}
html[dir=rtl] body{font-family:"Noto Sans Arabic","Noto Sans",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--green);color:#fff;padding:14px 0 16px}
@media (prefers-color-scheme:dark){header.top{background:#12392C}}
.top .wrap{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 21px/1.15 "Noto Serif",Georgia,serif;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}
.langbtn{flex:none;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font:600 14px/1 inherit;padding:9px 12px;border-radius:999px;cursor:pointer}
.langbtn svg{width:16px;height:16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:11px 0;outline:none;min-width:0}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.filters::-webkit-scrollbar{display:none}.fbtn{flex:none;white-space:nowrap}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px/1 inherit;padding:8px 11px;border-radius:999px;cursor:pointer}
.fbtn[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.fbtn[aria-pressed=true]{color:#10241B}}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);font-size:13.5px;padding:7px 12px;border-radius:999px;white-space:nowrap}
.cats a.on{background:var(--ink);color:var(--bg)}
section.cat{padding-top:18px}
section.cat h2{margin:0 0 2px;font:700 20px/1.2 "Noto Serif",Georgia,serif;color:var(--green)}
html[dir=rtl] section.cat h2{font-family:"Noto Sans Arabic",serif}
.cnote{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.items{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.ph{flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--chip);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.row{display:flex;align-items:baseline;gap:10px}
.name{flex:1;margin:0;font:700 16px/1.25 "Noto Serif",Georgia,serif}
.price{flex:none;font-weight:600;font-size:15.5px;white-space:nowrap}
.desc{margin:3px 0 0;font-size:14px}
.name.tl{font:600 16px/1.3 inherit}
.trname{margin:2px 0 0;color:var(--muted);font:600 13.5px/1.3 "Noto Serif",Georgia,serif;font-style:italic}
html[dir=rtl] .trname{text-align:right}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.t{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1;padding:5px 7px;border-radius:6px;background:var(--chip);color:var(--ink)}
.t.a{background:var(--amber-soft);color:var(--amber);font-weight:600}
.t.d{background:var(--green-soft);color:var(--green);font-weight:600}
.kcal{font-size:12px;color:var(--muted);margin-inline-start:2px;align-self:center}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{margin:28px 0 0;padding:20px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
footer h3{margin:0 0 8px;color:var(--ink);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.alert{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:14px}
footer p{margin:4px 0}
footer a{color:var(--green)}
.ver{margin-top:14px!important;font-size:12px;opacity:.7}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(20,15,10,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
.sheet h3{margin:10px 20px 6px;font-size:15px;color:var(--muted);font-weight:600}
.sheet button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:14px 20px;cursor:pointer;text-align:start}
.sheet button[aria-current=true]{color:var(--green);font-weight:600}
.sheet button span.en{color:var(--muted);font-size:13px}
.photo{align-items:center;padding:16px}
.photo figure{margin:0;max-width:560px;width:100%;background:var(--card);border-radius:16px;overflow:hidden}
.photo img{width:100%;max-height:70vh;object-fit:cover;display:block}
.photo figcaption{padding:12px 16px 16px}
.photo figcaption b{font:700 17px "Noto Serif",Georgia,serif;display:block}
.hide{display:none!important}

.chef{position:fixed;inset:0;z-index:30;background:rgba(20,15,10,.55);display:none;align-items:center;justify-content:center;padding:16px}
.chef.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.ccard{position:relative;background:var(--card);width:100%;max-width:380px;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .3s ease}
.chead{display:flex;align-items:center;gap:12px;padding:16px 16px 10px;background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.chead{background:#12392C}}
.chead img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:none;background:#fff}
.chead small{display:block;font-size:12.5px;opacity:.85}
.chead b{display:block;font:700 19px/1.2 "Noto Serif",Georgia,serif}
html[lang=ar] .chead b,html[lang=zh] .chead b,html[lang=ja] .chead b,html[lang=ko] .chead b{font-family:inherit}
.cx{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.cdish{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.cbody{padding:14px 16px 16px}
.cbody .row{margin-bottom:2px}
.cbtn{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--green);color:#fff;font:600 16px/1 inherit;padding:14px;cursor:pointer}
@media (prefers-color-scheme:dark){.cbtn{color:#10241B}}
.cfab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:15;width:58px;height:58px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden;cursor:pointer;background:#fff}
.cfab img{width:100%;height:100%;object-fit:cover;display:block}
.item.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:var(--shadow)}}

.chat{position:fixed;inset:0;z-index:30;background:rgba(20,15,10,.55);display:none;align-items:flex-end;justify-content:center}
.chat.open{display:flex;animation:fade .2s ease}
.cwin{background:var(--bg);width:100%;max-width:520px;height:min(86vh,720px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease}
@media (min-width:600px){.chat{align-items:center}.cwin{border-radius:20px}}
.cwin .chead{position:relative;flex:none}
.cwin .chead img{width:48px;height:48px;border-width:2px}
.chatlog{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.msg p{margin:0}
.msg p+p{margin-top:8px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-start-start-radius:4px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-end-end-radius:4px}
@media (prefers-color-scheme:dark){.msg.me{color:#10241B}}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dcard{display:flex;gap:10px;align-items:center;width:100%;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:start;font:inherit;cursor:pointer}
.dcard img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.dcard span{display:flex;flex-direction:column;gap:2px;min-width:0}
.dcard b{font:700 15px "Noto Serif",Georgia,serif}
.dcard small{color:var(--muted);font-size:13px}
.dcard em{font-style:normal;font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dchips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px 4px 4px;font:600 13px inherit;cursor:pointer}
html[dir=rtl] .dchips button{padding:4px 4px 4px 10px}
.dchips img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.cact{display:inline-block;margin-top:10px;border:0;border-radius:10px;background:var(--green-soft);color:var(--green);font:600 14px inherit;padding:9px 12px;text-decoration:none;cursor:pointer}
.chatq{flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-height:32%;overflow-y:auto;background:var(--card)}
.chatq button{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:7px 13px;font:600 13.5px inherit;flex:none;text-align:start;cursor:pointer}
.igbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:12px;color:#fff;text-decoration:none;font:600 14px inherit;background:linear-gradient(45deg,#F58529,#DD2A7B 50%,#8134AF 80%,#515BD4)}
.ighandle{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
.igfoot{display:inline-flex;align-items:center;gap:6px}
</style>
</head>

const LEGEND_ALG=["G","M","E","N","C","F"];

let lang="en", fsel=null;
const $=id=>document.getElementById(id);
function pickLang(){
  const u=new URLSearchParams(location.search).get("lang");
  if(u&&LI[u]!==undefined)return u;
  try{const s=localStorage.getItem("kanaat-menu-lang");if(s&&LI[s]!==undefined)return s}catch(e){}
  for(const l of (navigator.languages||[navigator.language||"en"])){const p=String(l).toLowerCase().slice(0,2);if(LI[p]!==undefined)return p}
  return "en";
}
const L=a=>a[LI[lang]];
const Lt=a=>a[LI[lang]+1];
function price(p){if(p==null)return "";const f=Math.round(p*100)%100!==0;return p.toLocaleString("tr-TR",{minimumFractionDigits:f?2:0,maximumFractionDigits:2})+" ₺"}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s).toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i")}
function imgTag(it){
  if(!it.img)return "";
  return `<button class="ph" type="button" data-zoom="${it.id}" aria-label="${esc(it.tr)}"><img loading="lazy" src="img/${esc(it.loc)}" data-r="${esc(REMOTE+"images/"+encodeURIComponent(it.img))}" onerror="if(this.dataset.r){this.src=this.dataset.r;this.dataset.r=''}else{this.parentNode.classList.add('hide')}" alt=""></button>`;
}
function tags(it){
  let h="";
  for(const m of it.meat)h+=`<span class="t">${MEAT[m][0]} ${esc(Lt(MEAT[m]))}</span>`;
  for(const a of it.alg)h+=`<span class="t a">${ALG[a][0]} ${esc(Lt(ALG[a]))}</span>`;
  for(const d of it.diet){ if(d==="v"&&it.diet.includes("V"))continue; h+=`<span class="t d">${DIET[d][0]} ${esc(Lt(DIET[d]))}</span>`}
  if(it.kcal)h+=`<span class="kcal">${it.kcal} kcal</span>`;
  return h?`<div class="tags">${h}</div>`:"";
}
function headHTML(it){
  const pr=`<span class="price" dir="ltr">${price(it.p)}</span>`;
  if(lang==="tr")return `<div class="row"><h3 class="name" lang="tr">${esc(it.tr)}</h3>${pr}</div>`;
  return `<div class="row"><h3 class="name tl">${esc(it.t[LI[lang]-1])}</h3>${pr}</div><p class="trname" lang="tr" dir="ltr">${esc(it.tr)}</p>`;
}
function itemDesc(it){
  const parts=[];
  if(lang==="tr"){ if(it.trn)parts.push(it.trn) }
  for(const n of it.notes)parts.push(L(NOTE[n]));
  return parts;
}
function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("langname").textContent=LANGS[LI[lang]][1];

  $("t-legend").textContent=L(UI.legend);
  $("t-prices").textContent=L(UI.prices);
  $("t-hours").textContent=L(UI.hours);
  document.querySelectorAll(".fbtn").forEach(b=>{const k=b.dataset.f,src=MEAT[k]||DIET[k];b.textContent=src[0]+" "+Lt(src)});
  $("legend").innerHTML=LEGEND_ALG.map(a=>`<span class="t a">${ALG[a][0]} ${esc(Lt(ALG[a]))}</span>`).join("")+
    ["V","v"].map(d=>`<span class="t d">${DIET[d][0]} ${esc(Lt(DIET[d]))}</span>`).join("");
  let nav="",html="";
  for(const c of MENU){
    nav+=`<a href="#c-${c.id}" data-c="${c.id}">${esc(L(CAT[c.id]))}</a>`;
    html+=`<section class="cat" id="c-${c.id}"><h2>${esc(L(CAT[c.id]))}</h2>`;
    if(CNOTE[c.id])html+=`<p class="cnote">${esc(L(CNOTE[c.id]))}</p>`;
    html+=`<div class="items">`;
    for(const it of c.items){
      const notes=itemDesc(it);
      html+=`<article class="item" data-id="${it.id}">${imgTag(it)}<div class="body">${headHTML(it)}`;
      if(notes.length)html+=`<p class="sub">${notes.map(esc).join(" · ")}</p>`;
      html+=tags(it)+`</div></article>`;
    }
    html+=`</div></section>`;
  }
  $("cats").innerHTML=nav;
  $("menu").innerHTML=html;
  $("langsheet").innerHTML=`<h3>${esc(L(UI.lang))}</h3>`+LANGS.map(([c,n,e])=>`<button type="button" data-lang="${c}" aria-current="${c===lang}"><span>${n}</span>${c===lang?"✓":`<span class="en">${e}</span>`}</button>`).join("");
  filter();
  spy();
}
const BYID={};
for(const c of MENU)for(const it of c.items)BYID[it.id]=it;
function filter(){
  const q=norm($("q").value.trim());
  let any=false;
  for(const sec of document.querySelectorAll("section.cat")){
    let vis=0;
    for(const el of sec.querySelectorAll(".item")){
      const it=BYID[el.dataset.id];
      let ok=true;
      if(fsel==="V")ok=it.diet.includes("V");
      else if(fsel==="v")ok=it.diet.includes("v")||it.diet.includes("V");
      else if(fsel)ok=it.meat.includes(fsel);
      if(ok&&q){const hay=norm(it.tr+" "+(lang==="tr"?"":it.t[LI[lang]-1])+" "+it.t[0]);ok=hay.includes(q)}
      el.classList.toggle("hide",!ok); if(ok)vis++;
    }
    sec.classList.toggle("hide",!vis);
    const a=document.querySelector(`.cats a[data-c="${sec.id.slice(2)}"]`); if(a)a.classList.toggle("hide",!vis);
    if(vis)any=true;
  }
  $("empty").style.display=any?"none":"block";
}
function spy(){
  const secs=[...document.querySelectorAll("section.cat:not(.hide)")];
  let cur=secs[0];
  for(const s of secs){if(s.getBoundingClientRect().top<140)cur=s}
  document.querySelectorAll(".cats a").forEach(a=>{
    const on=cur&&a.dataset.c===cur.id.slice(2);
    if(on&&!a.classList.contains("on")){a.classList.add("on");const n=a.parentNode;n.scrollLeft=a.offsetLeft-(n.clientWidth-a.offsetWidth)/2}
    else if(!on)a.classList.remove("on");
  });
}

   q:["İlk kez geliyorum, ne denemeliyim?","It's my first time here. What should I try?","هذه أول زيارة لي، ماذا أجرّب؟","Я здесь впервые. Что попробовать?","Es mi primera vez. ¿Qué debería probar?","C'est ma première visite. Que dois-je goûter ?","我第一次来，应该尝尝什么？","Ich bin zum ersten Mal hier. Was soll ich probieren?","初めて来ました。何を食べればいいですか？","처음 왔어요. 무엇을 먹어 볼까요?"],
   a:["İlk ziyaretiniz için ana yemekte kuzu etli Özbek pilavı, yanına zeytinyağlı enginar, tatlıda da kaymaklı ayva tatlısı öneririm. Görmek için yemeğe dokunun:","For your first visit, I recommend Uzbek-style pilaf with lamb as your main dish, artichoke in olive oil on the side, and quince dessert with clotted cream to finish. Tap a dish to see it:","لزيارتك الأولى أنصحك بالأرز الأوزبكي بلحم الضأن كطبق رئيسي، ومعه الخرشوف بزيت الزيتون، وفي الختام حلوى السفرجل مع القشطة. اضغط على أي طبق لرؤيته:","Для первого визита советую узбекский плов с бараниной, к нему артишок на оливковом масле, а на десерт айву с каймаком. Нажмите на блюдо, чтобы посмотреть:","Para su primera visita le recomiendo el pilaf uzbeko con cordero como plato principal, alcachofa en aceite de oliva como acompañamiento y, de postre, membrillo con nata. Toque un plato para verlo:","Pour une première visite, je vous recommande le pilaf ouzbek à l'agneau en plat principal, l'artichaut à l'huile d'olive en accompagnement, et le coing à la crème en dessert. Touchez un plat pour le voir :","第一次来的话，我推荐主菜点乌兹别克风味羊肉抓饭，配一道橄榄油洋蓟，甜点来一份配凝脂奶油的榅桲。点击菜名即可查看：","Für Ihren ersten Besuch empfehle ich als Hauptgericht usbekischen Pilaw mit Lamm, dazu Artischocke in Olivenöl und zum Dessert Quitte mit Rahm. Tippen Sie auf ein Gericht:","初めての方には、メインにラム肉のウズベク風ピラフ、付け合わせにアーティチョークのオリーブオイル煮、デザートにクリーム添えのマルメロをおすすめします。料理をタップしてご覧ください：","처음 오셨다면 메인으로 양고기 우즈베크식 필라프, 곁들임으로 올리브유 아티초크, 디저트로 크림을 곁들인 모과 디저트를 추천합니다. 요리를 눌러 확인하세요:"]},
  {id:"story",
   q:["Lokantanın hikâyesi nedir?","What is the story of this place?","ما قصة هذا المطعم؟","Какова история этого места?","¿Cuál es la historia de este lugar?","Quelle est l'histoire de cette maison ?","这家店有什么故事？","Was ist die Geschichte dieses Lokals?","このお店の歴史は？","이 식당의 이야기가 궁금해요"],
   a:["Lokantamız 1933'te Üsküdar'da kuruldu. Kurucumuz Kargılı Ailesi, yaklaşık 150 yıllık sütlü tatlı ve dondurmacılık geleneğinden gelir. Bugün hâlâ bir aile işletmesiyiz: üretimden satın almaya, mutfaktan servise kadar her aşamada aileden biri çalışır. Mutfakta 40 yılı aşkın tecrübeli ustalarımız var.\n\nHer gün 100–120 çeşit tatlı, zeytinyağlı, sıcak yemek, dondurma ve yoğurt taze hazırlanır. İlkemiz basit: malzemede en iyisi. Uygun kalitede malzeme bulamazsak o yemeği yapmayız. 1970'lerden beri geliştirdiğimiz paketleme sayesinde yemeklerimiz evlere ve iş yerlerine de ulaşır.\n\n2000 yılında Vizyon Dergisi'nin \"Yiyecekte En İyi 100\" araştırmasında En İyi Esnaf Lokantası, En İyi Dondurma, En İyi Yoğurt, En İyi Ekmek Kadayıfı ve En İyi Paça Çorbası seçildik. New York Times, Le Monde ve Elle'de yer aldık; Lonely Planet, Rough Guide, Le Guide du Routard ve Louis Vuitton rehberleri bizi tavsiye ediyor. Gault&Millau Türkiye Rehberi'nde 2025 ve 2026'da Geleneksel Mutfak ödülü aldık.", "Our lokanta was founded in 1933 in Üsküdar by the Kargılı family, whose tradition of milk desserts and ice cream goes back about 150 years. We are still a family business: a family member works at every stage, from production and purchasing to the kitchen and service, and some of our cooks have more than 40 years of experience.\n\nEvery day we prepare 100–120 kinds of desserts, olive oil dishes, hot dishes, ice cream and yoghurt fresh. Our rule is simple: only the best ingredients. If we can't find the right quality, we don't make that dish. Thanks to packaging we have been developing since the 1970s, our food also reaches homes and offices.\n\nIn 2000, Vizyon magazine's “Best 100 in Food” survey named us the best traditional lokanta, with the best ice cream, yoghurt, ekmek kadayıfı and trotters soup. We have been featured in the New York Times, Le Monde and Elle, and are recommended by Lonely Planet, Rough Guide, Le Guide du Routard and the Louis Vuitton guide. In 2025 and 2026 we received the Traditional Cuisine award in the Gault&Millau Turkey Guide.", "تأسست اللوكانتا عام 1933 في أسكودار على يد عائلة كارغيلي، التي تمتد تقاليدها في صناعة الحلويات بالحليب والآيس كريم إلى نحو 150 عامًا. ما زلنا مشروعًا عائليًا: يعمل أحد أفراد العائلة في كل مرحلة، من الإنتاج والشراء إلى المطبخ والخدمة، ولدى بعض طهاتنا خبرة تزيد على 40 عامًا.\n\nنحضّر كل يوم من 100 إلى 120 صنفًا طازجًا من الحلويات وأطباق زيت الزيتون والأطباق الساخنة والآيس كريم واللبن. قاعدتنا بسيطة: أفضل المكونات فقط، وإن لم نجد الجودة المناسبة لا نحضّر ذلك الطبق. وبفضل طرق التغليف التي نطوّرها منذ السبعينيات، تصل أطباقنا أيضًا إلى المنازل وأماكن العمل.\n\nفي عام 2000 اختارنا استطلاع «أفضل 100 في الطعام» لمجلة فيزيون أفضل لوكانتا تقليدية، مع أفضل آيس كريم ولبن وإكمك قطايف وشوربة كوارع. ظهرنا في نيويورك تايمز ولوموند وإيل، وتوصي بنا أدلة لونلي بلانيت وراف غايد ولو غيد دو روتار ولويس فويتون. وفي عامي 2025 و2026 حصلنا على جائزة المطبخ التقليدي في دليل غو إي ميّو تركيا.", "Наша локанта основана в 1933 году в Ускюдаре семьёй Каргылы, чьи традиции молочных десертов и мороженого насчитывают около 150 лет. Мы по-прежнему семейное заведение: на каждом этапе, от производства и закупок до кухни и обслуживания, работает кто-то из семьи, а у некоторых наших поваров более 40 лет опыта.\n\nКаждый день мы готовим 100–120 видов десертов, блюд на оливковом масле, горячих блюд, мороженого и йогурта. Наше правило простое: только лучшие продукты. Если нужного качества нет, мы это блюдо не готовим. Благодаря упаковке, которую мы совершенствуем с 1970-х годов, наша еда доезжает и до домов, и до офисов.\n\nВ 2000 году в рейтинге «Лучшие 100 в еде» журнала Vizyon нас назвали лучшей традиционной локантой, а наши мороженое, йогурт, экмек кадайыф и суп из ножек — лучшими. О нас писали New York Times, Le Monde и Elle, нас рекомендуют Lonely Planet, Rough Guide, Le Guide du Routard и путеводитель Louis Vuitton. В 2025 и 2026 годах мы получили награду в категории «Традиционная кухня» гида Gault&Millau Турция.", "Nuestra lokanta fue fundada en 1933 en Üsküdar por la familia Kargılı, con una tradición de postres lácteos y helados de unos 150 años. Seguimos siendo un negocio familiar: un miembro de la familia trabaja en cada etapa, desde la producción y las compras hasta la cocina y el servicio, y algunos de nuestros cocineros tienen más de 40 años de experiencia.\n\nCada día preparamos frescos entre 100 y 120 tipos de postres, platos en aceite de oliva, platos calientes, helados y yogur. Nuestra regla es sencilla: solo los mejores ingredientes. Si no encontramos la calidad adecuada, no preparamos ese plato. Gracias a los envases que perfeccionamos desde los años setenta, nuestra comida llega también a hogares y oficinas.\n\nEn 2000, la encuesta «Los 100 mejores en comida» de la revista Vizyon nos eligió la mejor lokanta tradicional, con el mejor helado, yogur, ekmek kadayıfı y sopa de manitas. Hemos aparecido en el New York Times, Le Monde y Elle, y nos recomiendan Lonely Planet, Rough Guide, Le Guide du Routard y la guía Louis Vuitton. En 2025 y 2026 recibimos el premio de Cocina Tradicional de la Guía Gault&Millau Turquía.", "Notre lokanta a été fondée en 1933 à Üsküdar par la famille Kargılı, héritière d'une tradition de desserts lactés et de glaces vieille d'environ 150 ans. Nous sommes toujours une maison familiale : un membre de la famille est présent à chaque étape, de la production et des achats à la cuisine et au service, et certains de nos cuisiniers ont plus de 40 ans d'expérience.\n\nChaque jour, nous préparons 100 à 120 sortes de desserts, plats à l'huile d'olive, plats chauds, glaces et yaourts. Notre règle est simple : seulement les meilleurs produits. Si nous ne trouvons pas la bonne qualité, nous ne faisons pas le plat. Grâce aux emballages que nous perfectionnons depuis les années 1970, nos plats arrivent aussi dans les foyers et les bureaux.\n\nEn 2000, l'enquête « Les 100 meilleurs en cuisine » du magazine Vizyon nous a désignés meilleure lokanta traditionnelle, avec la meilleure glace, le meilleur yaourt, le meilleur ekmek kadayıfı et la meilleure soupe de pieds. Nous avons été cités par le New York Times, Le Monde et Elle, et sommes recommandés par le Lonely Planet, le Rough Guide, le Guide du Routard et le guide Louis Vuitton. En 2025 et 2026, nous avons reçu le prix Cuisine traditionnelle du guide Gault&Millau Turquie.", "本店于1933年由卡尔格勒家族在于斯屈达尔创立，这个家族制作奶制甜点和冰淇淋的传统已有约150年。我们至今仍是家族经营：从生产、采购到厨房和服务，每个环节都有家族成员参与，部分厨师拥有40多年经验。\n\n我们每天新鲜制作100到120种甜点、橄榄油菜、热菜、冰淇淋和酸奶。我们的原则很简单：只用最好的食材；找不到合格的原料，就不做那道菜。凭借自1970年代以来不断改进的包装方法，我们的菜品也能送到家中和办公室。\n\n2000年，《Vizyon》杂志“美食百佳”评选将我们评为最佳传统小馆，冰淇淋、酸奶、糖浆面包甜点和羊蹄汤也获评最佳。我们曾被《纽约时报》、《世界报》和《ELLE》介绍，并获《孤独星球》、Rough Guide、Le Guide du Routard 和路易威登指南推荐。2025年和2026年，我们获得高特米鲁土耳其指南传统美食奖。", "Unsere Lokanta wurde 1933 in Üsküdar von der Familie Kargılı gegründet, deren Tradition in Milchdesserts und Eis rund 150 Jahre zurückreicht. Wir sind bis heute ein Familienbetrieb: In jedem Bereich, von Herstellung und Einkauf bis Küche und Service, arbeitet ein Familienmitglied mit, und manche unserer Köche haben über 40 Jahre Erfahrung.\n\nTäglich bereiten wir 100 bis 120 Sorten Desserts, Olivenölgerichte, warme Gerichte, Eis und Joghurt frisch zu. Unsere Regel ist einfach: nur die besten Zutaten. Finden wir nicht die passende Qualität, kochen wir das Gericht nicht. Dank Verpackungen, die wir seit den 1970er-Jahren weiterentwickeln, kommt unser Essen auch nach Hause und ins Büro.\n\nIm Jahr 2000 kürte uns die Umfrage „Die besten 100 beim Essen“ des Magazins Vizyon zur besten traditionellen Lokanta, dazu mit dem besten Eis, Joghurt, Ekmek Kadayıfı und der besten Lammfußsuppe. Wir wurden in der New York Times, Le Monde und Elle vorgestellt und werden von Lonely Planet, Rough Guide, Le Guide du Routard und dem Louis-Vuitton-Guide empfohlen. 2025 und 2026 erhielten wir die Auszeichnung für traditionelle Küche im Gault&Millau Türkei.", "当店は1933年、約150年続くミルクデザートとアイスクリームの伝統を持つカルギル家によってユスキュダルで創業しました。今も家族経営で、製造・仕入れから厨房、接客まで、すべての工程に家族の誰かが携わっています。40年以上の経験を持つ料理人もいます。\n\n毎日100〜120種類のデザート、オリーブオイル料理、温かい料理、アイスクリーム、ヨーグルトを手作りしています。ルールはシンプルで、最高の食材だけを使うこと。納得できる品質の材料がなければ、その料理は作りません。1970年代から改良を重ねてきた梱包技術により、ご家庭やオフィスにもお届けしています。\n\n2000年にはヴィジョン誌の「食のベスト100」で最優秀の伝統的ロカンタに選ばれ、アイスクリーム、ヨーグルト、エキメッキ・カダユフ、羊の足のスープもベストに選ばれました。ニューヨーク・タイムズ、ル・モンド、ELLEで紹介され、ロンリープラネット、ラフガイド、ギド・デュ・ルタール、ルイ・ヴィトン シティガイドでも推薦されています。2025年と2026年にはゴ・エ・ミヨ トルコ版で伝統料理部門の賞を受賞しました。", "저희 로칸타는 1933년 위스퀴다르에서 카르기를르 가문이 세웠습니다. 이 가문의 우유 디저트와 아이스크림 전통은 약 150년에 이릅니다. 지금도 가족이 운영하며, 생산과 구매부터 주방과 서비스까지 모든 단계에 가족 구성원이 함께하고, 40년 넘는 경력의 요리사도 있습니다.\n\n매일 100~120가지의 디저트, 올리브유 요리, 따뜻한 요리, 아이스크림과 요구르트를 신선하게 만듭니다. 원칙은 간단합니다. 최고의 재료만 사용하고, 알맞은 품질의 재료를 구하지 못하면 그 요리는 만들지 않습니다. 1970년대부터 발전시켜 온 포장 방식 덕분에 가정과 사무실에도 음식을 전해 드립니다.\n\n2000년 비지온 매거진의 '음식 베스트 100' 조사에서 최고의 전통 로칸타로 선정되었고, 아이스크림, 요구르트, 에크멕 카다이프, 양 족발 수프도 최고로 꼽혔습니다. 뉴욕 타임스, 르 몽드, 엘르에 소개되었으며 론리 플래닛, 러프 가이드, 르 기드 뒤 루타르, 루이 비통 가이드에서도 추천합니다. 2025년과 2026년에는 고 에 미요 터키 가이드에서 전통 요리 부문 상을 받았습니다."]},
  {id:"veg",act:"veg",
   q:["Vejetaryen ne var?","What can vegetarians eat?","ما الأطباق النباتية؟","Что есть для вегетарианцев?","¿Qué hay para vegetarianos?","Qu'y a-t-il pour les végétariens ?","有什么素食？","Was gibt es für Vegetarier?","ベジタリアン向けの料理は？","채식 메뉴가 있나요?"],
   a:["Zeytinyağlılarımızın çoğu vegan, salatalar ve kompostolar da öyle. Aşağıdaki düğmeyle menüde sadece vejetaryen yemekleri görebilirsiniz. Not: sıcak sebze yemeklerimizin çoğu etle pişer.","Most of our olive oil dishes are vegan, and so are the salads and compotes. Use the button below to see only vegetarian dishes. Note: most of our hot vegetable dishes are cooked with meat.","معظم أطباقنا بزيت الزيتون نباتية صرفة، وكذلك السلطات والكومبوت. استخدم الزر أدناه لعرض الأطباق النباتية فقط. ملاحظة: معظم أطباق الخضار الساخنة تُطبخ مع اللحم.","Большинство наших блюд на оливковом масле веганские, как и салаты и компоты. Нажмите кнопку ниже, чтобы увидеть только вегетарианские блюда. Обратите внимание: большинство горячих овощных блюд готовится с мясом.","La mayoría de nuestros platos en aceite de oliva son veganos, igual que las ensaladas y compotas. Use el botón de abajo para ver solo platos vegetarianos. Nota: la mayoría de los platos calientes de verduras se cocinan con carne.","La plupart de nos plats à l'huile d'olive sont végans, tout comme les salades et compotes. Utilisez le bouton ci-dessous pour n'afficher que les plats végétariens. Attention : la plupart des plats chauds de légumes sont cuisinés avec de la viande.","我们大部分橄榄油菜都是纯素的，沙拉和糖水水果也是。点击下方按钮即可只看素食菜品。注意：大部分热蔬菜菜肴是与肉同煮的。","Die meisten unserer Olivenölgerichte sind vegan, ebenso Salate und Kompotte. Mit der Taste unten sehen Sie nur vegetarische Gerichte. Hinweis: Die meisten warmen Gemüsegerichte werden mit Fleisch gekocht.","オリーブオイル料理のほとんどはヴィーガンで、サラダやコンポートも同様です。下のボタンでベジタリアン料理だけを表示できます。なお、温かい野菜料理の多くは肉と一緒に煮込んでいます。","올리브유 요리는 대부분 비건이고, 샐러드와 콤포트도 마찬가지입니다. 아래 버튼을 누르면 채식 요리만 볼 수 있어요. 참고: 따뜻한 채소 요리는 대부분 고기와 함께 조리합니다."]},
  {id:"olive",dishes:["Zeytinyağlı Yaprak Sarma","İmambayıldı","Zeytinyağlı Enginar"],
   q:["Zeytinyağlı nedir?","What are “olive oil dishes”?","ما هي أطباق زيت الزيتون؟","Что такое блюда на оливковом масле?","¿Qué son los platos en aceite de oliva?","Que sont les plats à l'huile d'olive ?","什么是橄榄油菜？","Was sind Olivenölgerichte?","オリーブオイル料理とは？","올리브유 요리가 뭔가요?"],
   a:["Sebzelerin zeytinyağıyla ağır ağır pişirilip soğuk servis edildiği, İstanbul mutfağının klasikleridir. Çoğu vegandır. Yaprak sarma veya imambayıldı ile başlayabilirsiniz:","Vegetables slowly cooked in olive oil and served cold, a classic of Istanbul cuisine. Most are vegan. Start with stuffed vine leaves or İmambayıldı:","خضار مطبوخة ببطء بزيت الزيتون وتُقدَّم باردة، وهي من كلاسيكيات مطبخ إسطنبول. معظمها نباتي صرف. ابدأ بورق العنب المحشي أو إمام بايلدي:","Овощи, томлёные в оливковом масле и подаваемые холодными, — классика стамбульской кухни. Большинство из них веганские. Начните с долмы из виноградных листьев или имам баялды:","Verduras cocinadas lentamente en aceite de oliva y servidas frías: un clásico de la cocina de Estambul. La mayoría son veganas. Empiece por las hojas de parra rellenas o el İmambayıldı:","Des légumes mijotés à l'huile d'olive et servis froids, un classique de la cuisine stambouliote. La plupart sont végans. Commencez par les feuilles de vigne farcies ou l'İmambayıldı :","用橄榄油慢煮、冷食的蔬菜，是伊斯坦布尔菜的经典。大多数是纯素的。可以先尝尝葡萄叶包饭或橄榄油茄子：","Gemüse, langsam in Olivenöl gegart und kalt serviert – ein Klassiker der Istanbuler Küche. Die meisten sind vegan. Probieren Sie gefüllte Weinblätter oder İmambayıldı:","野菜をオリーブオイルでじっくり煮て冷やして出す、イスタンブール料理の定番です。ほとんどがヴィーガンです。まずはぶどうの葉のご飯包みやイマム・バユルドゥをどうぞ：","채소를 올리브유에 천천히 익혀 차갑게 내는 이스탄불 요리의 고전입니다. 대부분 비건이에요. 포도잎 쌈이나 이맘 바일드부터 드셔 보세요:"]},
  {id:"dessert",dishes:["Ayva Tatlısı (Kaymaklı)","Sütlaç","Ekmek Kadayıfı (Kaymaklı)","Kazandibi"],
   q:["Tatlı olarak ne önerirsiniz?","Which dessert do you recommend?","أي حلوى تنصح بها؟","Какой десерт посоветуете?","¿Qué postre recomienda?","Quel dessert recommandez-vous ?","推荐什么甜点？","Welches Dessert empfehlen Sie?","おすすめのデザートは？","추천 디저트는요?"],
   a:["Kaymaklı ayva tatlımız çok sevilir. Hafif bir şey isterseniz sütlaç, şerbetli isterseniz ekmek kadayıfı. Merak ediyorsanız kazandibini deneyin; içinde tavuk göğsü var ama tadı tatlıdır!","Our quince dessert with clotted cream is a favourite. For something light, rice pudding; for something syrupy, ekmek kadayıfı. If you're curious, try kazandibi: it's made with chicken breast, yet it tastes sweet!","حلوى السفرجل مع القشطة هي المفضلة لدى ضيوفنا. للخفيف: الأرز بالحليب، ولمحبي القطر: إكمك قطايف. وإن كنت تحب التجربة فجرّب قازان ديبي، فهي مصنوعة بصدر الدجاج لكن طعمها حلو!","Айва с каймаком — наш любимый десерт. Если хочется лёгкого — рисовый пудинг, если сиропного — экмек кадайыф. А любопытным советую казандиби: он готовится с куриной грудкой, но на вкус сладкий!","Nuestro membrillo con nata es el favorito. Si quiere algo ligero, arroz con leche; si le gusta el almíbar, ekmek kadayıfı. Si tiene curiosidad, pruebe el kazandibi: está hecho con pechuga de pollo, ¡pero sabe dulce!","Notre coing à la crème est un grand favori. Pour plus léger, le riz au lait ; pour un dessert au sirop, l'ekmek kadayıfı. Si vous êtes curieux, goûtez le kazandibi : il est préparé avec du blanc de poulet, mais il est sucré !","配凝脂奶油的榅桲甜点最受欢迎。想吃清淡的，可以点米布丁；喜欢糖浆类的，可以点糖浆面包甜点。如果您好奇，试试焦底牛奶布丁——它用鸡胸肉制作，但味道是甜的！","Unsere Quitte mit Rahm ist ein Favorit. Leichter: Milchreis; mit Sirup: Ekmek Kadayıfı. Wenn Sie neugierig sind, probieren Sie Kazandibi – mit Hähnchenbrust zubereitet und trotzdem süß!","クリーム添えのマルメロが一番人気です。軽めならライスプディング、シロップ系ならエキメッキ・カダユフ。興味があればカザンディビをどうぞ。鶏むね肉入りですが、甘いデザートです！","크림을 곁들인 모과 디저트가 가장 인기예요. 가볍게 드시려면 쌀 푸딩, 시럽 디저트를 원하시면 에크멕 카다이프. 궁금하시다면 카잔디비를 드셔 보세요. 닭가슴살로 만들지만 맛은 달콤해요!"]},
  {id:"allergy",
   q:["Alerjim var, ne yapmalıyım?","I have an allergy. What should I do?","لديّ حساسية، ماذا أفعل؟","У меня аллергия. Что делать?","Tengo una alergia. ¿Qué hago?","J'ai une allergie. Que faire ?","我有过敏，该怎么办？","Ich habe eine Allergie. Was soll ich tun?","アレルギーがあります。どうすればいいですか？","알레르기가 있어요. 어떻게 해야 하나요?"],
   a:["Lütfen sipariş vermeden önce garsonumuza söyleyin, mutfağa iletir. Her yemeğin altındaki turuncu etiketler alerjenleri gösterir: gluten, süt, yumurta, kuruyemiş, kereviz ve balık. Etiketler yol göstericidir, kesin bilgi için garsonumuza danışın.","Please tell your waiter before ordering; they will let the kitchen know. The orange labels under each dish show allergens: gluten, milk, egg, nuts, celery and fish. The labels are a guide, so please check with your waiter to be sure.","يرجى إبلاغ النادل قبل الطلب، وسيُعلم المطبخ. تشير الملصقات البرتقالية تحت كل طبق إلى مسببات الحساسية: الغلوتين، الحليب، البيض، المكسرات، الكرفس والسمك. هذه الملصقات للإرشاد فقط، فيُرجى التأكد من النادل.","Пожалуйста, сообщите официанту перед заказом — он передаст на кухню. Оранжевые метки под каждым блюдом показывают аллергены: глютен, молоко, яйцо, орехи, сельдерей и рыба. Метки носят справочный характер, поэтому уточните у официанта.","Por favor, avise a su camarero antes de pedir; él informará a la cocina. Las etiquetas naranjas bajo cada plato indican alérgenos: gluten, leche, huevo, frutos secos, apio y pescado. Son orientativas; confírmelo con su camarero.","Merci de prévenir votre serveur avant de commander, il informera la cuisine. Les étiquettes orange sous chaque plat indiquent les allergènes : gluten, lait, œuf, fruits à coque, céleri et poisson. Elles sont indicatives ; vérifiez auprès de votre serveur.","请在点餐前告诉服务员，他会转告厨房。每道菜下方的橙色标签标示过敏原：麸质、奶、蛋、坚果、芹菜和鱼。标签仅供参考，请向服务员确认。","Bitte sagen Sie es vor der Bestellung Ihrem Kellner – er informiert die Küche. Die orangefarbenen Hinweise unter jedem Gericht zeigen Allergene: Gluten, Milch, Ei, Schalenfrüchte, Sellerie und Fisch. Sie dienen nur zur Orientierung; bitte fragen Sie beim Kellner nach.","ご注文の前に係員にお知らせください。厨房に伝えます。各料理の下のオレンジ色の表示はアレルゲン（グルテン、乳、卵、ナッツ、セロリ、魚）です。表示は目安ですので、必ず係員にご確認ください。","주문 전에 직원에게 알려 주세요. 주방에 전달해 드립니다. 각 요리 아래 주황색 표시는 알레르기 유발 성분(글루텐, 우유, 달걀, 견과류, 셀러리, 생선)을 나타냅니다. 표시는 참고용이니 직원에게 꼭 확인해 주세요."]},
  {id:"togo",act:"togo",
   q:["Paket alabilir miyim?","Can I take something away?","هل يمكنني أخذ طلب سفري؟","Можно взять с собой?","¿Puedo pedir para llevar?","Puis-je emporter quelque chose ?","可以外带吗？","Kann ich etwas mitnehmen?","持ち帰りはできますか？","포장할 수 있나요?"],
   a:["Elbette! Tatlılarımızı kiloyla, koyun yoğurdumuzu çömlekte ve ev yapımı reçellerimizi kavanozda paket alabilirsiniz. Dondurmamız da uygun paketlerle saatlerce yolda erimeden götürülebilir. Üsküdar'dan tatlı bir hatıra olur.", "Of course! You can take our desserts by the kilo, sheep's milk yoghurt in a clay pot, and our homemade jams. With the right packaging, our ice cream can travel for hours without melting. A sweet souvenir from Üsküdar.", "بالتأكيد! يمكنك أخذ حلوياتنا بالكيلو، ولبن الغنم في وعاء فخاري، ومربياتنا المنزلية. وبفضل التغليف المناسب يمكن حمل الآيس كريم لساعات دون أن يذوب. هدية حلوة من أسكودار.", "Конечно! Десерты можно взять на вес, овечий йогурт — в глиняном горшке, а также наше домашнее варенье. В подходящей упаковке наше мороженое часами не тает в дороге. Сладкий сувенир из Ускюдара.", "¡Por supuesto! Puede llevarse nuestros postres por kilo, yogur de oveja en olla de barro y nuestras mermeladas caseras. Con el embalaje adecuado, nuestro helado aguanta horas de viaje sin derretirse. Un dulce recuerdo de Üsküdar.", "Bien sûr ! Vous pouvez emporter nos desserts au kilo, du yaourt de brebis en pot de terre et nos confitures maison. Grâce à un emballage adapté, notre glace peut voyager des heures sans fondre. Un doux souvenir d'Üsküdar.", "当然可以！甜点可按公斤外带，还有陶罐装绵羊奶酸奶和自制果酱。我们的冰淇淋采用专门包装，路上几个小时都不会融化。是来自于斯屈达尔的甜蜜纪念品。", "Natürlich! Unsere Desserts gibt es pro Kilo, Schafsmilchjoghurt im Tontopf und hausgemachte Konfitüren zum Mitnehmen. Mit der passenden Verpackung übersteht unser Eis stundenlange Fahrten, ohne zu schmelzen. Ein süßes Souvenir aus Üsküdar.", "もちろんです！デザートはキロ単位で、羊乳ヨーグルトは土鍋入りで、自家製ジャムもお持ち帰りいただけます。アイスクリームも専用の梱包なら、何時間移動しても溶けません。ユスキュダルの甘いお土産にどうぞ。", "물론이죠! 디저트는 킬로 단위로, 양젖 요구르트는 토기에 담아, 수제 잼도 포장해 가실 수 있어요. 아이스크림도 알맞게 포장하면 몇 시간을 이동해도 녹지 않아요. 위스퀴다르의 달콤한 기념품이 될 거예요."]},
  {id:"hours",
   q:["Çalışma saatleriniz nedir?", "What are your opening hours?", "ما مواعيد العمل؟", "Какие у вас часы работы?", "¿Cuál es su horario?", "Quels sont vos horaires ?", "营业时间是几点？", "Wann haben Sie geöffnet?", "営業時間は？", "영업시간이 어떻게 되나요?"]}
 ]
};
const IG_URL="https://www.instagram.com/kanaatlokantasi1933/";
const IG_SVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
let invited=false;
const MAP_URL="https://maps.google.com/?q=Kanaat+Lokantas%C4%B1+Selmanipak+Cad.+No:9+%C3%9Csk%C3%BCdar+%C4%B0stanbul";
const ADDR="Selmanipak Cad. No:9, Üsküdar, İstanbul";
function jumpTo(el){
  if(!el)return;
  requestAnimationFrame(()=>{const r=el.getBoundingClientRect();
    scrollTo({top:Math.max(0,scrollY+r.top-(innerHeight-r.height)/2),behavior:"auto"});
    el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")});
}
function findByName(n){for(const c of MENU)for(const it of c.items)if(it.tr===n)return it;return null}
function goItem(it){
  chefClose();chatClose();fsel=null;$("q").value="";
  document.querySelectorAll(".fbtn").forEach(x=>x.setAttribute("aria-pressed",false));filter();
  jumpTo(document.querySelector(`.item[data-id="${it.id}"]`));
}
function thumb(it){return it.img?`<img src="img/${esc(it.loc)}" data-r="${esc(REMOTE+"images/"+encodeURIComponent(it.img))}" onerror="if(this.dataset.r){this.src=this.dataset.r;this.dataset.r=''}else{this.remove()}" alt="">`:""}
let asked=new Set();
function chatMsg(html,me){
  const d=document.createElement("div");d.className="msg "+(me?"me":"bot");d.innerHTML=html;
  $("chatlog").appendChild(d);d.scrollIntoView({block:"end",behavior:"smooth"});return d;
}
function chatChoices(){
  const left=CHAT.q.filter(q=>!asked.has(q.id));
  const list=left.length?left:CHAT.q;
  $("chatq").innerHTML=list.map(q=>`<button type="button" data-q="${q.id}">${esc(CL(q.q))}</button>`).join("");
}
function chatAnswer(q){
  let html="";
  if(q.id==="hours"){html=`<p>${esc(CL(UI.hours))}</p>`}
  else html=CL(q.a).split("\n\n").map(t=>`<p>${esc(t)}</p>`).join("");
  const dishes=q.dishes==="TODAY"?[chefItem()]:(q.dishes||[]).map(findByName);
  const ds=dishes.filter(Boolean);
  if(q.dishes==="TODAY"&&ds[0]){const it=ds[0];
    html+=`<button class="dcard" type="button" data-go="${it.id}">${thumb(it)}<span><b>${esc(lang==="tr"?it.tr:it.t[LI[lang]-1])}</b><small lang="tr" dir="ltr">${esc(lang==="tr"?(it.trn||""):it.tr)}</small><em dir="ltr">${price(it.p)}</em></span></button>`}
  else if(ds.length)html+=`<div class="dchips">${ds.map(it=>`<button type="button" data-go="${it.id}">${thumb(it)}<span>${esc(lang==="tr"?it.tr:it.t[LI[lang]-1])}</span></button>`).join("")}</div>`;
  if(q.act==="veg")html+=`<button class="cact" type="button" data-act="veg">${DIET.v[0]} ${esc(Lt(DIET.v))}</button>`;
  if(q.act==="togo")html+=`<button class="cact" type="button" data-act="togo">${esc(CL(CHEF_UI.show))}</button>`;
  if(q.act==="story")html+=`<a class="cact" href="https://www.kanaatlokantasi.com.tr/hakkimizda" target="_blank" rel="noopener">📖 ${esc(CL(CHAT.story))}</a>`;
  if(q.act==="map")html+=`<a class="cact" href="${MAP_URL}" target="_blank" rel="noopener">📍 ${esc(CL(CHAT.maps))}</a>`;
  return html;
}
function chatAsk(id){
  const q=CHAT.q.find(x=>x.id===id);if(!q)return;
  asked.add(id);chatMsg(`<p>${esc(CL(q.q))}</p>`,true);$("chatq").innerHTML="";
  const t=chatMsg(`<span class="dots"><i></i><i></i><i></i></span>`,false);
  setTimeout(()=>{t.innerHTML=chatAnswer(q);chatChoices();if(asked.size===2&&!invited){invited=true;setTimeout(()=>{chatMsg(`<p>${esc(CL(CHAT.insta))}</p><a class="igbtn" href="${IG_URL}" target="_blank" rel="noopener">${IG_SVG}<span>${esc(CL(CHAT.follow))}</span></a><small class="ighandle" dir="ltr">@kanaatlokantasi1933</small>`,false)},900)}$("chatq").scrollTop=0;const L=$("chatlog");L.scrollTo({top:Math.max(0,t.offsetTop-L.offsetTop-60),behavior:"smooth"})},700);
}
function chatStart(){
  asked=new Set();invited=false;$("chatlog").innerHTML="";
  $("chattitle").textContent=CL(CHAT.title);$("chatsub").textContent=CL(CHAT.sub);
  $("chatx").setAttribute("aria-label",CL(CHEF_UI.close));
  chatMsg(`<p>${esc(CL(CHAT.hello))}</p>`,false);chatChoices();
}
function chatOpen(){chefClose();if(!$("chatlog").children.length||$("chat").dataset.lang!==lang){chatStart();$("chat").dataset.lang=lang}$("chat").classList.add("open")}
function chatClose(){$("chat").classList.remove("open")}
$("chatx").addEventListener("click",chatClose);
$("chat").addEventListener("click",e=>{
  if(e.target===e.currentTarget)return chatClose();
  const b=e.target.closest("[data-q]");if(b)return chatAsk(b.dataset.q);
  const g=e.target.closest("[data-go]");if(g)return goItem(BYID[g.dataset.go]);
  const a=e.target.closest("[data-act]");
  if(a){chatClose();$("q").value="";
    if(a.dataset.act==="veg"){fsel="v";document.querySelectorAll(".fbtn").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f==="v"));filter();scrollTo({top:0,behavior:"smooth"})}
    if(a.dataset.act==="togo"){fsel=null;document.querySelectorAll(".fbtn").forEach(x=>x.setAttribute("aria-pressed",false));filter();requestAnimationFrame(()=>scrollTo({top:document.getElementById("c-togo").getBoundingClientRect().top+scrollY-170}))}}
});
addEventListener("keydown",e=>{if(e.key==="Escape")chatClose()});

lang=pickLang();
render();
$("cfab").setAttribute("aria-label",CL(CHAT.title));
let seen=false;try{seen=sessionStorage.getItem("kanaat-chef")==="1"}catch(_){}
if(!seen&&chefItem()){setTimeout(()=>{chefOpen();try{sessionStorage.setItem("kanaat-chef","1")}catch(_){}},1500)}
</script>
