<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noimageindex">
<title>Kanaat Lokantası · Menü</title>
<meta name="theme-color" content="#1D5A46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kanaat Menü">
<meta name="application-name" content="Kanaat Menü">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Serif:wght@600;700&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2E8; --card:#FFFDF8; --ink:#2A2620; --muted:#6F675B; --line:#E6DDCC;
  --green:#1D5A46; --green-soft:#E3EEE8; --amber:#8A4B0F; --amber-soft:#FBEBD6;
  --chip:#EFE7D8; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171512;--card:#211E1A;--ink:#F1EBDF;--muted:#ADA493;--line:#36312A;
  --green:#7FC2A4;--green-soft:#1F3229;--amber:#F2B66E;--amber-soft:#3A2A17;--chip:#2C2823;--shadow:none}
}
*{box-sizing:border-box}
html{scroll-padding-top:175px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Noto Sans",system-ui,sans-serif}
html[lang=zh] body,html[lang=zh] .name,html[lang=zh] section.cat h2{font-family:"Noto Sans SC","Noto Sans",system-ui,sans-serif}
html[lang=ja] body,html[lang=ja] .name,html[lang=ja] section.cat h2{font-family:"Noto Sans JP","Noto Sans",system-ui,sans-serif}
html[lang=ko] body,html[lang=ko] .name,html[lang=ko] section.cat h2{font-family:"Noto Sans KR","Noto Sans",system-ui,sans-serif}
html[dir=rtl] body{font-family:"Noto Sans Arabic","Noto Sans",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--green);color:#fff;padding:14px 0 16px}
@media (prefers-color-scheme:dark){header.top{background:#12392C}}
.top .wrap{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 21px/1.15 "Noto Serif",Georgia,serif;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}
.langbtn{flex:none;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font:600 14px/1 inherit;padding:9px 12px;border-radius:999px;cursor:pointer}
.langbtn svg{width:16px;height:16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:11px 0;outline:none;min-width:0}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.filters::-webkit-scrollbar{display:none}.fbtn{flex:none;white-space:nowrap}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px/1 inherit;padding:8px 11px;border-radius:999px;cursor:pointer}
.fbtn[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.fbtn[aria-pressed=true]{color:#10241B}}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);font-size:13.5px;padding:7px 12px;border-radius:999px;white-space:nowrap}
.cats a.on{background:var(--ink);color:var(--bg)}
section.cat{padding-top:18px}
section.cat h2{margin:0 0 2px;font:700 20px/1.2 "Noto Serif",Georgia,serif;color:var(--green)}
html[dir=rtl] section.cat h2{font-family:"Noto Sans Arabic",serif}
.cnote{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.items{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{cursor:pointer;display:flex;gap:12px;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.ph{flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--chip);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0}
.row{display:flex;align-items:baseline;gap:10px}
.name{flex:1;margin:0;font:700 16px/1.25 "Noto Serif",Georgia,serif}
.price{flex:none;font-weight:600;font-size:15.5px;white-space:nowrap}
.desc{margin:3px 0 0;font-size:14px}
.name.tl{font:600 16px/1.3 inherit}
.lcol{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:8px}
.say{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:#1D5A46;color:#fff;border-radius:50%;font-size:22px;line-height:1;padding:0;margin:0;vertical-align:middle;cursor:pointer;font-style:normal;box-shadow:0 2px 6px rgba(29,90,70,.45);animation:sayPulse 1.2s ease-in-out 4}
.say.on{background:#E8731F;transform:scale(1.1);animation:none}
@keyframes sayPulse{0%,100%{transform:scale(1);box-shadow:0 2px 6px rgba(29,90,70,.45)}50%{transform:scale(1.14);box-shadow:0 0 0 7px rgba(29,90,70,.22)}}
@media (prefers-reduced-motion:reduce){.say{animation:none}}
@media (prefers-color-scheme:dark){.say{background:#2E8A6A}}
.trname{margin:2px 0 0;color:var(--muted);font:600 13.5px/1.3 "Noto Serif",Georgia,serif;font-style:italic}
html[dir=rtl] .trname{text-align:right}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.t{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1;padding:5px 7px;border-radius:6px;background:var(--chip);color:var(--ink)}
.t.a{background:var(--amber-soft);color:var(--amber);font-weight:600}
.t.d{background:var(--green-soft);color:var(--green);font-weight:600}
.kcal{font-size:12px;color:var(--muted);margin-inline-start:2px;align-self:center}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{margin:28px 0 0;padding:20px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
footer h3{margin:0 0 8px;color:var(--ink);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.alert{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:14px}
footer p{margin:4px 0}
footer a{color:var(--green)}
.ver{margin-top:14px!important;font-size:12px;opacity:.7}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(20,15,10,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:85vh;max-height:85dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet h3{position:sticky;top:-8px;background:var(--card);padding:8px 0;z-index:1}
.sheet h3{margin:10px 20px 6px;font-size:15px;color:var(--muted);font-weight:600}
.sheet button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:11px 20px;cursor:pointer;text-align:start}
.sheet button[aria-current=true]{color:var(--green);font-weight:600}
.flag{font-size:22px;margin-inline-end:12px;vertical-align:-2px}
.sheet button span.en{color:var(--muted);font-size:13px}
.photo{align-items:center;padding:16px}
.photo figure{margin:0;max-width:560px;width:100%;background:var(--card);border-radius:16px;overflow:hidden}
.photo img{width:100%;max-height:70vh;object-fit:cover;display:block}
.photo figcaption{padding:12px 16px 16px;display:flex;align-items:center;gap:12px}
.photo .ptxt{flex:1;min-width:0}
.ppair{padding:0 16px 16px;border-top:1px solid var(--line)}
.ppair p{margin:12px 0 0;font-weight:700;color:var(--green);font-size:14.5px}
.ppair .dchips button{font-size:14px;padding:5px 12px 5px 5px}
.ppair .dchips img{width:34px;height:34px}
html[dir=rtl] .photo figcaption{flex-direction:row-reverse}
.psay{width:54px;height:54px;flex:none;animation:sayPulse 1.2s ease-in-out infinite}
.psay.on{animation:none}
.photo figcaption b{font:700 17px "Noto Serif",Georgia,serif;display:block}
.hide{display:none!important}

.chef{position:fixed;inset:0;z-index:30;background:rgba(20,15,10,.55);display:none;align-items:center;justify-content:center;padding:16px}
.chef.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.ccard{position:relative;background:var(--card);width:100%;max-width:380px;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .3s ease}
.chead{display:flex;align-items:center;gap:12px;padding:16px 16px 10px;background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.chead{background:#12392C}}
.chead img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:none;background:#fff}
.chead small{display:block;font-size:12.5px;opacity:.85}
.chead b{display:block;font:700 19px/1.2 "Noto Serif",Georgia,serif}
html[lang=ar] .chead b,html[lang=zh] .chead b,html[lang=ja] .chead b,html[lang=ko] .chead b{font-family:inherit}
.cx{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.cdish{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.cbody{padding:14px 16px 16px}
.cbody .row{margin-bottom:2px}
.crow1{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center!important;gap:8px}
.crow1 .name{min-width:0}
.crow1 .price{justify-self:end}
.csay{width:56px;height:56px;flex:none;animation:sayPulse 1.2s ease-in-out infinite}
.csay.on{animation:none}
.cbtn{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--green);color:#fff;font:600 16px/1 inherit;padding:14px;cursor:pointer}
@media (prefers-color-scheme:dark){.cbtn{color:#10241B}}
.cfab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:15;width:58px;height:58px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden;cursor:pointer;background:#fff}
.cfab img{width:100%;height:100%;object-fit:cover;display:block}
.item.flash{animation:flash 1s ease-in-out 4}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px var(--green);background:var(--green-soft)}}

.chat{position:fixed;inset:0;z-index:30;background:rgba(20,15,10,.55);display:none;align-items:flex-end;justify-content:center}
.chat.open{display:flex;animation:fade .2s ease}
.cwin{background:var(--bg);width:100%;max-width:520px;height:min(86vh,720px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease}
@media (min-width:600px){.chat{align-items:center}.cwin{border-radius:20px}}
.cwin .chead{position:relative;flex:none}
.cwin .chead img{width:48px;height:48px;border-width:2px}
.chatlog{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.msg p{margin:0}
.msg p+p{margin-top:8px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-start-start-radius:4px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-end-end-radius:4px}
@media (prefers-color-scheme:dark){.msg.me{color:#10241B}}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dcard{display:flex;gap:10px;align-items:center;width:100%;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:start;font:inherit;cursor:pointer}
.dcard img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.dcard span{display:flex;flex-direction:column;gap:2px;min-width:0}
.dcard b{font:700 15px "Noto Serif",Georgia,serif}
.dcard small{color:var(--muted);font-size:13px}
.dcard em{font-style:normal;font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dchips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px 4px 4px;font:600 13px inherit;cursor:pointer}
html[dir=rtl] .dchips button{padding:4px 4px 4px 10px}
.dchips img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.fbform{margin-top:10px}
.fbrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;font-size:14px}
.fbst{display:flex;gap:2px;flex:none}
.fbst button{border:0;background:none;font-size:24px;line-height:1;padding:2px;color:var(--line);cursor:pointer}
.fbst button.on{color:#E8A317}
.fbform textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);resize:vertical}
.fbform.done{opacity:.6}
.fberr{color:#B3261E;font-size:13px;margin:4px 0 0!important;min-height:0}
.cact.soft{background:transparent;border:1px solid var(--line);color:var(--muted)}
.cact{display:inline-block;margin-top:10px;border:0;border-radius:10px;background:var(--green-soft);color:var(--green);font:600 14px inherit;padding:9px 12px;text-decoration:none;cursor:pointer}
.chatq{flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);max-height:32%;overflow-y:auto;background:var(--card)}
.chatq button{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:7px 13px;font:600 13.5px inherit;flex:none;text-align:start;cursor:pointer}
.igbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:12px;color:#fff;text-decoration:none;font:600 14px inherit;background:linear-gradient(45deg,#F58529,#DD2A7B 50%,#8134AF 80%,#515BD4)}
.ighandle{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
.igfoot{display:inline-flex;align-items:center;gap:6px}

.addbox{margin-top:8px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,90,70,0)}50%{box-shadow:0 0 0 6px rgba(29,90,70,.35);background:var(--green-soft)}}
.addb.sm{border-style:dashed;font-size:12.5px;padding:7px 11px}
.stepw{display:inline-flex;align-items:center;gap:6px}.stepw small{font-weight:600;color:var(--green);font-size:12.5px}
.vtag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 5px;vertical-align:1px}
.addbox:empty{display:none}
.addb{border:1px solid var(--green);background:transparent;color:var(--green);font:600 13.5px/1 inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--green-soft);border-radius:999px;padding:2px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--green);color:#fff;font:600 19px/1 inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.step button{color:#10241B}}
.step b{min-width:26px;text-align:center;font-size:15px;color:var(--green)}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:14;width:calc(100% - 32px);max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font:600 16px inherit;padding:15px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
body.hascart .cfab{bottom:calc(84px + env(safe-area-inset-bottom))}
body.hascart footer{padding-bottom:110px}
.cart{position:fixed;inset:0;z-index:31;background:rgba(20,15,10,.55);display:none;align-items:flex-end;justify-content:center}
.cart.open{display:flex;animation:fade .2s ease}
.csheet{position:relative;background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:pop .25s ease}
.csheet .cx{background:var(--chip);color:var(--ink)}
.ctitle{margin:0 0 10px;font:700 20px "Noto Serif",Georgia,serif;color:var(--green)}
html[lang=ar] .ctitle,html[lang=zh] .ctitle,html[lang=ja] .ctitle,html[lang=ko] .ctitle{font-family:inherit}
.cl,.wl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl em,.wl em{font-style:normal;font-weight:600;min-width:72px;text-align:end;white-space:nowrap}
.cn{display:flex;flex-direction:column;min-width:0}
.cn b{font-size:15px}.cn small{color:var(--muted);font-size:12.5px}
.ctot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-size:18px}
.ctot b{font-size:20px}
.cnote{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.cbtn.sec{background:var(--green-soft);color:var(--green);margin-top:8px}
.tipbox{margin-top:14px;padding:12px;border-radius:14px;background:var(--green-soft)}
.tipbox.glow{animation:tipglow 1s ease-in-out 6}
@keyframes tipglow{0%,100%{box-shadow:0 0 0 0 rgba(29,90,70,0)}50%{box-shadow:0 0 0 5px rgba(29,90,70,.55),0 0 18px rgba(29,90,70,.45);background:#cfe6da}}
.tiph{font-weight:700;color:var(--green);margin-bottom:8px}
.tipopts{display:flex;flex-wrap:wrap;gap:6px}
.tipopts button{border:1px solid var(--green);background:var(--card);color:var(--green);font:600 14px/1 inherit;padding:9px 13px;border-radius:999px;cursor:pointer}
.tipopts button[aria-pressed=true]{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.tipopts button[aria-pressed=true]{color:#10241B}}
.tipin{display:flex;align-items:center;gap:6px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;max-width:200px}
.tipin input{flex:1;border:0;background:transparent;color:var(--ink);font:600 16px inherit;padding:10px 0;outline:none;min-width:0}
.tipbox .cnote{margin-top:8px}
.csub{display:flex;justify-content:space-between;padding:6px 0 0;color:var(--muted)}
.cart .crow .addbox{flex-direction:row;align-items:center}
.avail{margin:12px 0 2px;background:#1D5A46;color:#fff;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;line-height:1.4}
.avail.blink{animation:availBlink 1s ease-in-out 5}
@keyframes availBlink{0%,100%{background:#1D5A46;box-shadow:0 0 0 0 rgba(29,90,70,0)}50%{background:#2E8A6A;box-shadow:0 0 0 5px rgba(29,90,70,.35)}}
@media (prefers-reduced-motion:reduce){.avail{animation:none}}
@media (prefers-color-scheme:dark){.avail{background:#12392C}}
.cfine{margin:8px 0 0;text-align:center;color:var(--muted);font-size:12px}
.fwarn{margin:8px 0 0;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}

      else if(fsel==="v")ok=it.diet.includes("v")||it.diet.includes("V");

function chefLine(){const t=new Date(ST.day().d+"T12:00:00Z");let wd=CHEF_WD[lang]?CHEF_WD[lang][t.getUTCDay()]:t.toLocaleDateString(lang==="zh"?"zh-CN":lang,{weekday:"long",timeZone:"UTC"});return CL(CHEF_REC).replace("{d}",wd)}
function sayChef(it,btn){try{const vs=speechSynthesis.getVoices(),q=[];
  const mk=(t,l)=>{const u=new SpeechSynthesisUtterance(t);u.lang=VOICE_LANG[l];u.rate=l==="tr"?.8:.9;const v=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(l));if(v)u.voice=v;return u};
  const hasL=!vs.length||vs.some(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));
  if(lang==="tr")q.push(mk(chefLine()+": "+it.tr,"tr"));
  else{if(hasL)q.push(mk(chefLine()+": "+it.t[LI[lang]-1]+".",lang));q.push(mk(it.tr,"tr"))}
  speechSynthesis.cancel();btn.classList.add("on");const last=q[q.length-1];last.onend=last.onerror=()=>btn.classList.remove("on");
  q.forEach(u=>speechSynthesis.speak(u));ST.add("chefSay")}catch(_){}}
function chefOpen(){
  const it=chefItem();if(!it)return;
  let wd=new Date(ST.day().d+"T12:00:00Z").toLocaleDateString(lang==="zh"?"zh-CN":lang,{weekday:"long",timeZone:"UTC"});if(lang==="lv")wd=wd.toLocaleLowerCase("lv");$("ctoday").textContent="Kanaat Lokantası";$("ctitle").textContent=chefLine();
  $("cx").setAttribute("aria-label",CL(CHEF_UI.close));
  const d=$("cdish");
  if(it.img){d.classList.remove("hide");d.dataset.r=REMOTE+"images/"+encodeURIComponent(it.img);d.onerror=()=>{if(d.dataset.r){d.src=d.dataset.r;d.dataset.r=""}else d.classList.add("hide")};d.src="img/"+it.loc}else d.classList.add("hide");
  const notes=itemDesc(it);
  $("cbody").innerHTML=`<div class="row crow1"><h3 class="name">${esc(lang==="tr"?it.tr:it.t[LI[lang]-1])}</h3>${CAN_SAY&&lang!=="tr"?`<button class="say csay" type="button" id="csay" aria-label="🔊"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.3 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>`:""}<span class="price" dir="ltr">${price(it.p)}</span></div>${lang!=="tr"?`<p class="trname" lang="tr" dir="ltr">${esc(it.tr)}</p>`:""}`+(notes.length?`<p class="sub">${notes.map(esc).join(" · ")}</p>`:"")+tags(it)+
    `<button class="cbtn" id="cshow" type="button">${esc(CL(CHEF_UI.show))}</button><p class="cfine">${esc(CL(AVAIL_UI.chef))}</p>`;
  $("cshow").onclick=()=>{ST.add("chefGo");chefClose();fsel=null;$("q").value="";document.querySelectorAll(".fbtn").forEach(x=>x.setAttribute("aria-pressed",false));filter();
    jumpTo(document.querySelector(`.item[data-id="${it.id}"]`))};
  if($("csay"))$("csay").onclick=e=>{e.stopPropagation();ST.add("chefSay");sayTr(it.tr,$("csay"))};
  $("chef").classList.add("open");ST.add("chefShow");
}
function availBlink(){document.querySelectorAll(".avail").forEach(e=>{e.classList.remove("blink");void e.offsetWidth;e.classList.add("blink")})}
function chefClose(){$("chef").classList.remove("open")}
$("cx").addEventListener("click",chefClose);
$("chef").addEventListener("click",e=>{if(e.target===e.currentTarget)chefClose()});
$("cfab").addEventListener("click",()=>chatOpen());
addEventListener("keydown",e=>{if(e.key==="Escape")chefClose()});

   a:["İlk ziyaretiniz için ana yemekte kuzu etli Özbek pilavı, yanına zeytinyağlı enginar, tatlıda da kaymaklı ayva tatlısı öneririm. Görmek için yemeğe dokunun:","For your first visit, I recommend Uzbek-style pilaf with lamb as your main dish, artichoke in olive oil on the side, and quince dessert with clotted cream to finish. Tap a dish to see it:","لزيارتك الأولى أنصحك بالأرز الأوزبكي بلحم الضأن كطبق رئيسي، ومعه الخرشوف بزيت الزيتون، وفي الختام حلوى السفرجل مع القشطة. اضغط على أي طبق لرؤيته:","Для первого визита советую узбекский плов с бараниной, к нему артишок на оливковом масле, а на десерт айву с каймаком. Нажмите на блюдо, чтобы посмотреть:","Para su primera visita le recomiendo el pilaf uzbeko con cordero como plato principal, alcachofa en aceite de oliva como acompañamiento y, de postre, membrillo con nata. Toque un plato para verlo:","Pour une première visite, je vous recommande le pilaf ouzbek à l'agneau en plat principal, l'artichaut à l'huile d'olive en accompagnement, et le coing à la crème en dessert. Touchez un plat pour le voir :","第一次来的话，我推荐主菜点乌兹别克风味羊肉抓饭，配一道橄榄油洋蓟，甜点来一份配凝脂奶油的榅桲。点击菜名即可查看：","Für Ihren ersten Besuch empfehle ich als Hauptgericht usbekischen Pilaw mit Lamm, dazu Artischocke in Olivenöl und zum Dessert Quitte mit Rahm. Tippen Sie auf ein Gericht:","初めての方には、メインにラム肉のウズベク風ピラフ、付け合わせにアーティチョークのオリーブオイル煮、デザートにクリーム添えのマルメロをおすすめします。料理をタップしてご覧ください：","처음 오셨다면 메인으로 양고기 우즈베크식 필라프, 곁들임으로 올리브유 아티초크, 디저트로 크림을 곁들인 모과 디저트를 추천합니다. 요리를 눌러 확인하세요:"]},
  {id:"story",
   q:["Lokantanın hikâyesi nedir?","What is the story of this place?","ما قصة هذا المطعم؟","Какова история этого места?","¿Cuál es la historia de este lugar?","Quelle est l'histoire de cette maison ?","这家店有什么故事？","Was ist die Geschichte dieses Lokals?","このお店の歴史は？","이 식당의 이야기가 궁금해요"],
   a:["Lokantamız 1933'te Üsküdar'da kuruldu. Kurucumuz Kargılı Ailesi, yaklaşık 150 yıllık sütlü tatlı ve dondurmacılık geleneğinden gelir. Bugün hâlâ bir aile işletmesiyiz: üretimden satın almaya, mutfaktan servise kadar her aşamada aileden biri çalışır. Mutfakta 40 yılı aşkın tecrübeli ustalarımız var.\n\nHer gün 100–120 çeşit tatlı, zeytinyağlı, sıcak yemek, dondurma ve yoğurt taze hazırlanır. İlkemiz basit: malzemede en iyisi. Uygun kalitede malzeme bulamazsak o yemeği yapmayız. 1970'lerden beri geliştirdiğimiz paketleme sayesinde yemeklerimiz evlere ve iş yerlerine de ulaşır.\n\n2000 yılında Vizyon Dergisi'nin \"Yiyecekte En İyi 100\" araştırmasında En İyi Esnaf Lokantası, En İyi Dondurma, En İyi Yoğurt, En İyi Ekmek Kadayıfı ve En İyi Paça Çorbası seçildik. New York Times, Le Monde ve Elle'de yer aldık; Lonely Planet, Rough Guide, Le Guide du Routard ve Louis Vuitton rehberleri bizi tavsiye ediyor. Gault&Millau Türkiye Rehberi'nde 2025 ve 2026'da Geleneksel Mutfak ödülü aldık.", "Our lokanta was founded in 1933 in Üsküdar by the Kargılı family, whose tradition of milk desserts and ice cream goes back about 150 years. We are still a family business: a family member works at every stage, from production and purchasing to the kitchen and service, and some of our cooks have more than 40 years of experience.\n\nEvery day we prepare 100–120 kinds of desserts, olive oil dishes, hot dishes, ice cream and yoghurt fresh. Our rule is simple: only the best ingredients. If we can't find the right quality, we don't make that dish. Thanks to packaging we have been developing since the 1970s, our food also reaches homes and offices.\n\nIn 2000, Vizyon magazine's “Best 100 in Food” survey named us the best traditional lokanta, with the best ice cream, yoghurt, ekmek kadayıfı and trotters soup. We have been featured in the New York Times, Le Monde and Elle, and are recommended by Lonely Planet, Rough Guide, Le Guide du Routard and the Louis Vuitton guide. In 2025 and 2026 we received the Traditional Cuisine award in the Gault&Millau Turkey Guide.", "تأسست اللوكانتا عام 1933 في أسكودار على يد عائلة كارغيلي، التي تمتد تقاليدها في صناعة الحلويات بالحليب والآيس كريم إلى نحو 150 عامًا. ما زلنا مشروعًا عائليًا: يعمل أحد أفراد العائلة في كل مرحلة، من الإنتاج والشراء إلى المطبخ والخدمة، ولدى بعض طهاتنا خبرة تزيد على 40 عامًا.\n\nنحضّر كل يوم من 100 إلى 120 صنفًا طازجًا من الحلويات وأطباق زيت الزيتون والأطباق الساخنة والآيس كريم واللبن. قاعدتنا بسيطة: أفضل المكونات فقط، وإن لم نجد الجودة المناسبة لا نحضّر ذلك الطبق. وبفضل طرق التغليف التي نطوّرها منذ السبعينيات، تصل أطباقنا أيضًا إلى المنازل وأماكن العمل.\n\nفي عام 2000 اختارنا استطلاع «أفضل 100 في الطعام» لمجلة فيزيون أفضل لوكانتا تقليدية، مع أفضل آيس كريم ولبن وإكمك قطايف وشوربة كوارع. ظهرنا في نيويورك تايمز ولوموند وإيل، وتوصي بنا أدلة لونلي بلانيت وراف غايد ولو غيد دو روتار ولويس فويتون. وفي عامي 2025 و2026 حصلنا على جائزة المطبخ التقليدي في دليل غو إي ميّو تركيا.", "Наша локанта основана в 1933 году в Ускюдаре семьёй Каргылы, чьи традиции молочных десертов и мороженого насчитывают около 150 лет. Мы по-прежнему семейное заведение: на каждом этапе, от производства и закупок до кухни и обслуживания, работает кто-то из семьи, а у некоторых наших поваров более 40 лет опыта.\n\nКаждый день мы готовим 100–120 видов десертов, блюд на оливковом масле, горячих блюд, мороженого и йогурта. Наше правило простое: только лучшие продукты. Если нужного качества нет, мы это блюдо не готовим. Благодаря упаковке, которую мы совершенствуем с 1970-х годов, наша еда доезжает и до домов, и до офисов.\n\nВ 2000 году в рейтинге «Лучшие 100 в еде» журнала Vizyon нас назвали лучшей традиционной локантой, а наши мороженое, йогурт, экмек кадайыф и суп из ножек — лучшими. О нас писали New York Times, Le Monde и Elle, нас рекомендуют Lonely Planet, Rough Guide, Le Guide du Routard и путеводитель Louis Vuitton. В 2025 и 2026 годах мы получили награду в категории «Традиционная кухня» гида Gault&Millau Турция.", "Nuestra lokanta fue fundada en 1933 en Üsküdar por la familia Kargılı, con una tradición de postres lácteos y helados de unos 150 años. Seguimos siendo un negocio familiar: un miembro de la familia trabaja en cada etapa, desde la producción y las compras hasta la cocina y el servicio, y algunos de nuestros cocineros tienen más de 40 años de experiencia.\n\nCada día preparamos frescos entre 100 y 120 tipos de postres, platos en aceite de oliva, platos calientes, helados y yogur. Nuestra regla es sencilla: solo los mejores ingredientes. Si no encontramos la calidad adecuada, no preparamos ese plato. Gracias a los envases que perfeccionamos desde los años setenta, nuestra comida llega también a hogares y oficinas.\n\nEn 2000, la encuesta «Los 100 mejores en comida» de la revista Vizyon nos eligió la mejor lokanta tradicional, con el mejor helado, yogur, ekmek kadayıfı y sopa de manitas. Hemos aparecido en el New York Times, Le Monde y Elle, y nos recomiendan Lonely Planet, Rough Guide, Le Guide du Routard y la guía Louis Vuitton. En 2025 y 2026 recibimos el premio de Cocina Tradicional de la Guía Gault&Millau Turquía.", "Notre lokanta a été fondée en 1933 à Üsküdar par la famille Kargılı, héritière d'une tradition de desserts lactés et de glaces vieille d'environ 150 ans. Nous sommes toujours une maison familiale : un membre de la famille est présent à chaque étape, de la production et des achats à la cuisine et au service, et certains de nos cuisiniers ont plus de 40 ans d'expérience.\n\nChaque jour, nous préparons 100 à 120 sortes de desserts, plats à l'huile d'olive, plats chauds, glaces et yaourts. Notre règle est simple : seulement les meilleurs produits. Si nous ne trouvons pas la bonne qualité, nous ne faisons pas le plat. Grâce aux emballages que nous perfectionnons depuis les années 1970, nos plats arrivent aussi dans les foyers et les bureaux.\n\nEn 2000, l'enquête « Les 100 meilleurs en cuisine » du magazine Vizyon nous a désignés meilleure lokanta traditionnelle, avec la meilleure glace, le meilleur yaourt, le meilleur ekmek kadayıfı et la meilleure soupe de pieds. Nous avons été cités par le New York Times, Le Monde et Elle, et sommes recommandés par le Lonely Planet, le Rough Guide, le Guide du Routard et le guide Louis Vuitton. En 2025 et 2026, nous avons reçu le prix Cuisine traditionnelle du guide Gault&Millau Turquie.", "本店于1933年由卡尔格勒家族在于斯屈达尔创立，这个家族制作奶制甜点和冰淇淋的传统已有约150年。我们至今仍是家族经营：从生产、采购到厨房和服务，每个环节都有家族成员参与，部分厨师拥有40多年经验。\n\n我们每天新鲜制作100到120种甜点、橄榄油菜、热菜、冰淇淋和酸奶。我们的原则很简单：只用最好的食材；找不到合格的原料，就不做那道菜。凭借自1970年代以来不断改进的包装方法，我们的菜品也能送到家中和办公室。\n\n2000年，《Vizyon》杂志“美食百佳”评选将我们评为最佳传统小馆，冰淇淋、酸奶、糖浆面包甜点和羊蹄汤也获评最佳。我们曾被《纽约时报》、《世界报》和《ELLE》介绍，并获《孤独星球》、Rough Guide、Le Guide du Routard 和路易威登指南推荐。2025年和2026年，我们获得高特米鲁土耳其指南传统美食奖。", "Unsere Lokanta wurde 1933 in Üsküdar von der Familie Kargılı gegründet, deren Tradition in Milchdesserts und Eis rund 150 Jahre zurückreicht. Wir sind bis heute ein Familienbetrieb: In jedem Bereich, von Herstellung und Einkauf bis Küche und Service, arbeitet ein Familienmitglied mit, und manche unserer Köche haben über 40 Jahre Erfahrung.\n\nTäglich bereiten wir 100 bis 120 Sorten Desserts, Olivenölgerichte, warme Gerichte, Eis und Joghurt frisch zu. Unsere Regel ist einfach: nur die besten Zutaten. Finden wir nicht die passende Qualität, kochen wir das Gericht nicht. Dank Verpackungen, die wir seit den 1970er-Jahren weiterentwickeln, kommt unser Essen auch nach Hause und ins Büro.\n\nIm Jahr 2000 kürte uns die Umfrage „Die besten 100 beim Essen“ des Magazins Vizyon zur besten traditionellen Lokanta, dazu mit dem besten Eis, Joghurt, Ekmek Kadayıfı und der besten Lammfußsuppe. Wir wurden in der New York Times, Le Monde und Elle vorgestellt und werden von Lonely Planet, Rough Guide, Le Guide du Routard und dem Louis-Vuitton-Guide empfohlen. 2025 und 2026 erhielten wir die Auszeichnung für traditionelle Küche im Gault&Millau Türkei.", "当店は1933年、約150年続くミルクデザートとアイスクリームの伝統を持つカルギル家によってユスキュダルで創業しました。今も家族経営で、製造・仕入れから厨房、接客まで、すべての工程に家族の誰かが携わっています。40年以上の経験を持つ料理人もいます。\n\n毎日100〜120種類のデザート、オリーブオイル料理、温かい料理、アイスクリーム、ヨーグルトを手作りしています。ルールはシンプルで、最高の食材だけを使うこと。納得できる品質の材料がなければ、その料理は作りません。1970年代から改良を重ねてきた梱包技術により、ご家庭やオフィスにもお届けしています。\n\n2000年にはヴィジョン誌の「食のベスト100」で最優秀の伝統的ロカンタに選ばれ、アイスクリーム、ヨーグルト、エキメッキ・カダユフ、羊の足のスープもベストに選ばれました。ニューヨーク・タイムズ、ル・モンド、ELLEで紹介され、ロンリープラネット、ラフガイド、ギド・デュ・ルタール、ルイ・ヴィトン シティガイドでも推薦されています。2025年と2026年にはゴ・エ・ミヨ トルコ版で伝統料理部門の賞を受賞しました。", "저희 로칸타는 1933년 위스퀴다르에서 카르기를르 가문이 세웠습니다. 이 가문의 우유 디저트와 아이스크림 전통은 약 150년에 이릅니다. 지금도 가족이 운영하며, 생산과 구매부터 주방과 서비스까지 모든 단계에 가족 구성원이 함께하고, 40년 넘는 경력의 요리사도 있습니다.\n\n매일 100~120가지의 디저트, 올리브유 요리, 따뜻한 요리, 아이스크림과 요구르트를 신선하게 만듭니다. 원칙은 간단합니다. 최고의 재료만 사용하고, 알맞은 품질의 재료를 구하지 못하면 그 요리는 만들지 않습니다. 1970년대부터 발전시켜 온 포장 방식 덕분에 가정과 사무실에도 음식을 전해 드립니다.\n\n2000년 비지온 매거진의 '음식 베스트 100' 조사에서 최고의 전통 로칸타로 선정되었고, 아이스크림, 요구르트, 에크멕 카다이프, 양 족발 수프도 최고로 꼽혔습니다. 뉴욕 타임스, 르 몽드, 엘르에 소개되었으며 론리 플래닛, 러프 가이드, 르 기드 뒤 루타르, 루이 비통 가이드에서도 추천합니다. 2025년과 2026년에는 고 에 미요 터키 가이드에서 전통 요리 부문 상을 받았습니다."]},
  {id:"today",dishes:"TODAY",
   q:["Bugün ne önerirsiniz?","What do you recommend today?","ماذا تنصح اليوم؟","Что вы посоветуете сегодня?","¿Qué recomienda hoy?","Que recommandez-vous aujourd'hui ?","今天推荐什么？","Was empfehlen Sie heute?","今日のおすすめは？","오늘의 추천은 무엇인가요?"],
   a:["Bugün sizin için bunu öneriyorum, eminim çok beğeneceksiniz:","Today I recommend this one. I'm sure you'll love it:","أنصحك اليوم بهذا الطبق، وأنا متأكد أنه سيعجبك:","Сегодня советую вот это блюдо, уверен, вам понравится:","Hoy le recomiendo este plato, seguro que le encantará:","Aujourd'hui je vous recommande ce plat, il va vous plaire :","今天我推荐这道菜，相信您一定会喜欢：","Heute empfehle ich dieses Gericht. Es wird Ihnen schmecken:","本日のおすすめはこちらです。きっと気に入っていただけます：","오늘은 이 요리를 추천합니다. 분명 마음에 드실 거예요:"]},
  {id:"veg",act:"veg",
   q:["Vejetaryen ne var?","What can vegetarians eat?","ما الأطباق النباتية؟","Что есть для вегетарианцев?","¿Qué hay para vegetarianos?","Qu'y a-t-il pour les végétariens ?","有什么素食？","Was gibt es für Vegetarier?","ベジタリアン向けの料理は？","채식 메뉴가 있나요?"],
   a:["Zeytinyağlılarımızın çoğu vegan, salatalar ve kompostolar da öyle. Aşağıdaki düğmeyle menüde sadece vejetaryen yemekleri görebilirsiniz. Not: sıcak sebze yemeklerimizin çoğu etle pişer.","Most of our olive oil dishes are vegan, and so are the salads and compotes. Use the button below to see only vegetarian dishes. Note: most of our hot vegetable dishes are cooked with meat.","معظم أطباقنا بزيت الزيتون نباتية صرفة، وكذلك السلطات والكومبوت. استخدم الزر أدناه لعرض الأطباق النباتية فقط. ملاحظة: معظم أطباق الخضار الساخنة تُطبخ مع اللحم.","Большинство наших блюд на оливковом масле веганские, как и салаты и компоты. Нажмите кнопку ниже, чтобы увидеть только вегетарианские блюда. Обратите внимание: большинство горячих овощных блюд готовится с мясом.","La mayoría de nuestros platos en aceite de oliva son veganos, igual que las ensaladas y compotas. Use el botón de abajo para ver solo platos vegetarianos. Nota: la mayoría de los platos calientes de verduras se cocinan con carne.","La plupart de nos plats à l'huile d'olive sont végans, tout comme les salades et compotes. Utilisez le bouton ci-dessous pour n'afficher que les plats végétariens. Attention : la plupart des plats chauds de légumes sont cuisinés avec de la viande.","我们大部分橄榄油菜都是纯素的，沙拉和糖水水果也是。点击下方按钮即可只看素食菜品。注意：大部分热蔬菜菜肴是与肉同煮的。","Die meisten unserer Olivenölgerichte sind vegan, ebenso Salate und Kompotte. Mit der Taste unten sehen Sie nur vegetarische Gerichte. Hinweis: Die meisten warmen Gemüsegerichte werden mit Fleisch gekocht.","オリーブオイル料理のほとんどはヴィーガンで、サラダやコンポートも同様です。下のボタンでベジタリアン料理だけを表示できます。なお、温かい野菜料理の多くは肉と一緒に煮込んでいます。","올리브유 요리는 대부분 비건이고, 샐러드와 콤포트도 마찬가지입니다. 아래 버튼을 누르면 채식 요리만 볼 수 있어요. 참고: 따뜻한 채소 요리는 대부분 고기와 함께 조리합니다."]},
  {id:"olive",dishes:["Zeytinyağlı Yaprak Sarma","İmambayıldı","Zeytinyağlı Enginar"],
   q:["Zeytinyağlı nedir?","What are “olive oil dishes”?","ما هي أطباق زيت الزيتون؟","Что такое блюда на оливковом масле?","¿Qué son los platos en aceite de oliva?","Que sont les plats à l'huile d'olive ?","什么是橄榄油菜？","Was sind Olivenölgerichte?","オリーブオイル料理とは？","올리브유 요리가 뭔가요?"],
   a:["Sebzelerin zeytinyağıyla ağır ağır pişirilip soğuk servis edildiği, İstanbul mutfağının klasikleridir. Çoğu vegandır. Yaprak sarma veya imambayıldı ile başlayabilirsiniz:","Vegetables slowly cooked in olive oil and served cold, a classic of Istanbul cuisine. Most are vegan. Start with stuffed vine leaves or İmambayıldı:","خضار مطبوخة ببطء بزيت الزيتون وتُقدَّم باردة، وهي من كلاسيكيات مطبخ إسطنبول. معظمها نباتي صرف. ابدأ بورق العنب المحشي أو إمام بايلدي:","Овощи, томлёные в оливковом масле и подаваемые холодными, — классика стамбульской кухни. Большинство из них веганские. Начните с долмы из виноградных листьев или имам баялды:","Verduras cocinadas lentamente en aceite de oliva y servidas frías: un clásico de la cocina de Estambul. La mayoría son veganas. Empiece por las hojas de parra rellenas o el İmambayıldı:","Des légumes mijotés à l'huile d'olive et servis froids, un classique de la cuisine stambouliote. La plupart sont végans. Commencez par les feuilles de vigne farcies ou l'İmambayıldı :","用橄榄油慢煮、冷食的蔬菜，是伊斯坦布尔菜的经典。大多数是纯素的。可以先尝尝葡萄叶包饭或橄榄油茄子：","Gemüse, langsam in Olivenöl gegart und kalt serviert – ein Klassiker der Istanbuler Küche. Die meisten sind vegan. Probieren Sie gefüllte Weinblätter oder İmambayıldı:","野菜をオリーブオイルでじっくり煮て冷やして出す、イスタンブール料理の定番です。ほとんどがヴィーガンです。まずはぶどうの葉のご飯包みやイマム・バユルドゥをどうぞ：","채소를 올리브유에 천천히 익혀 차갑게 내는 이스탄불 요리의 고전입니다. 대부분 비건이에요. 포도잎 쌈이나 이맘 바일드부터 드셔 보세요:"]},
  {id:"dessert",dishes:["Ayva Tatlısı (Kaymaklı)","Sütlaç","Ekmek Kadayıfı (Kaymaklı)","Kazandibi"],
   q:["Tatlı olarak ne önerirsiniz?","Which dessert do you recommend?","أي حلوى تنصح بها؟","Какой десерт посоветуете?","¿Qué postre recomienda?","Quel dessert recommandez-vous ?","推荐什么甜点？","Welches Dessert empfehlen Sie?","おすすめのデザートは？","추천 디저트는요?"],
   a:["Kaymaklı ayva tatlımız çok sevilir. Hafif bir şey isterseniz sütlaç, şerbetli isterseniz ekmek kadayıfı. Merak ediyorsanız kazandibini deneyin; içinde tavuk göğsü var ama tadı tatlıdır!","Our quince dessert with clotted cream is a favourite. For something light, rice pudding; for something syrupy, ekmek kadayıfı. If you're curious, try kazandibi: it's made with chicken breast, yet it tastes sweet!","حلوى السفرجل مع القشطة هي المفضلة لدى ضيوفنا. للخفيف: الأرز بالحليب، ولمحبي القطر: إكمك قطايف. وإن كنت تحب التجربة فجرّب قازان ديبي، فهي مصنوعة بصدر الدجاج لكن طعمها حلو!","Айва с каймаком — наш любимый десерт. Если хочется лёгкого — рисовый пудинг, если сиропного — экмек кадайыф. А любопытным советую казандиби: он готовится с куриной грудкой, но на вкус сладкий!","Nuestro membrillo con nata es el favorito. Si quiere algo ligero, arroz con leche; si le gusta el almíbar, ekmek kadayıfı. Si tiene curiosidad, pruebe el kazandibi: está hecho con pechuga de pollo, ¡pero sabe dulce!","Notre coing à la crème est un grand favori. Pour plus léger, le riz au lait ; pour un dessert au sirop, l'ekmek kadayıfı. Si vous êtes curieux, goûtez le kazandibi : il est préparé avec du blanc de poulet, mais il est sucré !","配凝脂奶油的榅桲甜点最受欢迎。想吃清淡的，可以点米布丁；喜欢糖浆类的，可以点糖浆面包甜点。如果您好奇，试试焦底牛奶布丁——它用鸡胸肉制作，但味道是甜的！","Unsere Quitte mit Rahm ist ein Favorit. Leichter: Milchreis; mit Sirup: Ekmek Kadayıfı. Wenn Sie neugierig sind, probieren Sie Kazandibi – mit Hähnchenbrust zubereitet und trotzdem süß!","クリーム添えのマルメロが一番人気です。軽めならライスプディング、シロップ系ならエキメッキ・カダユフ。興味があればカザンディビをどうぞ。鶏むね肉入りですが、甘いデザートです！","크림을 곁들인 모과 디저트가 가장 인기예요. 가볍게 드시려면 쌀 푸딩, 시럽 디저트를 원하시면 에크멕 카다이프. 궁금하시다면 카잔디비를 드셔 보세요. 닭가슴살로 만들지만 맛은 달콤해요!"]},
  {id:"allergy",
   q:["Alerjim var, ne yapmalıyım?","I have an allergy. What should I do?","لديّ حساسية، ماذا أفعل؟","У меня аллергия. Что делать?","Tengo una alergia. ¿Qué hago?","J'ai une allergie. Que faire ?","我有过敏，该怎么办？","Ich habe eine Allergie. Was soll ich tun?","アレルギーがあります。どうすればいいですか？","알레르기가 있어요. 어떻게 해야 하나요?"],
   a:["Lütfen sipariş vermeden önce garsonumuza söyleyin, mutfağa iletir. Her yemeğin altındaki turuncu etiketler alerjenleri gösterir: gluten, süt, yumurta, kuruyemiş, kereviz ve balık. Etiketler yol göstericidir, kesin bilgi için garsonumuza danışın.","Please tell your waiter before ordering; they will let the kitchen know. The orange labels under each dish show allergens: gluten, milk, egg, nuts, celery and fish. The labels are a guide, so please check with your waiter to be sure.","يرجى إبلاغ النادل قبل الطلب، وسيُعلم المطبخ. تشير الملصقات البرتقالية تحت كل طبق إلى مسببات الحساسية: الغلوتين، الحليب، البيض، المكسرات، الكرفس والسمك. هذه الملصقات للإرشاد فقط، فيُرجى التأكد من النادل.","Пожалуйста, сообщите официанту перед заказом — он передаст на кухню. Оранжевые метки под каждым блюдом показывают аллергены: глютен, молоко, яйцо, орехи, сельдерей и рыба. Метки носят справочный характер, поэтому уточните у официанта.","Por favor, avise a su camarero antes de pedir; él informará a la cocina. Las etiquetas naranjas bajo cada plato indican alérgenos: gluten, leche, huevo, frutos secos, apio y pescado. Son orientativas; confírmelo con su camarero.","Merci de prévenir votre serveur avant de commander, il informera la cuisine. Les étiquettes orange sous chaque plat indiquent les allergènes : gluten, lait, œuf, fruits à coque, céleri et poisson. Elles sont indicatives ; vérifiez auprès de votre serveur.","请在点餐前告诉服务员，他会转告厨房。每道菜下方的橙色标签标示过敏原：麸质、奶、蛋、坚果、芹菜和鱼。标签仅供参考，请向服务员确认。","Bitte sagen Sie es vor der Bestellung Ihrem Kellner – er informiert die Küche. Die orangefarbenen Hinweise unter jedem Gericht zeigen Allergene: Gluten, Milch, Ei, Schalenfrüchte, Sellerie und Fisch. Sie dienen nur zur Orientierung; bitte fragen Sie beim Kellner nach.","ご注文の前に係員にお知らせください。厨房に伝えます。各料理の下のオレンジ色の表示はアレルゲン（グルテン、乳、卵、ナッツ、セロリ、魚）です。表示は目安ですので、必ず係員にご確認ください。","주문 전에 직원에게 알려 주세요. 주방에 전달해 드립니다. 각 요리 아래 주황색 표시는 알레르기 유발 성분(글루텐, 우유, 달걀, 견과류, 셀러리, 생선)을 나타냅니다. 표시는 참고용이니 직원에게 꼭 확인해 주세요."]},
  {id:"togo",act:"togo",
   q:["Yemeklerinizden paket alabilir miyim?", "Can I get your dishes to take away?", "هل يمكنني أخذ أطباقكم سفري؟", "Можно ли взять ваши блюда с собой?", "¿Puedo pedir sus platos para llevar?", "Puis-je emporter vos plats ?", "菜品可以打包带走吗？", "Kann ich Ihre Gerichte mitnehmen?", "料理は持ち帰りできますか？", "요리를 포장해 갈 수 있나요?"],

hmelzen. Ein süßes Souvenir aus Üsküdar.", "もちろんです！すべての料理とデザートをお持ち帰りいただけます。さらに、デザートはキロ単位で、羊乳ヨーグルトは土鍋入りで、自家製ジャムもお求めいただけます。アイスクリームも専用の梱包なら、何時間移動しても溶けません。ユスキュダルの甘いお土産にどうぞ。", "물론이죠! 모든 요리와 디저트를 포장해 가실 수 있습니다. 또한 디저트는 킬로 단위로, 양젖 요구르트는 토기에 담아, 수제 잼도 구매하실 수 있어요. 아이스크림도 알맞게 포장하면 몇 시간을 이동해도 녹지 않아요. 위스퀴다르의 달콤한 기념품이 될 거예요."]},

   a:["Evet, var! Evlere ve iş yerlerine yemek servisi yapıyor; organizasyonlara, düğünlere ve mevlitlere catering hizmeti veriyoruz.", "Yes, we do! We deliver food to homes and offices, and provide catering for events, weddings and mevlids (religious gatherings).", "نعم، لدينا! نوصل الطعام إلى المنازل وأماكن العمل، ونقدّم خدمة الكيترينغ للمناسبات والأعراس وحفلات المولد.", "Да, есть! Мы доставляем еду на дом и в офисы и обслуживаем мероприятия, свадьбы и мевлиды (религиозные собрания).", "¡Sí! Llevamos comida a casas y oficinas y ofrecemos catering para eventos, bodas y mevlits (reuniones religiosas).", "Oui, bien sûr ! Nous livrons des repas à domicile et au bureau, et assurons le service traiteur pour les événements, les mariages et les mevlits (réunions religieuses).", "有的！我们为家庭和公司送餐，并为各类活动、婚礼和宗教聚会（梅夫利德）提供餐饮服务。", "Ja! Wir liefern Essen nach Hause und ins Büro und bieten Catering für Veranstaltungen, Hochzeiten und Mevlit-Feiern (religiöse Gedenkfeiern).", "はい、ございます！ご家庭や職場への配達、イベント・結婚式・メヴリトへのケータリングを承っています。", "네, 있습니다! 가정과 직장에 음식을 배달하고, 행사·결혼식·메블리트에 케이터링 서비스를 제공합니다.", "Jā, ir! Mēs piegādājam ēdienu uz mājām un birojiem un nodrošinām ēdināšanu pasākumiem, kāzām un mevlīdiem (reliģiskiem saietiem).", "Kyllä on! Toimitamme ruokaa koteihin ja työpaikoille sekä tarjoamme pitopalvelua tilaisuuksiin, häihin ja mevlit-juhliin (uskonnollisiin juhliin).", "Sim, temos! Entregamos refeições em casas e escritórios e fazemos catering para eventos, casamentos e mevlits (cerimónias religiosas).", "Sì, certo! Consegniamo pasti a casa e in ufficio e offriamo catering per eventi, matrimoni e mevlit (cerimonie religiose)."]},

   a:["Çok kolay! Üstteki “🧾 {calc}” bölümünü açın, yediğiniz yemekleri “+” ile ekleyin; bazı yemeklerde az porsiyon ya da tek adet de seçebilirsiniz. Altta “{my}” çubuğu toplamı gösterir. Bitince “{show}” düğmesine basın; garsonunuz kodu okutup kontrol eder ve onaylar. Onaylanan hesabı telefonunuza kaydedebilirsiniz.", "It's easy! Open “🧾 {calc}” at the top and add the dishes you had with “+”; for some dishes you can also choose a half portion or a single piece. The “{my}” bar at the bottom shows your total. When you're done, tap “{show}”: your waiter scans the code, checks it and confirms. You can then save the confirmed bill on your phone in your own language.", "الأمر سهل! افتح «🧾 {calc}» في الأعلى وأضف الأطباق التي تناولتها بزر «+»، ويمكنك في بعض الأطباق اختيار نصف حصة أو قطعة واحدة. يُظهر شريط «{my}» في الأسفل المجموع. عند الانتهاء اضغط «{show}»، فيمسح النادل الرمز ويتحقق منه ويؤكده. بعدها يمكنك حفظ الفاتورة المؤكدة على هاتفك بلغتك.", "Это просто! Откройте «🧾 {calc}» вверху и добавьте блюда, которые вы заказали, кнопкой «+»; для некоторых блюд можно выбрать полпорции или 1 шт. Панель «{my}» внизу показывает итог. Когда закончите, нажмите «{show}»: официант отсканирует код, проверит и подтвердит. Подтверждённый счёт можно сохранить в телефоне на своём языке.", "¡Es fácil! Abra «🧾 {calc}» arriba y añada con «+» los platos que ha tomado; en algunos también puede elegir media ración o una unidad. La barra «{my}» de abajo muestra el total. Cuando termine, toque «{show}»: su camarero escaneará el código, lo revisará y lo confirmará. Después podrá guardar la cuenta confirmada en su teléfono, en su idioma.", "C'est simple ! Ouvrez « 🧾 {calc} » en haut et ajoutez avec « + » les plats que vous avez pris ; pour certains, vous pouvez aussi choisir une demi-portion ou une pièce. La barre « {my} » en bas affiche le total. Quand vous avez fini, touchez « {show} » : votre serveur scanne le code, vérifie et confirme. Vous pourrez ensuite enregistrer l'addition confirmée sur votre téléphone, dans votre langue.", "很简单！打开顶部的“🧾 {calc}”，用“+”添加您点过的菜品；部分菜品还可以选择半份或单个。底部的“{my}”栏会显示合计。完成后点击“{show}”，服务员会扫描二维码、核对并确认。之后您可以用自己的语言把确认后的账单保存到手机上。", "Ganz einfach! Öffnen Sie oben „🧾 {calc}“ und fügen Sie Ihre Gerichte mit „+“ hinzu; bei manchen können Sie auch eine halbe Portion oder ein Stück wählen. Die Leiste „{my}“ unten zeigt die Summe. Wenn Sie fertig sind, tippen Sie auf „{show}“: Ihr Kellner scannt den Code, prüft ihn und bestätigt. Danach können Sie die bestätigte Rechnung in Ihrer Sprache auf dem Handy speichern.", "簡単です！上の「🧾 {calc}」を開き、召し上がった料理を「+」で追加してください。料理によってはハーフサイズや1個単位も選べます。画面下の「{my}」バーに合計が表示されます。終わったら「{show}」をタップしてください。係員がコードを読み取り、確認して承認します。承認されたお会計は、ご自分の言語でスマートフォンに保存できます。", "간단해요! 위쪽의 '🧾 {calc}'을 열고 드신 요리를 '+'로 추가하세요. 일부 요리는 하프 사이즈나 1개 단위로도 고를 수 있어요. 아래 '{my}' 바에 합계가 표시됩니다. 다 고르셨으면 '{show}'를 누르세요. 직원이 코드를 스캔해 확인하고 승인합니다. 승인된 계산서는 내 언어로 휴대폰에 저장할 수 있어요."]},

let CART={};

const LOC=g=>g==="zh"?"zh-CN":g;
function fxText(tl,g){if(!FX||!(tl>0))return "";const f=(v,c)=>new Intl.NumberFormat(LOC(g),{style:"currency",currency:c,maximumFractionDigits:2}).format(v);
  return "≈ "+[["EUR",FX.EUR],["USD",FX.USD],["GBP",FX.GBP]].filter(([,r])=>r>0).map(([c,r])=>f(tl/r,c)).join(" · ")}
const fxNote=g=>FX?SPLIT_UI.fx[LI[g]].replace("{d}",FX.date||""):"";
try{const s=JSON.parse(localStorage.getItem("kanaat-cart")||"{}");for(const k in s){if(k==="_tip"){const t=s[k];if(t&&(t.k==="p"||t.k==="m")&&t.v>0)TIP=t;continue}if(k==="_split"){SPLIT=Math.max(1,Math.min(30,s[k]|0));continue}const [c,v]=splitKey(k);if(BYCODE[c]&&vOk(BYCODE[c],v)&&s[k]>0)CART[k]=Math.min(99,s[k]|0)}}catch(_){}
function cartSave(){try{const o={...CART};if(TIP)o._tip=TIP;if(SPLIT>1)o._split=SPLIT;localStorage.setItem("kanaat-cart",JSON.stringify(o))}catch(_){}}
const cartLines=()=>Object.entries(CART).map(([k,q])=>{const [c,v]=splitKey(k);return {it:BYCODE[c],v,q,k}}).filter(l=>l.q>0&&l.it&&vOk(l.it,l.v));

const vLabel=(v,tr)=>v==="a"?(tr?"AZ":CL(CART_UI.az)):v==="t"?(tr?"TEK":CL(CART_UI.tek)):"";
const cartCount=()=>cartLines().reduce((a,l)=>a+l.q,0);
const subOf=L=>L.reduce((a,l)=>a+l.q*(lp(l)||0),0);
const tipOf=(sub,t)=>!t?0:t.k==="p"?Math.round(sub*t.v)/100:t.v/100;
const cartTotal=(lines=cartLines())=>{const s=subOf(lines);return s+tipOf(s,TIP)};
const nameIn=it=>lang==="tr"?it.tr:it.t[LI[lang]-1];
const hasDrink=L=>L.some(l=>MENU.find(c=>c.id==="drink").items.includes(l.it));
let drinkAsked=false,cartView="sheet",tipCustom=false,tipGlow=false;
function ctl1(it,v){
  const k=keyOf(it.c,v),q=CART[k]||0,lbl=v?vLabel(v)+" · "+price(vPrice(it,v)):CL(CART_UI.add);
  if(!q)return v?`<button class="addb sm" type="button" data-inc="${k}">+ ${esc(lbl)}</button>`:`<button class="addr" type="button" data-inc="${k}" aria-label="${esc(lbl)}">+</button>`;
  return `<span class="stepw">${v?`<small>${esc(vLabel(v))}</small>`:""}<span class="step"><button type="button" data-dec="${k}" aria-label="−">−</button><b>${q}</b><button type="button" data-inc="${k}" aria-label="+">+</button></span></span>`;
}
function ctl(it){
  if(it.p==null)return "";
  return ["","a","t"].filter(v=>vOk(it,v)).map(v=>ctl1(it,v)).join("");
}
function cartPaint(){
  document.querySelectorAll("#calclist .crow").forEach(el=>{const it=BYID[el.dataset.id];el.querySelector(".addbox").innerHTML=ctl(it)});
  const n=cartCount();
  $("cartbar").classList.toggle("hide",!n);document.body.classList.toggle("hascart",!!n);
  $("cartbar").innerHTML=`<span>🧾 ${esc(CL(CART_UI.my))} · ${n}</span><b dir="ltr">${price(cartTotal())}</b>`;
  if($("cart").classList.contains("open")){if(cartView==="drinks")drinkStep(drinkNext);else if(cartView==="sheet")cartSheet()}
}
function cartInc(c,d){if(d>0){ST.add("add_"+c);if(cartView==="drinks"&&$("cart").classList.contains("open"))ST.add("drinkAdd")}const q=Math.max(0,Math.min(99,(CART[c]||0)+d));if(q)CART[c]=q;else delete CART[c];cartSave();cartPaint()}
function tipBox(sub){
  const opts=[["0",CL(TIP_UI.none)],["p5","%5"],["p10","%10"],["p15","%15"],["m",CL(TIP_UI.custom)]].map(([k,t])=>[k,lang==="tr"?t:t.replace(/^%(\d+)$/,"$1%")]);
  const cur=!TIP?"0":TIP.k==="p"?"p"+TIP.v:"m";
  const showIn=cur==="m"||tipCustom;
  const g=tipGlow;tipGlow=false;
  return `<div class="tipbox${g?" glow":""}"><div class="tiph">${esc(CL(TIP_UI.title))}</div>
   <div class="tipopts">${opts.map(([k,t])=>`<button type="button" data-tip="${k}" aria-pressed="${k===cur||(k==="m"&&tipCustom)}">${esc(t)}</button>`).join("")}</div>
   ${showIn?`<label class="tipin"><input id="tipamt" type="text" inputmode="decimal" autocomplete="off" placeholder="${esc(CL(TIP_UI.amount))}" value="${TIP&&TIP.k==="m"?TIP.v/100:""}"><span>₺</span></label>`:""}
   <p class="cnote">${esc(CL(TIP_UI.note))}</p></div>`;
}
function totalsHTML(L){
  const s=subOf(L),t=tipOf(s,TIP);
  return (t?`<div class="csub"><span>${esc(CL(TIP_UI.sub))}</span><b dir="ltr">${price(s)}</b></div><div class="csub"><span>${esc(CL(TIP_UI.line))}</span><b dir="ltr">${price(t)}</b></div>`:"")+
    `<div class="ctot"><span>${esc(CL(CART_UI.total))}</span><b dir="ltr">${price(s+t)}</b></div>`+
    (FX?`<div class="fx" dir="ltr">${esc(fxText(s+t,lang))}</div>`:"")+
    `<div class="splitrow"><span>👥 ${esc(CL(SPLIT_UI.people))}</span><span class="step"><button type="button" data-split="-1">−</button><b>${SPLIT}</b><button type="button" data-split="1">+</button></span></div>`+
    (SPLIT>1?`<div class="pp"><span>${esc(CL(SPLIT_UI.each))} (${SPLIT})</span><b dir="ltr">${price(Math.round((s+t)*100/SPLIT)/100)}</b></div>`+(FX?`<div class="fx" dir="ltr">${esc(fxText((s+t)/SPLIT,lang))}</div>`:""):"")+
    (FX?`<p class="fxnote">${esc(fxNote(lang))}</p>`:"");
}
function cartSheet(){
  cartView="sheet";
  const L=cartLines();
  if(!L.length){cartClose();return}
  $("cartbody").innerHTML=`<h3 class="ctitle">${esc(CL(CART_UI.my))}</h3>
   <div class="clines">${L.map(l=>`<div class="cl"><div class="cn"><b>${esc(nameIn(l.it))}${l.v?` <span class="vtag">${esc(vLabel(l.v))}</span>`:""}</b>${lang!=="tr"?`<small lang="tr" dir="ltr">${esc(l.it.tr)}${l.v?" ("+vLabel(l.v,1)+")":""}</small>`:""}<small dir="ltr">${price(lp(l))}</small></div>
     <span class="step"><button type="button" data-dec="${l.k}">−</button><b>${l.q}</b><button type="button" data-inc="${l.k}">+</button></span><em dir="ltr">${price(l.q*lp(l))}</em></div>`).join("")}</div>
   ${tipBox(subOf(L))}

   <button class="cbtn" type="button" id="cshowqr">${esc(CL(CART_UI.show))}</button>
   <button class="cbtn sec" type="button" id="csave">💾 ${esc(CL(OK_UI.save))}</button>
   <button class="clink" type="button" id="cclear">${esc(CL(CART_UI.clear))}</button>`;
}
let drinkNext="qr";
function drinkStep(next){
  cartView="drinks";drinkNext=next;
  const D=MENU.find(c=>c.id==="drink").items.filter(it=>it.p!=null);
  $("cartbody").innerHTML=`<h3 class="ctitle">🥤 ${esc(CL(DRINK_UI.q))}</h3><p class="cnote">${esc(CL(DRINK_UI.sub))}</p>

   <button class="cbtn" type="button" id="dcont">${esc(CL(DRINK_UI.cont))}</button>`;

function guardDrinks(next){ST.add("drinkStep");drinkStep(next);return true}
function tipToken(){return (!TIP?"":TIP.k==="p"?"._p"+TIP.v:"._m"+TIP.v)+(SPLIT>1?"._s"+SPLIT:"")}
function cartPayload(){
  const t=Math.round(Date.now()/6e4).toString(36);
  return lang+"."+t+"."+cartLines().map(l=>l.it.c+l.v+(l.q>1?l.q:"")).join(".")+tipToken();
}
const bi=(arr,suf)=>lang==="tr"?"":`<small dir="auto">${esc(CL(arr)+(suf||""))}</small>`;
function cartQR(){
  cartView="qr";
  const L=cartLines();
  {const s0=subOf(L),t0=tipOf(s0,TIP);ST.add("qrShow");ST.add("qrSum",Math.round((s0+t0)*100));ST.add(!TIP?"tip_none":TIP.k==="p"?"tip_p"+TIP.v:"tip_m");if(t0>0)ST.add("tipSum",Math.round(t0*100));if(SPLIT>1){ST.add("split");ST.add("splitPeople",SPLIT)}}
  const url=location.origin+location.pathname+"#g="+cartPayload();

   <div class="trlist" lang="tr" dir="ltr">${L.map(l=>`<div><span class="tl2"><b>${l.q} × ${esc(l.it.tr)}${l.v?" ("+vLabel(l.v,1)+")":""}</b>${lang!=="tr"?`<small dir="auto">${esc(nameIn(l.it))}${l.v?" ("+vLabel(l.v)+")":""}</small>`:""}</span><b>${price(l.q*lp(l))}</b></div>`).join("")}
     ${t?`<div class="trt"><span class="tl2"><b>Ara toplam</b>${bi(TIP_UI.sub)}</span><b>${price(s)}</b></div><div><span class="tl2"><b>Gönüllü bahşiş</b>${bi(TIP_UI.line)}</span><b>${price(t)}</b></div>`:""}
     <div class="trt"><span class="tl2"><b>Toplam</b>${bi(CART_UI.total)}</span><b>${price(s+t)}</b></div>${SPLIT>1?`<div><span class="tl2"><b>Kişi başı (${SPLIT} kişi)</b>${bi(SPLIT_UI.each,` (${SPLIT})`)}</span><b>${price(Math.round((s+t)*100/SPLIT)/100)}</b></div>`:""}</div>
   <button class="clink" type="button" id="cback">${esc(CL(CART_UI.back))}</button>`;

function cartClose(){$("cart").classList.remove("open")}

$("cartbar").addEventListener("click",cartOpen);
$("cart").addEventListener("click",e=>{
  if(e.target===e.currentTarget)return cartClose();
  const i=e.target.closest("[data-inc]"),d=e.target.closest("[data-dec]");
  if(i)return cartInc(i.dataset.inc,1);if(d)return cartInc(d.dataset.dec,-1);
  const tp=e.target.closest("[data-tip]");
  if(tp){const k=tp.dataset.tip;if(k==="0"){TIP=null;tipCustom=false}else if(k==="m"){tipCustom=true;if(TIP&&TIP.k==="p")TIP=null}else{TIP={k:"p",v:+k.slice(1)};tipCustom=false}
    cartSave();cartPaint();if(k==="m"){const inp=$("tipamt");if(inp)inp.focus()}return}
  const sp=e.target.closest("[data-split]");if(sp){SPLIT=Math.max(1,Math.min(30,SPLIT+(+sp.dataset.split)));cartSave();$("ctots").innerHTML=totalsHTML(cartLines());return}
  if(e.target.closest("#cshowqr")){if(guardDrinks("qr"))return;return cartQR()}
  if(e.target.closest("#csave")){if(guardDrinks("save"))return;return cartSaveImg()}
  if(e.target.closest("#dcont")){if(drinkNext==="save"){cartSheet();return cartSaveImg()}return cartQR()}
  if(e.target.closest("#cback"))return cartSheet();
  if(e.target.closest("#cclear")){CART={};TIP=null;cartSave();cartPaint();cartClose()}
  if(e.target.closest("#cartx"))cartClose();
});
$("cart").addEventListener("input",e=>{if(e.target.id!=="tipamt")return;
  const v=Math.round(parseFloat(String(e.target.value).replace(",","."))*100);

});

function parsePayload(p){
  const parts=p.split(".");const g=LI[parts[0]]!==undefined?parts[0]:"en";const at=parseInt(parts[1],36)*6e4;
  let tip=null,split=1;const W=[];for(const tok of parts.slice(2)){if(tok[0]==="_"){const n=parseInt(tok.slice(2),10);if(n>0&&(tok[1]==="p"||tok[1]==="m"))tip={k:tok[1],v:Math.min(n,tok[1]==="p"?100:10000000)};if(tok[1]==="s"&&n>1)split=Math.min(30,n);continue}const c=tok.slice(0,4),m=tok.slice(4).match(/^([at]?)(\d*)$/);if(!m)continue;const v=m[1],q=parseInt(m[2]||"1",10);if(BYCODE[c]&&vOk(BYCODE[c],v)&&q>0)W.push({it:BYCODE[c],v,q:Math.min(99,q)})}
  return {g,at:isFinite(at)&&at>0?at:Date.now(),W,tip,split};
}
function makePayload(g,at,W,tip,split){return g+"."+Math.round(at/6e4).toString(36)+"."+W.filter(l=>l.q>0).map(l=>l.it.c+(l.v||"")+(l.q>1?l.q:"")).join(".")+(tip?"._"+tip.k+tip.v:"")+(split>1?"._s"+split:"")}

function wrapText(x,text,maxW){
  const cjk=/[぀-ヿ㐀-鿿가-힯]/.test(text);
  const toks=cjk?[...text]:text.split(/(\s+)/);const out=[];let cur="";
  for(const t of toks){const nx=cur+t;if(x.measureText(nx).width<=maxW||!cur.trim()){cur=nx}else{out.push(cur.trimEnd());cur=t.trimStart()}
    while(x.measureText(cur).width>maxW&&cur.length>1){let k=cur.length-1;while(k>1&&x.measureText(cur.slice(0,k)).width>maxW)k--;out.push(cur.slice(0,k));cur=cur.slice(k)}}
  if(cur.trim())out.push(cur.trimEnd());return out.length?out:[""];
}

via, lisäkkeeksi oliiviöljyssä haudutettua artisokkaa ja jälkiruoaksi kvittenijälkiruokaa kerman kera. Napauta ruokaa nähdäksesi sen:", "Para a sua primeira visita, recomendo pilaf usbeque com cordeiro como prato principal, alcachofra em azeite como acompanhamento e doce de marmelo com nata para terminar. Toque num prato para o ver:", "Per la prima visita vi consiglio il pilaf uzbeko con agnello come piatto principale, il carciofo all'olio d'oliva come contorno e il dolce di mele cotogne con panna per finire. Toccate un piatto per vederlo:"], "Q.story.q": ["Kāds ir šīs vietas stāsts?", "Mikä on tämän paikan tarina?", "Qual é a história desta casa?", "Qual è la storia di questo locale?"], "Q.story.a": ["Mūsu lokantu 1933. gadā Ušķudarā dibināja Kargili ģimene, kuras piena desertu un saldējuma tradīcijas sniedzas apmēram 150 gadu senā pagātnē. Mēs joprojām esam ģimenes uzņēmums: katrā posmā, no ražošanas un iepirkumiem līdz virtuvei un apkalpošanai, strādā kāds no ģimenes, un dažiem mūsu pavāriem ir vairāk nekā 40 gadu pieredze.\n\nKatru dienu mēs svaigi pagatavojam 100–120 veidu desertus, ēdienus olīveļļā, siltos ēdienus, saldējumu un jogurtu. Mūsu noteikums ir vienkāršs: tikai labākās izejvielas. Ja nevaram atrast atbilstošu kvalitāti, šo ēdienu negatavojam. Pateicoties iepakojumam, ko pilnveidojam kopš 1970. gadiem, mūsu ēdieni nonāk arī mājās un birojos.\n\n2000. gadā žurnāla Vizyon aptaujā “Labākie 100 ēdienu jomā” mūs atzina par labāko tradicionālo lokantu, bet mūsu saldējumu, jogurtu, ekmek kadayıfı un kāju zupu — par labākajiem. Par mums rakstījuši New York Times, Le Monde un Elle, mūs iesaka Lonely Planet, Rough Guide, Le Guide du Routard un Louis Vuitton ceļvedis. 2025. un 2026. gadā saņēmām Gault&Millau Turcijas ceļveža balvu tradicionālās virtuves kategorijā.", "Lokantamme perusti Üsküdarissa vuonna 1933 Kargılın perhe, jonka maitojälkiruoka- ja jäätelöperinne ulottuu noin 150 vuoden taakse. Olemme yhä perheyritys: jokaisessa vaiheessa tuotannosta ja hankinnoista keittiöön ja palveluun työskentelee joku perheestä, ja osalla kokeistamme on yli 40 vuoden kokemus.\n\nValmistamme joka päivä tuoreena 100–120 erilaista jälkiruokaa, oliiviöljyruokaa, lämmintä ruokaa, jäätelöä ja jogurttia. Sääntömme on yksinkertainen: vain parhaat raaka-aineet. Jos sopivaa laatua ei löydy, emme valmista sitä ruokaa. 1970-luvulta asti kehittämämme pakkaustavan ansiosta ruokamme päätyy myös koteihin ja toimistoihin.\n\nVuonna 2000 Vizyon-lehden ”Ruoan 100 parasta” -kyselyssä meidät valittiin parhaaksi perinteiseksi lokantaksi, ja jäätelömme, jogurttimme, ekmek kadayıfımme ja sorkkakeittomme parhaiksi. Meistä ovat kirjoittaneet New York Times, Le Monde ja Elle, ja meitä suosittelevat Lonely Planet, Rough Guide, Le Guide du Routard ja Louis Vuitton -opas. Vuosina 2025 ja 2026 saimme Gault&Millau Turkki -oppaan perinteisen keittiön palkinnon.", "A nossa lokanta foi fundada em 1933 em Üsküdar pela família Kargılı, cuja tradição em sobremesas de leite e gelados remonta a cerca de 150 anos. Continuamos a ser um negócio familiar: em cada etapa, da produção e das compras à cozinha e ao serviço, trabalha um membro da família, e alguns dos nossos cozinheiros têm mais de 40 anos de experiência.\n\nTodos os dias preparamos frescos 100 a 120 tipos de sobremesas, pratos em azeite, pratos quentes, gelados e iogurte. A nossa regra é simples: só os melhores ingredientes. Se não encontramos a qualidade certa, não fazemos esse prato. Graças às embalagens que aperfeiçoamos desde os anos 70, a nossa comida chega também a casas e escritórios.\n\nEm 2000, o inquérito “Os 100 melhores na comida” da revista Vizyon elegeu-nos a melhor lokanta tradicional, com o melhor gelado, iogurte, ekmek kadayıfı e sopa de pés. Fomos destacados pelo New York Times, Le Monde e Elle, e somos recomendados pelo Lonely Planet, Rough Guide, Le Guide du Routard e pelo guia Louis Vuitton. Em 2025 e 2026 recebemos o prémio de Cozinha Tradicional do Guia Gault&Millau Turquia.", "La nostra lokanta è stata fondata nel 1933 a Üsküdar dalla famiglia Kargılı, la cui tradizione nei dolci al latte e nel gelato risale a circa 150 anni fa. Siamo ancora un'attività di famiglia: in ogni fase, dalla produzione e dagli acquisti alla cucina e al servizio, lavora un membro della famiglia, e alcuni dei nostri cuochi hanno più di 40 anni di esperienza.\n\nOgni giorno prepariamo freschi da 100 a 120 tipi di dolci, piatti all'olio d'oliva, piatti caldi, gelati e yogurt. La nostra regola è semplice: solo i migliori ingredienti. Se non troviamo la qualità giusta, quel piatto non lo prepariamo. Grazie agli imballaggi che perfezioniamo dagli anni Settanta, la nostra cucina arriva anche nelle case e negli uffici.\n\nNel 2000 il sondaggio “I 100 migliori nel cibo” della rivista Vizyon ci ha nominati migliore lokanta tradizionale, con il miglior gelato, yogurt, ekmek kadayıfı e zuppa di piedini. Siamo apparsi sul New York Times, su Le Monde ed Elle, e ci raccomandano Lonely Planet, Rough Guide, Le Guide du Routard e la guida Louis Vuitton. Nel 2025 e 2026 abbiamo ricevuto il premio Cucina Tradizionale della Guida Gault&Millau Turchia."], "Q.veg.q": ["Ko var veģetāriešiem?", "Mitä kasvissyöjille on tarjolla?", "O que há para vegetarianos?", "Cosa c'è per i vegetariani?"], "Q.veg.a": ["Lielākā daļa mūsu ēdienu olīveļļā ir vegāniski, tāpat kā salāti un kompoti. Ar pogu zemāk varat redzēt tikai veģetāros ēdienus. Ievērojiet: lielākā daļa silto dārzeņu ēdienu tiek gatavoti ar gaļu.", "Useimmat oliiviöljyruokamme ovat vegaanisia, samoin salaatit ja kompotit. Alla olevalla painikkeella näet vain kasvisruoat. Huom: useimmat lämpimät kasvisruoat valmistetaan lihan kanssa.", "A maioria dos nossos pratos em azeite é vegana, tal como as saladas e as compotas. Use o botão abaixo para ver só os pratos vegetarianos. Nota: a maioria dos pratos quentes de legumes é cozinhada com carne.", "La maggior parte dei nostri piatti all'olio d'oliva è vegana, così come le insalate e le composte. Usate il pulsante qui sotto per vedere solo i piatti vegetariani. Nota: la maggior parte dei piatti caldi di verdure è cucinata con carne."], "Q.olive.q": ["Kas ir “ēdieni olīveļļā”?", "Mitä ovat ”oliiviöljyruoat”?", "O que são “pratos em azeite”?", "Cosa sono i “piatti all'olio d'oliva”?"], "Q.olive.a": ["Dārzeņi, lēni gatavoti olīveļļā un pasniegti auksti, ir Stambulas virtuves klasika. Lielākā daļa ir vegāniski. Sāciet ar pildītām vīnogu lapām vai İmambayıldı:", "Oliiviöljyssä hitaasti haudutettuja ja kylminä tarjoiltuja vihanneksia, Istanbulin keittiön klassikko. Useimmat ovat vegaanisia. Aloita täytetyistä viininlehdistä tai İmambayıldısta:", "Legumes cozinhados lentamente em azeite e servidos frios, um clássico da cozinha de Istambul. A maioria é vegana. Comece pelas folhas de videira recheadas ou pelo İmambayıldı:", "Verdure cotte lentamente nell'olio d'oliva e servite fredde, un classico della cucina di Istanbul. La maggior parte è vegana. Iniziate dalle foglie di vite ripiene o dall'İmambayıldı:"], "Q.dessert.q": ["Kādu desertu jūs iesakāt?", "Mitä jälkiruokaa suosittelet?", "Que sobremesa recomenda?", "Quale dolce consiglia?"], "Q.dessert.a": ["Mūsu cidoniju deserts ar krējumu ir iecienīts. Ja vēlaties ko vieglu — rīsu pudiņš; ja ko sīrupainu — ekmek kadayıfı. Ja esat ziņkārīgs, pagaršojiet kazandibi: tas gatavots ar vistas krūtiņu, taču garšo saldi!", "Kvittenijälkiruokamme kerman kera on suosikki. Kevyempään makuun riisivanukas, siirappiseen ekmek kadayıfı. Jos olet utelias, maista kazandibia: se tehdään kananrinnasta, mutta maistuu makealta!", "O nosso doce de marmelo com nata é um favorito. Para algo leve, arroz-doce; para algo com calda, ekmek kadayıfı. Se tiver curiosidade, prove o kazandibi: é feito com peito de frango, mas é doce!", "Il nostro dolce di mele cotogne con panna è un preferito. Per qualcosa di leggero, il budino di riso; per qualcosa allo sciroppo, l'ekmek kadayıfı. Se siete curiosi, provate il kazandibi: è preparato con petto di pollo, eppure è dolce!"], "Q.allergy.q": ["Man ir alerģija. Ko man darīt?", "Minulla on allergia. Mitä teen?", "Tenho uma alergia. O que devo fazer?", "Ho un'allergia. Cosa devo fare?"], "Q.allergy.a": ["Lūdzu, pirms pasūtīšanas pastāstiet viesmīlim; viņš informēs virtuvi. Oranžās zīmes zem katra ēdiena norāda alergēnus: glutēnu, pienu, olu, riekstus, seleriju un zivi. Zīmes ir orientējošas, tāpēc, lūdzu, pārliecinieties pie viesmīļa.", "Kerrothan tarjoilijalle ennen tilaamista; hän ilmoittaa keittiöön. Jokaisen ruoan alla olevat oranssit merkinnät kertovat allergeeneista: gluteeni, maito, kananmuna, pähkinät, selleri ja kala. Merkinnät ovat suuntaa-antavia, joten varmista asia tarjoilijalta.", "Informe o seu empregado antes de pedir; ele avisará a cozinha. As etiquetas laranja por baixo de cada prato indicam os alergénios: glúten, leite, ovo, frutos de casca rija, aipo e peixe. São apenas orientativas, por isso confirme com o seu empregado.", "Informate il cameriere prima di ordinare; avviserà la cucina. Le etichette arancioni sotto ogni piatto indicano gli allergeni: glutine, latte, uovo, frutta a guscio, sedano e pesce. Sono solo indicative, quindi verificate con il cameriere."], "Q.togo.q": ["Vai varu ņemt jūsu ēdienus līdzi?", "Voinko ottaa ruokia mukaan?", "Posso levar os vossos pratos para fora?", "Posso portare via i vostri piatti?"], "Q.togo.a": ["Protams! Visus mūsu ēdienus un desertus varat ņemt arī līdzi. Varat arī iegādāties desertus pēc svara, aitas piena jogurtu māla podā un mūsu mājas ievārījumus. Atbilstošā iepakojumā mūsu saldējums stundām ilgi nekūst ceļā. Salds suvenīrs no Ušķudaras.", "Totta kai! Kaikki ruokamme ja jälkiruokamme saa myös mukaan. Voit myös ostaa jälkiruokia kiloittain, lampaanmaitojogurttia savipadassa ja kotitekoisia hillojamme. Sopivasti pakattuna jäätelömme kestää tuntikausia sulamatta. Makea muisto Üsküdarista.", "Claro! Todos os nossos pratos e sobremesas também podem ser levados. Pode ainda comprar as nossas sobremesas ao quilo, iogurte de ovelha em pote de barro e os nossos doces caseiros. Com a embalagem certa, o nosso gelado aguenta horas de viagem sem derreter. Uma doce recordação de Üsküdar.", "Certo! Tutti i nostri piatti e dolci sono disponibili anche da asporto. Potete anche acquistare i dolci al chilo, lo yogurt di pecora in vaso di terracotta e le nostre confetture fatte in casa. Con l'imballaggio giusto il nostro gelato viaggia per ore senza sciogliersi. Un dolce ricordo di Üsküdar."], "Q.calc.q": ["Kā es varu aprēķināt savu rēķinu?", "Miten lasken laskuni?", "Como calculo a minha conta?", "Come posso calcolare il mio conto?"], "Q.calc.a": ["Tas ir vienkārši! Atveriet “🧾 {calc}” augšpusē un ar “+” pievienojiet apēstos ēdienus; dažiem ēdieniem varat izvēlēties arī pusporciju vai vienu gabalu. Josla “{my}” apakšā rāda kopsummu. Kad esat gatavs, pieskarieties “{show}”: viesmīlis noskenēs kodu, pārbaudīs un apstiprinās. Pēc tam apstiprināto rēķinu varat saglabāt tālrunī savā valodā.", "Helppoa! Avaa ylhäältä ”🧾 {calc}” ja lisää syömäsi ruoat ”+”-painikkeella; joihinkin ruokiin voit valita myös puolikkaan annoksen tai yhden kappaleen. Alareunan ”{my}”-palkki näyttää summan. Kun olet valmis, napauta ”{show}”: tarjoilija skannaa koodin, tarkistaa ja vahvistaa sen. Sen jälkeen voit tallentaa vahvistetun laskun puhelimeesi omalla kielelläsi.", "É fácil! Abra “🧾 {calc}” no topo e adicione com “+” os pratos que comeu; em alguns pratos também pode escolher meia dose ou uma unidade. A barra “{my}” em baixo mostra o total. Quando terminar, toque em “{show}”: o seu empregado lê o código, verifica e confirma. Depois pode guardar a conta confirmada no telemóvel, no seu idioma.", "È semplice! Aprite “🧾 {calc}” in alto e aggiungete con “+” i piatti che avete mangiato; per alcuni potete scegliere anche mezza porzione o un singolo pezzo. La barra “{my}” in basso mostra il totale. Quando avete finito, toccate “{show}”: il cameriere scansiona il codice, lo controlla e lo conferma. Poi potete salvare il conto confermato sul telefono, nella vostra lingua."], "Q.hours.q": ["Kāds ir jūsu darba laiks?", "Mitkä ovat aukioloaikanne?", "Qual é o vosso horário?", "Quali sono i vostri orari?"]};

s Mapes"], "Q.first.q": ["Είναι η πρώτη μου φορά εδώ. Τι να δοκιμάσω;", "És la primera vegada que vinc. Què he de tastar?"], "Q.first.a": ["Για την πρώτη σας επίσκεψη προτείνω ουζμπέκικο πιλάφι με αρνί ως κυρίως πιάτο, αγκινάρα σε ελαιόλαδο ως συνοδευτικό και για το τέλος κυδώνι γλυκό με καϊμάκι. Πατήστε ένα πιάτο για να το δείτε:", "Per a la primera visita us recomano el pilaf a l'estil uzbek amb xai com a plat principal, carxofa a l'oli d'oliva per acompanyar i, per acabar, les postres de codony amb crema quallada. Toqueu un plat per veure'l:"], "Q.story.q": ["Ποια είναι η ιστορία αυτού του μαγαζιού;", "Quina és la història d'aquest lloc?"], "Q.story.a": ["Το μαγαζί μας ιδρύθηκε το 1933 στο Σκούταρι (Üsküdar) από την οικογένεια Kargılı, της οποίας η παράδοση στα γαλακτερά γλυκά και στο παγωτό ξεκινά πριν από περίπου 150 χρόνια. Είμαστε ακόμη οικογενειακή επιχείρηση: σε κάθε στάδιο, από την παραγωγή και τις αγορές ως την κουζίνα και το σέρβις, εργάζεται ένα μέλος της οικογένειας, και κάποιοι από τους μάγειρές μας έχουν πάνω από 40 χρόνια εμπειρίας.\n\nΚάθε μέρα ετοιμάζουμε φρέσκα 100–120 είδη γλυκών, λαδερών, μαγειρευτών, παγωτών και γιαουρτιού. Ο κανόνας μας είναι απλός: μόνο τα καλύτερα υλικά. Αν δεν βρούμε την ποιότητα που θέλουμε, δεν φτιάχνουμε εκείνο το πιάτο. Χάρη στη συσκευασία που αναπτύσσουμε από τη δεκαετία του 1970, τα φαγητά μας φτάνουν και σε σπίτια και γραφεία.\n\nΤο 2000, η έρευνα «Τα 100 καλύτερα στη γεύση» του περιοδικού Vizyon μάς ανέδειξε καλύτερο παραδοσιακό εστιατόριο, με το καλύτερο παγωτό, γιαούρτι, εκμέκ κανταΐφι και πατσά. Έχουμε γραφτεί στους New York Times, στη Le Monde και στο Elle, και μας προτείνουν οι οδηγοί Lonely Planet, Rough Guide, Le Guide du Routard και Louis Vuitton. Το 2025 και το 2026 λάβαμε το βραβείο Παραδοσιακής Κουζίνας στον οδηγό Gault&Millau Τουρκίας.", "La nostra lokanta es va fundar el 1933 a Üsküdar per la família Kargılı, la tradició de la qual en postres de llet i gelats es remunta a uns 150 anys enrere. Encara som un negoci familiar: un membre de la família treballa a cada etapa, des de la producció i les compres fins a la cuina i el servei, i alguns dels nostres cuiners tenen més de 40 anys d'experiència.\n\nCada dia preparem frescos entre 100 i 120 tipus de postres, plats a l'oli d'oliva, plats calents, gelats i iogurt. La nostra norma és senzilla: només els millors ingredients. Si no trobem la qualitat adequada, no fem aquell plat. Gràcies als envasos que desenvolupem des dels anys setanta, el nostre menjar també arriba a cases i oficines.\n\nL'any 2000, l'enquesta «Els 100 millors en gastronomia» de la revista Vizyon ens va triar com la millor lokanta tradicional, amb el millor gelat, iogurt, ekmek kadayıfı i sopa de peus de xai. Hem sortit al New York Times, a Le Monde i a Elle, i ens recomanen Lonely Planet, Rough Guide, Le Guide du Routard i la guia de Louis Vuitton. El 2025 i el 2026 vam rebre el premi de Cuina Tradicional de la guia Gault&Millau Turquia."], "Q.today.q": ["Τι προτείνετε σήμερα;", "Què ens recomaneu avui?"], "Q.today.a": ["Σήμερα σας προτείνω αυτό. Είμαι σίγουρος ότι θα σας αρέσει πολύ:", "Avui us recomano aquest. Segur que us encantarà:"], "Q.veg.q": ["Τι μπορούν να φάνε οι χορτοφάγοι;", "Què poden menjar els vegetarians?"], "Q.veg.a": ["Τα περισσότερα λαδερά μας είναι βίγκαν, όπως και οι σαλάτες και οι κομπόστες. Με το παρακάτω κουμπί βλέπετε μόνο τα χορτοφαγικά πιάτα. Σημείωση: τα περισσότερα ζεστά πιάτα λαχανικών μαγειρεύονται με κρέας.", "La majoria dels nostres plats a l'oli d'oliva són vegans, igual que les amanides i les compotes. Amb el botó de sota veureu només els plats vegetarians. Nota: la majoria dels plats calents de verdura es cuinen amb carn."], "Q.olive.q": ["Τι είναι τα «λαδερά»;", "Què són els «plats a l'oli d'oliva»?"], "Q.olive.a": ["Λαχανικά μαγειρεμένα αργά σε ελαιόλαδο και σερβιρισμένα κρύα, κλασικό της κουζίνας της Πόλης. Τα περισσότερα είναι βίγκαν. Ξεκινήστε με γεμιστά αμπελόφυλλα ή ιμάμ μπαϊλντί:", "Verdures cuinades lentament amb oli d'oliva i servides fredes, un clàssic de la cuina d'Istanbul. La majoria són veganes. Comenceu per les fulles de parra farcides o l'İmambayıldı:"], "Q.dessert.q": ["Ποιο γλυκό προτείνετε;", "Quines postres ens recomaneu?"], "Q.dessert.a": ["Το κυδώνι γλυκό με καϊμάκι είναι από τα αγαπημένα. Για κάτι ελαφρύ, ρυζόγαλο· για κάτι σιροπιαστό, εκμέκ κανταΐφι. Αν είστε περίεργοι, δοκιμάστε το καζάν ντιμπί: φτιάχνεται με στήθος κοτόπουλου, κι όμως είναι γλυκό!", "Les postres de codony amb crema quallada són de les preferides. Si voleu una cosa lleugera, arròs amb llet; si la voleu amb almívar, ekmek kadayıfı. Si teniu curiositat, tasteu el kazandibi: es fa amb pit de pollastre i, tot i això, és dolç!"], "Q.allergy.q": ["Έχω αλλεργία. Τι πρέπει να κάνω;", "Tinc una al·lèrgia. Què he de fer?"], "Q.allergy.a": ["Ενημερώστε τον σερβιτόρο πριν παραγγείλετε· θα το πει στην κουζίνα. Οι πορτοκαλί ετικέτες κάτω από κάθε πιάτο δείχνουν τα αλλεργιογόνα: γλουτένη, γάλα, αυγό, ξηροί καρποί, σέλινο και ψάρι. Οι ετικέτες είναι ενδεικτικές, γι' αυτό επιβεβαιώστε με τον σερβιτόρο.", "Digueu-ho al cambrer abans de demanar; ell avisarà la cuina. Les etiquetes taronja de sota cada plat indiquen els al·lèrgens: gluten, llet, ou, fruits secs, api i peix. Les etiquetes són orientatives, així que confirmeu-ho amb el cambrer."], "Q.togo.q": ["Μπορώ να πάρω τα φαγητά σας για το σπίτι;", "Puc endur-me els vostres plats?"], "Q.togo.a": ["Φυσικά! Όλα τα φαγητά και τα γλυκά μας διατίθενται και σε πακέτο. Μπορείτε επίσης να πάρετε γλυκά με το κιλό, πρόβειο γιαούρτι σε πήλινο και τις σπιτικές μας μαρμελάδες. Με τη σωστή συσκευασία, το παγωτό μας ταξιδεύει ώρες χωρίς να λιώσει. Ένα γλυκό ενθύμιο από το Σκούταρι.", "És clar! Tots els nostres plats i postres també es poden emportar. També podeu comprar postres al pes, iogurt de llet d'ovella en olla de fang i les nostres melmelades casolanes. Amb l'envàs adequat, el nostre gelat pot viatjar hores sense desfer-se. Un dolç record d'Üsküdar."], "Q.cater.q": ["Κάνετε διανομή φαγητού και catering για σπίτια, γραφεία, εκδηλώσεις, γάμους και μεβλίτ;", "Feu repartiment de menjar i càtering per a cases, oficines, esdeveniments, casaments i mevlids?"], "Q.cater.a": ["Ναι! Παραδίδουμε φαγητό σε σπίτια και γραφεία και κάνουμε catering για εκδηλώσεις, γάμους και μεβλίτ (θρησκευτικές συγκεντρώσεις).", "Sí, és clar! Portem menjar a cases i oficines, i fem càtering per a esdeveniments, casaments i mevlids (trobades religioses)."], "Q.calc.q": ["Πώς μπορώ να υπολογίσω τον λογαριασμό μου;", "Com puc calcular el meu compte?"], "Q.calc.a": ["Είναι εύκολο! Ανοίξτε το «🧾 {calc}» επάνω και προσθέστε με «+» τα πιάτα που φάγατε· σε κάποια πιάτα μπορείτε να διαλέξετε και μισή μερίδα ή ένα τεμάχιο. Η μπάρα «{my}» κάτω δείχνει το σύνολο. Όταν τελειώσετε, πατήστε «{show}»: ο σερβιτόρος σαρώνει τον κωδικό, τον ελέγχει και τον επιβεβαιώνει. Μετά μπορείτε να αποθηκεύσετε τον επιβεβαιωμένο λογαριασμό στο τηλέφωνό σας στη γλώσσα σας.", "És fàcil! Obriu «🧾 {calc}» a dalt i afegiu amb «+» els plats que heu menjat; en alguns plats també podeu triar mitja ració o una sola peça. La barra «{my}» de baix mostra el total. Quan acabeu, toqueu «{show}»: el cambrer escaneja el codi, el revisa i el confirma. Després podeu desar el compte confirmat al telèfon en el vostre idioma."], "Q.fb.q": ["Θα ήθελα να πω τη γνώμη μου", "M'agradaria donar la meva opinió"], "Q.fb.a": ["Με μεγάλη χαρά! Βαθμολογήστε μας και, αν θέλετε, γράψτε λίγα λόγια:", "Amb molt de gust! Puntueu-nos i, si voleu, escriviu unes paraules:"], "Q.hours.q": ["Ποιο είναι το ωράριό σας;", "Quin horari teniu?"], "CHEF_REC": ["Η πρόταση του σεφ για σήμερα, {d}", "Aquest {d}, el xef recomana"]};

 for(let i=0;i<2;i++)for(const [path,vals] of Object.entries(EXT5)){const [a,b,c]=path.split(".");
