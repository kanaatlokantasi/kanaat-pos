<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e6e4df;--acc:#a87b06;--pos:#2b8a3e;--neg:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1e;--fg:#f2f2f2;--muted:#9a9aa0;--line:#2c2c2e;--acc:#e0b84a;--pos:#51cf66;--neg:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.r{text-align:right;white-space:nowrap}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--fg);font:inherit;font-size:13px;margin-left:6px;cursor:pointer}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.chip b{display:block;font-size:15px}
.warn{background:rgba(201,42,42,.08);border:1px solid var(--neg);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--fg)}
.check input{width:auto;margin-top:3px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:10}
.center{max-width:420px;margin:8vh auto 0}
.err{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
svg{width:100%;height:auto;display:block}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:4px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* ============ AYARLAR — Firebase projesi açılınca doldurulacak ============ */
const CFG = {
  apiKey: "AIzaSyD5iitZVlKEtx-sLYXlr2_mn1KYJFyiliA",
  authDomain: "birikimler-5a13e.firebaseapp.com",
  projectId: "birikimler-5a13e",
  appId: "1:743195441381:web:c86b94de22c43fcd9b7c0c"
};
const CONFIGURED = !CFG.apiKey.startsWith("BURAYA");
const SURUM = 6; // her güncellemede artırılır (version.json ile aynı)
const KILIT_SURESI = 3 * 60 * 1000;   // 3 dk işlem yoksa kilitlenir
const ARKA_PLAN_SURESI = 60 * 1000;   // 1 dk arka planda kalırsa kilitlenir

let FB = null, auth = null, db = null;
if (CONFIGURED) {
  const v = "10.12.2";
  const [appM, authM, fsM] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),

  ]);
  FB = { ...authM, ...fsM };
  const app = appM.initializeApp(CFG);
  auth = authM.getAuth(app);
  db = fsM.getFirestore(app);
}

/* ============ Şifreleme (cihazda, AES-256-GCM + PBKDF2) ============ */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const a = new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function anahtarUret(parola, salt){
  const base = await crypto.subtle.importKey("raw", te.encode(parola), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function sifrele(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, te.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function coz(key, iv, ct){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: unb64(iv)}, key, unb64(ct));
  return JSON.parse(td.decode(pt));
}

/* ============ Durum ============ */
let screen = "login", tab = "ozet", draft = null, demo = false;
let uid = null, key = null, salt = null, kasaDoc = null, kasaId = null, benEmail = "", unsub = null;
let S = null; // çözülmüş veri: {assets:[], snapshots:[]}
let prices = { fx:{}, gold:{}, silver:{}, crypto:{}, updated:null, goldSrc:"" };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
let gizli = lsGet("gizle") === "1";

const TYPES = {
  altin:{ad:"Altın", renk:"#d4a017"},
  gumus:{ad:"Gümüş", renk:"#9aa5b1"},
  nakit:{ad:"Nakit / Döviz", renk:"#0c8599"},
  bist:{ad:"Hisse (BIST)", renk:"#e4572e"},
  abd:{ad:"Hisse (ABD)", renk:"#4c6ef5"},
  kripto:{ad:"Kripto", renk:"#f59f00"},
  fon:{ad:"Yatırım Fonu", renk:"#7048e8"},
  bes:{ad:"BES", renk:"#ae3ec9"},
  alacak:{ad:"Alacak", renk:"#2b8a3e"},
  borc:{ad:"Borç", renk:"#c92a2a"}
};
const isBA = a => a.type==="alacak" || a.type==="borc";
const ALTIN = {gram24:"Gram (24 ayar)", gram22:"Gram (22 ayar)", ceyrek:"Çeyrek", yarim:"Yarım", tam:"Tam", cumhuriyet:"Cumhuriyet", ons:"Ons"};
const KONUM = {kasa:"Özel kasa", banka:"Banka", araci:"Aracı kurum", borsa:"Kripto borsası", diger:"Diğer"};
const PARA = ["TRY","USD","EUR","GBP"];
const CG = {BTC:"bitcoin",ETH:"ethereum",USDT:"tether",USDC:"usd-coin",BNB:"binancecoin",SOL:"solana",XRP:"ripple",ADA:"cardano",DOGE:"dogecoin",AVAX:"avalanche-2",DOT:"polkadot",TRX:"tron",LINK:"chainlink",LTC:"litecoin",TON:"the-open-network",SHIB:"shiba-inu",POL:"polygon-ecosystem-token",MATIC:"polygon-ecosystem-token",ATOM:"cosmos",XLM:"stellar"};
const cgId = s => CG[String(s||"").toUpperCase()] || String(s||"").toLowerCase().trim();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sayi = v => { if (v===""||v==null) return null; const n = parseFloat(String(v).replace(/\s/g,"").replace(",", ".")); return isNaN(n) ? null : n; };
const fTL = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
const fTL2 = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2});
const fUSD = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"USD",maximumFractionDigits:0});
const fN = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:8});
const para = (v, f=fTL) => gizli ? "••••••" : (v==null ? "—" : f.format(v));
const bugun = () => new Date().toLocaleDateString("sv-SE");

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ============ Fiyatlar ============ */
function parseTR(v){ if (typeof v==="number") return v; let s=String(v).replace(/[^\d.,-]/g,""); if (s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isNaN(n)?null:n; }
function tget(j,k){ const o=j?.[k]; if(!o) return null; const v=o["Satış"]??o.Satis??o.Selling??o.selling; return v==null?null:parseTR(v); }

async function fiyatlariAl(){
  const ids = [...new Set((S?.assets||[]).filter(a=>a.type==="kripto").map(a=>cgId(a.symbol)).filter(Boolean))];
  const all = [...new Set([...ids,"bitcoin","tether","pax-gold","kinesis-silver"])];
  let ok = false;
  try {
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${all.join(",")}&vs_currencies=try,usd&include_24hr_change=true`);
    const j = await r.json();
    for (const id of all) if (j[id]) prices.crypto[id] = {try:j[id].try, usd:j[id].usd, ch:j[id].try_24h_change};
    if (j.tether?.try) prices.fx.USD = j.tether.try;
    const onsTL = j["pax-gold"]?.try, gumusOns = j["kinesis-silver"]?.try;
    if (onsTL) {
      const g = onsTL/31.1035;
      prices.gold = {gram24:g, gram22:g*0.916, ceyrek:g*1.75*0.916, yarim:g*3.5*0.916, tam:g*7*0.916, cumhuriyet:g*7.216*0.916, ons:onsTL};
      prices.goldSrc = "Ons × kur (yaklaşık)";
    }
    if (gumusOns) prices.silver.gram = gumusOns/31.1035;
    ok = true;
  } catch(e) {}
  try {
    const r = await fetch("https://finans.truncgil.com/today.json");
    const j = await r.json();
    const g = tget(j,"gram-altin");
    if (g && g > 100) {
      prices.gold = {
        gram24:g, gram22: tget(j,"22-ayar-bilezik") || g*0.916,
        ceyrek: tget(j,"ceyrek-altin") || prices.gold.ceyrek, yarim: tget(j,"yarim-altin") || prices.gold.yarim,
        tam: tget(j,"tam-altin") || prices.gold.tam, cumhuriyet: tget(j,"cumhuriyet-altini") || prices.gold.cumhuriyet,
        ons: prices.gold.ons
      };
      prices.goldSrc = "Serbest piyasa";
    }
    const gm = tget(j,"gumus"); if (gm) prices.silver.gram = gm;
    for (const c of ["USD","EUR","GBP"]) { const v = tget(j,c); if (v) prices.fx[c] = v; }
    ok = true;
  } catch(e) {}
  if (ok) { prices.updated = new Date(); gunlukKayit(); }
  if (screen==="app") render();
}

function birimTL(a){
  switch(a.type){
    case "kripto": return prices.crypto[cgId(a.symbol)]?.try ?? null;
    case "altin": return prices.gold[a.unit||"gram24"] ?? null;
    case "gumus": return prices.silver.gram ?? null;
    case "nakit": case "alacak": case "borc": return (a.cur||"TRY")==="TRY" ? 1 : (prices.fx[a.cur] ?? null);
    case "bist": return sayi(a.manualPrice);
    case "fon": case "bes": { const p=sayi(a.manualPrice), k=kurTL(a.fiyatCur); return (p!=null && k!=null) ? p*k : null; }
    case "abd": { const p=sayi(a.manualPrice); return (p!=null && prices.fx.USD) ? p*prices.fx.USD : null; }
  }
  return null;
}
const kurTL = c => (!c || c==="TRY") ? 1 : (prices.fx[c] ?? null);
const maliyetTL = a => { const c=sayi(a.cost), k=kurTL(a.costCur); return (c==null||k==null) ? null : c*k; };
const degerTL = a => { const u=birimTL(a); return u==null ? null : u*(+a.qty||0); };
function netHesap(){
  const t = toplam(S.assets);
  let alacak=0, borc=0, eksik=t.eksik;
  for (const a of S.assets) if (isBA(a)) { const d=degerTL(a); if (d==null) { eksik++; continue; } if (a.type==="alacak") alacak+=d; else borc+=d; }
  return {varlik:t.v, alacak, borc, net:t.v+alacak-borc, eksik, kz:t.kz, kzOran:t.kzOran};
}
function toplam(list){ let v=0, eksik=0, mal=0, malDeger=0; for (const a of list){ if (isBA(a)) continue; const d=degerTL(a); if (d==null) { eksik++; continue; } v+=d; const c=maliyetTL(a); if (c!=null){ mal+=c; malDeger+=d; } } return {v, eksik, kz: mal ? malDeger-mal : null, kzOran: mal ? (malDeger-mal)/mal*100 : null}; }

function gunlukKayit(){
  if (!S || !S.assets.length) return;
  const t = netHesap(); if (t.eksik) return;
  const d = bugun(), son = S.snapshots[S.snapshots.length-1];
  if (son?.d === d) son.t = Math.round(t.net);
  else { S.snapshots.push({d, t:Math.round(t.net)}); if (S.snapshots.length>800) S.snapshots.shift(); kaydet(true); }
}

/* ============ Kayıt ============ */
async function kaydet(sessiz){
  if (demo) { if(!sessiz) toast("Demo: kaydedilmez"); return; }
  try {
    const {iv, ct} = await sifrele(key, S);
    const veri = {v:1, salt:b64(salt), iv, ct, updatedAt:Date.now(), guncelleyen:benEmail};
    if (!kasaDoc?.sahip) { veri.sahip = uid; veri.uyeler = []; }
    kasaDoc = {...(kasaDoc||{}), ...veri};
    await FB.setDoc(FB.doc(db,"kasa",kasaId), veri, {merge:true});
    if(!sessiz) toast("Şifrelendi ve kaydedildi");
  } catch(e) { toast("Kaydedilemedi: "+(e.code||e.message)); }
}

/* Ortak kasa: diğer cihazdaki değişiklikleri anında al */
function dinle(){
  if (demo || unsub) return;
  unsub = FB.onSnapshot(FB.doc(db,"kasa",kasaId), async snap => {
    const d = snap.data(); if (!d || snap.metadata.hasPendingWrites) return;
    if (d.updatedAt === kasaDoc?.updatedAt) { kasaDoc = d; return; }
    kasaDoc = d;
    if (!key || screen!=="app") return;
    if (d.salt !== b64(salt)) { kilitle(); toast("Kasa parolası değiştirildi, yeni parolayla açın"); return; }
    try {
      S = await coz(key, d.iv, d.ct); S.assets ||= []; S.snapshots ||= [];
      if (tab!=="ekle") render();
      toast((d.guncelleyen && d.guncelleyen!==benEmail ? d.guncelleyen : "Diğer cihaz") + " güncelledi");
    } catch {}
  });
}
function dinlemeyiBirak(){ if (unsub) { unsub(); unsub=null; } }
const sahipMi = () => kasaId === uid;

async function uyeEkle(mail){
  mail = mail.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return toast("Geçerli bir e-posta girin");
  if (mail === benEmail) return toast("Kendi adresinizi eklemenize gerek yok");
  const liste = [...new Set([...(kasaDoc.uyeler||[]), mail])];
  await FB.setDoc(FB.doc(db,"uyelik",mail), {kasa:uid});
  await FB.setDoc(FB.doc(db,"kasa",kasaId), {uyeler:liste}, {merge:true});
  kasaDoc.uyeler = liste; render(); toast("Eklendi");
}
async function uyeSil(mail){
  if (!confirm(mail+" kasaya erişemesin mi?\n\nNot: Kasa parolasını biliyorsa, ardından parolayı da değiştirmeniz önerilir.")) return;
  const liste = (kasaDoc.uyeler||[]).filter(m=>m!==mail);
  await FB.setDoc(FB.doc(db,"kasa",kasaId), {uyeler:liste}, {merge:true});
  await FB.deleteDoc(FB.doc(db,"uyelik",mail));
  kasaDoc.uyeler = liste; render(); toast("Erişim kaldırıldı");
}

/* ============ Ekranlar ============ */
const app = document.getElementById("app");

function render(){
  if (screen==="login") return loginEkrani();
  if (screen==="setup") return kurulumEkrani();
  if (screen==="unlock") return acEkrani();
  app.innerHTML = `
  <header><h1>Birikimlerim${demo?' <span class="tag">DEMO</span>':''}</h1>
    <div><button class="iconbtn" data-act="gizle">${gizli?"Göster":"Gizle"}</button><button class="iconbtn" data-act="kilitle">Kilitle</button></div>
  </header>
  <main>${tab==="ozet"?ozet():tab==="varlik"?varliklar():tab==="kasa"?kasa():tab==="ba"?borcAlacak():form()}</main>
  <nav>${[["ozet","Özet"],["varlik","Varlıklar"],["ba","Borç/Alacak"],["kasa","Kasa"],["ekle",draft?.id?"Düzenle":"Ekle"]].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</nav>`;
}

function loginEkrani(){
  app.innerHTML = `<main class="center"><div class="card">
    <h1 style="margin:0 0 4px;font-size:22px">Birikimlerim</h1>
    <p class="muted">Kişisel, şifreli yatırım takibi · Sürüm ${SURUM}</p>
    ${CONFIGURED ? `
      <button class="btn" data-act="google">Google ile giriş yap</button>
      <p class="muted">Girişten sonra ayrıca kasa parolanız istenir.</p>
      <div class="err" id="err"></div>`
    : `<div class="warn">Firebase bağlantısı henüz yapılmadı. Uygulamayı denemek için demo modunu açabilirsiniz; demo verileri kaydedilmez.</div>
      <button class="btn" data-act="demo">Demo ile dene</button>`}
  </div></main>`;
}

function kurulumEkrani(){
  app.innerHTML = `<main class="center"><div class="card">
    <h1 style="margin:0 0 4px;font-size:20px">Kasa parolası oluştur</h1>
    <p class="muted">Bu parola, hesap şifrenizden ayrıdır. Verileriniz bu parolayla telefonunuzda şifrelenir; sunucuya sadece şifreli hali gider.</p>
    <label>Kasa parolası (en az 10 karakter)</label><input id="p1" type="password" autocomplete="new-password">

    <label class="check"><input type="checkbox" id="ok"> Parolayı unutursam verilerin kurtarılamayacağını anladım.</label>
    <button class="btn" data-act="olustur">Kasayı oluştur</button>
    <div class="err" id="err"></div>
    <p class="muted">Başka birinin (ör. eşinizin) kasasına katılacaksanız yeni kasa oluşturmayın. Sizi kendi kasasına eklemesini isteyin, sonra sayfayı yenileyin.</p>
    <button class="btn ghost" data-act="cikis">Hesaptan çıkış</button>
  </div></main>`;

function acEkrani(){
  app.innerHTML = `<main class="center"><div class="card">
    <h1 style="margin:0 0 4px;font-size:20px">Kasa kilitli</h1>
    <label>Kasa parolası</label><input id="kp" type="password" autocomplete="current-password">
    <button class="btn" data-act="ac">Aç</button>
    <button class="btn ghost" data-act="cikis">Hesaptan çıkış</button>
    <div class="err" id="err"></div>
  </div></main>`;
  setTimeout(()=>document.getElementById("kp")?.focus(), 50);
}

function fiyatSeridi(){
  const c = (l,v,f=fTL2) => `<div class="chip"><span class="muted">${l}</span><b>${v==null?"—":f.format(v)}</b></div>`;
  return `<div class="chips">${c("Gram altın",prices.gold.gram24)}${c("Gram gümüş",prices.silver.gram)}${c("Dolar",prices.fx.USD)}${c("Euro",prices.fx.EUR)}${c("Bitcoin",prices.crypto.bitcoin?.try,fTL)}${c("Çeyrek altın",prices.gold.ceyrek,fTL)}</div>
  <p class="muted">${prices.updated?`Son güncelleme ${prices.updated.toLocaleTimeString("tr-TR")} · altın: ${esc(prices.goldSrc)}`:"Fiyatlar alınıyor…"} <a href="#" data-act="yenile">Yenile</a></p>`;
}

function grafik(){
  const s = S.snapshots.slice(-180);
  if (s.length < 2) return `<p class="muted">Portföy grafiği, uygulamayı birkaç gün açtıkça oluşur.</p>`;
  const vals = s.map(x=>x.t), mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts = s.map((x,i)=>`${(i/(s.length-1)*300).toFixed(1)},${(95-(x.t-mn)/rg*85).toFixed(1)}`).join(" ");
  const fark = vals[vals.length-1]-vals[0];
  return `<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="height:120px"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
  <p class="muted">${esc(s[0].d)} → ${esc(s[s.length-1].d)} · <span class="${fark>=0?"pos":"neg"}">${gizli?"••••":(fark>=0?"+":"")+fTL.format(fark)}</span></p>`;
}

function ozet(){
  const t = netHesap();
  const grup = {}; for (const a of S.assets){ if (isBA(a)) continue; const d=degerTL(a); if (d!=null) grup[a.type]=(grup[a.type]||0)+d; }
  const top = Object.values(grup).reduce((x,y)=>x+y,0) || 1;
  const sira = Object.entries(grup).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="card">
    <div class="muted">Net varlık</div>
    <div class="big">${para(t.net)}</div>
    ${(t.alacak||t.borc)?`<div class="muted">Varlıklar ${para(t.varlik)} · Alacak <span class="pos">+${para(t.alacak)}</span> · Borç <span class="neg">−${para(t.borc)}</span></div>`:""}
    <div class="muted">${prices.fx.USD?`≈ ${para(t.net/prices.fx.USD,fUSD)}`:""}
      ${t.kz!=null?` · <span class="${t.kz>=0?"pos":"neg"}">${gizli?"••••":(t.kz>=0?"+":"")+fTL.format(t.kz)+" ("+t.kzOran.toFixed(1)+"%)"}</span> <span class="muted">(maliyeti girilenler)</span>`:""}</div>
    ${t.eksik?`<p class="muted">${t.eksik} varlığın fiyatı yok, toplama katılmadı.</p>`:""}
    ${sira.length?`<div class="bar">${sira.map(([k,v])=>`<div style="width:${v/top*100}%;background:${TYPES[k].renk}"></div>`).join("")}</div>
    <div class="legend">${sira.map(([k,v])=>`<span><span class="dot" style="background:${TYPES[k].renk}"></span>${TYPES[k].ad} %${(v/top*100).toFixed(0)}</span>`).join("")}</div>`:`<p class="muted">Henüz varlık yok. "Ekle"den başlayın.</p>`}
  </div>
  <div class="card"><div class="muted" style="margin-bottom:6px">Portföy değeri</div>${grafik()}</div>
  <h2>Piyasa</h2>${fiyatSeridi()}
  ${demo?"":ayarlar()}`;
}

function etiket(a){
  if (a.type==="altin") return "Altın · "+(ALTIN[a.unit]||"");
  if (a.type==="gumus") return "Gümüş";
  if (a.type==="nakit") return "Nakit · "+a.cur;
  if (isBA(a)) return a.kisi || "";
  return String(a.symbol||"").toUpperCase();
}
function miktar(a){
  if (gizli) return "••••";
  const q = fN.format(+a.qty||0);
  if (a.type==="altin") return q+" adet/gr";
  if (a.type==="gumus") return q+" gr";
  if (a.type==="nakit") return q+" "+a.cur;
  if (a.type==="fon" || a.type==="bes") return q+" pay";
  return q+" adet";
}
function satir(a){
  const d = degerTL(a), c = maliyetTL(a);
  const kz = (d!=null && c) ? (d-c)/c*100 : null;
  const elle = ["bist","abd","fon","bes"].includes(a.type);
  return `<div class="row tap" data-edit="${esc(a.id)}">
    <div><div>${esc(etiket(a))}${a.konum==="kasa"?'<span class="tag">kasa</span>':""}</div>
    <div class="muted">${miktar(a)}${elle?` · elle fiyat${a.fiyatCur&&a.fiyatCur!=="TRY"?" ("+a.fiyatCur+")":""}${a.priceDate?" · "+esc(a.priceDate):""}`:""}${a.konumNot?" · "+esc(a.konumNot):""}</div></div>
    <div class="r"><div>${para(d)}</div>${kz!=null?`<div class="muted ${kz>=0?"pos":"neg"}">${gizli?"":(kz>=0?"+":"")+kz.toFixed(1)+"%"}</div>`:""}</div>
  </div>`;
}

function varliklar(){
  if (!S.assets.length) return `<div class="card"><p class="muted">Henüz varlık yok.</p><button class="btn" data-tab="ekle">Varlık ekle</button></div>`;
  return Object.keys(TYPES).filter(k=>k!=="alacak"&&k!=="borc").map(k=>{
    const l = S.assets.filter(a=>a.type===k); if (!l.length) return "";
    return `<h2>${TYPES[k].ad} · ${para(toplam(l).v)}</h2><div class="card">${l.map(satir).join("")}</div>`;
  }).join("");
}

function satirBA(a){
  const d = degerTL(a), b = bugun();
  let vade = "";
  if (a.vade) {
    const gun = Math.round((new Date(a.vade) - new Date(b)) / 86400000);
    vade = gun < 0 ? `<span class="neg">vadesi ${-gun} gün geçti</span>` : gun===0 ? `<span class="neg">vadesi bugün</span>` : `vade ${esc(a.vade)} (${gun} gün)`;
  }
  return `<div class="row tap" data-edit="${esc(a.id)}">
    <div><div>${esc(a.kisi)}</div><div class="muted">${vade}${a.not?(vade?" · ":"")+esc(a.not):""}</div></div>
    <div class="r"><div class="${a.type==="alacak"?"pos":"neg"}">${para(d)}</div>${a.cur&&a.cur!=="TRY"?`<div class="muted">${gizli?"••••":fN.format(a.qty)+" "+a.cur}</div>`:""}</div>
  </div>`;
}
function borcAlacak(){
  const t = netHesap();
  const sirala = l => l.sort((x,y)=>(x.vade||"9999").localeCompare(y.vade||"9999"));
  const al = sirala(S.assets.filter(a=>a.type==="alacak")), bo = sirala(S.assets.filter(a=>a.type==="borc"));
  return `<div class="card">
    <div class="row"><span>Alacaklarım</span><b class="pos">${para(t.alacak)}</b></div>
    <div class="row"><span>Borçlarım</span><b class="neg">${para(t.borc)}</b></div>
    <div class="row"><span>Fark</span><b>${para(t.alacak-t.borc)}</b></div>
  </div>
  <h2>Alacaklar</h2><div class="card">${al.length?al.map(satirBA).join(""):'<p class="muted">Kayıtlı alacak yok.</p>'}<button class="btn ghost" data-yeni="alacak">+ Alacak ekle</button></div>
  <h2>Borçlar</h2><div class="card">${bo.length?bo.map(satirBA).join(""):'<p class="muted">Kayıtlı borç yok.</p>'}<button class="btn ghost" data-yeni="borc">+ Borç ekle</button></div>`;
}

function kasa(){
  const l = S.assets.filter(a=>a.konum==="kasa");
  return `<div class="card"><div class="muted">Özel kasadaki toplam</div><div class="big">${para(toplam(l).v)}</div>
    <p class="muted">Varlık eklerken konumu "Özel kasa" seçilenler burada görünür.</p></div>
    ${l.length?`<div class="card">${l.map(satir).join("")}</div>`:""}`;
}

function form(){
  const a = draft || (draft = {type:"altin", unit:"gram24", konum:"kasa", cur:"TRY"});
  const v = k => esc(a[k] ?? "");
  const sel = (n, opts, cur) => `<select name="${n}">${Object.entries(opts).map(([k,l])=>`<option value="${k}" ${k===cur?"selected":""}>${l}</option>`).join("")}</select>`;
  let ozel = "";
  switch(a.type){
    case "altin": ozel = `<label>Cins</label>${sel("unit",ALTIN,a.unit)}<label>Miktar (adet veya gram)</label><input name="qty" inputmode="decimal" value="${v("qty")}">`; break;
    case "gumus": ozel = `<label>Miktar (gram)</label><input name="qty" inputmode="decimal" value="${v("qty")}">`; break;
    case "nakit": ozel = `<label>Para birimi</label>${sel("cur",Object.fromEntries(PARA.map(p=>[p,p])),a.cur)}<label>Tutar</label><input name="qty" inputmode="decimal" value="${v("qty")}">`; break;
    case "kripto": ozel = `<label>Sembol (ör. BTC, ETH, SOL)</label><input name="symbol" autocapitalize="characters" value="${v("symbol")}"><label>Miktar</label><input name="qty" inputmode="decimal" value="${v("qty")}">`; break;
    case "bist": ozel = `<label>Hisse kodu (ör. THYAO)</label><input name="symbol" autocapitalize="characters" value="${v("symbol")}"><label>Adet</label><input name="qty" inputmode="decimal" value="${v("qty")}"><label>Güncel fiyat (TL) — canlı veri sonraki sürümde</label><input name="manualPrice" inputmode="decimal" value="${v("manualPrice")}">`; break;
    case "abd": ozel = `<label>Hisse kodu (ör. AAPL)</label><input name="symbol" autocapitalize="characters" value="${v("symbol")}"><label>Adet</label><input name="qty" inputmode="decimal" value="${v("qty")}"><label>Güncel fiyat (USD) — canlı veri sonraki sürümde</label><input name="manualPrice" inputmode="decimal" value="${v("manualPrice")}">`; break;
    case "fon": ozel = `<label>Yatırım fonu kodu (TEFAS, ör. AFA)</label><input name="symbol" autocapitalize="characters" value="${v("symbol")}"><label>Pay adedi</label><input name="qty" inputmode="decimal" value="${v("qty")}"><label>Birim pay fiyatı — canlı veri sonraki sürümde</label><div style="display:flex;gap:8px"><input name="manualPrice" inputmode="decimal" value="${v("manualPrice")}" style="flex:2"><select style="flex:1" name="fiyatCur">${["TRY","USD","EUR"].map(c=>`<option value="${c}" ${(a.fiyatCur||"TRY")===c?"selected":""}>${c==="TRY"?"TL":c}</option>`).join("")}</select></div>`; break;
    case "bes": ozel = `<label>BES fon kodu (TEFAS'ta yazan kod)</label><input name="symbol" autocapitalize="characters" value="${v("symbol")}"><label>Pay adedi</label><input name="qty" inputmode="decimal" value="${v("qty")}"><label>Birim pay fiyatı — canlı veri sonraki sürümde</label><div style="display:flex;gap:8px"><input name="manualPrice" inputmode="decimal" value="${v("manualPrice")}" style="flex:2"><select style="flex:1" name="fiyatCur">${["TRY","USD","EUR"].map(c=>`<option value="${c}" ${(a.fiyatCur||"TRY")===c?"selected":""}>${c==="TRY"?"TL":c}</option>`).join("")}</select></div>`; break;
    case "alacak": case "borc": ozel = `<label>${a.type==="alacak"?"Kimden alacaklısınız?":"Kime borçlusunuz?"} (kişi veya kurum)</label><input name="kisi" value="${v("kisi")}">
      <label>Para birimi</label>${sel("cur",Object.fromEntries(PARA.map(p=>[p,p])),a.cur||"TRY")}<label>Kalan tutar</label><input name="qty" inputmode="decimal" value="${v("qty")}">
      <label>Vade tarihi (isteğe bağlı)</label><input name="vade" type="date" value="${v("vade")}">
      <label>Not (ör. "kredi kartı", "elden verildi")</label><input name="not" value="${v("not")}">`; break;
  }
  const ba = isBA(a);
  return `<div class="card"><form id="f" autocomplete="off">
    <label>Tür</label>${sel("type",Object.fromEntries(Object.entries(TYPES).map(([k,t])=>[k,t.ad])),a.type)}
    ${ozel}
    ${ba?"":`<label>Nerede duruyor?</label>${sel("konum",KONUM,a.konum)}
    <label>Konum notu (ör. "çelik kasa", "Garanti hesabı")</label><input name="konumNot" value="${v("konumNot")}">
    <label>Toplam maliyet (isteğe bağlı — kâr/zarar için)</label><div style="display:flex;gap:8px"><input name="cost" inputmode="decimal" value="${v("cost")}" style="flex:2"><select style="flex:1" name="costCur">${["TRY","USD","EUR"].map(c=>`<option value="${c}" ${(a.costCur||"TRY")===c?"selected":""}>${c==="TRY"?"TL":c}</option>`).join("")}</select></div>
    <label>Alış tarihi</label><input name="date" type="date" value="${v("date")}">`}
    <button class="btn" type="submit">${a.id?"Kaydet":"Ekle"}</button>
    ${a.id?`<button class="btn danger" type="button" data-act="sil">Sil</button><button class="btn ghost" type="button" data-act="vazgec">Vazgeç</button>`:""}
  </form></div>`;
}
function formOku(){
  const f = document.getElementById("f"); if (!f) return draft;
  const o = {...draft}; for (const el of f.elements) if (el.name) o[el.name] = el.value; return o;
}

/* ============ Olaylar ============ */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab],[data-edit],[data-yeni]"); if (!t) return;
  if (t.dataset.yeni){ draft={type:t.dataset.yeni, cur:"TRY"}; tab="ekle"; render(); window.scrollTo(0,0); return; }
  if (t.dataset.tab){ if (t.dataset.tab!=="ekle") draft=null; tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (t.dataset.edit){ const a=S.assets.find(x=>x.id===t.dataset.edit); if(a){ draft={...a}; tab="ekle"; render(); window.scrollTo(0,0);} return; }
  e.preventDefault();
  const act = t.dataset.act, err = m => { const x=document.getElementById("err"); if(x) x.textContent=m; };
  try {
    if (act==="demo"){ demo=true; S=demoVeri(); screen="app"; render(); fiyatlariAl(); }
    if (act==="google"){
      t.disabled=true;
      const p = new FB.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
      try { await FB.signInWithPopup(auth, p); }
      catch(ex){
        if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(ex.code)) await FB.signInWithRedirect(auth, p);
        else throw ex;
      }
    }
    if (act==="olustur"){
      const p1=document.getElementById("p1").value, p2=document.getElementById("p2").value;
      if (p1.length<10) return err("Kasa parolası en az 10 karakter olmalı.");
      if (p1!==p2) return err("Parolalar aynı değil.");
      if (!document.getElementById("ok").checked) return err("Lütfen uyarıyı onaylayın.");
      t.disabled=true; t.textContent="Oluşturuluyor…";
      salt = crypto.getRandomValues(new Uint8Array(16));
      key = await anahtarUret(p1, salt);
      S = {assets:[], snapshots:[]};
      await kaydet(true); screen="app"; tab="ekle"; render(); fiyatlariAl(); dinle();
    }
    if (act==="ac"){
      const p=document.getElementById("kp").value; if(!p) return;
      t.disabled=true; t.textContent="Açılıyor…";
      try {
        salt = unb64(kasaDoc.salt); key = await anahtarUret(p, salt);
        S = await coz(key, kasaDoc.iv, kasaDoc.ct);
        S.assets ||= []; S.snapshots ||= [];
        screen="app"; tab="ozet"; render(); fiyatlariAl(); dinle();
      } catch { key=null; t.disabled=false; t.textContent="Aç"; err("Parola yanlış."); }
    }
    if (act==="cikis" || act==="cikisApp"){ dinlemeyiBirak(); key=null; S=null; await FB.signOut(auth); }
    if (act==="uyeEkle") await uyeEkle(document.getElementById("uyeMail").value);
    if (act==="uyeSil") await uyeSil(t.dataset.mail);
    if (act==="parolaDegis"){
      const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
      if (p1.length<10) return toast("En az 10 karakter");
      if (p1!==p2) return toast("Parolalar aynı değil");
      if (!confirm("Kasa parolası değişsin mi? Yeni parolayı mutlaka not edin.")) return;
      salt = crypto.getRandomValues(new Uint8Array(16)); key = await anahtarUret(p1, salt);
      await kaydet(true); render(); toast("Parola değiştirildi");
    }
    if (act==="kilitle") kilitle();
    if (act==="gizle"){ gizli=!gizli; lsSet("gizle",gizli?"1":"0"); render(); }
    if (act==="yenile") fiyatlariAl();
    if (act==="guncelle"){ t.textContent="Güncelleniyor…"; location.replace(location.pathname+"?v="+Date.now()); }
    if (act==="vazgec"){ draft=null; tab="varlik"; render(); }
    if (act==="sil"){ if (confirm("Bu varlık silinsin mi?")){ S.assets=S.assets.filter(a=>a.id!==draft.id); draft=null; tab="varlik"; render(); await kaydet(); } }
    if (act==="yedek"){
      const blob = new Blob([JSON.stringify(kasaDoc)], {type:"application/json"});
      const u = URL.createObjectURL(blob), l=document.createElement("a"); l.href=u; l.download=`birikimlerim-sifreli-yedek-${bugun()}.json`; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
      toast("Yedek şifreli; açmak için kasa parolası gerekir");
    }
  } catch(ex){ t.disabled=false; err(hataMetni(ex)); }
});
document.addEventListener("change", e => {
  if (e.target.form?.id==="f" && e.target.name==="type"){ draft = {...formOku(), type:e.target.value}; render(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id!=="f") return; e.preventDefault();
  const o = formOku();
  o.qty = sayi(o.qty); o.cost = sayi(o.cost); if ("manualPrice" in o) o.manualPrice = sayi(o.manualPrice);
  if (!o.qty || o.qty<=0) return toast(isBA(o)?"Tutar girin":"Miktar girin");
  if (isBA(o)) { if (!String(o.kisi||"").trim()) return toast("Kişi veya kurum girin"); o.kisi=o.kisi.trim(); o.cur ||= "TRY"; delete o.konum; delete o.cost; }
  if (["kripto","bist","abd","fon","bes"].includes(o.type) && !String(o.symbol||"").trim()) return toast("Sembol / kod girin");
  if (o.symbol) o.symbol = o.symbol.trim().toUpperCase();
  const eski = S.assets.find(a=>a.id===o.id);
  if (o.manualPrice!=null && (!eski || eski.manualPrice!==o.manualPrice)) o.priceDate = bugun();
  if (eski) Object.assign(eski, o); else { o.id = crypto.randomUUID(); S.assets.push(o); }
  draft=null; tab=isBA(o)?"ba":"varlik"; render(); window.scrollTo(0,0);
  await kaydet(); if (o.type==="kripto") fiyatlariAl();
});
document.addEventListener("keydown", e => {
  if (e.key==="Enter" && ["kp","p2"].includes(e.target.id)) document.querySelector("[data-act=ac],[data-act=olustur]")?.click();
});
function hataMetni(e){
  const m = {"auth/popup-closed-by-user":"Giriş penceresi kapatıldı.","auth/unauthorized-domain":"Bu adres Firebase'de yetkili değil (Authentication → Settings → Authorized domains).","auth/invalid-credential":"E-posta veya şifre hatalı.","auth/wrong-password":"Şifre hatalı.","auth/user-not-found":"Hesap bulunamadı.","auth/email-already-in-use":"Bu e-postayla hesap zaten var, Giriş'i kullanın.","auth/too-many-requests":"Çok fazla deneme. Biraz bekleyin.","auth/network-request-failed":"İnternet bağlantısı yok.","permission-denied":"Bu hesabın erişim izni yok."};
  return m[e?.code] || (e?.message || "Bir hata oluştu.");
}

  dinlemeyiBirak(); key=null; S=null; draft=null;
  if (demo){ demo=false; screen="login"; } else screen="unlock";
  render();
}
let sonIslem = Date.now(), gizlendi = 0;
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>sonIslem=Date.now(),{passive:true}));
setInterval(()=>{ if (screen==="app" && Date.now()-sonIslem>KILIT_SURESI) kilitle(); }, 10000);
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden) gizlendi = Date.now();
  else if (screen==="app" && gizlendi && Date.now()-gizlendi>ARKA_PLAN_SURESI) kilitle();
});
setInterval(()=>{ if (screen==="app" && !document.hidden) fiyatlariAl(); }, 60000);

  return { assets:[
    {id:"1",type:"altin",unit:"gram24",qty:50,konum:"kasa",konumNot:"çelik kasa"},
    {id:"2",type:"altin",unit:"ceyrek",qty:10,konum:"kasa",konumNot:"çelik kasa"},
    {id:"3",type:"nakit",cur:"USD",qty:3000,konum:"kasa"},

if (CONFIGURED) {
  FB.onAuthStateChanged(auth, async user => {
    if (!user){ uid=null; key=null; S=null; screen="login"; return render(); }
    uid = user.uid; benEmail = (user.email||"").toLowerCase();
    try {
      // Önce: bu kişi başkasının kasasına eklenmiş mi (ör. eş)?
      kasaId = uid; kasaDoc = null;
      const uy = await FB.getDoc(FB.doc(db,"uyelik",benEmail));
      if (uy.exists() && uy.data().kasa && uy.data().kasa !== uid) {
        try {
          const ortak = await FB.getDoc(FB.doc(db,"kasa",uy.data().kasa));
          if (ortak.exists()) { kasaId = ortak.id; kasaDoc = ortak.data(); }
        } catch {}
      }
      if (!kasaDoc) {
        const snap = await FB.getDoc(FB.doc(db,"kasa",uid));
        kasaDoc = snap.exists() ? snap.data() : null;
      }
      screen = kasaDoc ? "unlock" : "setup";
    } catch(e){ screen="login"; render(); const x=document.getElementById("err"); if(x) x.textContent=hataMetni(e); return; }
    render();
  });
}
/* ============ Yeni sürüm kontrolü ============ */
let yeniSurum = null;
async function surumKontrol(){
  try {
    const r = await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const j = await r.json();
    if (j.surum > SURUM && yeniSurum !== j.surum){ yeniSurum = j.surum; surumBandi(j); }
  } catch {}
}
function surumBandi(j){
  document.getElementById("surumBant")?.remove();
  const d = document.createElement("div"); d.id="surumBant";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--acc);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)";
  d.innerHTML = `<div style="flex:1"><b>Yeni sürüm hazır (${esc(j.surum)})</b>${j.not?`<div style="font-size:13px;opacity:.9">${esc(j.not)}</div>`:""}</div><button data-act="guncelle" style="background:#fff;color:#000;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:600">Güncelle</button>`;
  document.body.appendChild(d);
}
surumKontrol();
setInterval(surumKontrol, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) surumKontrol(); });

render();
</script>
